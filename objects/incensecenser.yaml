      - name: Swing Censer
        description: The triggering creature pushes the censer up to 3 squares, and can choose to shift 1 square after this push. After this movement and the creature's shift, the censer returns to its starting position and then moves the same number of squares in the exact opposite direction from the first movement. It then returns to its original position again. During the censer's movement, any creature in the censer's space that is 1M or larger or not prone is hit by the censer, taking 10 damage. A creature who has M<2 is prone.
