        guid: 044b64a1-fd0a-47b1-bd7f-81eb91493301
        name: Archer's Stakes
        description: Sharp stakes placed point-out to protect defenders against charges. A creature takes 2 damage per square of stakes they enter, and an additional 3 damage if they are force moved in. Allies of the stakes ignore the difficult terrain and take no damage from moving through them.
        implementation: 2
        implementationDetails: 'BRONZE: Each object is one square of stakes (3 Stamina): one stake with nine attached, which are nudged, turned and resized at random each time it is placed. The stakes point the way the object is rotated (north at 0). Heroes entering from the front take 2 damage per square (sideways moves along the stakes keep counting), and a forced move in from the front makes it one hit of 5 damage; entering from the side or behind does nothing. Every hero gets the difficult terrain. Not built: allies taking damage when force moved, cover for allies, the Poison and Sticky upgrades.'
        source: Character Feature
        modifiers: []
