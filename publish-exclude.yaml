# Assets in this repo that are deliberately NOT shipped in the mcdm-drawsteel module.
# Read by drawsteel-deploy.py from the git ref being deployed. Every entry must match an
# existing asset (the script refuses stale entries). Match on category + id; object-table
# entries also give the tableid. `why` is for humans.
#
# This controls shipping, not deletion -- everything listed here stays in the repo. The
# separate `doNotPurge: true` flag on an asset record controls deletion instead, and most
# such assets do ship. See "Asset flags" in DATA_REFERENCE.md.
