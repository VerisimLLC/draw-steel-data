      description: Lady Letitia throws a grenade into a space within 10 squares. The grenade is a 1T object. As a maneuver, another creature can pick up the grenade and throw it up to 10 squares. At the end of each Condemned character's turn, roll 1d6. On a 3 or lower, the grenade explodes in a 2 burst, dealing 10 fire damage to each creature in the area. The grenade has 1 Stamina and explodes early when reduced to 0 Stamina. [As printed, the stat block lists a 2d10 + 2 power roll for this ability but no tier results, distance, or target rows.]
      range: 1
      implementation: 1
      keywords:
        Ranged: true
        Melee: true
        Weapon: true
        Strike: true
      flavor: ""
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        saturation: 1
        hueshift: 0
      implementationDetails: The grenade object lifecycle (placement as a 1T object, pick-up-and-throw maneuver, end-of-turn 1d6 tick, 1 Stamina, early detonation) is not automatable and is tracked manually by the Director with a map token. When the grenade explodes, use the companion Bluepowder Grenade Explosion ability centered on the grenade's space to automate the damage.
