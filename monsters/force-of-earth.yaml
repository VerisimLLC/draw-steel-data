    - name: Stone Swim
      description: The force can burrow through stone, but can't drag other creatures underground when they do so.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:7ad05d79-37c9-4a11-86f3-3c6cfdbdfdce: true
      guid: 7ad05d79-37c9-4a11-86f3-3c6cfdbdfdce
      implementation: 4
      implementationDetails: "GOLD: Burrowing is not limited by material, so the force already burrows through stone. When the force digs down, any creature it is grabbing is released and left on the surface instead of being dragged underground. Edge case: if the force grabs a creature while already underground and then moves, the engine still drags that creature along (needs an engine change)."
