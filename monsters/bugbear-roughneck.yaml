    import:
      data: |+
        Bugbear Roughneck	Level 2 Elite Brute
        Bugbear, Goblin, Humanoid, Fey	EV 16
        <b>Stamina</b> 109
        <b>Speed</b> 6	<b>Size</b> 1L /<b> Stability</b> 0
        <b>Free Strike</b> 5
        Might +2	Agility +2	Reason 0	Intuition 0	Presence 0
        <b>Haymaker</b> (Action)%E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 1<b>	Target</b> 2 creatures or objects
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage
        %E2%98%85	<b>12%E2%80%9316</b>	11 damage; one target is grabbed; one target is pushed 2
        %E2%9C%B8	<b>17</b>	14 damage; one target is grabbed; one target is vertically pushed 3
        <b>5 Malice</b> The distance becomes 1 Burst, the Strike keyword is replaced with Area, and the roughneck targets all enemies instead.

        <b>Leaping Fury</b> (Action)%E2%97%86 2d10 + 3
        <b>Keywords</b> Ranged, Strike, Weapon
        <b>Distance</b> Melee 1<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	8 damage; M<1 prone
        %E2%98%85	<b>12%E2%80%9316</b>	13 damage; M<2 prone
        %E2%9C%B8	<b>17</b>	16 damage; M<3 prone
        <b>Effect</b> The roughneck leaps 5 to an unoccupied space adjacent to the target before making the attack.

        <b>Drag Through Hell</b> (Maneuver)%E2%97%86 3 Malice
        <b>Keywords</b> -
        <b>Distance</b> Melee 1	<b>Target</b> 1 creature or object grabbed by the roughneck
        <b>Effect</b> The roughneck moves up to their speed, dragging the target across the ground. The target takes 2 damage for each square they were dragged through before being released prone. Each square the target was dragged through becomes difficult terrain for enemies.

        <b>Throw</b> (Maneuver)
        <b>Keywords</b> Attack, Melee
        <b>Distance</b> Melee 1<b>	Target</b> 1 creature or object grabbed by the roughneck
        <b>Effect</b> Vertical push 5. An ally target doesn't take damage from being force moved.

        <b>Catcher</b> (Free Triggered Action)
        <b>Keywords</b> -
        <b>Distance</b> Melee 1<b>	Target</b> 1 size 1 creature or object
        <b>Trigger</b> The target is force moved into a square adjacent to the roughneck.
        <b>Effect</b> The target is grabbed by the roughneck.

        <b>Flying Sawblade</b> (Triggered Action)
        <b>Keywords</b> -
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Trigger</b> The roughneck is vertically moved by another creature.
        <b>Effect</b> The roughneck uses their Haymaker ability against a creature or object at the end of the movement.



