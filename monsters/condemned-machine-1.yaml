      description: |-
        **Trigger:** A creature or object moves adjacent to Machine 1.

        **Effect:** The Grinder ability.
      implementationDetails: Fires automatically as a free triggered action when any creature finishes a move within 1 square of Machine 1, running the full Grinder power roll and forced movement. The engine has no "enters an adjacent space" trigger, so this uses finishmove with a subject range of 1 - a creature that passes through an adjacent square without stopping there is not caught.
