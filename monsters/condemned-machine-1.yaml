      description: |-
        **Trigger:** A creature or object moves adjacent to Machine 1.

        **Effect:** The target is pulled into the machine's space and is then pushed 5 in the direction opposite to the one from which they came.
      implementationDetails: Power roll and damage are fully automated. The pull-then-push is run through the rules engine as "pull 1; push 5", so it respects stability and forced-movement restrictions. The engine pushes directly away from Machine 1 rather than tracing the exact path the target arrived along, so the printed "direction opposite to the one from which they came" is approximated by "away from the machine" - identical in the normal case where the target walked straight in.
