      data: |+
        Bugbear Channeler	Level 2 Elite Controller
        Bugbear, Goblin, Humanoid, Fey	EV 16
        <b>Stamina</b> 60
        <b>Speed</b> 5	<b>Size</b> 1L /<b> Stability</b> 0
        <b>Free Strike</b> 5
        Might +1	Agility +1	Reason +2	Intuition +2	Presence +2
        <b>Shadow Drag</b> (Action)%E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Magic, Strike, Ranged
        <b>Distance</b> Ranged 8<b>	Target</b> 2 creatures or objects on the ground
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage; pull 2
        %E2%98%85	<b>12%E2%80%9316</b>	10 damage; pull 3
        %E2%9C%B8	<b>17</b>	13 damage; pull 4
        <b>Effect</b> Each square that a target is pulled through becomes difficult terrain for enemies.

        <b>Blistering Element</b> (Action)%E2%97%86 2d10 + 2
        <b>Keywords</b> Area, Magic
        <b>Distance</b> 3 burst<b>	Target</b> All enemies in the burst
        %E2%9C%A6	<b>%E2%89%A411</b>	2 damage; M<0 bleeding (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	3 damage; M<1 bleeding (save ends)
        %E2%9C%B8	<b>17</b>	4 damage; M<2 bleeding (save ends)
        <b>Effect</b> The channeler chooses one of the following damage types for the damage: acid, cold, corruption, fire, or poison.

        <b>Twist Shape</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 5 Malice
        <b>Keywords</b> Magic, Ranged
        <b>Distance</b> Ranged 5<b>	Target</b> 1 creature
        %E2%9C%A6	<b>%E2%89%A411</b>	5 corruption damage; P<0 slowed (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	8 corruption damage; P<1 shapechanged (save ends)
        %E2%9C%B8	<b>17</b>	11 corruption damage; P<2 shapechanged (save ends)
        <b>Effect</b> A shapechanged creature has their limbs violently stretched and their skin becomes paper thin. They are slowed and have fire weakness 10 while they have this effect.

        <b>Throw</b> (Maneuver)
        <b>Keywords</b> Attack, Melee
        <b>Distance</b> Melee 1<b>	Target</b> 1 creature or object grabbed by the channeler
        <b>Effect</b> Vertical push 3. An ally target doesn't take damage from being force moved.

        <b>Catcher</b> (Free Triggered Action)
        <b>Keywords</b> -
        <b>Distance</b> Melee 1<b>	Target</b> 1 size 1 creature or object
        <b>Trigger</b> The target is force moved into a square adjacent to the channeler.
        <b>Effect</b> The target is grabbed by the channeler.

        <b>Shadow Veil</b> (Triggered Action) %E2%97%86 1 Malice
        <b>Keywords</b> Magic, Ranged
        <b>Distance</b> Ranged 5<b>	Target</b> 1 ally
        <b>Trigger</b> The target takes damage.
        <b>Effect</b> The channeler collapses the target into their shadow and halves the damage. The target can't be targeted by strikes until they reform from the shadows at the start of their next turn.



