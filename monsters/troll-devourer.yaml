    - name: Horrid Stench
      description: Whenever an enemy regains Stamina while within 5 squares of the Devourer, they regain 8 less Stamina (minimum 1 Stamina regained).
      __typeName: CharacterFeature
      domains:
        CharacterFeature:bdfbf089-fa89-43b0-9ccd-02457d0c7dab: true
      guid: bdfbf089-fa89-43b0-9ccd-02457d0c7dab
      implementation: 3
      implementationDetails: "SILVER: When an enemy within 5 squares regains 2 or more Stamina, a mandatory trigger takes back min(8, amount - 1) of it straight after (setting their Stamina, not dealing damage). The amount is the heal as rolled, so a heal that was capped at their Stamina maximum is reduced by too much - give back the difference by hand. Minions never report regaining Stamina, so a minion enemy is not affected."
      modifiers:
      - name: Horrid Stench
        description: Whenever an enemy regains Stamina while within 5 squares of the Devourer, they regain 8 less Stamina (minimum 1 Stamina regained).
        __typeName: CharacterModifier
        behavior: trigger
        domains:
          CharacterFeature:bdfbf089-fa89-43b0-9ccd-02457d0c7dab: true
        guid: 508c6ab7-8886-42cf-b331-e98874146480
        source: Trait
        sourceguid: bdfbf089-fa89-43b0-9ccd-02457d0c7dab
        triggeredAbility:
          name: Horrid Stench
          description: The enemy regains 8 less Stamina (minimum 1).
          __typeName: TriggeredAbility
          abilityType: none
          behaviors:
          - __typeName: ActivatedAbilitySetStaminaBehavior
            chatMessage: "Horrid Stench: 8 less Stamina regained (minimum 1)"
            roll: target.Stamina - min(8, Healed - 1)
          castImmediately: true
          conditionFormula: Healed >= 2
