      implementationDetails: Fires automatically as a free triggered action when any creature finishes a move within 1 square of Machine 3, running the full Malfunction power roll including the potency-gated daze. The engine has no "enters an adjacent space" trigger, so this uses finishmove with a subject range of 1 - a creature that passes through an adjacent square without stopping there is not caught.
