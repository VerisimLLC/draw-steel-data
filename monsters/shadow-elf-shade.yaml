        Shadow Elf Shade	Level 4 Ambusher Retainer
        Fey, Humanoid, Shadow Elf	EV 23
        <b>Stamina</b> 60
        <b>Speed</b> 5 (climb)	<b>Size</b> 1M/<b>Stability</b> 0
        <b>Free Strike</b> 5
        Might +1	Agility +2	Reason 0	Intuition +2	Presence +1
        <b>Shadow Dagger</b> (Action) - 2d10 + highest characteristic - Signature
        <b>Keywords</b> Melee, Ranged, Strike, Weapon
        <b>Distance</b> Melee 1 or Ranged 3 	<b>Target </b>One creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>		6 damage
        %E2%98%85	<b>12-16</b>	10 damage
        %E2%9C%B8	<b>17</b>		13 damage
        <b>Effect</b> When the shade starts their turn concealed from the target, gain a surge.

        <b>Gathering Gloom</b> (Maneuver, Encounter)
        <b>Keywords</b> Area, Magic, Ranged
        <b>Distance</b> 3 cube within 1	<b>Target</b> -
        <b>Effect</b> Until the end of the next turn, the area is filled with darkness. The shade's mentor ignores concealment granted by this darkness.

        <b>Of the Umbra</b>
        The shade ignores concealment granted by darkness. While the shade is in direct sunlight, they have damage weakness 3. While the shade is concealed, they have damage immunity 3.

        Level 7 Retainer Advancement Ability
        <b>Slow-Poison Needle</b> (Action, Encounter) - 2d10 + highest characteristic
        <b>Keywords</b> Ranged, Strike, Weapon
        <b>Distance</b> Ranged 5	<b>Target</b> 1 creature
        %E2%9C%A6	<b>%E2%89%A411</b>		at the start of the target's next turn, 8 poison damage and weakened (save ends)
        %E2%98%85	<b>12-16</b>		at the start of the target's next turn, 12 poison damage and weakened (save ends)
        %E2%9C%B8	<b>17</b>		at the start of the target's next turn, 16 poison damage and weakened (save ends)
        <b>Effect </b>The slow-poison needle is initially painless. When using this ability, the shade can remain hidden if they are already hidden.

        Level 10 Retainer Advancement Ability
        <b>Shadow-Poison Dagger </b>(Action, Encounter) - 2d10 + highest characteristic
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 1	<b>Target</b> 1 creature
        %E2%9C%A6	<b>%E2%89%A411</b>		12 poison damage; shadowed vision (save ends)
        %E2%98%85	<b>12-16</b>		17 poison damage; shadowed vision (save ends)
        %E2%9C%B8	<b>17</b>		23 poison damage; shadowed vision (save ends)
        <b>Effect </b>While a creature has shadowed vision, every creature has concealment from them.

