          CharacterFeature:fa794469-3263-4d41-8cf9-20f633a507a8: true
        filterCondition: Monster Mode = 1
        guid: 498a5681-64b6-4364-97e0-7979a2c87718
        hideEnhancementOptions: true
        powerRollModifier:
          name: Devilish Suggestion
          __typeName: CharacterModifier
          activationCondition: false
          behavior: power
          changeTarget: true
          changeTargetFilter: not (Target = Current)
          changeTargetRange: ability
          guid: c4d26a04-5681-45c5-a818-cc26fa4c970b
          hasTriggerBefore: true
          keywords:
            Strike: true
          modtype: none
          resourceCostAmount: "2"
          resourceCostType: cost
          rollType: enemy_ability_power_roll
          rules: ""
          source: Trigger
          triggerBefore:
            name: Devilish Suggestion
            description: ""
            __typeName: TriggeredAbility
            abilityType: none
            behaviors:
            - name: DevilishSuggestion
              __typeName: ActivatedAbilityScriptBehavior
              code: |
                -- Devilish Suggestion: the triggering creature makes a
                -- Presence test; the outcome is dispatched onto the pending
                -- trigger so the attacker's open roll dialog applies it.
                -- Tier 1 = the attacker is charmed (save ends) and the strike
                -- proceeds unchanged, tier 2 = the high judge chooses a new
                -- target (triggerBeforeRetarget flag -> the trigger panel
                -- opens the retarget picker), tier 3 = bane (augmentation 1).
                local CHARM_MODIFIER_GUID = "498a5681-64b6-4364-97e0-7979a2c87718"
                local CHARMED_EFFECT = "4a607059-6413-49d4-80f5-c6f2f75619ae"

                local trig = nil
                local bestTime = nil
                for _,t in pairs(casterToken.properties:GetAvailableTriggers() or {}) do
                    local prm = t.powerRollModifier
                    if prm and prm.guid == CHARM_MODIFIER_GUID and t.triggered and (not t:try_get("charmResolved", false)) then
                        local ts = tonumber(t.timestamp) or 0
                        if bestTime == nil or ts > bestTime then
                            bestTime = ts
                            trig = t
                        end
                    end
                end

                if trig == nil then
                    print("DevilishSuggestion:: no pending activated trigger found")
                    return
                end

                local attackerToken = nil
                if trig.casterid then
                    attackerToken = dmhub.GetTokenById(trig.casterid)
                end
                if attackerToken == nil or (not attackerToken.valid) then
                    print("DevilishSuggestion:: attacker token not found")
                    return
                end

                local tierTexts = {
                    "The target is charmed (save ends).",
                    "The high judge chooses a new target for the strike.",
                    "The target takes a bane on the strike.",
                }

                -- Send the Presence test as a roll request to the attacker's
                -- controller (the same cross-client prompt machinery that
                -- resistance rolls use), then wait for completion in this
                -- coroutine. parallelWithRollDialog lets the prompt surface
                -- while the triggering strike's roll dialog is still open.
                -- AwaitRequestedActionCoroutine auto-resolves when the roll
                -- lands (or after its own timeout), so this cannot hang.
                local check = RollCheck.new{
                    type = "resistance_power_roll",
                    id = "resistance_power_roll",
                    text = "Resistance",
                    explanation = "Presence test vs Devilish Suggestion",
                    consequences = "",
                    silent = false,
                    info = {
                        attrid = "prs",
                        tiers = tierTexts,
                    },
                    options = {
                        casterid = casterToken.id,
                        parallelWithRollDialog = true,
                    },
                }

                local actionid = dmhub.SendActionRequest(RollRequest.new{
                    checks = {check},
                    tokens = { [attackerToken.charid] = {} },
                })

                local dcresult = AwaitRequestedActionCoroutine(actionid, {})

                local tier = nil
                if dcresult.result and dcresult.action ~= nil then
                    local dcinfo = dcresult.action.info.tokens[attackerToken.charid]
                    if dcinfo ~= nil and dcinfo.status == "complete" then
                        tier = RollUtils.DiceResultToTier{
                            total = dcinfo.result,
                            boons = dcinfo.boons,
                            banes = dcinfo.banes,
                        }
                    end
                end

                if tier == nil then
                    print("DevilishSuggestion:: Presence test canceled; trigger left as plain activation")
                    return
                end

                print("DevilishSuggestion:: Presence test tier", tier)

                if not casterToken.valid then
                    return
                end

                if tier == 1 and attackerToken.valid then
                    -- Tier 1: the attacker is charmed (save ends). The strike
                    -- itself proceeds unchanged, so the trigger stays a plain
                    -- activation (base no-op modifier, cost still paid).
                    local judgeTokenId = casterToken.charid
                    attackerToken:ModifyProperties{
                        undoable = false,
                        description = "Devilish Suggestion: charmed",
                        execute = function()
                            attackerToken.properties:ApplyOngoingEffect(CHARMED_EFFECT, "save_ends", { tokenid = judgeTokenId })
                        end,
                    }
                end

                local trigid = trig.id
                casterToken:ModifyProperties{
                    undoable = false,
                    description = "Devilish Suggestion outcome",
                    execute = function()
                        local live = casterToken.properties:GetAvailableTriggers() or {}
                        local t = live[trigid]
                        if t == nil then
                            return
                        end
                        t.charmResolved = true
                        if tier == 3 then
                            t.triggered = 1
                        elseif tier == 2 then
                            -- Tier 2: the high judge chooses a new target for
                            -- the strike. The trigger panel's complete callback
                            -- sees this flag and opens the retarget picker.
                            t.triggerBeforeRetarget = true
                        end
                        casterToken.properties:DispatchAvailableTrigger(t)
                    end,
                }
            display:
              bgcolor: "#ffffffff"
              brightness: 1
              hueshift: 0
              saturation: 1
            guid: 289182e7-fc2c-4c3c-a530-eb0716033fd3
            iconid: ui-icons/skills/1.png
            modifiers: []
            numTargets: "1"
            persistence: []
            range: 1
            repeatTargets: false
            strain: []
            targetType: self
            trigger: d20roll
        range: 5
        rules: "**Trigger:** A creature targets the high judge with a strike. **Effect:** The target makes a Presence test to determine the outcome."
        source: Trait
        sourceguid: fa794469-3263-4d41-8cf9-20f633a507a8
        targetType: self
        trigger: strike
        type: trigger
