    import:
      data: |
        Striped Condor Griffon	Level 2 Elite Brute
        Beast, Griffon	EV 16
        <b>Stamina</b> 100
        <b>Speed</b> 7 (fly)	<b>Size</b> 3 /<b>Stability</b> 3
        <b>Free Strike</b> 5
        Might +2	Agility +2	Reason -1	Intuition +2	Presence +1
        <b>Violent Thrashing</b> (Action)%E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 2	<b>Target</b> 2 creatures or objects
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage; push 1
        %E2%98%85	<b>12-16</b>	11 damage; one target is pushed 2; the other target is vertically pushed 2
        %E2%9C%B8	<b>17</b>	14 damage; one target is pushed 2 and prone; the other target is vertically pushed 3

        <b>Bound Ahead</b> (Action)%E2%97%86 5 Malice
        <b>Keywords</b> -
        <b>Distance</b> Self (while grounded)	<b>Target</b> Self
        <b>Effect</b> The griffon shifts up to their speed in a straight line. Each enemy who comes within 1 of the griffon during the move can choose to either take 5 damage or be knocked prone.

        <b>Power Wing Buffet</b> (Maneuver) %E2%97%86 2d10 + 2 %E2%97%86 3 Malice
        <b>Keywords</b> Area, Melee
        <b>Distance</b> 5 x 3 line within 1<b>Target</b> All creatures and objects
        %E2%9C%A6	<b>%E2%89%A411</b>	Push 2; M<0 forced movement is vertical
        %E2%98%85	<b>12-16</b>	Push 4; M<1 forced movement is vertical
        %E2%9C%B8	<b>17</b>	Push 6; M<2 forced movement is vertical

        <b>Circle and Strike</b> (Triggered Action) %E2%97%86 2d10 +2
        <b>Keywords</b> -
        <b>Distance</b> Self	<b>Target</b> Triggering creature
        <b>Trigger</b> The griffon flies above a creature on the ground within 5.
        <b>Effect</b> The griffon falls down upon the target, taking no damage from falling. The target takes 3 damage for each square the griffon fell and is <b>A<2</b> prone or grabbed.

        <b>Beast of Prey</b>
        Creatures have a double bane on escaping the griffon's grab.

        <b>Steady</b>
        Creatures have a bane on power rolls that could knock the griffon prone.

        <b>Banded Predator</b>
        The griffon is hidden whenever they have cover or concealment.
      type: mcdm
