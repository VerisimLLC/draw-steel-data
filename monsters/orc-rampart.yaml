    import:
      data: |+
        Orc Rampart	Level 2 Defender
        Humanoid, Orc	EV 17
        <b>Stamina</b> 45	Immunity weapon 2
        <b>Speed</b> 6	<b>Size</b> 1L /<b> Stability</b> 2
        <b>Free Strike</b> 4
        Might +2	Agility +1	Reason 0	Intuition +1	Presence 0
        <b>My Spear, My Foe</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Attack, Melee, Weapon
        <b>Distance</b> Reach 2<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	4 damage; taunted (EoT)
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage; taunted (EoT)
        %E2%9C%B8	<b>17</b>	10 damage; taunted (INU ends)
        <b>Effect</b> The rampart has an edge on the attack if the target attacked them within the round.

        <b>Castling</b> (Maneuver)
        <b>Keywords</b> -
        <b>Distance</b> Special<b>	Target</b> 1 ally
        <b>Effect</b> The rampart moves or shifts up to their speed to a square adjacent to the target and then swaps places with the target.

        <b>No.</b> (Triggered Action)
        <b>Keywords</b> -
        <b>Trigger</b> A creature attacks an adjacent ally.
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Effect</b> The rampart becomes the attack's target.

        <b>Relentless</b>
        If the rampart's Stamina drops to 0, they can take a free strike before dying. If the target is reduced to 0 Stamina by the attack, the rampart lives and their Stamina is reduced to 1 instead.

