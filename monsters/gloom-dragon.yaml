    - name: Encroaching Darkness
      description: "Trigger: A creature within 10 squares moves. Effect: The dragon spends 1 Malice to move two existing cubes of magical darkness they created up to 10 squares each."
      __typeName: CharacterFeature
      domains:
        CharacterFeature:a6bb14c9-67cd-436c-a0bc-204afeadabf0: true
      guid: a6bb14c9-67cd-436c-a0bc-204afeadabf0
      implementation: 4
      modifiers:
      - name: Encroaching Darkness
        description: ""
        __typeName: CharacterModifier
        behavior: trigger
        domains:
          CharacterFeature:a6bb14c9-67cd-436c-a0bc-204afeadabf0: true
        guid: be87f4af-9306-418f-9444-96f6e5935b7c
        source: Trait
        sourceguid: a6bb14c9-67cd-436c-a0bc-204afeadabf0
        triggeredAbility:
          name: Encroaching Darkness
          description: "Trigger: A creature within 10 squares moves. Effect: The dragon moves two existing cubes of magical darkness they created up to 10 squares each."
          __typeName: TriggeredAbility
          abilityType: none
          actionResourceId: 5e551b7d-17fb-4099-a303-bafb3c146f98
          behaviors:
          - name: Move Darkness Cubes
            __typeName: ActivatedAbilityScriptBehavior
            code: |
              -- Encroaching Darkness: move up to two Magical Darkness cubes, each up
              -- to 10 squares from its current position. Cubes are read off the map
              -- objects so darkness breathed by the dragon's illusions (including
              -- popped illusions) can be moved too. Every prompt is skippable:
              -- skipping the cube pick ends the ability, skipping a destination
              -- leaves that cube where it is and moves on.
              local AURA_NAME = "Magical Darkness"
              local NUM_CUBES = 2
              local MOVE_RANGE = 10

              symbols = symbols or {}

              -- A darkness cube's map object can drift off-grid (manual drags), and the
              -- AuraInstance's stored area is a cast-time snapshot that goes stale once
              -- the object moves. Derive the live footprint from the object's position:
              -- even-sized cubes are centred on tile intersections (x.5), so snap the
              -- centre and expand radius tiles from there.
              local function CubeFootprint(obj, radius)
                  local cx = math.floor(obj.x) + 0.5
                  local cy = math.floor(obj.y) + 0.5
                  local minx = math.floor(cx - radius/2 + 0.5)
                  local miny = math.floor(cy - radius/2 + 0.5)
                  local locs = {}
                  for x = minx, minx + radius - 1 do
                      for y = miny, miny + radius - 1 do
                          locs[#locs+1] = core.Loc{ x = x, y = y }:WithDifferentFloor(obj.floorIndex)
                      end
                  end
                  -- The tile just past the centre intersection, mirroring the area.origin
                  -- anchor the built-in Move-Aura ability measures relocation range from.
                  local origin = core.Loc{ x = math.floor(cx + 0.5), y = math.floor(cy + 0.5) }:WithDifferentFloor(obj.floorIndex)
                  return locs, origin
              end

              local function CollectCubes()
                  local result = {}
                  local casterFloor = casterToken.loc.floor
                  for _, floor in ipairs(game.currentMap.floors) do
                      for _, obj in pairs(floor.objects) do
                          if obj.valid and obj.floorIndex == casterFloor then
                              local component = obj:GetComponent("Aura")
                              local props = nil
                              if component ~= nil then
                                  props = component.properties
                              end
                              -- The component's "aura" property is the AuraInstance, whose
                              -- name is the CASTING ABILITY's name (Breath of Brume, Shadow
                              -- Skulk). The aura definition we want to match by name is the
                              -- instance's inner .aura.
                              local auraInstance = nil
                              if props ~= nil then
                                  auraInstance = props:try_get("aura")
                              end
                              local auraDef = nil
                              if auraInstance ~= nil then
                                  auraDef = auraInstance:try_get("aura")
                              end
                              if auraDef ~= nil and auraDef:try_get("name", "") == AURA_NAME then
                                  local area = auraInstance:GetArea()
                                  local radius = 4
                                  if area ~= nil and tonumber(area.radius) ~= nil then
                                      radius = tonumber(area.radius)
                                  end
                                  local locs, origin = CubeFootprint(obj, radius)
                                  result[#result+1] = {
                                      obj = obj,
                                      radius = radius,
                                      locs = locs,
                                      origin = origin,
                                      objectRef = { floorid = floor.floorid, objid = obj.id },
                                  }
                              end
                          end
                      end
                  end
                  return result
              end

              -- Tag every cube's map object with a TRANSIENT Targetable component so the
              -- standard targeting UI can offer it as a clickable target (reticle on the
              -- cube, one click to choose). The additionalTargetFilter grants targeting
              -- only to this ability (ActivatedAbility:ObjectGrantsTargeting), so
              -- pre-existing targetable props (wall voxels, hazards, objectives) are never
              -- offered, and other abilities cannot target the darkness during the brief
              -- window the component exists. Returns {obj, key} tags for RemoveTargeting.
              local function AddTargeting(cubes)
                  local tags = {}
                  for _, cube in ipairs(cubes) do
                      local key = cube.obj:AddComponent("Targetable")
                      if key ~= nil then
                          local comp = cube.obj:GetComponent("Targetable")
                          if comp ~= nil and comp.properties ~= nil then
                              comp.properties.additionalTargetFilter = 'ability.name is "Encroaching Darkness"'
                              comp.properties.no_collision_damage = true
                          end
                          -- Lock the object while it is targetable: a Director click on an
                          -- unlocked map object opens the object Properties editor, which
                          -- steals the click from target selection. Locked objects ignore
                          -- the editor and the click reaches the targeting sheet.
                          local wasLocked = cube.obj.locked
                          cube.obj.locked = true
                          cube.obj:Upload()
                          tags[#tags+1] = { obj = cube.obj, key = key, wasLocked = wasLocked }
                      end
                  end

                  -- Token materialisation is not synchronous with AddComponent. The cast
                  -- runs in a coroutine, so wait (bounded) until each cube has a token
                  -- WITH a sheet. Count distinct objects, not tokens: a cube that was
                  -- just relocated can briefly keep a stale token from the previous
                  -- pick alongside its fresh one, and an aggregate token count exits
                  -- early on the duplicate. The sheet is what receives the click, and
                  -- it arms a few frames after the token appears; exiting before it is
                  -- ready made the first click of the second pick land on nothing
                  -- (reported as "needs a double click").
                  for i = 1, 30 do
                      local ready = {}
                      for _, tok in ipairs(dmhub.allTokensIncludingObjects) do
                          if tok.valid and tok.isObject and tok.objectInstance ~= nil and tok.sheet ~= nil then
                              for _, cube in ipairs(cubes) do
                                  if tok.objectInstance.id == cube.objectRef.objid then
                                      ready[cube.objectRef.objid] = true
                                  end
                              end
                          end
                      end
                      local count = 0
                      for _ in pairs(ready) do
                          count = count + 1
                      end
                      if count >= #tags then
                          break
                      end
                      coroutine.yield(0.1)
                  end

                  -- Grace: the sheet's click collider arms asynchronously after the
                  -- sheet exists and there is no queryable signal for it. A few short
                  -- yields cover the arming frames without a perceptible delay.
                  coroutine.yield(0.1)
                  coroutine.yield(0.1)
                  coroutine.yield(0.1)

                  return tags
              end

              local function RemoveTargeting(tags)
                  for _, tag in ipairs(tags) do
                      pcall(function()
                          tag.obj:RemoveComponent(tag.key)
                          tag.obj.locked = tag.wasLocked or false
                          tag.obj:Upload()
                      end)
                  end
              end

              -- Prompt the caster's controller to TARGET one of the cubes via the standard
              -- target-selection UI (the cubes are transiently Targetable, see
              -- AddTargeting). The cubes' full footprints are marked while the prompt is
              -- open so this reads as selecting an existing aura, not placing a new one.
              -- Returns the chosen cube, or nil if skipped.
              local function PickCube(prompt, cubes)
                  local markers = {}
                  for _, cube in ipairs(cubes) do
                      markers[#markers+1] = dmhub.MarkLocs{ locs = cube.locs, color = "white" }
                  end

                  local maxDist = 1
                  for _, cube in ipairs(cubes) do
                      for _, l in ipairs(cube.locs) do
                          local dist = l:DistanceInTiles(casterToken.loc)
                          if dist > maxDist then
                              maxDist = dist
                          end
                      end
                  end

                  local capturedId = nil
                  local capture = ActivatedAbilityBehavior.new{ instant = true }
                  capture.Cast = function(behaviorSelf, captureAbility, captureCaster, captureTargets, captureOptions)
                      if captureTargets ~= nil and #captureTargets > 0 then
                          local tok = captureTargets[1].token
                          if tok ~= nil and tok.objectInstance ~= nil then
                              capturedId = tok.objectInstance.id
                          end
                      end
                  end

                  local pick = ActivatedAbility.Create()
                  pick.name = "Encroaching Darkness"
                  pick.targetType = "target"
                  pick.targetFilter = "Target.Is Object"
                  pick.range = maxDist + 2
                  pick.numTargets = "1"
                  pick.countsAsCast = false
                  pick.skippable = true
                  pick.promptOverride = prompt
                  pick.behaviors = { capture }
                  local ok, err = pcall(function()
                      ActivatedAbilityInvokeAbilityBehavior.ExecuteInvoke(casterToken, pick, casterToken, "prompt", symbols, {})
                  end)

                  for _, marker in ipairs(markers) do
                      pcall(function() marker:Destroy() end)
                  end
                  if not ok then
                      error(err)
                  end

                  if capturedId == nil then
                      return nil
                  end
                  for _, cube in ipairs(cubes) do
                      if cube.objectRef.objid == capturedId then
                          return cube
                      end
                  end
                  return nil
              end

              -- Move the chosen cube with the same flow as the aura's own "Move" ability
              -- (AuraInstance:FillActivatedAbilities): a full-size cube placement whose
              -- range is measured from the cube's own position (casterLocOverride),
              -- executed by the engine's ActivatedAbilityMoveAuraBehavior so placement
              -- and the slide animation match every other relocatable aura.
              local function MoveCube(cube)
                  local move = ActivatedAbility.Create()
                  move.name = "Encroaching Darkness"
                  move.casterLocOverride = cube.origin
                  move.targetType = "cube"
                  move.radius = tostring(cube.radius)
                  move.range = MOVE_RANGE
                  move.numTargets = "1"
                  move.countsAsCast = false
                  move.skippable = true
                  move.promptOverride = string.format("Move the darkness cube up to %d squares, or skip", MOVE_RANGE)
                  move.behaviors = {
                      ActivatedAbilityMoveAuraBehavior.new{ object = cube.objectRef },
                  }
                  ActivatedAbilityInvokeAbilityBehavior.ExecuteInvoke(casterToken, move, casterToken, "prompt", symbols, {})
              end

              for i = 1, NUM_CUBES do
                  local cubes = CollectCubes()
                  if #cubes == 0 then
                      break
                  end

                  -- The Targetable tags MUST come off again no matter how the pick ends,
                  -- so the pick runs under pcall and the error (if any) is re-raised after
                  -- cleanup.
                  local tags = AddTargeting(cubes)
                  local ok, chosen = pcall(PickCube, string.format("Target the darkness cube to move (%d of %d), or skip", i, NUM_CUBES), cubes)
                  RemoveTargeting(tags)
                  if not ok then
                      error(chosen)
                  end

                  if chosen == nil then
                      break
                  end

                  MoveCube(chosen)
              end
