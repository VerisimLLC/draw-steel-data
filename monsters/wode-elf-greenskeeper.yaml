      data: |+
        Wode Elf Greenskeeper	Level 1 Platoon Defender
        Fey, Humanoid, Wode Elf	EV 6
        <b>Stamina</b> 40
        <b>Speed </b>7	<b>Size</b> 1M / <b>Stability</b> 0
        <b>Free Strike</b> 3
        Might 0	Agility +2	Reason 0	Intuition 0	Presence +1
        <b>Growing Longsword</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 1<b>Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	5 damage
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage
        %E2%9C%B8	<b>17</b>	9 damage
        <b>Effect</b> Taunted (EoT). The greenskeeper can shift 3 after making the attack.
        <b>2 Malice</b> The distance increases to Melee 5.

        <b>Overgrowth</b> (Maneuver) %E2%97%86 3 Malice
        <b>Keywords</b> Area, Ranged
        <b>Distance</b> 3 cube within 10<b>Target</b> Special
        <b>Effect </b>The affected area is overgrown with heavy brush and bramble. It provides cover and concealment for the greenskeeper and all allies, and is considered difficult terrain for enemies. An enemy that starts their turn in an affected square takes 3 damage<b>.</b>

        <b>Masking Glamor</b>
        The greenskeeper immediately hides at the end of their turn while in cover or concealment, even if they are observed.
        Wode Elf Guerilla	Level 3 Platoon Ambusher
        Fey, Humanoid, Wode Elf	EV 10
        <b>Stamina</b> 50
        <b>Speed </b>7 (teleport)	<b>Size</b> 1M / <b>Stability</b> 0
        	<b>Free Strike</b> 5
        Might 0	Agility +2	Reason 0	Intuition 0	Presence +1
        <b>Splinter Dagger</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Ranged, Strike, Weapon
        <b>Distance</b> Melee 1 or Ranged 5<b>Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage
        %E2%98%85	<b>12%E2%80%9316</b>	11 damage
        %E2%9C%B8	<b>17</b>	14 damage; M<2 bleeding (save ends)
        <b>Effect</b> The tree guerilla can teleport 3 after using this ability.
        <b>3 Malice</b> The tree guerilla targets an additional creature or object. The tree guerilla deals an additional 3 damage if both targets are adjacent to each other.

        <b>Do Not Hesitate in the Wode</b> (Free Triggered Action) %E2%97%86 3 Malice
        <b>Keywords</b> -
        <b>Distance</b> Self and Squad<b>Target</b> Self and Squad
        <b>Trigger </b>An ally ends their turn while the tree guerilla hasn't acted this round.
        <b>Effect</b> The targets take their turn immediately. Each target has an edge on their abilities until the end of their turn.

        <b>Hunter's Glamor</b>
        The tree guerilla immediately hides at the end of their turn, even if they are observed.

