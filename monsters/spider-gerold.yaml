      implementationDetails: The bane is implemented as an opt-in checkbox on enemy power rolls targeting Spider Gerold; the Director checks it when spending the triggered action (and only while Gerold has at least 4 legs, tracked manually). The 1 Malice follow-up (use Throw Bottle against the triggering creature) is resolved manually by casting Throw Bottle.
