      domains:
        CharacterFeature:2982ec48-78e2-4784-9365-dfc1cb5fff64: true
      description: "Triggered action. Ranged 10; target self. Trigger: A creature within distance targets Spider Gerold with a power roll; Spider Gerold has at least 4 legs. Effect: Spider Gerold takes a swig from a bottle. The power roll has a bane. Spend 1 Malice: Spider Gerold uses Throw Bottle, targeting the triggering creature."
