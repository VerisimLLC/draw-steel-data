    - name: Beta Version
      description: "Spider Gerold has 8 legs. Whenever he takes at least 10 damage at once from a single ability, one of his legs malfunctions and is destroyed, and any creature grabbed by Spider Gerold is released. When Spider Gerold is reduced to 4 legs, he can no longer grab creatures with his Spiderblade. When Gerold is reduced to 3 legs, he falls prone and his speed is permanently reduced to 0. {Implementation Status: Bespoke resource tracking with no engine support. The Director tracks legs manually, starting at 8: each time Gerold takes 10 or more damage from a single ability, remove a leg and manually release any grabbed creature. At 4 legs, ignore the grabbed clauses on Spiderblade's tier results (and Hair of the Dog no longer triggers below 4 legs). At 3 legs, manually apply prone and set his speed to 0.}"
