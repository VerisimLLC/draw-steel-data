      guid: 15a7db8a-5a61-48a8-9b40-77554f359dd8
      implementation: 3
      implementationDetails: "SILVER: the amalgamist gains the Elemental keyword at runtime, so elemental-only abilities (the Convocations, Elemental Swap) can target him, and his monster group is Elemental so the Elemental Malice features are offered on his turn. The Split exclusion is not enforced: Split is still listed and the Director must not use it for him."
