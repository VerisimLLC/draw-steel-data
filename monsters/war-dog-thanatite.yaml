      implementation: 4
      implementationDetails: "GOLD: The thanatite targets one ally. An invoked roll picks every non-friendly creature within 2 squares of that ally (Parent Target) and rolls once against each; then the ally is destroyed. The 3 Malice mode adds a second invoke that frightens (save ends, of the thanatite) each of those enemies who is adjacent to a corpse (AdjacentToCorpse) or to the dying ally. The roll runs before the death so the ally's square can still be measured from."
