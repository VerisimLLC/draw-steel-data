        rangeOrigin: parent_primary_target
      - __typeName: ActivatedAbilityInvokeAbilityBehavior
        applyto: caster
        customAbility:
          name: Wall of Flesh (Slide)
          description: Each creature in the new wall is lifted onto it. Each enemy then vertically slides up to 2 squares and is knocked prone.
          __typeName: ActivatedAbility
          abilityType: none
          behaviors:
          - __typeName: ActivatedAbilityScriptBehavior
            code: |
              -- A creature where the wall rose is now inside it, and a forced move from inside a
              -- wall only collides, so lift it onto the top first. One already at or above the top
              -- (on an older wall of flesh, or flying) was not in the area: drop it from the slide.
              for i = #targets, 1, -1 do
                  local tok = targets[i].token
                  local top = nil
                  if tok ~= nil and tok.valid then
                      for _, loc in ipairs(tok.locsOccupying) do
                          local ground = loc.withGroundAltitude.altitude
                          if top == nil or ground > top then
                              top = ground
                          end
                      end
                  end
                  if top ~= nil and tok.altitude < top then
                      tok:MoveVertical(top)
                  else
                      table.remove(targets, i)
                  end
              end
            guid: 093a9ac3-becb-40b1-8c3a-38205d480d8b
          - __typeName: ActivatedAbilityDrawSteelCommandBehavior
            applyto: targets
            filterTarget: not Friends(Target, Caster)
            rule: vertical slide 2; prone
          categorization: Hidden
