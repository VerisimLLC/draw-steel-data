    characterFeatures:
    - name: Fuel Level
      description: The juicer's Juice Spray and Juice Up abilities refer to their Fuel Level. A juicer's Fuel Level is equal to the number of inert war dogs in juicer beds powering the Iron Scorpion.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:e17ca8a8-aabe-4eb6-b398-102eb7b56225: true
      guid: e17ca8a8-aabe-4eb6-b398-102eb7b56225
      implementation: 3
      implementationDetails: The engine can't count the inert juicers in the beds, so Juice Spray and Juice Up each ask for the current Fuel Level (1-8) as a mode when cast; the chosen mode sets the acid damage or temporary Stamina.
      modifiers: []
      source: Trait
