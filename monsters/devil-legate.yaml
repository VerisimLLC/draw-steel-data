    - name: Law and Order
      description: The target is taunted by the legate (save ends). The legate can have only one creature taunted at a time.
      __typeName: ActivatedAbility
      abilityType: none
      actionResourceId: a513b9a6-f311-4b0f-88b8-4e9c7bf92d0b
      behaviors:
      - __typeName: ActivatedAbilityDrawSteelCommandBehavior
        applyto: targets
        rule: taunted (save ends)
      - name: OneTauntOnly
        __typeName: ActivatedAbilityScriptBehavior
        applyto: targets
        code: |-
          local COND = "85e26e12-e853-464d-bbbc-98ddf2c0071a"
          local EFF = "2677712b-9ca5-4e91-b354-293c5ab0c403"
          local me = casterToken.charid
          local keep = {}
          for _, t in ipairs(targets or {}) do
            if t.token ~= nil then keep[t.token.charid] = true end
          end
          for _, tok in ipairs(dmhub.allTokens) do
            if tok.valid and tok.properties ~= nil and not keep[tok.charid] then
              local t2 = tok
              local ok, mine = pcall(function()
                local c = t2.properties
                local inf = (c:try_get("inflictedConditions", {}) or {})[COND]
                if inf ~= nil and inf.casterInfo ~= nil and inf.casterInfo.tokenid == me then return true end
                for _, e in ipairs(c:ActiveOngoingEffects(true)) do
                  local ci = e:try_get("casterInfo")
                  if e.ongoingEffectid == EFF and ci ~= nil and ci.tokenid == me then return true end
                end
                return false
              end)
              if ok and mine then
                t2:ModifyProperties{
                  description = "Clear previous taunt",
                  undoable = false,
                  execute = function()
                    pcall(function() t2.properties:RemoveOngoingEffect(EFF) end)
                    pcall(function() t2.properties:InflictCondition(COND, {purge = true}) end)
                  end,
                }
              end
            end
          end
        filterTarget: ""
        guid: b7d92e14-6c58-4f3a-a081-2d94c5e8f760
