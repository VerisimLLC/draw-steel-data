      description: |-
        Trigger: A creature targets the legate with a strike.

        Effect: The target makes a Presence test. Tier 1: The legate chooses a new target for the strike. Tier 2: The legate halves the triggering damage. Tier 3: The target takes a bane on the strike.
      source: Trait
      modifiers:
      - __typeName: CharacterModifier
        name: Devilish Charm
        description: ""
        source: Trait
        sourceguid: 7d8ca46d-e943-47a6-8cbd-0ee39f5d1de0
        guid: f4f72ea1-7125-4256-9557-236200ec0c86
        behavior: triggerdisplay
        filterCondition: Monster Mode = 1
        domains:
          CharacterFeature:7d8ca46d-e943-47a6-8cbd-0ee39f5d1de0: true
        ability:
          __typeName: TriggeredAbilityDisplay
          guid: aa85dff2-ef84-407e-b2d1-52bee8416f77
          name: Devilish Charm
          cost: 2 Malice
          keywords:
            Magic: true
            Ranged: true
          distance: Ranged 5
          target: The triggering creature
          trigger: A creature targets the legate with a strike.
          effect: "The target makes a Presence test. Tier 1 (11 or lower): The legate chooses a new target for the strike. Tier 2 (12-16): The legate halves the triggering damage. Tier 3 (17+): The target takes a bane on the strike."
      - __typeName: CharacterModifier
        name: Devilish Charm
        description: ""
        rules: "**Trigger:** A creature targets the legate with a strike. **Effect:** The target makes a Presence test to determine the outcome."
        source: Trait
        sourceguid: 7d8ca46d-e943-47a6-8cbd-0ee39f5d1de0
        guid: 61ff95a2-baeb-4399-8e13-db0411c997b9
        behavior: powertabletrigger
        filterCondition: Monster Mode = 1
        type: trigger
        trigger: strike
        targetType: self
        hideEnhancementOptions: true
        range: 5
        abilityFilter: Distance(Caster) <= 5
        domains:
          CharacterFeature:7d8ca46d-e943-47a6-8cbd-0ee39f5d1de0: true
        powerRollModifier:
          __typeName: CharacterModifier
          behavior: power
          name: Devilish Charm
          guid: 2d85b41f-eb2b-4c0b-b2ec-e353a230154a
          source: Trigger
          rollType: enemy_ability_power_roll
          modtype: none
          activationCondition: false
          rules: ""
          keywords:
            Strike: true
          resourceCostType: cost
          resourceCostAmount: "2"
          changeTarget: true
          changeTargetRange: ability
          changeTargetFilter: not (Target = Current)
          hasTriggerBefore: true
          triggerBefore:
            __typeName: TriggeredAbility
            guid: 44a9762c-4a81-4b2e-9dfa-ca2182740650
            name: Devilish Charm
            description: ""
            iconid: ui-icons/skills/1.png
            abilityType: none
            trigger: d20roll
            targetType: self
            numTargets: "1"
            range: 1
            strain: []
            persistence: []
            modifiers: []
            repeatTargets: false
            display:
              bgcolor: "#ffffffff"
              hueshift: 0
              brightness: 1
              saturation: 1
            behaviors:
            - __typeName: ActivatedAbilityScriptBehavior
              name: DevilishCharm
              code: |
                -- Devilish Charm: the triggering creature makes a Presence
                -- test; the outcome is dispatched onto the pending trigger so
                -- the attacker's open roll dialog applies it. Tier 1 = the
                -- legate chooses a new target (triggerBeforeRetarget flag ->
                -- the trigger panel opens the retarget picker), tier 2 =
                -- halve damage (augmentation 1), tier 3 = bane (augmentation 2).
                local CHARM_MODIFIER_GUID = "61ff95a2-baeb-4399-8e13-db0411c997b9"

                local trig = nil
                local bestTime = nil
                for _,t in pairs(casterToken.properties:GetAvailableTriggers() or {}) do
                    local prm = t.powerRollModifier
                    if prm and prm.guid == CHARM_MODIFIER_GUID and t.triggered and (not t:try_get("charmResolved", false)) then
                        local ts = tonumber(t.timestamp) or 0
                        if bestTime == nil or ts > bestTime then
                            bestTime = ts
                            trig = t
                        end
                    end
                end

                if trig == nil then
                    print("DevilishCharm:: no pending activated trigger found")
                    return
                end

                local attackerToken = nil
                if trig.casterid then
                    attackerToken = dmhub.GetTokenById(trig.casterid)
                end
                if attackerToken == nil or (not attackerToken.valid) then
                    print("DevilishCharm:: attacker token not found")
                    return
                end

                local tierTexts = {
                    "The legate chooses a new target for the strike.",
                    "The legate halves the triggering damage.",
                    "The target takes a bane on the strike.",
                }

                -- Send the Presence test as a roll request to the attacker's
                -- controller (the same cross-client prompt machinery that
                -- resistance rolls use), then wait for completion in this
                -- coroutine. parallelWithRollDialog lets the prompt surface
                -- while the triggering strike's roll dialog is still open.
                -- AwaitRequestedActionCoroutine auto-resolves when the roll
                -- lands (or after its own timeout), so this cannot hang.
                local check = RollCheck.new{
                    type = "resistance_power_roll",
                    id = "resistance_power_roll",
                    text = "Resistance",
                    explanation = "Presence test vs Devilish Charm",
                    consequences = "",
                    silent = false,
                    info = {
                        attrid = "prs",
                        tiers = tierTexts,
                    },
                    options = {
                        casterid = casterToken.id,
                        parallelWithRollDialog = true,
                    },
                }

                local actionid = dmhub.SendActionRequest(RollRequest.new{
                    checks = {check},
                    tokens = { [attackerToken.charid] = {} },
                })

                local dcresult = AwaitRequestedActionCoroutine(actionid, {})

                local tier = nil
                if dcresult.result and dcresult.action ~= nil then
                    local dcinfo = dcresult.action.info.tokens[attackerToken.charid]
                    if dcinfo ~= nil and dcinfo.status == "complete" then
                        tier = RollUtils.DiceResultToTier{
                            total = dcinfo.result,
                            boons = dcinfo.boons,
                            banes = dcinfo.banes,
                        }
                    end
                end

                if tier == nil then
                    print("DevilishCharm:: Presence test canceled; trigger left as plain activation")
                    return
                end

                print("DevilishCharm:: Presence test tier", tier)

                if not casterToken.valid then
                    return
                end

                local trigid = trig.id
                casterToken:ModifyProperties{
                    undoable = false,
                    description = "Devilish Charm outcome",
                    execute = function()
                        local live = casterToken.properties:GetAvailableTriggers() or {}
                        local t = live[trigid]
                        if t == nil then
                            return
                        end
                        t.charmResolved = true
                        if tier == 2 then
                            t.triggered = 1
                        elseif tier == 3 then
                            t.triggered = 2
                        else
                            -- Tier 1: the legate chooses a new target for the
                            -- strike. The trigger panel's complete callback
                            -- sees this flag and opens the retarget picker.
                            t.triggerBeforeRetarget = true
                        end
                        casterToken.properties:DispatchAvailableTrigger(t)
                    end,
                }
        additionalCostModifiers:
        - __typeName: CharacterModifier
          behavior: power
          name: Halve Damage
          rulesText: The legate halves the triggering damage.
          guid: cf092fa2-fb9f-4672-99ca-cbc2cb602d5f
