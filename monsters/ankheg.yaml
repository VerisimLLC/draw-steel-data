        Ankheg	Level 1 Solo
        Monster	EV 60
        <b>Stamina</b> 120
        <b>Speed</b> 5 (burrow)	<b>Size</b> 2 /<b> Stability</b> 2
        <b>Free Strike</b> 5
        Might +3	Agility +1	Reason -3	Intuition +1	Presence -4
        <b>Solo Monster</b>
        <b>Solo Turns</b> The ankheg takes two turns each round. They can use two actions on each of their turns, and can take each turn after any enemy's turn. While dazed, the ankheg can take one action and one maneuver per turn.
        <b>End Effect</b> At the end of their turn, the ankheg can take 5 damage to end one save ends effect affecting them. This damage can't be reduced in any way.

        <b>Soft Underbelly</b>
        A prone creature gains an edge on melee strikes against the ankheg instead of taking a bane.

        <b>Bite</b> (Action) %E2%97%86 2d10 + 3 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 2	<b>Target</b> One creature or object
        %E2%9C%A6	%E2%89%A411	9 damage
        %E2%98%85	12%E2%80%9316	13 damage; grabbed
        %E2%9C%B8	17+	16 damage; grabbed
        <b>Effect</b> A size 1 target grabbed this way takes 3 acid damage at the start of each of their turns.

