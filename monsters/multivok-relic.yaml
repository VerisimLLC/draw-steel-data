    characterFeatures:
    - name: Self-Replicating
      description: At the end of each round, the relic squad's Stamina pool increases as if each relic were at full Stamina. If there are at least five minions in their squad, they also create new multivok relics until the squad contains eight. If there are fewer than four, they instead create new relics until the squad contains four. New relics are added to adjacent unoccupied squares.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:24ce5ab2-74d2-4172-b629-a7d4bf7c1b78: true
      guid: 24ce5ab2-74d2-4172-b629-a7d4bf7c1b78
      implementation: 2
      implementationDetails: The squad's Stamina pool refills automatically when the next round begins, which is the same moment as the end of the round. Creating new relics is not automated - at the end of each round, add multivok relics to the squad in adjacent unoccupied squares (up to eight if the squad has five or more, or up to four if it has fewer than four).
