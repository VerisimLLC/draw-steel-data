      implementationDetails: "SILVER: Fires as an optional free triggered action when another creature finishes moving adjacent to the brick, then uses Engulf with a double edge (the Director picks the triggering creature as the target). It does not fire for objects or for a creature that only passes through an adjacent square, and the Engulf used this way has no 2 Malice option."
