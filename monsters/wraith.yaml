        <b>Chilling Gravetouch</b> (Action) %E2%97%86 2d10 + 3%E2%97%86 Signature
        <b>Keywords</b> Magic, Melee, Strike, Weapon
        <b>Distance</b> Melee 1<b>	Target</b> One creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	5 cold damage; P<1 slowed (save ends)
        %E2%98%85	<b>12-16</b>	7 cold damage; P<2 slowed (save ends)
        %E2%9C%B8	<b>17</b>	9 cold damage; P<3 slowed (save ends)
        <b>Effect</b> Living creatures killed by this ability return as a <b>ghoul craver</b> the next round, under the Director's control.

