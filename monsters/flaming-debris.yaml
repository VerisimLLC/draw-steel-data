      modifiers: []
      flavor: ""
      description: "Upgrade (+4 EV): The debris is shifting. At the start of each round, add one square of flaming debris adjacent to an existing square of flaming debris."
      implementationDetails: |-
        Optional upgrade, so it is a Director-invoked ability rather than an always-on trait -- adding it to an encounter costs +4 EV and the Director should only use it when that upgrade was bought. Invoking it spawns a new Flaming Debris token and prompts for placement within 1 square of this square, and the new token joins this creature's initiative group.

        Not automated: the "at the start of each round" cadence. There is no begin-round hook that could fire this without also forcing the upgrade on every encounter, so the Director invokes it once per round.
