      implementation: 4
      implementationDetails: |-
        The power roll, fire damage, the literal potency gates (M<1 / M<2 / M<3), the burning ongoing effect (save ends) and the "adjacent but not in it" bane are all automated. The bane is an ActivatedAbilityModifyPowerRollBehavior gated on Caster.Distance(Target) > 0, so it applies on the adjacent-start-of-turn trigger path and not when the target is standing in the debris.

        Burning uses the existing Burning ongoing effect (420d80fa-3784-4b7e-9b6c-586deed49d4e), which ticks 1d6 fire damage automatically at the start of the burning creature's turn (the printed Draw Steel wording); the Condemned stat block describes it as end of each round.
