    characterFeatures:
    - name: Roots Run Deep
      description: The field can target any creature touching the ground with their abilities, even if they don't have line of effect to that creature.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:bb1e4255-ff2c-436f-b47d-53111fee76f0: true
      guid: bb1e4255-ff2c-436f-b47d-53111fee76f0
      implementation: 4
      implementationDetails: "GOLD: Pierce Walls lets the field's abilities target through walls, and a target filter re-blocks any creature that is off the ground (floor altitude above 0) when true line of effect is missing. The cover bane is also cancelled against grounded targets, since a strike that ignores the wall should not suffer the wall's cover."
      modifiers:
      - name: Roots Run Deep
        description: The field ignores line of effect to creatures touching the ground.
        __typeName: CharacterModifier
        attribute: 899681f1-936f-48ce-b2f1-4a40fc694083
        behavior: attribute
        domains:
          CharacterFeature:bb1e4255-ff2c-436f-b47d-53111fee76f0: true
        guid: 4b27f71a-b4f8-469a-8ca0-d2d1cadffdb3
        source: Trait
        sourceguid: bb1e4255-ff2c-436f-b47d-53111fee76f0
        value: 99
      - name: Roots Run Deep
        description: Pierce Walls is on permanently, so this re-blocks the case it should not cover - an airborne target with no real line of effect. lineofsight takes its pierce-walls value from its FIRST argument, so passing Target first measures true geometry instead of the field's own wall-piercing.
        __typeName: CharacterModifier
        ability:
          name: New Ability
          description: ""
          __typeName: ActivatedAbility
          abilityModification: true
          abilityType: none
          behaviors: []
          display:
            bgcolor: "#ffffffff"
            brightness: 1
            hueshift: 0
            saturation: 1
          guid: 92653a17-cf99-49c0-891f-bb25f96565c4
          iconid: ui-icons/skills/1.png
