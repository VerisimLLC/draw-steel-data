          numTargets: "1"
          range: 1
          repeatTargets: false
          strain: []
          targetType: self
        attributes:
        - id: reasonfilter
          operation: reasonfilter
          reasonedFilters:
          - formula: Target.FloorAltitude <= 0 or lineofsight(Target, Caster) > 0
            reason: "**Roots Run Deep:** the field ignores line of effect only against creatures touching the ground."
          value: ""
        behavior: modifyability
        domains:
          CharacterFeature:bb1e4255-ff2c-436f-b47d-53111fee76f0: true
        filterAbility: ""
        guid: d50d0b5d-d15e-439a-96cf-f1d24a6b9e6d
        modifyDescription: Requires line of effect only against creatures that are not touching the ground.
        source: Trait
        sourceguid: bb1e4255-ff2c-436f-b47d-53111fee76f0
      - name: Roots Run Deep
        description: Cancels the cover bane against grounded targets. The activation condition repeats the global Cover modifier's own trigger so this strips a bane only when cover actually applied one.
        __typeName: CharacterModifier
        activationCondition: Target.FloorAltitude <= 0 and (Target.HasCover or (Line of Sight(Self, Target) < 1) or (Target.MovementType = "Burrow" and Target.DistanceBelowGround >= 1) or (Caster.MovementType = "Burrow" and Caster.DistanceBelowGround >= 1))
        behavior: power
        domains:
          CharacterFeature:bb1e4255-ff2c-436f-b47d-53111fee76f0: true
        guid: 22c92532-f08e-481c-b85e-e10649275648
