    - name: Undead Summoner
      description: |-
        Eranya can command up to two squads of minions with a maximum of 8 minions per squad. She can have only one squad of signature minions active at any time.
        At the start of each of Eranya's turns, up to four skeletons appear in unoccupied spaces within 5 squares of Eranya. On each of Eranya's turns, she directs the squad of skeletons to move and use a main action.
