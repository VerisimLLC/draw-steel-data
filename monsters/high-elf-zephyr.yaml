        High Elf Zephyr	Level 1 Platoon Harrier
        Fey, High Elf, Humanoid	EV 6
        <b>Stamina</b> 30
        <b>Speed</b> 7	<b>Size</b> 1M /<b> Stability</b> 0
        <b>Free Strike</b> 3
        Might 0	Agility +2	Reason 0	Intuition 0	Presence +1
        <b>Sweeping Blade</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 2<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	5 damage
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage
        %E2%9C%B8	<b>17</b>	9 damage; the zephyr makes a free strike on a creature adjacent to the target; both creatures are A<2 prone
        <b>Effect</b> Shift 2.

        <b>Windwalk</b> (Maneuver)
        <b>Keywords</b> -
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Effect </b>The zephyr moves up to their speed through the air<b>.</b> They must end this movement on solid ground or immediately fall prone.

        <b>Like the Wind</b>
        All of the zephyr's movement is considered shifting.

        <b>Otherworldly Grace</b>
        At the start of their turn, the zephyr can turn the duration of one save ends effect they suffer from into EoT.



