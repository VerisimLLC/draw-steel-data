    import:
      data: |+
        High Elf Zephyr	Level 1 Platoon Harrier
        Fey, High Elf, Humanoid	EV 6
        <b>Stamina</b> 30
        <b>Speed</b> 7	<b>Size</b> 1M /<b> Stability</b> 0
        <b>Free Strike</b> 3
        Might 0	Agility +2	Reason 0	Intuition 0	Presence +1
        <b>Sweeping Blade</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 2<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	5 damage
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage
        %E2%9C%B8	<b>17</b>	9 damage; the zephyr makes a free strike on a creature adjacent to the target; both creatures are A<2 prone
        <b>Effect</b> Shift 2.

        <b>Windwalk</b> (Maneuver)
        <b>Keywords</b> -
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Effect </b>The zephyr moves up to their speed through the air<b>.</b> They must end this movement on solid ground or immediately fall prone.

        <b>Like the Wind</b>
        All of the zephyr's movement is considered shifting.

        <b>Otherworldly Grace</b>
        At the start of their turn, the zephyr can turn the duration of one save ends effect they suffer from into EoT.



      type: mcdm
    inflictedConditions: []
    initiativeGrouping: e547b39b-f08f-46cf-bc0a-25b1d7268041
    innateActivatedAbilities:
    - name: Sweeping Blade
      description: On a tier 3 outcome, the zephyr can make a free strike against a creature adjacent to the target. If that creature and the target both have A<2, both of them are knocked prone. On any tier outcome, the zephyr can then shift up to 2 squares.
      __typeName: ActivatedAbility
      abilityType: none
      actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
      behaviors:
      - __typeName: ActivatedAbilityPowerRollBehavior
        roll: 2d10 + Highest Characteristic
        tiers:
        - 5 damage
        - 7 damage
        - 9 damage
      # Tier 3 only. rangeOrigin anchors the range-1 pick on the creature that was
      # struck rather than on the zephyr, which is what "adjacent to the target"
      # means -- the strict targeting block measures from GetRangeSource, so this
      # is genuinely enforced, not just advisory. The two params carry the struck
      # target's id and Agility down into every nested level of the ability below.
      - __typeName: ActivatedAbilityInvokeAbilityBehavior
        applyto: targets
        invokeOnCaster: true
        rangeOrigin: parent_primary_target
        tiersSelected:
        - 3
        promptText: Make a free strike against a creature adjacent to the target. If that creature and the target both have A<2, both of them are knocked prone.
        standardAbilityParams:
          targetid: "<<Target.ID>>"
          primaryagility: "<<Target.Agility>>"
        customAbility:
          name: Sweeping Blade Free Strike
          description: ""
          __typeName: ActivatedAbility
          abilityType: none
          behaviors:
          - __typeName: ActivatedAbilityInvokeAbilityBehavior
            abilityType: standard
            applyto: caster
            invokeOnCaster: true
            standardAbility: 491c36e6-a36b-47be-9134-788b071fa7ca
            standardAbilityParams:
              targetid: "<<Cast.PrimaryTarget.id>>"
            customAbility:
              name: Invoked Ability
              description: ""
              __typeName: ActivatedAbility
              abilityType: none
              behaviors: []
              display:
                bgcolor: "#ffffffff"
                brightness: 1
                hueshift: 0
                saturation: 1
              guid: be0fe546-18d1-44d9-8360-371ba00e0351
              iconid: ui-icons/skills/1.png
              modifiers: []
              numTargets: "1"
              range: 1
              repeatTargets: false
              strain: []
              targetType: self
          # Both prones share one coupled test, so neither creature falls unless BOTH
          # have Agility < 2. Here Target is the adjacent creature just free struck,
          # and primaryagility is the originally struck target's score.
          - __typeName: ActivatedAbilityDrawSteelCommandBehavior
            rule: prone
            applyto: targets
            filterTarget: Target.Agility < 2 and <<primaryagility>> < 2
          # Prone the originally struck target. NOTE: applyto "all_creatures" only
          # covers creatures in the initiative queue, which does NOT include the
          # heroes -- so it can never reach a hero target. Instead invoke a tiny
          # ability with targetType "all", which scans every token in range and
          # picks the struck creature out by id.
          # The coupled "both must be A<2" test lives on filterTarget here, the one
          # place both scores are known: Target is the adjacent creature just struck,
          # and primaryagility is the originally struck target's score.
          - __typeName: ActivatedAbilityInvokeAbilityBehavior
            applyto: targets
            invokeOnCaster: true
            filterTarget: Target.Agility < 2 and <<primaryagility>> < 2
            customAbility:
              name: Sweeping Blade Prone Struck Target
              description: ""
              __typeName: ActivatedAbility
              abilityType: none
              behaviors:
              - __typeName: ActivatedAbilityDrawSteelCommandBehavior
                rule: prone
              categorization: Hidden
              display:
                bgcolor: "#ffffffff"
                brightness: 1
                hueshift: 0
                saturation: 1
              guid: 4e04a53a-f734-4d81-9049-2dbb615ae847
              iconid: ui-icons/skills/1.png
              modifiers: []
              numTargets: "1"
              persistence: []
              range: 10
              repeatTargets: false
              strain: []
              targetFilter: Target.ID = <<targetid>>
              targetType: all
          categorization: Hidden
          display:
            bgcolor: "#ffffffff"
            brightness: 1
            hueshift: 0
            saturation: 1
          guid: c2f3199b-7f21-4e2c-bf2e-55b8113bc5f7
          iconid: ui-icons/skills/1.png
          modifiers: []
          numTargets: "1"
          objectTarget: false
          persistence: []
          range: 1
          repeatTargets: false
          strain: []
          targetFilter: not (Target.ID = <<targetid>>)
          targetType: target
      # "On any tier outcome, the zephyr can then shift up to 2 squares" -- no
      # tiersSelected, so this runs on a miss as well as a hit.
      - __typeName: ActivatedAbilityDrawSteelCommandBehavior
        rule: shift 2
        applyto: caster
      categorization: Signature Ability
