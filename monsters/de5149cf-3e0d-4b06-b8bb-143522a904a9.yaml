      data: |
        Orc Terranova	Level 2 Platoon Controller
        Humanoid, Orc	EV 8
        <b>Stamina</b> 30
        <b>Speed</b> 6 (burrow)	<b>Size</b> 1M /<b> Stability</b> 2
        <b>Free Strike</b> 4
        Might +1	Agility +1	Reason 0	Intuition +1	Presence +2
        <b>Earth Pillar</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Magic, Ranged, Strike
        <b>Distance</b> Ranged 10<b>	Target</b> 3 creatures touching the ground
        %E2%9C%A6	<b>%E2%89%A411</b>	6 damage; A<0 prone can't stand (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	9 damage; A<1 prone can't stand (save ends)
        %E2%9C%B8	<b>17</b>	12 damage; prone A<2 and can't stand (save ends)
        <b>Effect</b> The ground beneath each target rises 1 square.

        <b>Sinkhole</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 3 Malice
        <b>Keywords</b> Melee, Weapon
        <b>Distance</b> 3 Burst<b>	Target</b> All enemies
        %E2%9C%A6	<b>%E2%89%A411</b>	4 damage; M<0 restrained (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage; M<1 restrained (save ends)
        %E2%9C%B8	<b>17</b>	10 damage; M<2 restrained (save ends)
        <b>Effect</b> The affected area is considered difficult terrain.

        <b>Seismic Step</b>
        The terranova ignores difficult terrain. The terranovadoesn't need line of effect totarget creatures touching the ground with abilities.

        <b>Relentless</b>
        If the terranova's Stamina drops to 0, they can take a free strike before dying. If the target is reduced to 0 Stamina or killed by the strike, the terranova lives and their Stamina is reduced to 1 instead.
        Orc Warleader	Level 3 Leader
        Humanoid, Orc	EV 20
        <b>Stamina</b> 120
        <b>Speed</b> 6	<b>Size</b> 1M /<b> Stability</b> 2
        <b>Free Strike</b> 5
        Might +3	Agility +2	Reason +1	Intuition +2	Presence +2
        <b>Go.</b> (Action)%E2%97%86 Signature
        <b>Keywords</b> -
        <b>Distance</b> Ranged 10<b>	Target</b> 1 ally
        <b>Effect</b> The target moves up to their speed and uses an action.
        <b>1 Malice</b> The warleader targets a second ally.
        <b>3 Malice</b> The warleader targets a squad instead of a second ally.

        <b>Mace Lariat</b> (Action) %E2%97%86 2d10 + 3
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 1<b>	Target</b> All enemies
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage; push 1; M<1 dazed (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	10 damage; push 3; M<2 dazed (save ends)
        %E2%9C%B8	<b>17</b>	13 damage; push 5; M<3 dazed (save ends)

        <b>Lockdown</b> (Maneuver)%E2%97%86 3 Malice
        <b>Keywords</b> -
        <b>Distance</b> Ranged 10<b>	Target</b> 3 allies
        <b>Effect</b> Each target moves up to their speed and uses the Grab maneuver with an edge. The warleader moves up to their speed.

        <b>Courtesy Call</b> (Triggered Action)
        <b>Keywords</b> -
        <b>Distance</b> Ranged 10<b>	Target</b> 1 creature
        <b>Trigger</b> The target gets a tier 1 result on a power roll.
        <b>Effect</b> The target has a double edge on next power roll.

        <b>Close In</b> (Villain Action 1)
        <b>Keywords</b> Area
        <b>Distance</b> 10 Burst<b>	Target</b> All allies
        <b>Effect</b> Each target moves up to their speed. Each enemy within 1 of a target makes an <b>Intuition test.</b>
        %E2%9C%B8	<b>%E2%89%A411</b>	Frightened of the warleader (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	Frightened of the warleader (EoT)
        %E2%9C%A6	<b>17</b>	no effect

        <b>Familial Reinforcements</b> (Villain Action 2)
        <b>Keywords</b> Area
        <b>Distance</b> Ranged 10<b>	Target</b> All allies
        <b>Effect</b> The warleader shifts up to their speed and 5 <b>orc blitzers</b> appear in unoccupied spaces within distance.

        <b>I'll Do This Myself</b> (Villain Action 3)
        <b>Keywords</b> Attack, Melee, Weapon
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Effect</b> The warleader shifts up to their speed and uses Mace Lariat. Then, the warleader shifts up to their speed and uses Mace Lariat. Finally, the warleader shifts up to their speed and uses Mace Lariat.

        <b>End Effect</b>
        At the end of their turn, the warleader can take 5 damage to end one save ends effect affecting them. This damage can't be reduced in any way.

        <b>Relentless</b>
        If the warleader's Stamina drops to 0, they can take a free strike before dying. If the target is reduced to 0 Stamina or killed by the strike, the dohma lives and their Stamina is reduced to 1 instead.
        Scyza	Level 3 Elite Mount
        Animal, Orc	EV 20
        <b>Stamina</b> 100
        <b>Speed</b> 6	<b>Size</b> 4 /<b> Stability</b> 3
        <b>Free Strike</b> 5
        Might +2	Agility -1	Reason -4	Intuition 0	Presence -1
        <b>Clawed Kick</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 2<b>	Target</b> 2 creatures or objects
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage
        %E2%98%85	<b>12%E2%80%9316</b>	11 damage; prone
        %E2%9C%B8	<b>17</b>	14 damage; prone
        <b>Effect</b> The scyza roars and the target is <b>I<2</b> frightened (save ends).

        <b>Whiptail</b> (Action) %E2%97%86 2d10 + 2
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 3<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	8 damage
        %E2%98%85	<b>12%E2%80%9316</b>	13 damage
        %E2%9C%B8	<b>17</b>	16 damage; A<2 bleeding (save ends)
        <b>Effect</b> This ability has an edge against a target on top of the scyza and knocks the target prone into an unoccupied adjacent square.

        <b>Crestfall</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 2 Malice
        <b>Keywords</b> Area, Melee, Weapon
        <b>Distance</b> 3 cube within 2<b>	Target</b> All enemies in the cube
        %E2%9C%A6	<b>%E2%89%A411</b>	4 damage; 1 sonic damage; R<0 dazed (save ends)
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage; 2 sonic damage; R<1 dazed (save ends)
        %E2%9C%B8	<b>17</b>	9 damage; 3 sonic damage; R<2 dazed (save ends)

        <b>Sandstorm</b> (Maneuver) %E2%97%86 2d10 + 2 %E2%97%86 3 Malice
        <b>Keywords</b> -
        <b>Distance</b> 3 burst<b>	Target</b> Special
        <b>Effect</b> The scyza kicks up a sandstorm concealing themselves and each ally in the affected area until the end of the scyza's next turn. Each enemy in the burst makes an <b>Intuition test.</b>
        %E2%9C%B8	<b>%E2%89%A411</b>	10 damage; prone; slowed (EoT)
        %E2%98%85	<b>12%E2%80%9316</b>	7 damage; slowed (EoT)
        %E2%9C%A6	<b>17</b>	4 damage

        <b>Brace and Bogart</b> (Triggered Action)
        <b>Keywords</b> -
        <b>Distance</b> Self	<b>Target</b> Self
        <b>Trigger</b> The scyza or an ally riding the scyza is targeted by an ability.
        <b>Effect</b> Any damage dealt by the triggering ability is halved. If the creature or object who used the ability is within 3 of the scyza, the scyza makes a free strike against them.

        <b>War Harness</b>
        Three of the scyza's size 1 allies can occupy the same space while riding the scyza.

        <b>Terrible Beast</b>
        The scyza deals an additional 6 damage on strikes and abilities used against objects.

        Retainer
