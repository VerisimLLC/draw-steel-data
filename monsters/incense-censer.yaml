      domains:
        CharacterFeature:ddf85397-bad6-4bf0-bcdf-008b4c763ade: true
      guid: ddf85397-bad6-4bf0-bcdf-008b4c763ade
      implementation: 0
      implementationDetails: Pure flavor and Director adjudication. Nothing here changes a stat, a roll, or a game-state value at runtime, so it is deliberately rated Narrative. The "passes underneath" clause is enforced by the Swing Censer ability's reasoned target filter rather than here.
