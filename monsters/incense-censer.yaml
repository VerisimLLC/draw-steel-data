    characterFeatures:
    - __typeName: CharacterFeature
      name: Suspended Censer
      guid: ddf85397-bad6-4bf0-bcdf-008b4c763ade
      source: Trait
      implementation: 0
      domains:
        CharacterFeature:ddf85397-bad6-4bf0-bcdf-008b4c763ade: true
      description: A large incense censer suspended from the ceiling. Because the censer hangs above the floor, a creature that is prone or 1S or smaller passes underneath it. The censer does not set nearby flammable oil alight on its own; only its Burning Incense ability ignites the surrounding area.
      implementationDetails: Pure flavor and Director adjudication. Nothing here changes a stat, a roll, or a game-state value at runtime, so it is deliberately rated Narrative. The "passes underneath" clause is enforced by the Swing Censer ability's reasoned target filter rather than here.
      modifiers: []
    innateActivatedAbilities:
    - __typeName: ActivatedAbility
      name: Deactivate
      guid: 231dbcc8-5e05-4cc7-88f4-52f96848732e
      actionResourceId: a513b9a6-f311-4b0f-88b8-4e9c7bf92d0b
      categorization: Ability
      abilityType: none
      targetType: target
      numTargets: "1"
      range: 1
      repeatTargets: false
      objectTarget: false
      targetTextOverride: One adjacent creature
      implementation: 2
      keywords: {}
      modifiers: []
      flavor: ""
      description: As a maneuver, a creature adjacent to an incense censer can make an Agility test. Tier 1 - the creature accidentally activates the Burning Incense ability. Tier 2 - the incense censer is deactivated but the creature is slowed (EoT). Tier 3 - the incense censer is deactivated and can't be used.
      implementationDetails: The Agility test is automated as a resistance power roll, so the adjacent creature (the target of this ability) rolls 2d10 + their own Agility rather than the censer rolling. The tier 2 slowed (EoT) result is applied automatically. Two outcomes are Director bookkeeping and are marked with # so they display dimmed and are skipped at execution - the tier 1 accidental discharge (use the censer's Burning Incense ability immediately afterwards) and the deactivated state itself on tiers 2 and 3, which has no game-state representation for a terrain object.
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        saturation: 1
        hueshift: 0
      behaviors:
      - __typeName: ActivatedAbilityPowerRollBehavior
        resistanceRoll: true
        resistanceAttr: agl
        roll: 2d10 + Agility
        applyto: targets
        tiers:
        - "# The creature accidentally activates the Burning Incense ability."
        - "slowed (EoT); # the incense censer is deactivated"
        - "# The incense censer is deactivated and can't be used."
      iconid: ui-icons/skills/1.png
    - __typeName: ActivatedAbility
      name: Burning Incense
      guid: 0edbbfc0-11d0-4a8f-b2f7-01d05e9b4e08
      actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
      categorization: Signature Ability
      abilityType: none
      targetType: cube
      radius: "3"
      range: 1
      numTargets: "1"
      repeatTargets: false
      objectTarget: true
      targetTextOverride: Each creature and object in the area
      implementation: 3
      keywords:
        Area: true
        Weapon: true
      modifiers: []
      flavor: ""
      description: A creature adjacent to the incense censer tips its burning contents into a 3 cube within 1 square, hitting each creature and object in the area. If the burning incense is poured down on targets from above, the censer has high ground and gains an edge on the power roll. A burning creature takes 1d6 fire damage at the start of each of their turns. A burning object takes 1d6 fire damage at the end of each round. This ability can't be used again until the incense censer is reloaded.
      implementationDetails: "Automated: the 3 cube area, the 2d10 + 2 power roll, all three tiers of fire damage, the literal M<1/M<2/M<3 potency gates, and the resulting Burning (save ends) ongoing effect, applied per tier via tier-gated ApplyOngoingEffect behaviors filtered on Might Potency Resistance. Burning is the shared effect 420d80fa (1d6 fire at the start of a burning creature's turn, 1d6 at the end of each round for a burning object), which matches this stat block's Effect line verbatim - this is the same effect Flaming Debris applies, so the two DTOs agree. The high ground edge is an opt-in checkbox on the roll dialog (default unchecked) because the engine has no high-ground symbol, so the Director confirms the censer is being poured from above. Reload gating is handled by the usage limit below."
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        saturation: 1
        hueshift: 0
      usageLimitOptions:
        resourceid: ee94e738-b24d-49c6-ae9d-3bd045430cd8
        charges: "1"
        multicharge: false
        resourceRefreshType: never
      behaviors:
      - __typeName: ActivatedAbilityPowerRollBehavior
        roll: 2d10 + 2
        applyto: targets
        tiers:
        - 5 fire damage; M<1, burning (save ends)
        - 9 fire damage; M<2, burning (save ends)
        - 12 fire damage; M<3, burning (save ends)
      - __typeName: ActivatedAbilityApplyOngoingEffectBehavior
        applyto: targets
        ongoingEffect: 420d80fa-3784-4b7e-9b6c-586deed49d4e
        ongoingEffectCustom: false
        ongoingEffectSource: specific
        duration: save_ends
        tiersSelected:
        - 1
        filterTarget: Might Potency Resistance < 1
      - __typeName: ActivatedAbilityApplyOngoingEffectBehavior
        applyto: targets
        ongoingEffect: 420d80fa-3784-4b7e-9b6c-586deed49d4e
        ongoingEffectCustom: false
        ongoingEffectSource: specific
        duration: save_ends
        tiersSelected:
        - 2
        filterTarget: Might Potency Resistance < 2
      - __typeName: ActivatedAbilityApplyOngoingEffectBehavior
        applyto: targets
        ongoingEffect: 420d80fa-3784-4b7e-9b6c-586deed49d4e
        ongoingEffectCustom: false
        ongoingEffectSource: specific
        duration: save_ends
        tiersSelected:
        - 3
        filterTarget: Might Potency Resistance < 3
      - __typeName: ActivatedAbilityModifyPowerRollBehavior
        guid: 253e472c-602e-4fb4-ac6d-1b56d7bafb6d
        modifier:
          __typeName: CharacterModifier
          behavior: power
          modtype: edge
          rollType: ability_power_roll
          name: Burning Incense
          guid: 3089afb0-1d7e-48a3-a697-2c4da64b4485
          sourceguid: 253e472c-602e-4fb4-ac6d-1b56d7bafb6d
          domains: []
          keywords: []
          description: Poured down on the targets from above. The censer has high ground and gains an edge on the power roll.
          displayCondition: "1"
          activationCondition: false
      iconid: ui-icons/skills/1.png
    - __typeName: ActivatedAbility
      name: Swing Censer
      guid: 0c11def0-8ea8-4dec-b8e5-2db236b02002
      actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
      categorization: Ability
      abilityType: none
      targetType: target
      numTargets: "3"
      range: 3
      repeatTargets: false
      objectTarget: false
      targetTextOverride: Each creature the swinging censer passes through
      implementation: 2
      keywords: {}
      modifiers: []
      flavor: ""
      description: A creature adjacent to the incense censer pushes it up to 3 squares, and can choose to shift 1 square after this push. After this movement and the creature's shift, the censer returns to its starting position and then moves the same number of squares in the exact opposite direction from the first movement. It then returns to its original position again. During the censer's movement, any creature in the censer's space that is 1M or larger or not prone is hit by the censer, taking 10 damage. A creature who has M<2 is prone.
      implementationDetails: "Automated: the 10 damage and the M<2 potency gate that knocks a struck creature prone, plus a reasoned target filter that blocks selecting a creature who would pass underneath the censer (smaller than 1M and prone). NOT automated: the there-and-back-and-out-the-other-side path itself. The censer is pushed out, returns to its origin, sweeps the mirrored distance, and returns again, with an optional 1-square shift by the pushing creature interleaved - four legs of scripted movement of a variable length chosen mid-resolution, driven by a creature who is not the caster in the engine's model. No behavior or rule string expresses that, so the Director drags the censer token along the path and then selects the creatures it swept (up to 3, one per square of the longest leg). Rated Bronze on that basis - the headline movement is manual and only the on-hit result is mechanical."
      reasonedFilters:
      - reason: The censer swings above the floor. A creature smaller than 1M who is prone passes underneath it and is not hit.
        formula: (Target.Size >= 3) or (Not (Target.Conditions has "Prone"))
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        saturation: 1
        hueshift: 0
      behaviors:
      - __typeName: ActivatedAbilityDrawSteelCommandBehavior
        rule: 10 damage; M<2, prone
        applyto: targets
      iconid: ui-icons/skills/1.png
    - __typeName: ActivatedAbility
      name: Reload
      guid: 65955ea4-5f26-452c-a4b4-55bc8284937d
      actionResourceId: d81ce1e9-96a3-4705-9180-1c80f72a86cf
      categorization: Ability
      abilityType: none
      targetType: self
      numTargets: "1"
      range: 1
      repeatTargets: false
      implementation: 2
      keywords: {}
      modifiers: []
      flavor: ""
      description: The incense censer is reloaded, allowing Burning Incense to be used again. This action can only be used once per round.
      implementationDetails: "Automated: the once-per-round limit, which is a real usage limit and greys the ability out for the rest of the round after it is used. NOT automated: the restore itself. Burning Incense is gated by a Manual Refresh usage limit, so after it fires it is genuinely locked out - but clearing that lock needs ActivatedAbilityReplenishBehavior, which resolves its resourceid against the characterResources table and cloud-errors on an ad-hoc guid. Closing the loop needs one companion file, a hidden CharacterResource with usageLimit never, whose id both this behavior and Burning Incense's usageLimitOptions reference. Until that exists the Director uses Reload and then sets Burning Incense's charge back to 1/1 from the ability's cost display on the sheet. The source prints no action-cost row for Reload, so it is modeled as a free maneuver - the least distorting reading - and the once-per-round text carries the real constraint."
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        saturation: 1
        hueshift: 0
      usageLimitOptions:
        resourceid: d7e3b827-79c1-43a1-a758-34ec60aef0ce
        charges: "1"
        multicharge: false
        resourceRefreshType: round
      behaviors: []
      iconid: ui-icons/skills/1.png
