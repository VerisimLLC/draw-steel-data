    - name: Clinging Muck
      description: |-
        **1 Malice.** Trigger: A creature or object within distance deals damage to the effluence.

        Effect: The damage is halved. The area within 1 square of the effluence is covered in muck. The muck is difficult terrain, and an enemy that ends their turn with speed 0 in the muck is weakened and slowed (save ends).
      __typeName: CharacterFeature
      domains:
        CharacterFeature:6a645ba4-d33d-4f65-9bde-af805763c756: true
      guid: 6a645ba4-d33d-4f65-9bde-af805763c756
      implementation: 3
      implementationDetails: "SILVER: the 1 Malice cost, the free triggered action prompt when a creature within 3 squares damages the effluence with a power roll, halving the damage, and the muck (difficult terrain within 1 square of the effluence for the rest of the encounter; an enemy who ends their turn there with speed 0 is weakened and slowed, save ends) are automated. The muck is placed when the effluence takes the halved damage, via a marker effect. Damage that does not come from a power roll does not offer the prompt. The book gives the muck no duration; it lasts until the end of the encounter here."
