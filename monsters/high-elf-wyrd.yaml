        <b>Keywords</b> Area, Magic, Ranged
        <b>Distance</b> 8 wall within 8<b>	Target</b> Special
        <b>Effect</b> The wyrd shapes the land as if it were loose clay. Each wall segment takes up the entire square. A segment can also be used to push a square of the terrain further into the ground. An enemy on top of an affected square moves with the elevation of the terrain.

