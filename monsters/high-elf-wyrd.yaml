        <b>Twystrd</b> (Action)%E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Area, Magic, Ranged
        <b>Distance</b> 1 cube within 5<b>	Target</b> All enemies in the cube
        %E2%9C%A6	<b>%E2%89%A411</b>	vertical push 3
        %E2%98%85	<b>12%E2%80%9316</b>	vertical push 5
        %E2%9C%B8	<b>17</b>	vertical push 6
