        <b>Summon Elemental</b> (Maneuver)%E2%97%86 2 Malice
        <b>Keywords</b> -
        <b>Distance</b> Ranged 5<b>	Target</b> Special
        <b>Effect</b> The wyrd summons 2 <b>elemental motes</b> or 2 <b>soot crows</b> into unoccupied squares within distance.

