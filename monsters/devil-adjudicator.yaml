        Effect: The target makes a Presence test. Tier 1: The adjudicator chooses a new target for the strike. Tier 2: The adjudicator halves the triggering damage. Tier 3: The target takes a bane on the strike.
      source: Trait
      modifiers:
      - __typeName: CharacterModifier
        name: Devilish Charm
        description: ""
        source: Trait
        sourceguid: 1533be05-8e37-47de-8266-6c4b17724262
        guid: 0f22f3d3-af90-4aeb-815d-e793ce2a376e
        behavior: triggerdisplay
        filterCondition: Monster Mode = 1
        domains:
          CharacterFeature:1533be05-8e37-47de-8266-6c4b17724262: true
        ability:
          __typeName: TriggeredAbilityDisplay
