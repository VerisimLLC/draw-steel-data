      data: |+
        Human Knave	Level 2 Platoon Defender
        Human, Humanoid	EV 8
        <b>Stamina</b> 50	<b>Immunity</b> Corruption 2, Psychic 2
        <b>Speed</b> 5	<b>Size</b> 1M/ <b>Stability</b> 0
        	<b>Free Strike</b> 4
        Might +2	Agility +0	Reason +1	Intuition +0	Presence +0
        <b>Morningstar & Javelin</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Ranged, Strike, Weapon
        <b>Distance</b> Melee 1 or Ranged 5	<b>Target</b> One creature or object
        %E2%9C%A6	%E2%89%A411	6 damage
        %E2%98%85	12%E2%80%9316	9 damage
        %E2%9C%B8	17+	12 damage; M<2 the target has a double bane on their next power roll
        <b>Effect </b>Taunted (EoT).

        <b>I'm Your Enemy</b>
        The knave can make a free strike against an adjacent creature they have taunted whenever the creature deals damage to a creature other than the knave.

        <b>Overwhelm</b>
        An enemy who starts their turn adjacent to the knave can't shift.

        <b>Supernatural Insight</b>
        The knave ignores concealment if it's granted by a supernatural effect, or the target is supernatural.

