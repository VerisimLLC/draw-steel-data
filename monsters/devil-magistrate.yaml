        Effect: The target makes a Presence test. Tier 1: The magistrate chooses a new target for the strike. Tier 2: The magistrate halves the triggering damage. Tier 3: The target takes a bane on the strike.
      source: Trait
      modifiers:
      - __typeName: CharacterModifier
        name: Devilish Charm
        description: ""
        source: Trait
        sourceguid: 39b6151f-1303-4273-80e6-2925ef0fb9a5
        guid: c0003440-06b3-4529-b579-98a34e4057bb
        behavior: triggerdisplay
        filterCondition: Monster Mode = 1
