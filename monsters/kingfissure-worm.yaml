      domains:
        CharacterFeature:c5227c2d-b56f-468b-b88a-6654e843842e: true
      guid: c5227c2d-b56f-468b-b88a-6654e843842e
      modifiers: []
      source: Trait
    - name: Titanic Tunneler
      description: The kingfissure worm can burrow through solid rock at half their burrowing speed and leaves a stable, size 3 tunnel in their wake.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:d396abf7-bc0c-4f46-9d8b-0bef6f451830: true
      guid: d396abf7-bc0c-4f46-9d8b-0bef6f451830
