    - name: Multiple Tongues
      description: The kingfissure worm has three tongues. A tongue is a 5 x 1 line within 1 of the kingfissure worm, has 35 Stamina, psychic immunity all, and can't be force moved. Each tongue enables the kingfissure worm to grab one Size-3 or smaller creature or object, and can only be targeted by strikes and abilities while it's grabbing a target.
