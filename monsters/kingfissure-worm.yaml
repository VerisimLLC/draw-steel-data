      source: Trait
    - name: Seismic King
      description: The kingfissure worm can't establish line of effect beyond 3 squares, but ignores concealment and doesn't need line of effect to target creatures touching the ground with strikes and abilities.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:663cfb13-04a9-4c75-b65b-7d9dfd0dfc05: true
      guid: 663cfb13-04a9-4c75-b65b-7d9dfd0dfc05
      modifiers: []
      source: Trait
    - name: Swallowed
      description: A swallowed creature is restrained. At the start of each turn of combat, the swallowed creature takes 1d6 acid damage. If the kingfissure worm takes 25 or more damage in a single round from swallowed creatures, they immediately regurgitate all swallowed creatures, who land prone in an unoccupied square within 3 of the kingfissure worm.
      __typeName: CharacterFeature
      domains:
        CharacterFeature:31cff03a-ecbf-4da0-9a78-a96e9342b0d2: true
      guid: 31cff03a-ecbf-4da0-9a78-a96e9342b0d2
      modifiers: []
      source: Trait
    - name: Unstoppable Crawler
      description: The kingfissure worm can't be frightened or knocked prone. While the kingfissure worm is restrained or slowed, their speed is reduced by 2 instead of suffering the condition's normal effects.
      __typeName: CharacterFeature
      domains:
