      data: |+
        Dwarf Shieldwall	Level 3 Platoon Defender
        Dwarf, Humanoid	EV 10
        <b>Stamina</b> 72
        <b>Speed </b>5	<b>Size</b> 1M /<b> Stability</b> 4
        <b>	Free Strike</b> 5
        Might +2	Agility 0	Reason +0	Intuition +0	Presence +1
        <b>Wide Axe</b> (Action) %E2%97%86 2d10 + 2 %E2%97%86 Signature
        <b>Keywords</b> Melee, Strike, Weapon
        <b>Distance</b> Melee 1<b>	Target</b> 1 creature or object
        %E2%9C%A6	<b>%E2%89%A411</b>	7 damage; slide 1
        %E2%98%85	<b>12%E2%80%9316</b>	10 damage; slide 1
        %E2%9C%B8	<b>17</b>	13 damage; slide 1
        <b>Effect</b> The shieldwall can shift 1 to remain adjacent to the target. A target restrained by a dwarf can be slid by this ability.
        <b>3 Malice</b> The shieldwall targets an additional creature or object.

        <b>Intercepting Shield</b> (Triggered Action) %E2%97%86 1 Malice
        <b>Keywords</b> -
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Trigger</b> A creature strikes an adjacent ally.
        <b>Effect</b> The shieldwall becomes the strike's target and halves the damage.

        <b> Call to the Wall</b>
        The shieldwall inflicts taunted (EoT) on a creature whenever they deal damage to the shieldwall or take damage from the shieldwall.



