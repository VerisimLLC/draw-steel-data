    notes:
    - text: |-
        Ensnarers are the result of pitlings getting hold of an unfortunate soul.
        A pitling in the process of digesting the soul of a creature has that soul physically bore through their head to become a fanged appendage. Mouths form across the creature's body, each attacking with long, barbed tongues.
