    - name: Topaz Field
      description: 'The dragon projects a psionic field around themself in a 3 aura at the start of each round. While the aura is active, the dragon ignores difficult and hazardous terrain within the affected area.


        An enemy that enters the affected area for the first time on their turn or starts their turn there takes 2 cold damage unless they have a psychic immunity. At the start of the dragon''s turn, the dragon gains a speed bonus equal to the number of enemies in the area that don''t have a psychic immunity until the end of their turn.


        Whenever the dragon is targeted by an ability that normally deals psychic damage, the area of the field shrinks by 1. The dragon can also reduce the area of the field by 2 at the start of each of their turns to end one effect on them that can be ended by a saving throw. If the area is reduced to 0, the field is inactive until the start of the next round.'
      __typeName: CharacterFeature
