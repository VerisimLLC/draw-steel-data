    import:
      data: |+
        Orc Dohma	Level 3 Leader
        Humanoid, Orc	EV 60
        <b>Stamina</b> 120
        <b>Speed</b> 6	<b>Size</b> 1M /<b> Stability</b> 2
        <b>Free Strike</b> 5
        Might +3	Agility +2	Reason +1	Intuition +2	Presence +2
        <b>Go.</b> (Action)%E2%97%86 Signature
        <b>Keywords</b> -
        <b>Distance</b> Ranged 10<b>	Target</b> 1 ally
        <b>Effect</b> The target moves up to their speed and uses a signature action.
        <b>1 VP</b> The dohma targets a second ally.
        <b>3 VP</b> The dohma targets a squad and one ally instead of 2 allies.

        <b>Mace Lariat</b> (Action) %E2%97%86 2d10 + 3
        <b>Keywords</b> Attack, Melee, Weapon
        <b>Distance</b> Reach 1<b>	Target</b> All enemies
        %E2%9C%A6	<b>%E2%89%A411</b>	5 damage; push 1
        %E2%98%85	<b>12%E2%80%9316</b>	9 damage; push 3
        %E2%9C%B8	<b>17</b>	12 damage; push 5; dazed (EoT)

        <b>Familial Reinforcements</b> (Maneuver)%E2%97%86 3 VP
        <b>Keywords</b> -
        <b>Distance</b> Ranged 15<b>	Target</b> Special
        <b>Effect</b> The dohma shifts up to their speed and 5 orc blitzers appear in unoccupied spaces.

        <b>Courtesy Call</b> (Triggered Action)
        <b>Keywords</b> -
        <b>Trigger</b> A creature gets a tier 1 result on a power roll or becomes winded
        <b>Distance</b> Ranged 10<b>	Target</b> Triggering creature
        <b>Effect</b> The target has a double edge on next power roll.

        <b>Close In</b> (Villain Action 1)
        <b>Keywords</b> Area
        <b>Distance</b> 10 Burst<b>	Target</b> All allies
        <b>Effect</b> Each target moves up to their speed. Enemies within reach of a target make an <b>Intuition resistance roll</b>:
        %E2%9C%B8	<b>%E2%89%A411</b>	Frightened of the dohma (INU ends)
        %E2%98%85	<b>12%E2%80%9316</b>	Frightened of the dohma (EoT)
        %E2%9C%A6	<b>17</b>	no effect

        <b>Lockdown </b>(Villain Action 2)
        <b>Keywords</b> Area
        <b>Distance</b> 10 Burst<b>	Target</b> All allies
        <b>Effect</b> Each target attempts a grab with an edge. The dohma then moves up to their speed.

        <b>I'll Do This Myself</b> (Villain Action 3)
        <b>Keywords</b> Attack, Melee, Weapon
        <b>Distance</b> Self<b>	Target</b> Self
        <b>Effect</b> The dohma shifts up to their speed and takes a Mace Lariat attack. Then, dohma shifts up to their speed and takes a Mace Lariat attack. Finally, the dohma shifts up to their speed and takes a Mace Lariat attack.

        <b>End Effect</b>
        The dohma takes 5 damage and ends one EoE effect affecting them at the end of their turn.

        <b>Relentless</b>
        If the dohma's Stamina drops to 0, they can take a free strike before dying. If the target is reduced to 0 Stamina by the attack, the dohma lives and their Stamina is reduced to 1 instead.

