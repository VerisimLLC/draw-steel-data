  - name: Dig
    description: ""
    __typeName: CharacterFeature
    canHavePrerequisites: true
    guid: a6f1b4e0-9405-4f86-b9e4-b490b0fb74a6
    implementation: 4
    modifiers:
    - name: Dig
      description: A creature with a burrow speed can use the Dig maneuver to move up to their size vertically, straight up or down through the ground.
      __typeName: CharacterModifier
      activatedAbility:
        name: Dig
        description: A creature with a burrow speed can use the Dig maneuver to move up to their size vertically, straight up or down through the ground.
        __typeName: ActivatedAbility
        abilityFilters:
        - formula: (Burrowing Speed > 0) and (Movement Type = "Walk" or Movement Type = "Burrow")
          reason: You can only Dig while walking on solid ground or already burrowing -- not while flying, hovering, or swimming.
        abilityType: none
        actionResourceId: a513b9a6-f311-4b0f-88b8-4e9c7bf92d0b
        behaviors:
        - __typeName: ActivatedAbilityCustomTriggerBehavior
          applyto: caster
          triggerName: Dig
          value: ""
        - __typeName: ActivatedAbilityDigVerticalBehavior
        categorization: Heroic Ability
        conditionalReminders:
        - formula: Movement Type = "Burrow" and Number of Creatures Grabbed > 0 and Can Dig While Grabbing = 0
          text: If a burrowing creature has a creature who is not unconscious grabbed, they can't willingly move deeper into the ground. It's too difficult to dig with a flailing enemy in your claws
        - formula: Movement Type = "Burrow" and Number of Creatures Grabbed > 0 and Can Dig While Grabbing > 0
          positive: true
          text: "{Name} can dig while grabbing another creature"
