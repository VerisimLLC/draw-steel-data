      description: While a creature is climbing or riding you, you can use a maneuver to attempt to knock them off.
      __typeName: CharacterModifier
      activatedAbility:
        name: Shake Off
        description: |-
          You attempt to knock a creature that is climbing or riding you off. They make a Might or Agility test:

          A tier 1 result means they fall off you into an unoccupied adjacent space, taking falling damage and landing prone as usual. A tier 2 result means they slide down you into an unoccupied adjacent space and don't land prone. On a tier 3 result they continue to hold on.
