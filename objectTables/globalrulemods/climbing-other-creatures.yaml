name: Climbing Other Creatures
_migrated_apply: true
modifierInfo:
  __typeName: ClassLevel
  features:
  - __typeName: CharacterFeature
    implementation: 4
    description: |-
      You can attempt to climb a creature whose size is greater than yours. If the creature is willing, you can climb them without any trouble. If the creature is unwilling, you make a Might or Agility test.

      While you climb or ride a creature, you gain an edge on melee abilities used against them. The creature can use a maneuver to attempt to knock you off.

      If you are knocked prone while climbing or riding a creature, you fall and land prone in an adjacent space of your choice, taking damage as usual from the fall.
    modifiers:
    - __typeName: CharacterModifier
      activatedAbility:
        __typeName: ActivatedAbility
        targetType: target
        behaviors:
        - __typeName: ActivatedAbilityPowerRollBehavior
          filterTarget: not Friends(Caster, Target)
          roll: 2d10 + Might or Agility
          tiers:
          - You fail to climb the creature, and they can make a free strike against you.
          - You fail to climb the creature.
          - You climb the creature.
          guid: a8d5c260-3f71-4b96-8e02-d19c74f5a3b8
