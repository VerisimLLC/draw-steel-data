      triggeredAbility:
        name: Critical Hit!
        description: "When you roll a natural 19 or 20 on an ability roll made as part of a main action, you score a critical hit and immediately gain an additional main action that you can use right away, even if it isn't your turn or you are dazed. An ability roll made as part of a maneuver, triggered action, or free strike can't score a critical hit. Granted free strikes, such as the one from the Troubadour's Dramatic Reversal, still get a tier 3 result on a natural 19 or 20 but do not trigger a critical hit."
