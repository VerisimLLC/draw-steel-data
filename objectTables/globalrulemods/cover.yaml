      __typeName: CharacterModifier
      activationCondition: '(Target.HasCover or (Line of Sight(self, Target) < 1) or (Target.MovementType = "Burrow" and Target.DistanceBelowGround >= 1) or (Caster.MovementType = "Burrow" and Caster.DistanceBelowGround >= 1)) and Self.Ignore Cover <= 0 '
