      source: Falling Global Rule Mod Feature
      sourceguid: 1f18ce16-b3c1-4e67-9352-a2585841b07f
      triggeredAbility:
        name: Fall Damage
        description: When a creature falls 2 or more squares and lands on the ground, they take 2 damage for each square they fall (to a maximum of 50 damage) and land prone. A creature who falls can reduce the effective height of the fall by a number of squares equal to their Agility score (to a minimum of 0).
        __typeName: TriggeredAbility
        abilityType: none
        behaviors:
        - __typeName: ActivatedAbilityDamageBehavior
          chatMessage: Falling Damage
          filterTarget: (speed - Fall Reduction) >= 2 and Target.InWater = 0
          roll: Min(50, (speed - Fall Reduction)*2) - Fall Damage Reduction
        - __typeName: ActivatedAbilityDrawSteelCommandBehavior
          filterTarget: (speed - (Fall Reduction + 4 when Target.InWater)) >= 2
          rule: prone
        - __typeName: ActivatedAbilityDamageBehavior
          chatMessage: Falling Damage - Landed in Water
          filterTarget: ((speed-4) - Fall Reduction) >= 2 and Target.InWater = 1
          roll: Min(50, ((speed-4) - Fall Reduction)*2) - Fall Damage Reduction
        - __typeName: ActivatedAbilityCustomTriggerBehavior
          triggerName: landfromfall
          value: Cast.Damage Dealt Against(target)
        conditionFormula: Stop Fall Damage < 1
        display:
