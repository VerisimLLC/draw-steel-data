documentation: Invoked on a creature that is climbing another creature when its mount uses Shake Off. The climber makes the test, so this is invoked on their controller. Tier 1 invokes Fall Off Creature, which prompts them for the adjacent space to fall into and then drops them from the height of the creature so the usual falling rules apply the damage and prone; tier 2 slides them down to an adjacent space automatically; tier 3 leaves them where they are.
