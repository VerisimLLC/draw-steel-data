documentation: Prompts a creature to make a ranged free strike with its own abilities. Deals no damage itself. It gathers every ability the creature can use as a free strike that has the Ranged keyword and offers those to be used. The chosen strike pays its own resource costs and does not consume an action, and casting it raises the makerangedfreestrike custom trigger. Use this for effects that read the target can make a ranged free strike, such as granted free strikes at range. For a fixed-damage attack instead, use Ranged Free Strike.
