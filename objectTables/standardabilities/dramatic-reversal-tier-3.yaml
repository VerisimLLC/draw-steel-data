documentation: 'Dramatic Reversal tier 3 package: the creature can shift up to 3 squares, make a free strike with an edge, then can spend a Recovery. Each step can be skipped. The recovery uses Prompt Spend Recovery (not May Spend Recovery) so the controller is always asked -- this package runs on the target player''s own machine, where May Spend Recovery would silently auto-spend. Invoked on each target of the Troubadour ability Dramatic Reversal via a prompt card.'
