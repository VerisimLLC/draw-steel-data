documentation: Prompts a creature to make a melee free strike with its own abilities. Deals no damage itself. It gathers every ability the creature can use as a free strike that has the Melee keyword and offers those to be used. The chosen strike pays its own resource costs and does not consume an action, and casting it raises the makemeleefreestrike custom trigger. Use this for effects that read the target can make a melee free strike, such as strike-on-death traits or granted free strikes. For a fixed-damage attack instead, use Melee Free Strike.
