documentation: The caster picks themselves or an ally, and that creature then chooses EITHER to spend a recovery OR to end one condition on themselves lasting until a save or the end of a turn. Pass <<targetfilter>> to narrow who is eligible beyond plain range (e.g. proximity to a summon), and <<range>> 999 when that filter is the real gate. Use "Purge Save Ends Effect and Recovery on Ally" when the caster must not be a valid choice and the target gets both effects.
