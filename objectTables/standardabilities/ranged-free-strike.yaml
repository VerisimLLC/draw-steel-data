documentation: The stock monster ranged free strike. A range 5 Strike that deals 2 damage (a flat number: free strike damage never scales with charges, and multiplying by Charges zeroed the roll when the strike was invoked from a channeled ability) and spends the free strike action resource. Monsters carry their own copy of this ability inside their stat block with the roll and damage type edited to match the creature, so edit the copy rather than this template. Use this when a creature should actually make the attack. To instead let a creature use whichever ranged free strike it already has, use Make Ranged Free Strike.
