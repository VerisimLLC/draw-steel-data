description: |-
  Read aloud
  - "Purple candlelight flickers in the room casting countless shadows."
  - "This dimly lit chamber contains many swinging iron doors that tell the full history of the Ala'ral family along its walls and ceiling. A once-proud noble family that has suffered many tragic deaths."
  - "Each door is engraved with the name and deeds of the person entombed behind it."

  Secrets
  - All the undead in this chamber are hidden behind doors at the start of the encounter. If the heroes ask to search for hidden enemies or danger, allow them to do so. Otherwise, the undead catch them by surprise.

  Encounter Adjustments
  - For three heroes, remove two vampires from group 3 and two waxens from group 4.
  - For four heroes, remove two vampires from group 3.
  - For each hero in the encounter above five, either add two vampires or waxens to their own group or start with 3 more Malice.

  Tomb Doors
  The tomb doors move freely on their hinges and can swing into either room. They can grant cover for size 1M or smaller creatures adjacent to them. A creature who is adjacent to a door can use a maneuver to swing it hard at another creature adjacent to the door. The target takes 5 damage. Creatures who are force moved into a door take 5 damage and keep moving as if they didn't hit an object.

  Tactics
  The vampires pounce and immediately engage the heroes, blocking their path in the hall to allow the waxens to rain down pain on the heroes at a distance. The vampires use Reactive Charm as often as they can to make the heroes harm each other.

  Ending the Encounter
  All the undead fight until the non-minion vampires are destroyed and then attempt to flee into the night. The heroes earn 1 Victory each for defeating the undead.

  Loot
  Inside the northernmost tomb is an Ala'ral family member who didn't move. They appear to have both femur bones coated in lead.
  These are Deadweights.
  Hall of Ala-ral

  Source: Draw Steel: Encounters, page 125.
