description: |-
  Read aloud
  - "The great tower juts into the sky, a shadow of its former self. Much of it has collapsed and fallen on the keep below, and the wind howls around the broken edge that leads only to open air."
  - "Four large jars made of copper and glass line the walls and are connected by copper cabling to a pair of tall metal pillars that seem to reach out to the lightning. An iron vat full of bubbling green ooze is attached to the jars by thick pipes."
  - "Something large wriggles within each of the jars, suspended in greenish liquid."
  - "Near to the iron vat in the center of the rooftop is a wooden table soaked in layers of blood and surrounded by loose shanks of discarded flesh. Behind the table is a tall war dog sporting a thick leather apron, a loud device on his back, and noticeably fewer scars than the others."
  - "When he notices you, he shoots you a menacing grin. 'I thought we might have guests. You've come just in time to test my latest batch! Let's see how long you can last against my boomdogs!'"

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add two war dog phosphorites to their own group or start with 3 more Malice.

  Mortum Cauldrons
  Each of the four Mortum Cauldrons around the edge of the tower contain one unawakened boomdog. Each cauldron has 10 Stamina, and, if shattered, the liquid within drains and the contained boomdog collapses and can no longer be awakened.

  It's Alive!
  At the start of any war dog's turn during this encounter, you can spend Malice to activate the following Malice feature. (Stat block in the book.)

  Tactics
  Potamus is buying time for his boomdogs to be awakened and sticks near the vat of ichor vitae while using the ranged version of his signature ability. The commandos harass the frontline heroes while the amalgamites try to keep them away from the cauldrons and lightning rods. Meanwhile, the phosphorites attack the backline heroes, using their range to keep far from the melee.
  When a boomdog is awakened, they move directly into the fray and try to tackle the nearest hero not already grabbed by a boomdog.

  Ending the Encounter
  The encounter ends when Potamus CDIV is killed. Upon his death, all remaining war dogs activate their loyalty collars and all Mortum Cauldrons detonate (dealing 1d6 damage to each creature within 2 spaces). The heroes earn 2 Victories each for defeating the war dogs.

  Loot
  Further exploration of the ruins reveals Potamus's personal bunk in the old master bedroom. In a chest of belongings there is a Mask of the Many and two Mirror Tokens.

  Source: Draw Steel: Encounters, page 40.
