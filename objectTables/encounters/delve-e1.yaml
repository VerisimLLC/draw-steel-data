description: |-
  Read aloud
  - "Shrieking shadows flit across the ceiling 50 feet above, backlit by motes of light that look like stars."
  - "The walls and floor are covered in several inches of thick, dark slime. Two enormous slug-like masses of sludge on the ground begin to stir."
  - "Rough steps lead higher into the mountain. Thick vines cover the eastern wall, and an enormous centipede made of moss and wood perched high on the rock wall turns to regard the new intrusion."

  Encounter Adjustments
  - For three heroes, remove one effluence of rot from group 2 and one rot bat from group 3.
  - For four heroes, remove one effluence of rot from group 2.
  - For each hero in the encounter above five, either add one effluence of rot or two rot bats to their own group or start with 3 more Malice.

  Coating of Sludge
  The slime on the walls and floor is relatively harmless, but it prevents non-elementals from shifting and halves the distance a creature can jump while touching it.

  Level 3 Hazard
  EV 3 per 10 x 10 patch (Stat block in the book.)

  Tactics
  The field of growth starts 5 squares high up on the wall above the vines.
  They try to remain along this wall throughout the encounter; they can target enemies and allies alike, as long as the target is in contact with the ceiling, ground, or walls of the cave. When they die, they crash to the ground, crushing anything below them.
  The effluences of rot use Convocation of Vermin on themselves or the field of growth to remain concealed. They engage as many enemies in melee as possible, using their attacks to regain Stamina, which stacks with the temporary Stamina continually granted by the field of growth's Convocation of Verdure. If the fight goes poorly, the elementals Split with Elemental Malice to double the Stamina they grant and regain.
  The rot bats are opportunists and not tactical or team players.

  Ending the Encounter
  When the field of growth and any of their splits are destroyed, the vines die back and the eastern wall cracks open to reveal the exit into the next cavern. The heroes earn 1 Victory each for escaping the cave. The elementals continue to fight until the intruders leave the cavern.

  Loot
  If all the elementals are destroyed, the sludge begins to thin out. The heroes can find a Necklace of the Bayou in the mud after the slime clears. If a hero wants to grab the treasure and has to move more than 5 squares to get it while the ritual is ongoing, increase the round count by 1.

  Source: Draw Steel: Encounters, page 115.
