description: |-
  Read aloud
  - "From up close, the scorpion is obviously mechanical. Its body looks like a black iron ship with six articulated legs, its pincers are iron hooks big enough to grapple a giant, and its tail is a hinged, climbable tower ending in a nozzle."
  - "One of the scorpion's giant pincers is trying to grasp an ogre-sized crate on the ground. On deck, war dogs are too busy watching the operation to notice you."
  - "As you approach, someone shouts an alarm. Instantly, war dogs line the railings of the vessel's deck."

  Encounter Adjustments
  - For three heroes, remove group 4, and each dynamic terrain object has its Stamina halved.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, add two war dog firestarters to their own group, increase each dynamic terrain object's Stamina by 45, or start with 3 more Malice.

  Barrel Stack
  On the Iron Scorpion's deck is a pyramidal stack of barrels that is 3 squares high at the peak and 1 square high at the bottom. The stack grants cover to adjacent creatures. A creature adjacent to the stack can make a Might test as a maneuver to push the stack over. The stack can also be knocked over by an effect that can force move an object. The barrels fall in a 3 x 3 area adjacent to their original position, toward the front or rear of the Iron Scorpion (depending on the general direction of the push).

  Might Test: Knock Over the Barrels
  ! The area is difficult terrain. @ Each creature in the area takes 5 damage and is knocked prone. The area is difficult terrain. # Each creature in the area takes 10 damage and is knocked prone. The area is difficult terrain.

  Crates
  The two coffin-like crates are each 1 square high and contain a 10- foot-long, inanimate severed leg. The war dogs plan to connect the legs to the torso in the hold. The completed body is to be presented to Logostician Vesper's new ally, the overmind Alzur the Cerebromancer.

  Claws
  Two scorpion claws hang in the air 5 squares above the ground, connected to the Iron Scorpion by hydraulic arms and long chains.
  A creature can move across the arms or the chains, treating them as difficult terrain.
  Each claw can be operated by a creature sitting in the chair on top of the claw.

  Scorpion Claw
  Level 9 Siege Engine Brute

  EV 22
  (Stat block in the book.)

  Tactics
  On turn 1, Logostician Vesper attacks once and then retreats to the hold (the hatch automatically opens to let them pass) to protect Alzur and warn the other war dogs of the danger coming their way. Each war dog firestarter in group 4 sits on one claw and pilots it, using it to grasp a hero if possible or using Twin Flamebelchers otherwise. The other war dogs start the encounter on deck. The war dog firestarter captains remain on deck, approaching the heroes while the war dog shriketroops attack from a distance. The scorpion tail uses Acid Bubble to target groups of heroes, including war dogs in the area if necessary.

  Ending the Encounter
  Apart from Logostician Vesper, the war dogs fight to the death. Each hero earns 1 Victory if the war dogs are defeated.

  Source: Draw Steel: Encounters, page 185.
