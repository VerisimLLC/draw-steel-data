description: |-
  Read aloud
  - "This antechamber is dominated by tables and chairs that paint the picture of a welcoming mess hall, spoiled by bloodstains of the battle that took place here."
  - "Two sets of stairs on either side of the room lead to a balcony that crosses above the front door, providing access to the arrow slits."
  - "To one side, an opening in the wall gives way to a small kitchen area."

  Secrets
  - The hearth in the kitchen vents to a hidden chimney on top of the bluffs. Heroes who manage to discover it could use it to sneak in and avoid the fortifications.

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add one hobgoblin incendiarist to their own group or start with 3 more Malice.

  Front Door
  The door is a barred wooden door with 9 Stamina, damage immunity 5, and fire weakness 5. A creature adjacent to it on the inside can unbar it as a maneuver.

  Timber Barricades
  A creature force moved into one of these barricades takes 3 damage in addition to any other effects. Its spaces count as squares of wood for the sake of breaking from forced movement.

  Arrow Slits
  Four arrow slits are hidden in the masonry of the facade, 4 squares high at eye level with the balcony inside. A creature adjacent to one of these arrow slits can draw line of effect through it. The arrow slits otherwise block line of effect.

  Chimney
  If the heroes notice the chimney smoke, they can make an Agility test to find another way inside without being discovered. It's been recently extinguished when the party arrives. If they reach the chimney, heroes can start the encounter near it in the kitchen instead of the front.

  Agility Test: Reach the Chimney
  ! They don't make it to the chimney before the hobgoblins find them. The heroes are surprised. @ They manage to reach the chimney, but the hobgoblins are alerted to their presence. # They reach the chimney without being detected. The heroes can climb down to catch the hobgoblins by surprise.

  Tactics
  The grandguard posts up on the stairs into the compound, while the lancers stay near the grandguard and attack from behind the barricades, exploiting their reach and high ground advantage. Meanwhile, the incendiarists inside attack through the arrow slits to wear down foes, and the recruits lie in wait in case the door is breached. The recruits unbar the door and join the grandguard out front once that hobgoblin is winded or they let the grandguard in if they were attacked from the kitchen.

  Ending the Encounter
  If the grandguard and at least one incendiarist are defeated, the hobgoblins break rank and try to flee, heading to O3 to warn their allies of intruders. Defeating or routing them earns each hero 1 Victory.

  Loot
  The kitchen contains a dried tongue and a recipe in Caelian to turn it into an Imp's Tongue, which counts as a project source for that item. It also contains three Healing Potions.

  Source: Draw Steel: Encounters, page 67.
