description: |-
  Captives
  The book marks 4 captives (not spawned) at squares (5, 9), (5, 8), (5, 7), (5, 6).

  Read aloud
  - "Raucous shouts, savage laughter, and the snarl of feasting gnolls is near deafening."
  - "The length of the cavern is taken up by a long makeshift feasting table: a splintered assembly of mashed wagon boards, stained red."
  - "Gnolls and hyenas snap and rip at messy piles of bloody bodies. At the far end are still-living captives, beaten and bound."
  - "Twin gnolls sit at the head of the table near the captives, leering over them as they chant profane vows in Tholl."

  Encounter Adjustments
  - For three heroes, remove eight abyssal hyenas and both gnoll marauders.
  - For four heroes, remove eight abyssal hyenas.
  - For each hero in the encounter above five, either add one gnoll abyssal summoner to their own group or start with 3 more Malice.

  Ritual
  The captives in the feast hall are trapped in plain sight. The summoners plan to sacrifice the merchants and feed them to their hyena minions, trying to "encourage" the beasts into transforming into full gnolls.
  If an abyssal summoner is not otherwise controlled or forced to engage the heroes, they strike at a helpless captive on their turn. If a captive is killed by an abyssal summoner, the cost of the gnolls' Bloodpool Malice feature is reduced by 1 until the start of the next round of combat. This effect stacks. Captives killed by non-summoner gnolls or other effects do not trigger this effect.

  Dining Table
  The table can be used for cover or elevation, or as a projectile. A segment of table moves 1 additional square when it is force moved, bringing any size 1M or smaller creature on top of it along for the ride.

  Tactics
  One of the marauders starts the encounter hidden in a bone pile.
  The wildlings use their numbers to keep the heroes at bay while the summoners sacrifice captives one by one and turn the hyenas into gnolls. The mage maulers provide methodical backup and pick off any magic users that could disrupt the ritual too soon.

  Ending the Encounter
  The abyssal summoners stay in the fight until they have no captives left to sacrifice. If both summoners fall or flee, any remaining abyssal hyenas shriek and flee the cavern. The remaining gnolls fight until the summoners are felled and they are outnumbered by the heroes, fleeing the cavern to bite another day. The heroes gain 2 Victories each for overcoming the gnolls and saving at least one captive, or 1 Victory each if they overcome the gnolls but all the captives are slain.

  Loot
  Should any of the captives survive, one is a local merchant named Revienne. She offers the heroes a plain leather bag and directs them to meet her in the nearby town when they're finished here. Should they do so, Revienne gives them an opal brooch to go with the bag, completing a Quantum Satchel.

  Source: Draw Steel: Encounters, page 31.
