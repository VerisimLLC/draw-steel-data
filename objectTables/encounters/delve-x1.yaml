description: |-
  Read aloud
  - "You plunge from the mouth of a towering snake demon idol into a pit of churning tar, boiling marrow, and molten gold. The air reeks of ozone and cremating heat gnaws at your eyes."
  - "Piles of liquefied treasure seethe and congeal into solid mounds atop the pit. Grunting figures heave their dissolving bellies across each burning gold mound and claw for jewels."
  - "Atop the largest pile of riches at the far end of the pit, a medusa with an ash-colored bridal veil pries rings from the fingers of disintegrating victims. She stacks the rings in a tempting collection of glittering gold."

  Secrets
  - An urn-stone cadaver collector hides in plain sight as a rocky mound floating in the sludge (see Urn-stone Mound). When the medusa notices the heroes, she screams and two izyaks and eight tyburakis are magically summoned into the chamber.

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, either add two izyaks to their own group or start with 3 more Malice.

  Tar, Marrow, and Molten Gold Pit
  The ground in the chamber is covered in a shoulder-deep sludge of hissing tar, boiling bone marrow, and molten gold. Treasure and bodies are disgorged in a constant stream from the mouth of the coil.
  Non-demons who lack the Swim or Fly keywords in their speed treat the pit as difficult terrain. Non-demon creatures who enter the pool for the first time on a turn, or start their turn there, take 15 acid damage.

  Mounds of Wealth and Woe
  Three smaller mounds of melting treasure and charred bodies float atop the pit. These mounds provide safety from the pit, albeit with risk.
  Mounds of Wealth and Woe Level 9 Hazard Ambusher EV 9 per 2 x 3 patch (Stat block in the book.)

  Tactics
  The medusa death-bride hews close to the largest pile of gold. At the start of combat, she shrieks at the approaching heroes: "You lie before Him, but my gracious Lord will never melt a crown atop your brows!"
  The death-bride repels as many approaching heroes as possible with her gaze abilities. If surrounded, she uses Serpent Wings to fly atop any pillars created by the collector.
  Once risen, the cadaver collector trudges through the pit to pulverize heroes. They use Tombstone Run to create barriers between the heroes and the medusa.
  The tyburakis position themselves to be adjacent to as many heroes as possible to make the most of their Tail Bite ability. They can swim in the liquid of the pit. The izyaks work together, using Ruinous Temptation to daze as many foes as possible and Nostalgic Wanderlust to keep heroes restrained in the liquid of the pit.

  Loot
  During the encounter, a hero can make an Intuition test to sift through the wedding rings at the foot of the Aurumvas statue as a maneuver.
  Intuition Test: Search the Mound of Wedding Rings ! The hero grabs a cursed ring. They become afflicted with a tomb-robber's curse. While cursed, the hero is compelled to grab magical gems and non-mundane treasure they find in the delve. (This becomes especially relevant in the Conclusion.) @ The hero finds nothing of value. # The hero finds the Cold Iron Chime of the Ferryman.
  If the area is cleared of enemies, searching heroes find the chime without needing to make an Intuition test.
  Ringing the chime summons a hooded skeletal boatman into the squares marked blue on the map. The boatman ferries the heroes east through the long, dark tunnels to area X2.

  Ending the Encounter
  When the medusa death-bride is first made winded, she rushes over to the statue of Aurumvas. Once there, she spends her main action shoveling through the heap of wedding rings in desperation. At the start of her next turn, she finds the Cold-Iron Chime of the Ferryman unless she is force moved into a square not adjacent to the mound.
  If she finds the chime, she rings it and boards the skiff. If the heroes cannot prevent her from boarding the skiff, the delve ends in defeat and the heroes are trapped in the Abyssal Wastes. She proclaims to Aurumvas, "The wretches sought to steal your glory, my Lord, but their bones only gild your throne!" If she cannot find the chime, she fights until slain.
  The urn-stone cadaver collector and other demons fight to the death.
  The heroes gain 1 Victory each for finding the Cold-Iron Chime of the Ferryman and using it to escape to area X2.

  Source: Draw Steel: Encounters, page 195.
