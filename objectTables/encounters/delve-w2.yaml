description: |-
  Read aloud
  - "The back half of the tent is occupied by a machine full of metal buttons, glass panels, dials, levers, and a jungle of wires."
  - "A war dog sits at the machine pressing buttons, pulling levers, and speaking into a cone that protrudes out of the machine. She sounds frustrated with others who move wires and fixtures around."
  - "At a table near the front, a doctor prepares stimulants for their audience of soldiers."

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, either add two war dog tormentites to their own group or start with 3 more Malice.

  Communication Machine
  When combat begins, the war dog sitting at the controls of the machine bangs on the controls, and rods protruding from the machine quickly begin spinning around shooting lightning. At the end of each round while the machine is active this way, each creature not wearing a war dog collar in the tent must make an Agility test to avoid the lightning.

  Agility Test: Avoid Lightning
  ! 10 lightning damage @ 5 lightning damage # No effect.

  Tactics
  The mischievites corral the heroes while the rest of the war dogs keep a safe distance. Given the chance, the tormentites use Vortex of Pain to scare the heroes into spreading back out. The war doc focuses on keeping the tormentites flush with temporary Stamina and isn't afraid to use Posthumous Promotion whenever one of their "allies" is beyond saving.

  Ending the Encounter
  The war doc fights to the death. When the remaining war dogs are outnumbered by the heroes, they willingly activate their loyalty collars in the hopes of harming as many of the do-gooders as possible. The heroes earn 1 Victory each for defeating the war dogs.

  Loot
  The war doc has a captain ID key on their person.

  Source: Draw Steel: Encounters, page 89.
