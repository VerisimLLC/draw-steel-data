description: |-
  Read aloud
  - "The nightmarish drone of buzzing reaches a crescendo as you descend into a massive ceremonial chamber."
  - "Towers and walls of wax encase the room. Nestled amid the structures, clusters of pulsating pale-blue eggs glow dully in the dim light."
  - "At the far side of the cavern, a giant wasp-like creature with a gaping maw of teeth on the underside of its abdomen raises a faceless head to assess you. Their skin splits into a leech-like toothed orifice, and they let out a high-pitched screech."
  - "In response, a hoard of insectoid demons rise as one, their focus drawn to you all at once as their maws salivate at the promise of violence."

  Encounter Adjustments
  - For three heroes, remove groups 2 and 3, and both northmost hive clusters are withered and dead.
  - For four heroes, remove group 2, and the northmost hive cluster is withered and dead.
  - For each hero in the encounter above five, add eight soulraker stingers to their own group, increase the soulraker hivequeen's Stamina by 120, or start with 3 more Malice.

  Arched Chamber
  This massive cavern has a ceiling 7 squares above the natural floor. The back portion of the chamber that isn't covered in wax rises 2 squares off the ground.

  Hive Clusters
  Pock-marked clusters of pale-blue translucent eggs glow faintly, pulsing with malevolent life within. At the start of her turn, the hivequeen can spend 2 Malice to cause one of these clusters to hatch, releasing either a soulraker praetorian or four soulraker stingers. These creatures join her initiative group.
  Each of these clusters is a size 2 object with 30 Stamina and fire weakness 5. If one is destroyed, it explodes - the hivequeen takes 10 psychic damage from the backlash, and all her enemies within 2 squares of the egg cluster must make an Agility test.

  Agility Test: Avoid the Burst
  ! 18 corruption damage; weakened (save ends) @ 13 corruption damage; weakened (EoT) # 8 corruption damage

  Tactics
  The hivequeen plays elusive, exploiting her flight in the large room to avoid dangerous melee combatants, while counting on her praetorians to keep ranged damage dealers busy. The soulraker stingers stay up on their raised platforms, laying down a constant barrage on the heroes.
  Meanwhile, the izyaks keep their distance while making sure those who get up onto the upper platforms live to regret it by hurling them back down with Nostalgic Wanderlust.
  Hivequeen's Lair

  Level 7+ Malice Features
  At the start of any level 7 or higher demon's turn, you can spend Malice to activate one of the following features. (Stat block in the book.)

  Ending the Encounter
  If the hivequeen is defeated, the remaining demons break rank and rapidly devour one another. The heroes earn 2 Victories each for defeating the hivequeen.

  Loot
  The heroes can find a skeleton wearing an Adaptive Second Skin of Toxins embedded in the corpse wax platforms. Furthermore, among the remains of the hivequeen, they find a Wellness Tonic in a rusty flask.

  Source: Draw Steel: Encounters, page 166.
