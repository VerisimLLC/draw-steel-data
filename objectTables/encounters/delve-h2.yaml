description: |-
  Read aloud
  - "The corridor narrows into a low cavern with deep indentations in its walls - large enough to serve as bunks."
  - "Even these sleeping quarters aren't safe from the oppressive humidity of the cave, and some have eroded concave, causing water to pool."
  - "Eight of the bunks nearby have old, rotten skeletons lying in them."

  Secrets
  - The skeletons are a red herring. Incorporeal members of Cryx's crew are hiding in the side passages of this room, setting an ambush for the heroes.
  - Snare traps are hidden in the chamber.

  Encounter Adjustments
  - For three heroes, remove group 2 and one specter from group 3.
  - For four heroes, remove one umbral stalker from group 2 and one specter from group 3.
  - For each hero in the encounter above five, either add two umbral stalkers or specters to their own group or start with 3 more Malice.

  Ceiling
  The ceiling in this cavern is only 2 squares high.

  Snare Traps
  Captain Cryx has ordered her crew to set up three snare traps in this room, concealing them in the loose silt of the chamber and driving them into the wall with pitons. They are marked with Xs on the map, and each triggers when a size 1M creature walks over the ground in that area. The incorporeal undead can't trigger these traps.

  Snare Trap
  Level 1 Trap Ambusher

  EV 1
  (Stat block in the book.)

  Tactics
  The undead in this fight use hit-and-run tactics. This room is claustrophobic and narrow, which is a serious problem for the heroes.
  It's much less so for the incorporeal undead, who can pass through walls to escape attackers. By moving through the southeast wall, they can get behind the approaching heroes and outflank them. The undead are willing to suffer an opportunity attack if it means they can elude a dangerous foe, and they try to trick attackers into triggering the snare traps by baiting them closer.

  Ending the Encounter
  These undead wish to slay the heroes and add them to the crew, but they aren't mindless in this endeavor. If the undead are outnumbered by the heroes, the remaining enemies attempt to retreat into area H3 to reinforce their captain. The heroes gain 1 Victory each for defeating the undead.

  Loot
  One of the bunks contains a small satchel with three vials of black ash and a recipe for Black Ash Darts, while another contains a Healing Potion.

  Source: Draw Steel: Encounters, page 21.
