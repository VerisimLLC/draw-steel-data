description: |-
  Read aloud
  - "A sound like a slow-boiling cauldron and an acrid smell that threatens to burn the skin of your nose permeate this room, which is dimly lit by the green light of large lanterns hanging overhead."
  - "Large cylindrical metal vats inscribed with shimmering glyphs dominate the far side of the room, one of which is much larger than the others, and set in a section of the room that looks to have been carved out with acid."
  - "Above the tanks, flanked by several of her draconic creations, a golden-scaled draconian woman with countless trinkets strung about her person raises a green, winged staff above her head, and calls out, "It is time! Rise, my creations!"
  - "Suddenly, the vats begin to rattle, the lid on one of them visibly lifting off as if pushed from within."

  Encounter Adjustments
  - For three heroes, remove group 4.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, add one ravager drake to their own group, increase Aeolyxria the Uncanny's Stamina by 70, or start with 3 more Malice.

  Raised Platform
  The back portion of the laboratory is 2 squares high above the floor and rises to 3 squares high near the size 3 specimen tank.

  Venom Sigils
  Aeolyxria inscribed these sigils into the walls of her laboratory and keyed them to a talisman on her person. As a maneuver, she can trigger one of them to spray a 3 x 6 line of poison. Creatures in the line must make an Agility test.

  Agility Test: Avoid the Poison Spray
  ! 10 poison damage; m<3] weakened @ 7 poison damage; m<2] weakened # 3 poison damage; m<1] weakened A creature adjacent to one of these sigils can make a Reason test as a maneuver to disable it.

  Reason Test: Disarm the Sigil
  ! The sigil is triggered by the attempt to disarm it. @ The sigil is disabled. # The sigil is disabled, and the creature manages to repurpose some of its magic. They gain 1 surge.

  Specimen Tanks
  These large metal tanks contain Aeolyxria's current experiments.
  When the heroes arrived, she started the process of waking them. The size 2 tanks each contain a ravager drake, while the size 3 tank contains an enhanced bull drake who deals an extra 3 damage with strikes and area abilities. If a tank is destroyed by a creature being force moved into it, the specimen inside immediately emerges, but is dazed until the end of the encounter. Additionally, if a hero is force moved into the vat, they roll 1d6; on a 4+, they gain the Dracomutant title (see area D2).
  At the start of each round, Aeolyxria chooses one of these tanks to start stirring. She can choose the size 3 specimen tank only at the beginning of the fourth round or later. The specimen inside wakes up at the end of the round. A creature adjacent to the tank with no enemies adjacent to them can make a Reason test as a maneuver to try to stop the process.

  Reason Test: Stop the Experiment
  ! The experiment completes, and the specimen immediately wakes. @ The experiment continues unabated. # The specimen dies.

  Chandeliers
  These large iron alchemical lanterns hang from the ceiling 3 squares up. Hanging more weight than this or dealing 15 damage to one of them causes it to shatter, spilling its volatile compounds in a 2-cube area. When a creature enters this area for the first time on a turn, or starts their turn there, they take 8 acid damage. Destroying all of them plunges the room into darkness.

  Tactics
  Aeolyxria knows she can't stand up to the heroes in a toe-to-toe melee battle. She uses Elevate to stay out of their reach whenever possible, otherwise retreating. She also conjures an additional pillar to give Lydixavus a vantage point, if possible. Lydixavus, similarly, harries the heroes as she flies around the room, using the pillars and chandeliers to keep distance while using Parting Gift to herd foes into the areas of the Venom Sigils. The drakes, meanwhile, attack recklessly and relentlessly, though Aeolyxria constantly shouts at them to be careful around the tanks, often to little effect. She is not shy about catching the drakes in the area of her Venom Sigils if it means getting the heroes.

  Ending the Encounter
  Neither Aeolyxria nor Lydixavus are here to fight to the death - if both draconians are winded and out of allies, they surrender. Otherwise, they fight relentlessly alongside the drakes until one of them sincerely believes their life is in danger. If both Aeolyxria and Lydixavus are killed, the drakes lose all direction and flee. The heroes earn 2 Victories each for defeating the draconians.

  Loot
  Aeolyxria's lab turns up a great many oddities, including a jar containing a sage's breath, and another containing a still-growing algae.
  Her notes indicate these are materials for Breath of Dawn and Purified Jelly, respectively, and serve as a project source for both of these.
  Additionally, a pair of badly damaged Lightning Treads are jammed under one of the tanks, with a note inside that reads "Note to self: fix these for Lyddie." They are unwearable in their current state, and repairing them is a project with a goal of 40 points, which Aeolyxria's notes serve as a source for.

  Source: Draw Steel: Encounters, page 109.
