description: |-
  Read aloud
  - "The sound of heavy breathing permeates this room, and its source is apparent as you enter: the left-hand side of the room is a row of metal cages, their sides hung with canvas, preventing the inhabitants of one from seeing into the next."
  - "Two prisoners, gaunt and frail, hold each other for warmth in the first cage."
  - "Inside one of the last cages, you see a bulky draconic figure with scales like black steel. About the size of a horse, the creature sleeps with caustic drool dripping between their jagged teeth."
  - "To the other side of the room, a stone table with a few chairs in front of it protrudes from the corner of the wall. It has all manner of lab equipment, open notebooks, and strange concoctions."

  Secrets
  - These creations are some of Aeolyxria's more successful minions. She can put them to sleep with commands in Vastariax: "Solimnix" for sleep, and "Avaretaex" to awaken them. Luficrex, a draconian shadow, is feigning slumber in the second-last cell, and observes the heroes' actions. If they see a good moment, they ambush, calling "Avaretaex" to awaken the beasts.

  Encounter Adjustments
  - For three heroes, remove group 2.
  - For four heroes, remove one ravager drake from group 2.
  - For each hero in the encounter above five, add one ravager drake to their own group, increase the bull drake's Stamina by 90, or start with 3 more Malice.

  Prisoners
  The two prisoners, Alden and Edie, are mountain villagers who were kidnapped by Aeolyxria. As a result of the experiments, their skin is slowly becoming covered in scales and their shoulder blades are bulging.
  The prisoners are noncombatants. When their cage is unlocked, both villagers flee and the heroes gain a hero token.
  These cages are used to store Aeolyxria's experimental subjects. As her current batch have been successfully tamed through hypnotic commands, the pens are not locked, save for the first and the last one.
  Though anyone can open or close one of these doors while adjacent to it on their turn (no action required), jamming it shut takes a main action. Luficrex has the key, allowing them to lock or unlock one of these cages as a maneuver. The locked door has 40 Stamina and damage immunity 5.

  Lab Desk
  This desk, laden with lab equipment, materials, and open notebooks, is a safety hazard waiting to happen. However, it also hides secrets of Aeolyxria's experiments. A hero who spends at least 1 minute reading through the books can make a Reason test.

  Reason Test: Investigate the Lab
  ! The hero finds nothing of note. @ The hero learns a little bit about Aeolyxria's experiments and gains an edge on all other tests to interface with her devices and sigils. # As 12-16, and the hero also learns the command to put the creatures in this room to sleep.
  Special: A hero can attempt this test as a maneuver, but suffers a double bane on the roll.
  If a creature is force moved into the desk, roll 1d6 + forced movement remaining.
  - 1-2: The creature inhales a strange gas and regains 5 Stamina.
  - 3-4: The creature touches a flame and takes 3 fire damage.
  - 5-6: The creature has acid splashed on them. They take 7 damage and if m<2], they are weakened (EoT).
  - 7-8: Something on the desk explodes, and the creature takes 12 fire damage and is pushed 3 squares directly away from the desk.
  - 9+: Strange magic erupts from the desk. The creature takes 15 corruption damage and if m<4], they are dazed (save ends). If the creature is a hero and not a dragon knight, you gain the Dracomutant title (see below). If the forced movement of the desk effect is triggered five times, the contents of the desk are destroyed completely, rendering it inert and preventing further investigation. Dracomutant: Something strange has taken root in you. The next time you finish a respite, you gain the ability to speak and understand Vastariax, if you don't already have it. Afterward, the next time you gain a level, you gain the dragon knight ancestry's Wyrmplate trait, and your maximum number of Recoveries is reduced by 1. You can remove this title with the Find a Cure downtime project (see Chapter 12 in Draw Steel: Heroes), though you retain your knowledge of Vastariax.

  Tactics
  Luficrex picks their moment very carefully. They spring into action if the heroes move far enough into the room that the drakes can get behind them, or if the heroes become fully distracted investigating the lab desk. When they do, they rush out of the cell they're hiding in, hoping to surprise the heroes with Ambuscade before awakening the drakes and teleporting into one of the pens to hide. The drakes burst out of their pens immediately and rush whoever's nearest to them while Luficrex continues their hit-and-run attacks.

  Ending the Encounter
  The heroes can win this encounter by killing everything here.
  Alternatively, if the heroes manage to put the drakes back to sleep, they can't be woken again by the hypnotic command for 10 minutes.
  In this case, if Luficrex is still alive, they surrender, but wait for a good opportunity to betray the heroes in the next area if they aren't locked up. The heroes earn 1 Victory each for defeating Luficrex.

  Loot
  The notes on the desk are a project source for a Dragon Soul armor enhancement. If the desk is destroyed, increase the resultant project goal by 30 the first time the notes are used, as it takes time to interpret the notes from what remains. A crate under the desk also contains three Snapdragons.

  Source: Draw Steel: Encounters, page 107.
