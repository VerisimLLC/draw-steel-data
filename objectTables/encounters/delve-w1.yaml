description: |-
  Read aloud
  - "Weapon racks, crates, barrels, and shelves line the tent. Most of the storage is neatly organized."
  - "A group of war dogs sit on crates and barrels drinking a milky white liquid from metal cups. A pungent odor from the liquid hangs in the air."
  - "The massive war dog in the back of the tent waits patiently to be deployed, all the while restlessly tapping their front hoof."

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add two war dog doomthieves to their own group or start with 3 more Malice.

  Barrels
  The barrels are full of a milky substance that war dogs drink to keep themselves nourished. When a creature is force moved into a barrel, they are splashed with the liquid. If the creature is a war dog, they gain 5 temporary Stamina. If the creature isn't a war dog, they take 5 poison damage.

  Crates
  The crates are full of alchemical supplies. When a creature is force moved into a crate or if a crate takes any damage, it explodes, dealing 5 fire damage to each creature adjacent to the crate.

  Weapon Racks
  If a creature is force moved into a weapon rack, they take an additional 5 damage.

  Tactics
  Most of the war dogs use their forced movement options to push their enemies into the sides of the tent and the crates, barrels, and weapon racks in the tent. The hypokrites engage their enemies in melee combat to make the most of Feign Death to damage the heroes and then teleport next to the equivite to protect them.

  Ending the Encounter
  The heroes earn 1 Victory each when all of the war dogs are destroyed.

  Loot
  The equivite has a captain ID key on their person. The shelves in the back contain two vials of Breath of Dawn.

  Source: Draw Steel: Encounters, page 88.
