description: |-
  Read aloud
  - "The tunnel leading into the cave ends in a large cavern. The ground is completely covered by dark mud, decomposing plant matter, and congealed blood."
  - "Lichen and mushrooms grow on top of a few large rocks scattered across the room."
  - "Swamp sludge constantly drips from the ceiling, keeping the chamber humid and fetid. The smell is made worse by small holes in the ground that spew sulfurous marsh gas like underground chimneys."
  - "Enormous creatures with leathery green skin and gangly limbs turn around to see who has entered their lair. To these trolls, this is the first time a meal has come knocking on their door."

  Encounter Adjustments
  - For three heroes, remove group 3, and the troll glutton in group 2 has only 80 Stamina.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, add one troll glutton with only 80 Stamina to their own group, increase one troll glutton's Stamina by 80, or start with 3 more Malice.

  Large Rocks
  Stones covered in fungi are peppered around this chamber. They grant cover to size 1L or smaller creatures adjacent to them.

  Marsh Gas Chimneys
  Plant and animal matter rotting underwater produce gases that bubble up until they escape into the air. These marsh gas chimneys are harmless until a source of fire gets too close. The trolls avoid fire, so they don't understand the flammable nature of the chimney, but any hero who can smell the gas knows it's explosive.
  When a chimney takes fire damage, the marsh gas ignites and causes a small explosion. Each adjacent creature makes an Agility test.

  Agility Test: Dodge the Explosion
  ! 15 fire damage @ 12 fire damage # 7 fire damage

  Tactics
  The gluttons start on the far end of the cave, using their Crash Through ability to quickly reach the entrance. They try to stay close to the party, using their Food Frenzy maneuver whenever possible to improve the efficacy of their Voracious Mastication ability. The ravagers start in the middle of the room, using hit-and-run tactics to damage the heroes and fall back into a safer position. The limbjumbles already start close to the entrance, knocking the heroes prone with their Arm and a Leg ability.

  Ending the Encounter
  The trolls' hunger and rage cloud their minds. They fight to the bitter end, until every single one of them has collapsed. The heroes earn 1 Victory each for defeating the trolls.

  Loot
  Behind one of the large rocks, covered in mud, are the bones of a long-dead human. Next to it lie a pouch containing an ounce of scrapings from a coven's used cauldron, a recipe for Stygian Liquor, and a vial with an Anamorphic Larva.

  Source: Draw Steel: Encounters, page 135.
