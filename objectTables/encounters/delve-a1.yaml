description: |-
  Read aloud
  - "The hollow welcomes you with a damp cove that stinks of moss and lichen."
  - "Even though the area is open to the sky, most of the rain is blocked by its walls. Only a light drizzle and the distant sound of thunder make their way inside."
  - "Water sits at knee-height near the entrance. The rocky ground is uneven, with tall mounds of dark sand collecting at the edges of the cove."
  - "Loud croaks emerge from the banks as groups of short frog folk with iridescent skin move to attack. Out of the water crawl eight-legged eels ready to aid the angulotls."
  - "A deep, guttural chanting carried on a magic wind suddenly fills the chamber, and the water in the chamber begins to rise."

  Encounter Adjustments
  - For three heroes, remove one angulotl needler from groups 1 and 2, and remove four angulotl pollywogs from group 3.
  - For four heroes, remove one angulotl needler from groups 1 and 2.
  - For each hero in the encounter above five, either add two angulotl needlers to their own group or start with 3 more Malice.

  Uneven Floor
  The floor of the cove has three distinct elevation levels. The center of the room sits 1 square above the southwest entrance and 1 square below the sand banks at the edges.

  Rising Waters
  As soon as the heroes are spotted, the croaking angulotls alert their whole tribe to prepare for combat! This prompts Daybringer Acueyatl to command the waters of the lake to flood the entrance to the lair.
  Combat starts with the water level at knee-height near the southwest entrance. After three turns (not rounds) of combat, the water in the lair rises by 1 square. The water overflows into the center of the room and becomes knee deep while the entrance is fully submerged. After three more turns, the water in the lair rises a second time and overflows into the sand banks.
  Areas where the water is knee-deep are considered difficult terrain for creatures who lack the Swim keyword in their speed. Creatures who start their turn in or enter an area of water that is at least 1 square deep become wet until the end of the encounter.

  Underwater Combat
  While a creature is fully submerged in water, they have fire immunity 5 and lightning weakness 5. If they can't swim at full speed while moving, their power rolls take a bane.

  Tactics
  The needlers take full advantage of the sand banks' elevation to hit the heroes with their blowguns while staying out of danger. The pollywogs start in the center of the room, using hit-and-run tactics through the water. The clawfish mill about in the water until they can shock wet enemies and potentially hook into smaller heroes as the water level rises.

  Ending the Encounter
  These warriors are just the hollow's first line of defense, so they only fight until all non-minion creatures are defeated - any remaining minions flee to the lake. The heroes gain 1 Victory each for defeating the angulotls.

  Loot
  A few orange blossoms grow from a crack in the rocky wall that surrounds the room. These are four Snapdragons.

  Source: Draw Steel: Encounters, page 11.
