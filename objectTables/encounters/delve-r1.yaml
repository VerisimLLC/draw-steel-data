description: "Read aloud\n- \"As you follow the stream underground through the darkness of a natural crevasse,\
  \ the rough walls and cramped tunnel give way to the worked stone and crumbling vaulted ceiling of an\
  \ ancient undercroft.\"\n- \"A ledge separates the upper and lower undercroft. At the top, crates of\
  \ supplies and a line of cells are guarded by war dog sentries. At the bottom, dozens of hacked up corpses\
  \ form a reeking midden next to the stream.\n- \"Torches light the top of the undercroft, but the lower\
  \ levels are dark, and the sentries don't seem to have noticed you \u2026 yet.\"\n\nSecrets\n- The cell\
  \ closest to the exit contains a war dog boomdog lying beneath filthy blankets.\n\nEncounter Adjustments\n\
  - For three heroes, remove group 2.\n- For four heroes, remove one war dog teletalite from groups 3\
  \ and 4.\n- For each hero in the encounter above five, either add two war dog boomdogs or war dog pestilites\
  \ to their own group or start with 3 more Malice.\n\nTiered Undercroft\nThe undercroft has a lower cavern\
  \ and an upper dungeon. The dungeon is 4 squares above the cavern's floor. There is a small ledge raised\
  \ 2 squares above the cavern's floor in the north portion of the map.\n\nMidden Heap\nThere is a pile\
  \ of rotting flesh heaped near the stream. A creature who has p<2] is weakened by the stench while they\
  \ are within 2 squares of it.\n\nUnderground Stream\nA small stream runs from a spring deep underground\
  \ and out of the undercroft through a crevasse. It is shallow enough to walk through and is treated\
  \ as difficult terrain by any creature without the Swim keyword in their speed.\n\nCrates and Barrels\n\
  Several wooden crates and barrels appear on the upper tier of the undercroft. They grant cover and concealment\
  \ to size 1M or smaller creatures adjacent to them.\nThey have 4 Stamina each.\n\nTactics\nGroups 1\
  \ and 2 want to stay in the upper tier and use their advantageous position to rain arrows and spells\
  \ down on the party.\nGroups 3 and 4 use the crates to break line of effect and sneak around behind\
  \ to attack low-Stamina heroes, dropping down to the lower tier via the ledge if they remain hidden.\
  \ The boomdog starts in the southernmost cell and does not attack until a creature with a soul comes\
  \ within 5 squares of it for the first time, after which they always attack the nearest creature with\
  \ a soul.\n\nEnding the Encounter\nWhen there are fewer war dogs left in the encounter than heroes,\
  \ any war dogs within 6 squares of the southwest exit retreat and join the Great Hall encounter. The\
  \ remaining war dogs activate their loyalty collars in hopes of catching the heroes off-guard. The heroes\
  \ earn 1 Victory each for defeating the war dogs.\n\nLoot\nIn the crates of supplies can be found a\
  \ satchel containing a variety of medicinal substances, including three ounces of powdered costmary\
  \ leaves (which can be used to create Healing Potions), 1 ounce of demon honey (which can be used to\
  \ create Buzz Balm), and the recipe for Healing Potions.\n\nSource: Draw Steel: Encounters, page 37."
