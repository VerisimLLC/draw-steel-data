description: |-
  Read aloud
  - "Moving through the rest of the citadel turns up nothing but ransacked rooms."
  - "There's no sign of additional war dogs - or of Castellan Hoplon, despite the taxiarch in the meeting hall seemingly confirming their captain is here and in 'the vault.'"
  - Secret: The blue ceramic disk claimed in the second area the heroes explored (see Loot in areas L1 and L2) is a key that allows the heroes to access area L3.
  - "While moving through a nondescript hallway, the blue ceramic disc suddenly begins to pulse and glow."
  - "A few paces away, a section of stone floor begins to glow blue - then becomes translucent as it seemingly slips out of phase with reality."
  - "A wide spiral staircase now extends down from the corridor, fading into darkness below." Any hero who has the Magic skill or a suitable background can sense a supernatural connection between the disk and the floor, with the disk acting as a dimensional key that "opens" the floor to give access to area L3 below. The floor restores itself as the heroes descend, but phases out again when any creature bearing a disk ascends from below.

  Encounter Adjustments
  - For three heroes, remove groups 4 and 5.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, add two war dog blackcaps to their own group in the central area, increase Castellan Hoplon's Stamina by 130, or start with 3 more Malice.

  Start Area
  The heroes start the encounter at the bottom of the stairs. Depending on their approach, it might be possible for some heroes to descend while others hang back above, allowing the entrance area to be scouted before the war dogs in the adjacent area become aware of the entire party.
  - "War dog draconites are hard at work in a domed chamber, breaking open crates piled high along the walls."
  - "At the center of the space, a circle set into the stone floor glows a brilliant blue."
  - "A steep flight of stone stairs leads up to an even larger chamber."

  Portals
  In addition to lore and resources stored here, the great secret of the hidden vault beneath Lord Lacham's citadel was a series of ancient teleportation portals. Their original programming and destinations are for you to determine, but Castellan Hoplon's plan is to reprogram their power to serve Ajax and his agents.
  After being brought back online by Hoplon, the portals presently connect only to each other. Any creature who enters a portal understands immediately that they can use a maneuver to teleport to any other portal they are aware of within the vault. A creature who teleports appears in an unoccupied space at the destination portal. If the destination portal has no unoccupied space large enough for the teleporting creature, that creature and each creature in the portal's space take 1d6 damage and are pushed to the nearest unoccupied space outside the portal. (Because the central area is 3 squares above the start area, heroes won't be aware of that central area's portal until they are able to observe it.)

  Crates
  Crates and boxes are piled up within the vault between 1 and 2 squares high. These areas must be climbed or jumped over, and provide cover.
  As a maneuver, a creature can slide 1 square of crates up to 3 squares to position them for better cover.

  Different Levels
  The central area of the vault is 3 squares above the adjacent areas, with the different levels connected by steep stairs that are difficult terrain.
  The higher central level is open to the levels below, and neither the edge of that level nor the staircases feature any railings or barriers.

  Tactics
  Castellan Hoplon is initially dismissive of the party's appearance in the vault, trusting the war dogs closer to the stairs to deal with them. Treat Hoplon, the blackcaps, and the prismites in the leftmost area on the map as a second wave, joining the fight in round 2.
  The two squads of war dog draconites close ranks to keep the heroes locked down. The blackcaps teleport to follow heroes using the portals to escape from trouble or get close to Hoplon. Castellan Hoplon stays close to his war dogs, hindering the heroes' attacks as he cuts down anyone who dares draw too close to him.
  All the war dogs use the portals to move through the vault, not caring if teleporting to an occupied portal deals damage to themselves or allies.

  Ending the Encounter
  Hoplon and his war dogs are zealots in Ajax's service, giving and asking no quarter. They fight until destroyed to the last.
  The heroes earn 2 Victories each for defeating Castellan Hoplon and his war dogs.

  Loot
  Castellan Hoplon carries another of the blue disks that open the entrance to this area. Additionally, Hoplon and his forces have long been collecting valuable treasures and lore for Ajax's war effort.
  Searching the war dogs turns up project resources or prerequisites for up to three treasures useful to the heroes.
  Lord Lacham and his followers stored lore and resources in the vault for the fight against Ajax, but were killed before they could use or disperse it. The crates and boxes can hold armor, magic, supplies, and weapons as you determine. Any resources the heroes need for themselves, or for the support of allies and people depending on them, can be sourced here.

  Source: Draw Steel: Encounters, page 147.
