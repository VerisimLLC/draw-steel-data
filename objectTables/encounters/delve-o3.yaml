description: |-
  Read aloud
  - "In the dull light of the hanging lanterns of a stagnant old stone cellar, the smell of offal and gore tinged with sulfur overwhelms the senses."
  - "Glowering down at you from a raised balcony, a hobgoblin painted with infernal sigils and decorated with skulls growls out, 'Look now my pet, meat comes willingly to your plate!'"
  - "At the center of the room, an inhuman creature twitches to consciousness. From beneath their mane of writhing tentacles, four arms pockmarked with crooked mouths emerge wielding jagged blades, and they rise on clawed feet."

  Encounter Adjustments
  - For three heroes, remove group 5, and remove four hobgoblin recruits from group 4.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, either add one hobgoblin incendiarist to their own group or start with 3 more Malice.

  Loft Supports
  The upper loft is 2 squares up and supported by seven metal posts, each of which has 9 Stamina and damage immunity 3. If four of these seven posts are broken, the entire upper loft collapses, the barrels on it are destroyed to no effect, and the area directly beneath it becomes difficult terrain. Each creature above or below the loft when it collapses must make an Agility test.

  Agility Test: Loft Collapse
  ! 10 damage, prone @ 6 damage, prone # 3 damage Any creature beneath the loft when it collapses that gets knocked prone also can't stand up (save ends).

  Storage Barrels
  The barrels on the upper loft break if they take a single instance of 5 or more damage, or if a creature is force moved into them. A creature can throw a barrel 1 square from the loft as a maneuver. A creature hit with a barrel takes 5 damage, and all creatures in a cube 3 area get splashed.
  A creature that gets splashed, or force moved into a barrel, suffers an effect dependent on the type of barrel.
  - Water: The creature gains fire immunity 5 until the next time they take fire damage. Additionally, they are unaffected by burning and immediately save against burning while they have this effect (as in against the hobgoblin incendiarist's effect).
  - Oil: The creature loses any fire immunity and gains fire weakness 5 until the next time they take fire damage. Additionally, if one of these barrels is destroyed by fire damage, all adjacent creatures and objects are burning.
  - Spirits: The creature is dazed until the end of their next turn.

  Tactics
  The war mage shouts commands at her pet from on high while empowering them with Enchantments of War. If not actively being commanded, the slaughter demon is pure wanton violence - they know not to kill their own allies, but otherwise hungrily approach whatever foes are nearest, and harm them until they are dead.
  The incendiarists rain hell down on foes with Fire Crossbow and Fireball Volley. Half the recruits utilize the Defend action and try to keep enemies from ascending the stairs, while the other half pelt the heroes below with oil and spirit barrels.

  Ending the Encounter
  If the slaughter demon and war mage are defeated, the fight is over.
  Otherwise, the hobgoblins fight to the death - they fear their leader and her demon far more than they fear the heroes. The heroes earn 2 Victories each if they defeat the hobgoblins.

  Malice Features
  At the start of any hobgoblin's turn, you can spend Malice to activate one of the following features. (Stat block in the book.)

  Loot
  The hobgoblin war mage is carrying a Scroll of Resurrection - shame it didn't help her in the end - along with a recipe in Caelian for Authority's End, which counts as a project source for that item.

  Source: Draw Steel: Encounters, page 70.
