description: |-
  Read aloud
  - "A massive window looks out onto the surrounding desert."
  - "Walkways divide the room into quarters. Between the walkways, shallow pits are crowded with war dogs, each connected to the floor by glowing tubes."
  - "In the center of the room, a floating brain with one central eye - an overmind - speaks: 'Where are my battle legs? Ajax promised me a flesh suit to rival yours, Logostician.'" The overmind Alzur the Cerebromancer was recently attacked by adventurers and left for dead, his floating eyes slain. He aids Logostician Vesper's mission while the war dogs create him a headless body to augment his power. Once it is completed, he intends to betray the war dogs - but Vesper has betrayed him by secretly installing a loyalty collar inside the body. (If the heroes have defeated an overmind in the past, such as Xorannax the Tyract, then this could be the same overmind.)

  Encounter Adjustments
  - For three heroes, remove two war dog socialites from each squad in group 3 and two war dog hunter-killers from each squad in group 4.
  - For four heroes, remove one war dog socialite from each squad in group 3 and one war dog hunter-killer from each squad in group 4.
  - For each hero in the encounter above five, add eight war dog hunter- killers to their own group, increase Alzur's Stamina by 115, or start with 3 more Malice.

  Crew Pits
  The room contains four crew pits, each 2 squares on a side and 2 squares deep. Each crew pit contains a squad of war dog socialites or a squad of war dog hunter-killers. These war dogs are connected to the Iron Scorpion by glowing tubes and can't willingly leave their spaces (their stability is 5 while connected in this way). Unlike the juicers in the hold's beds, these war dogs are combatants.
  A hero who enters a pit while at least one war dog remains within is immediately grabbed by a war dog (chosen by the Director) and knocked prone, provided the war dog isn't already grabbing another creature.

  Window
  The window is 6 squares long and 2 squares tall. It's transparent only from inside: from the outside, it looks just like the rest of the Iron Scorpion's hull. The window is made of a single pane of reinforced glass with 18 Stamina. Damage to any part of the window affects the whole, and once the window is reduced to 0 Stamina the entire window shatters, dealing 5 damage to adjacent creatures. Once the window is broken, it's a 3-square drop from the cockpit to the sandy ground below.
  Logostician Vesper can use this window with Portal to the Sky to teleport enemies outside the scorpion.

  Tactics
  If present, Logostician Vesper fights to the death to defend the Iron Scorpion. The war dog socialites use Call to Self-Sabotage against the closest foe while the hunter-killers use Fuse-Iron Rocket to harm foes attempting to hide away from the danger. Alzur the Cerebromancer gleefully sacrifices war dog minions to fuel his abilities. When Alzur thinks the battle is lost, he tosses a creature or object through the window (unless it's already broken), uses Sudden but Inevitable Betrayal, and flees.

  Ending the Encounter
  When Alzur the Cerebromancer and Logostician Vesper are both defeated, any remaining war dogs throughout the Iron Scorpion immediately activate their loyalty collars. The heroes earn 2 Victories each for defeating Alzur and Vesper.

  Loot
  Tossed casually in the crew pits is the loot from the Iron Scorpion's raids: enough coins and jewelry for each hero to earn 1 Wealth, an Abjurer's Bastion, an Elixir of Saint Elspeth, and Mindspeech texts for creating a Psi Blade (see Chapter 13: Rewards in Draw Steel: Heroes).

  Source: Draw Steel: Encounters, page 190.
