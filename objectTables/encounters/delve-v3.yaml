description: "Read aloud\n- \"As you enter the corridor, lights flicker on. On the back wall of the room\
  \ ahead, a tremendous, smiling construct is pinned to the wall by a spear. They're the same construct\
  \ that appeared in one of the blue light pictures in the last room.\"\n- \"The room contains an inactive\
  \ wall-to-ceiling forge on one wall with a conveyer belt trailing out of it. A tall construct sits on\
  \ the walkway overlooking the belt, admiring the small constructs frozen in time.\"\n- \"A huge machine\
  \ stands still near the large workbench, bristling with pincers, hammers, and a wrecking ball, frozen\
  \ with a cold half-forged sword in one pincer and a hammer in another.\"\n- \"On closer inspection,\
  \ the smiling construct is built into the wall, not just pinned to it. The spear in the construct's\
  \ chest flickers with electricity, sending continual arcs of lighting into the construct. The only sound\
  \ in the room is the crackling of the spear.\" Bench: The bench is covered with tools (both traditional\
  \ tools and unfamiliar, unusable ones), raw prismacore and valiar (beautiful but unusable without advanced\
  \ knowledge), and pieces of unfinished machinery. Forge: The forge area contains a furnace, a conveyer\
  \ belt, and a loading platform. The head of another valok can be seen poking out from the furnace. The\
  \ conveyor belt is only separated from the walkway by a knee-high guardrail. Spear: The spear in the\
  \ inert, smiling construct is a star elf weapon that deactivates constructs. If it is removed as a maneuver,\
  \ the construct - an intelligent multivok named Prototype -  reactivates, sending out a command that\
  \ activates all valok throughout the complex. This initiates both a combat and a negotiation (see Prototype).\
  \ If the heroes do not manually remove the spear and start to leave the room, the servok builder will\
  \ tip over and shake the room, causing the spear to fall out of Prototype. V3. Workroom\n\nEncounter\
  \ Adjustments\n- For three heroes, remove group 1.\n- For four heroes, the multivok chief has only 110\
  \ Stamina.\n- For each hero in the encounter above five, add one multivok chief with only 110 Stamina\
  \ to their own group, increase one multivok chief's Stamina by 110, or start with 3 more Malice.\n\n\
  Minion Captains and Initiative Groups\nWhenever a tough elite monster is listed as the captain to a\
  \ large number of minions, you can have the minions and their captain act on different turns once in\
  \ a while like we do in V3 and V1. This can give the heroes a chance to respond to the threat while\
  \ still maintaining the captain bonus for a particularly organized squad of minions. \xA3\n\nForge\n\
  The forge unit roars to life when Prototype is activated. The unit has 100 Stamina and damage immunity\
  \ 10. It shields a furnace that produces unfinished valok onto the conveyer belt. The forge continues\
  \ to produce valok until it is destroyed or Prototype turns it off.\nAt the end of each round, if any\
  \ creature or object is inside of the forge's furnace, it erupts in blue flame. Each creature and object\
  \ in the furnace when it activates takes 20 fire damage. If a creature or object is reduced to 0 Stamina\
  \ by this damage, its organic parts are vaporized and its inorganic parts are reduced to slag.\n\nConveyer\
  \ Belt\nAt the start of each round (including the first), the conveyer belt slides all creatures and\
  \ objects currently on the belt until they arrive on or adjacent to the loading platform.\nEight new\
  \ multivok relics from the forge then slide onto the conveyer belt. These relics don't activate and\
  \ join the initiative either until the start of the next round or until all of the previously activated\
  \ relics have been destroyed.\n\nPrototype\nThe smiling construct, Prototype, is three squares tall\
  \ and built into the wall. Prototype is solid valiar with no moving parts and can't be destroyed.\n\
  Prototype is inert while the spear is stuck in their chest. A creature can use a maneuver to remove\
  \ the spear or put it back into Prototype, deactivating them. Deactivating Prototype has no effect on\
  \ the other valok. The spear is a leveled treasure called Short Circuit (see Loot).\nWhen the spear\
  \ is first removed from Prototype, Prototype instantly regains consciousness and issues a command in\
  \ Rallarian: \"Activate: initiate self-repair.\" Each valok in the complex immediately reactivates,\
  \ repairing themselves and re-attaching or replacing any lost body parts.\nWhile the valok are self-repairing,\
  \ Prototype asks in Rallarian, \"Query:\nWho are you? You are not the star elves who attacked me just\
  \ now.\" If the heroes don't understand, Prototype repeats the question in High and Low Rhyvian, Kheltivari,\
  \ Phorialtic, and Ullorvic.\nBefore the heroes can answer, the valok in the workroom finish self-repair\
  \ and immediately attack.\n\nNegotiating With Prototype\nIf any of the heroes can communicate with Prototype\
  \ (Prototype knows Rallarian, High and Low Rhyvian, Kheltivari, Phorialtic, and Ullorvic), the heroes\
  \ can converse. If the heroes make any requests of Prototype (such as to deactivate the valok or to\
  \ share ancient secrets), Prototype responds, \"You breached my facility. Why should I cooperate with\
  \ you?\" The heroes must negotiate to win Prototype's cooperation.\nIf the heroes negotiate during combat,\
  \ on each hero's turn a hero can make an argument in addition to their other activities, provided they\
  \ or another hero shares a language with Prototype. Dwarf characters gain an edge while negotiating\
  \ with Prototype. \xAE\n\nMotivations\nDiscovery: Prototype loves research and acquiring new knowledge.\
  \ If the heroes promise to share new facts and useful knowledge with Prototype as part of an argument,\
  \ they appeal to this motivation.\nLegacy: If the steel dwarves are gone, then the existing people of\
  \ the world should be their inheritors. If the heroes argue that allowing them to live lets them share\
  \ the gifts of the steel dwarves with others, they appeal to this motivation.\n\nPitfall\nFreedom: Prototype\
  \ doesn't want to leave the facility. If the heroes offer to help Prototype leave the facility, they\
  \ invoke this pitfall.\nGreed: Prototype has no interest in rewards or wealth. If the heroes offer them\
  \ anything of material value, they invoke this pitfall. \xA3\n\nNegotiation Outcomes\nThis negotiation\
  \ can have the following outcomes:\n- Interest 5: Prototype agrees to turn off the forge and disable\
  \ the other valok in this room, and gives the heroes both research materials and the Prototype Gem (see\
  \ Loot).\n- Interest 4: Prototype agrees to turn off the forge and disable the other valok in this room.\n\
  - Interest 3: Prototype agrees to turn off the forge and disable the other valok in this room, but first\
  \ they must give him schemas, journals, or other documents that can serve as the project source for\
  \ at least five crafting projects.\n- Interest 2: Prototype refuses to deactivate the valok in this\
  \ room, but if they defeat the combative valok, Prototype gives them the research materials in this\
  \ room (see Loot).\n- Interest 1: Prototype refuses to deactivate the valok in this room.\n- Interest\
  \ 0: Prototype refuses to deactivate the valok in this room and emits a loud screech. Each hero in the\
  \ room takes 20 sonic damage. If the heroes convince Prototype to disable the hostile valok in this\
  \ room, the construct warns the heroes that they will have to fight their way out of the gauntlet. Prototype's\
  \ signal can't reach freestanding valok outside of the workroom. Prototype can continue to converse\
  \ with the heroes as they move through the gauntlet. The construct can deactivate the display models\
  \ in V2 and open doors on command, but only does this for the heroes if asked.\n\nPrototype's Memories\n\
  While conversing with Prototype, the heroes can learn a little about the ancient past (but not much:\
  \ Prototype never left this facility and knew little of the wider world).\nPrototype was an experimental\
  \ intelligent valok built by the steel dwarves to run a completely automated research facility called\
  \ a gauntlet. Prototype produced several inventions, including the mining servok in the display room.\
  \ Steel dwarf scientists had gathered to inspect the mining servok when a team of star elves attacked,\
  \ destroying valok, slaughtering dwarves, and using a magic spear to deactivate Prototype. That's the\
  \ last thing Prototype remembers.\n\nTactics\nOnce activated, the multivok chief stands in front of\
  \ the display room door so that heroes must pass them to enter the room. The chief closes the door at\
  \ the end of their turn while there are one or more heroes still in the display room.\nThe servok war\
  \ engine stays at a distance while using ranged abilities, lunging forward to use Blade Rake. The multivok\
  \ relics stay behind cover and use their Arm Blasters, switching to Arm Blades if approached. One of\
  \ the multivok relics climbs the destroyed war engine to trigger their attacks.\n\nEnding the Encounter\n\
  The encounter ends when the heroes escape or the valok are destroyed.\nThey relentlessly pursue heroes\
  \ to the best of their abilities, but they can't open doors. The heroes earn 1 Victory each for destroying\
  \ the valok.\n\nLoot\nAmid the valok debris is a rusted-over crown made of starmetal.\nIts magic is\
  \ long gone, but the relic might prove interesting to anthropologists researching star elves or their\
  \ lingering institutions (see Continuing the Story).\n\nShort Circuit\nThe tip of this spear flickers\
  \ with lightning.\n\nKeywords: Magic, Spear\nSpecial: This spear was crafted to be able to pierce valiar\
  \ metal. It treats any valiar like mundane metal and ignores valiar traits such as the valok's Valiar\
  \ Might. 1st Level: Any weapon ability that deals rolled damage using this weapon deals an extra 1 lightning\
  \ damage. Whenever you damage a creature with the weapon, you can immediately use a maneuver to slide\
  \ the creature 2 squares. This forced movement ignores Stability.\nInstead, the forced movement is reduced\
  \ by a number equal to the target's Reason score.\nAdditionally, whenever you make a strike using the\
  \ spear against a construct and obtain a tier 3 outcome, the spear sticks in the construct.\nYou can\
  \ use a maneuver to remove it. While the spear is stuck in the construct, they are either weakened---if\
  \ they are a leader or boss---or they are deactivated. A deactivated construct reactivates once the\
  \ spear is removed. 5th Level: The weapon's extra lightning damage increases to 2 and the distance you\
  \ slide a target increases to 4. If the target slides into another creature or object, that creature\
  \ or object takes 3 lightning damage. 9th Level: The weapon's extra lightning damage increases to 3\
  \ and the distance you slide a target increases to 5. If the target was moved at least 1 square, you\
  \ can choose to have the target make a melee free strike against a creature or object of your choice.\n\
  If the heroes negotiated with Prototype and obtained an Interest of 5, Prototype gives them a 4th-echelon\
  \ trinket, the Prototype Gem.\n\nPrototype Gem\nInside this blue gem is a flickering image of Prototype.\n\
  \nKeywords: Magic\nEffect: Once per respite, while working on a downtime research project, a hero can\
  \ use the Prototype Gem to consult with Prototype about the project. The hero gains a +10 bonus on the\
  \ project roll and is considered to know Rallarian, High and Low Rhyvian, Kheltivari, Phorialtic, and\
  \ Ullorvic.\n\nV2. Display Room\nProvide the following information if the valok are activated: \"At\
  \ the podiums, ghostly dwarves are giving a silent speech to a spectral audience, occasionally gesturing\
  \ at the charred drill vehicle as if describing its features. As you enter, the dwarves shout a rally\
  \ cry and reach for ghostly weapons.\"\nA hero that knows Rallarian can understand their cry: \"Star\
  \ elf intruders! To arms!\"\n\nDisplay Models\nThe valok on display aren't fully functional units, but\
  \ they are armed.\nEach display model has 110 Stamina. Whenever an enemy enters the area within 3 squares\
  \ of a model or starts their turn there, the model blasts them and deals 10 fire damage.\nOnce activated,\
  \ the models stay active until they are destroyed or turned off by Prototype.\n\nRestless Spirits\n\
  The undead dwarves are reliving the moment when the star elves attacked and see the heroes as the assailants.\
  \ If a hero understands Rallarian, they can hear the spirits taunting them with phrases such as \"No\
  \ star elf will stop our progress!\" and \"We will outlive you!\"\nA hero can use a maneuver once per\
  \ turn to make a Presence test to convince the dwarves to stand down (for instance, by telling them\
  \ that their war is long over). They have a double bane on the test unless they use a podium (see Stage).\n\
  \nPresence Test: Dismiss the Undead\n! The attempt has no effect. @ Each haunt and echo spirit in the\
  \ room takes 10 damage. If this damage reduces a creature to 0 Stamina, they bow and fade away. # Each\
  \ haunt and echo spirit in the room takes 20 damage. If this damage reduces a creature to 0 Stamina,\
  \ they bow and fade away.\n\nStage\nThe stage's steps are difficult terrain. At each corner of the stage\
  \ is a podium. When a hero adjacent to the podium speaks or whispers, their voice echoes throughout\
  \ the facility. A hero can attempt to dismiss the undead from a podium with no penalty on the test.\n\
  The podiums also amplify loud sounds. While a creature is adjacent to a podium, any sonic damage they\
  \ deal is doubled.\n\nV1. Guardroom\nProvide the following information if the valok are activated: \"\
  From among the wreckage, a dozen constructs stand up, their eyes glowing. One war engine by the door\
  \ rights themself onto their metal- treaded wheels, their gun tube swiveling and their serrated blade\
  \ humming to life. The overturned war engine twitches and can't right themself.\"\n\nBanners and Ledge\n\
  Four wall banners, each 1 square wide and 3 squares high, extend up to a ledge three squares above the\
  \ floor. The banners can be climbed easily. The ledge is 1 square wide and rings the room, jutting out\
  \ from the wall. A prone creature on the ledge has cover from creatures on the floor.\n\nWar Engines\n\
  When the valok are activated, one war engine activates normally and becomes a combatant. The other war\
  \ engine is too badly damaged to fully activate.\nThe damaged war engine has 130 Stamina. They can't\
  \ take actions on their own, but a creature on top of them can use a main action to manually trigger\
  \ one of their weapons, causing them to use the servok war engine's Blade Rake or Prismacore Cannon\
  \ ability with the creature's choice of target. They can be activated once each turn. The machine blocks\
  \ the way out of the gauntlet and must be moved or destroyed before escaping.\n\nValok Debris\nEven\
  \ after the valok have been reactivated, the floor is riddled with pieces of valok too damaged to be\
  \ fully reactivated. This debris is difficult terrain. An enemy that enters the debris or starts their\
  \ turn in it takes 8 damage from twitching, swiping limbs.\n\nSource: Draw Steel: Encounters, page 174."
