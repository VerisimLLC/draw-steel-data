description: |-
  Read aloud
  - "The worked walls of the tunnel begin to narrow, their stones glistening and shimmering with moisture."
  - "A cavern opens up ahead, its rough walls and floor lit up by a pale purple light shed by globs of glowing ooze scattered across the ceiling."
  - "A rough-walled pit opens up near the center of the cavern floor, lit by the same purple light."
  - "The cavern is filled with oozes, surrounding the pit and already advancing."

  Secrets
  - In addition to the visible ooze guardians watching over this area, a gummy brick lurks motionless at the far side of the cavern. The brick is hidden until they move, but any hero who intentionally scans the cavern before moving into it can make an Intuition test to note the ooze's presence by spotting an object within it.

  Encounter Adjustments
  - For three heroes, remove group 4 and one gummy ball from group 2.
  - For four heroes, remove one creeping sludge from group 3 and one gummy ball from both group 2 and group 4.
  - For each hero in the encounter above five, either add two creeping sludges or gummy balls to their own group or start with 3 more Malice.

  Intuition Test: Detect the Hidden Gummy Brick
  ! Some sort of object sits on the ground across the cavern, lit up by a flicker of firelight. @ A helmet of some sort floats just above the ground across the cavern, lit up by a flicker of firelight. # A helmet floats just above the ground across the cavern, set with curving horns of ebony that hold a crackling plume of fire between them.
  The floating object is a Hellcharger Helm that the gummy brick consumed long ago, and which now hangs suspended within the creature's translucent form. See more details in the Tactics section.

  Glowglobs
  This area is lit by twenty glowglobs - fist-sized dollops of squishy glowing ooze created by the Oozemaster. Glowglobs aren't creatures and pose no threat. They light up the surrounding area and can be easily carried as a light source if placed in a glass jar or other transparent container. Glowglobs are highly valuable, as they live indefinitely if given a bit of water and food once per week.

  Spiky Stone Floor
  A few areas of closely clustered stone spikes are difficult terrain. When a creature is force moved into or knocked prone onto a square of the spiky floor, they take 4 damage.

  Tactics
  White ichors are a special creation of the Oozemaster. Tasked with not allowing intruders down to area S3, the oozes here ensure that any forced movement keeps the heroes away from the Sluice tunnel.
  The gummy brick makes use of the Hellcharger Helm they "wear," using the Charge main action each round to increase their speed as they tear around the cavern.
  All the oozes focus on heroes trying to enter the Sluice tunnel. However, if all the heroes successfully descend the tunnel before the oozes are destroyed, surviving oozes fall back and continue to guard the cavern.

  Ending the Encounter
  These oozes have been placed here as guardians by Oz the Oozemaster.
  They are compelled to stay in this area and fight until destroyed. The heroes gain 1 Victory each for exiting the area through either the Sluice tunnel or any of the six northernmost side tunnels.

  Loot
  The Hellcharger Helm inside the gummy brick can be claimed by the heroes if that creature is destroyed.

  Sluice Tunnel
  What appears from a distance to be a pit 3 squares across is actually a rough-walled natural tunnel descending along a twisting corkscrew path. The water of the Sluice once fountained up the tunnel from area S3 to flow along the sewer tunnels.
  Without magic or some other way to avoid climbing, descending the tunnel safely to reach area S3 requires an Agility test. Each hero who climbs down on a rope lashed to one of the stone spikes on the cavern floor gains an edge on the test.

  Agility Test: Descend the Sluice Tunnel
  ! The hero slips and slides all the way down the corkscrewing tunnel, losing 2d6 Stamina. @ The hero slips only a few times while climbing, losing 1d6 Stamina. # The hero descends the tunnel safely.
  Glowglobs clinging to the walls fill the tunnel with pale purple light.

  Side Tunnels
  These tunnels are much more erratic and natural. To reach the cavern below from one of these tunnels, it'll take strong intuition to get there.
  Anyone can go back and take the Sluice tunnel instead!
  Any hero must make up to three Intuition tests to navigate their way down. They reach the elemental cavern in area S3 after their third attempt or as soon as they get a tier 3 result. A hero takes a bane on the roll if they travel alone.

  Intuition Test: Navigate the Side Tunnels
  ! The hero gets lost in the tunnels. They and any creatures traveling with them lose 2d6 Stamina exerting themselves. @ The hero has a sense of how to get down, but it's taking time.
  They and any creatures traveling with them lose 1d6 Stamina exerting themselves. # The hero finds a way down, and they and any creatures traveling with them can enter area S3 from their choice of either of the tunnels on the map rather than in the normal starting area.
  The first time a hero gets less than a tier 3 result on the test, their group gains an edge on their next attempt. The second time they fail, their group has a double edge on their last attempt. The hero and any creatures traveling with them eventually find their way to the cavern after resolving their third attempt.

  Source: Draw Steel: Encounters, page 57.
