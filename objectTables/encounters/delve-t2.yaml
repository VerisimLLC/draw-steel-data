description: |-
  Read aloud
  - "The scent of long forgotten tomes is tangible. The woody notes of the paper mingle with the metallic tang of fresh blood."
  - "In the far corner, several bookcases have been moved and fashioned into a makeshift barricade. The raiders are ready for their intruders."

  Secrets
  - There are three time raider hijacks, each hiding behind a bookcase near the entrance to the room.

  Encounter Adjustments
  - For three heroes, remove group 2.
  - For four heroes, remove one time raider hijack from group 3.
  - For each hero in the encounter above five, either add one time raider hijack to their own group or start with 3 more Malice.

  Mind Punks
  The mind punks in this encounter are piloting lightweight versions of their typical vehicles. They are size 1L instead of size 2, and their speed is 6.

  Tactics
  The time raiders here are ready for intruders after the noise of the battle in area T1. The hijacks come out of from behind the bookshelves and attack heroes attempting to stay at range. The myriads attempt to slide the heroes into bookshelves.
  The helix utilizes their Kinetic Lanes to force the heroes into the walls and away from the barricade. The longer it takes the heroes to reach the next room, the longer the helix can assault them with Blaster Volleys.

  Ending the Encounter
  Much like in the ruined hall, these time raiders fight to the bitter end.
  Except for the helix; if all other time raiders are defeated before them, they surrender and beg for their life.
  The heroes gain 1 Victory each for defeating the time raiders.

  Loot
  Several books in this room contain records of hidden draconian settlements and old dragon knight heroes written in Caelian. There's also one roughed up tome written in the First Language that covers the time magic the draconians used on the temple. A hero can research the tome and learn about its contents as a downtime activity to research lost knowledge (see Chapter 12 in Draw Steel: Heroes).

  Barricade
  The barricade of bookcases provides cover to creatures who are adjacent to it from creatures on the other side of the wall. The barricade is 2 squares high and each square of the barricade has 3 Stamina.

  Bookcases
  There is just enough space behind the standing bookcases that size 1L or smaller creatures can fit behind them, granting them cover from creatures not behind the bookcase.
  If a creature is force moved into a standing bookcase, it falls. Each creature adjacent to or on a bookcase when it falls takes 5 damage.

  Source: Draw Steel: Encounters, page 49.
