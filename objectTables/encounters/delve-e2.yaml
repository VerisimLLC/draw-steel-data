description: |-
  Read aloud
  - "A winding tunnel leads to a bright cavern lit by lavafall. Lava bubbles and pools throughout the stony interior."
  - "The only obvious exit is an unassuming metal door on the western wall."
  - "Tight clusters of butterflies flicker in and out of existence across the cavern. Each swarm appears to lack depth, making it hard to discern their true positions."
  - "A giant metal crab scuttles closer, pincers clamping with a squeal and a bang."

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, increase one edifice of steel's Stamina by 80 or start with 3 more Malice.

  Lava
  Level 3 Hazard Hexer EV 4 per 10 x 10 patch (Stat block in the book.)

  Tactics
  The edifices of steel try to impale as many enemies as possible before walking them over lava. When an impaled enemy appears near death, the edifice uses Trisect and lets them fall prone in the lava. The enigmas of void use the Convocation of Stars upgrade to make the edifices invisible while engaging in hit-and-run attacks without provoking opportunity attacks.

  Ending the Encounter
  When one edifice of steel is destroyed, the ladder in the lavafall becomes accessible. The heroes earn 1 Victory each for escaping the crucible. The elementals continue to fight until the intruders leave the crucible.

  Loot
  Through the metal door is a vast and cluttered library full of esoteric texts regarding the nature of the elements and elementals. With this trove, a hero can claim the Ancient Loremaster title after completing this delve. Heroes can also find two leveled items: a Chain of the Sea and the Sky armor and a Thief of Joy. If a hero grabs either treasure while the ritual is ongoing, increase the round count by 1.
  Dulcaine's journal is here. It contains details of his life after losing Loeren (detailed in the intro) and his plan to resurrect her by summoning an omen dragon. Quickly skimming the journal doesn't increase the round count.

  Source: Draw Steel: Encounters, page 117.
