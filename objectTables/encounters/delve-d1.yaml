description: |-
  Read aloud
  - "This old stone atrium is lit by hanging lanterns spiked into pillars that flank the center walkway and stretch toward its arched ceiling. These magical lights cast the chilling mountain fortress in a dull green hue."
  - "On old gargoyles jutting out from the pillars, crimson snakelike creatures with crooked wings and mouths dripping an oily fluid stir to attention. As they take flight, they undulate as if slithering through the air."
  - "Meanwhile, a 7-foot-tall dragon knight with snow-white scales marred by countless scars and scrapes steps into the light. Without hesitation, he bellows out a roar, unslings a massive sledgehammer, and kicks off toward you like a meteor breaching the clouds."

  Secrets
  - Wystixis's hunting companion, a lightbender, is hiding in the shadows of this room awaiting their opportunity to pounce.

  Encounter Adjustments
  - For three heroes, remove groups 4 and 5.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, add one wending drake to their own group, increase Wystixis the Hateful's Stamina by 80, or start with 3 more Malice.

  Pillars
  The pillars hold the roof of the hall firmly in place. Destroying all the pillars causes the hall's roof to buckle and partially collapse, filling the room in a thick cloud of dust until the end of the encounter.

  Pillar
  Level 2 Hazard Hexer

  EV 3
  (Stat block in the book.)

  Tactics
  Wystixis wants nothing more than to throw people off the mountain.
  It's the most fun he can imagine.
  He rushes the heroes while they're in the doorway and attempts to push them off. Meanwhile, his lightbender jumps in and out of hiding to catch heroes off guard with dazed and dazzled effects, giving Wystixis more opportunities to throw them off the mountain. The wending drakes harry the heroes with hit-and-run strikes, exploiting their ability to ignore opportunity attacks.

  Ending the Encounter
  If Wystixis is defeated, the lightbender and drakes flee. The heroes earn 1 Victory each for defeating the draconian.

  Loot
  Wystixis is carrying a Bull Shot that he was saving for a worthy foe.
  Guess he didn't see it coming.

  Source: Draw Steel: Encounters, page 105.
