description: |-
  Read aloud
  - "As you move from the flooded entryway, you see a silty sea cave pockmarked with shallow tidal pools full of dark, stagnant water."
  - "The air is humid, stale, and reeks of algae. The walls and ceiling drip perpetually."
  - "Clattering bones break the silence, and dark silhouettes move up ahead. They seem to notice you as quickly as you notice them. As they step into the light, you see their bony faces, ragged tunics, rusty cutlasses, and old crossbows. Their clothes bear the sign of the Horizon - a great bird carrying a sun in its beak."

  Secrets
  - Three zombies lie hidden at the bottom of the largest tidal pool.

  Encounter Adjustments
  - For three heroes, remove one zombie from groups 3 and 4, and remove group 2.
  - For four heroes, remove one zombie from groups 3 and 4.
  - For each hero in the encounter above five, either add two zombies to their own group or start with 3 more Malice.

  Tiered Cavern Floor
  This cavern is divided into three sections. The floor of the entrance section sits 2 squares below the floor of the middle section and 4 squares below the floor of the northmost section.

  Tidal Pools
  This cavern floods and drains at regular intervals, creating tidal pools in the pitted, eroded shale. These are considered difficult terrain for any creature who lacks the Swim keyword in their speed. Most of these pools are shallow enough to walk through, but the largest of these pools (on the southwest side of the room) has been dug 2 squares deep, with an island in its center.

  Stalagmites
  The stalagmites grant cover to size 1L or smaller creatures adjacent to them.

  Tactics
  The skeletons use their favorable elevation and cover to pepper the party with Bone Shards as they approach. One group starts on the highest tier of the cave, while another starts on the island in the middle of the southwest tidal pool. One group of zombies runs interference on the second tier of the cave, while the other lies in wait in the tidal pool. If a hero approaches or enters the tidal pool, they use Clobber and Clutch to try and drag them under. If no heroes have approached the tidal pool by the time the zombies must act, they emerge from the pool and attack the closest heroes.

  Ending the Encounter
  The undead in this encounter are simple and mindless. They fight until destroyed. The heroes gain 1 Victory each for defeating the undead.

  Loot
  A swollen corpse at the bottom of the largest tidal pool has its fingers wrapped in a death grip around a human femur - this femur is a Deadweight.

  Source: Draw Steel: Encounters, page 19.
