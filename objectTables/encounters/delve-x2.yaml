description: |-
  Read aloud
  - "The smothering heat of the pit and the glare of molten gold fades behind you. With each rasp of the skeletal ferryman's oars, his skiff glides deeper into a frigid and stagnant gloom."
  - "The brimstone tunnel constricts into a channel of acrid water. Thousands of funeral coins bob and clatter on the surface, all green with age and slick with grave scum."
  - "A cracked lantern dangles from the skiff's bow. Glistening mausoleum walls press in from beyond its feeble halo of light. Reliefs of Aurumvas leer from the walls, each exalting the demon lord who wrings souls from jeweled skulls onto the eager tongues of his followers."

  Secrets
  - Two vicisitators lay dormant in a locked alcove across from a fallen idol near the center of the mausoleum and won't attack until the idol's brazier is lit (see Worshipper Idol). Meanwhile, two haunts spring forth from the first jeweled skull mound the heroes clear in front of the skiff (see Jeweled Skull Mounds). Combat begins as soon as the heroes enter the area.

  Encounter Adjustments
  - For three heroes, remove groups 1 and 4. The skiff now moves up to 8 squares, and a hero can move it up to 4 squares.
  - For four heroes, remove group 1. The skiff now moves up to 6 squares, and a hero can move it up to 3 squares.
  - For each hero in the encounter above five, either add two izyaks to their own group or start with 3 more Malice.

  Pitch Darkness
  The entire encounter area is covered in a supernatural darkness that clouds the senses, crushes hope, and imposes a double bane on all power rolls unless the worshipper idol's chalice is lit (see Worshipper Idol). A swaying lantern chained to the skiff's bow casts light out that dispels the darkness in 3 squares from all edges of the raft.
  Aside from the lantern and the worshipper idol's chalice, all lights fail in the darkness.
  The ferryman and all the heroes' enemies in the mausoleum ignore the darkness.

  Canal of Coins
  The water is 3 feet deep. Atop the water float thousands of funeral coins.
  Creatures who lack the Swim or Fly keywords in their speed treat the water as difficult terrain. A non-demon who enters the water for the first time on a turn, or starts their turn there, takes 15 psychic damage.

  Protect the Ferryman
  The skeletal ferryman rows his 2-by-4 square skiff through the mausoleum. The skiff moves up to 4 squares at the end of each hero's turn in combat. The skiff can't move through other creatures. Heroes on the skiff travel along with it and can move across its squares as normal terrain. A hero on the skiff can also use their maneuver to help the ferryman row, immediately moving the skiff up to 2 squares.
  When the ferryman reaches an intersection, he stops and the heroes must decide which direction to travel next.
  The ferryman is a noncombatant, but he can be targeted by enemy attacks unless a hero blocks line of sight. He always stands at the boat's bow and has 100 Stamina. If the ferryman is destroyed, the delve ends in defeat (see Ending the Encounter).

  Rakilings
  Tiny tyburaki-like demons infest these waters and are desperate for a bite to eat. At the end of each round of combat, four more rakilings appear out of the water within 3 squares of the back of the skiff.

  Worshipper Idol
  A large basalt statue of a fallen idol lies on her stomach in a cramped chamber. The heroes can access this chamber from either of the main channels (until the second cave-in occurs and blocks the eastern entrance. See Sarcophagus Cave-In).
  The statue clutches a brazier with jealous hands. The brazier is filled with bones chiseled from coal. A hero adjacent to the idol can attempt to ignite the occult brazier as a maneuver. Fire is not sufficient - a brief ritual must be performed as a Reason test.

  Reason Test: Light the Brazier
  ! The hero fails to light the brazier, and the idol's basalt eyes flare. Until the end of the encounter, the hero is cursed to be prone. They are prone, can't stand, and are overcome with agonizing greed - the more riches they've accumulated, the more acute their hunger. At the start of each of the hero's turns, they take psychic damage equal to four times their Wealth score. This effect ends at the end of the combat encounter. @ The hero fails to light the brazier. # The brazier flares to life with ghostly emerald flames. The entire encounter area flickers with phantom light - just enough for the heroes to see normally. The secret alcove to south grinds open, freeing two vicisitators who immediately join the fray.

  Sarcophagus Cave-In
  Once the skiff entirely crosses each marked area midway through both of the longest channels, the ceiling above collapses and sarcophagi tumble down from a tomb above. Each sarcophagus splits open, spilling out the rotted funeral regalia of long-dead emperors.
  The ferryman points and whispers the first time a cave-in occurs:
  - "They craved riches of the flesh. Aurumvas was generous."
  - "Now only husks remain. Not even your gods may reclaim what is left of their souls." The caved-in areas block line of effect and movement.

  Jeweled Skull Mounds
  Two large mounds of jeweled skulls block the channel towards the end of the canal. The ceiling buckled in these areas, dumping the skulls from tombs above into the water. Most of the skulls' gems are cracked and dim, but a rare few still throb with the ashen glow of trapped souls.
  The mounds form 2-by-3 square obstacles that block the skiff's movement - they must be cleared. Each mound has 60 Stamina, but the mounds can also be cleared with Might tests.

  Might Test: Clear the Jeweled Skull Mound
  ! The hero fails to clear any squares, and if their p<4], they touch the still-active soul gem and has life-force drained, losing half their maximum Recoveries. @ The hero clears 1 square. # The hero clears 3 squares.
  The ferryman points and whispers the first time the heroes spot a jeweled skull mound. "Vessels. Jewel and bone. Aurumvas sates his fickle brides with the souls trapped inside."
  The first time a square is cleared from the first mound, numerous soul gems crack open, freeing two haunts who immediately attack the heroes.

  Tactics
  The optacus demons cling to the walls in burial alcoves along the channel, using Optical Flare to harm the ferryman (or any heroes that get in their way). They stay in their alcoves until the skiff passes out of sight, at which point they climb along the walls to follow.
  The medusa death-maidens use their Viper Bites to pull heroes out of the way of the ferryman and into the water.
  The rakilings focus down the ferryman, but won't hesitate to bite heroes that enter the water.
  The izyaks attempt to daze heroes with Ruinous Temptation to prevent them from helping the ferryman and use Nostalgic Wanderlust to restrain heroes in the water.
  The haunts and vicisitators go after straggling heroes and anyone that leaves the skiff. They pursue the heroes to the end of the mausoleum.

  Ending the Encounter
  If the skeletal ferryman is destroyed, the heroes are trapped in the pitch-dark underworld with no means to breach Aurumvas's lair.
  A titanic demon's skull is set into the wall at the end of the mausoleum.
  A circular membrane is set into the mausoleum wall where the demon's jaw would be. If the skiff moves adjacent to this doorway, the skeletal ferryman traces a bony finger across its twitching surface in inscrutable patterns and whispers a paean to the demon lord of greed.
  The membrane splits in a cacophony of screams to reveal a portal of grasping golden hands.
  Heroes who enter the portal are transported to area X3. The heroes gain 1 Victory each for overcoming this encounter.

  Source: Draw Steel: Encounters, page 197.
