description: |-
  Read aloud
  - "Eight pitch-black pillars dominate the room, humming with energy."
  - "Faces in various states of anguish who resemble people from your past occasionally appear on each pillar's surface."
  - "These faces join and twist into a swirling mass of unruly souls."
  - "Another six undead step out from the pillars. These corporeal beings grin evilly as they shamble into existence."

  Encounter Adjustments
  - For three heroes, remove two koptouroks from group 3 and two vampires from group 4.
  - For four heroes, remove group 2.
  - For each hero in the encounter above five, either add two haunts or koptouroks to their own group or start with 3 more Malice. The magic pillars absorb light with surfaces that are the deepest shade of black. Any creature who is not undead and starts their turn adjacent to a pillar takes 5 corruption damage. This effect ends if no undead are in this room. They can grant cover for size 1L or smaller creatures adjacent to them. Each pillar has 30 Stamina. When a pillar is destroyed, it dissipates in a burst of energy, and each undead creature in the room takes 5 damage. A hero with the Magic or Religion skill understands that the pillars are the creation of a necromancer, that destroying them will harm the undead in the room, and that the pillars are also an integral part of Eranya's ritual to raise undead in the tomb. The more pillars the heroes destroy, the weaker the roiling pool becomes in C3.

  Tactics
  The haunts and faded echo spirits use hit-and-run tactics. The spirits move through as many heroes as possible each turn to leverage their Corruptive Phasing effectively. The haunt waits for a hero to be adjacent to a pillar before using Crushing Despair.
  The koptouroks use Choking Grasp to grab heroes who are near a pillar and hold them there. If no enemies are next to a pillar, they use Inhale instead to drag them toward the pillars. The vampires use their speed aggress and corral heroes attempting to stay away from the pillars.

  Ending the Encounter
  The undead fight until either the heroes outnumber them or more than half of the pillars are destroyed. They then retreat. The heroes earn 1 Victory each for defeating the undead.

  Loot
  With the swirling energy and corruption removed from the pillars, two small glass tubes with rubies set atop them become visible.
  These are Blood Essence Vials. One is closed with a small parchment inside with the recipe for Blood Essence Vials written in Proto- Ctholl, which serves as a project source for making the item (see Chapter 12: Downtime Projects in Draw Steel: Heroes).

  Source: Draw Steel: Encounters, page 127.
