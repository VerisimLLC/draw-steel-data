description: |-
  Read aloud
  - "Where the vertical tunnel ends, it opens up to a larger cavernous space filled with a pale blue light. From the mouth of the tunnel, it's a long drop to the rocky ground below."
  - "The ground directly below the tunnel is surrounded by tall, rough standing stones. The blue light appears to be streaming out of the stones and deeper into the cavern."
  - "The full expanse of the area can be seen - a huge cavern whose cracked floor is split into tiers." From the side tunnels:
  - "The natural tunnels squeeze dangerously tight before they open up to a large, glowing cavernous space." From either entrance:
  - "Rough-edged pools crater the cavern floor, including one large pool with a natural stone arch rising over it like a bridge. A river of light drifts toward a figure in filthy robes standing atop the arch, their eyes closed as they mutter."
  - "A number of oozes slither between the stones and the bridge, seemingly guarding against intrusion."

  Secrets
  - In addition to the visible threats, a number of oozes lie hidden within the pools.

  Encounter Adjustments
  - For three heroes, remove groups 2 and 5.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, add one stunslopper to their own group, increase Oz the Oozemaster's Stamina by 30, or start with 3 more Malice.

  Standing Stones
  The blue glow suffused into the standing stones marks the elemental power that flows through them. It once magically channeled a torrent of water that forced its way up the corkscrew tunnel to become the Sluice. A visible stream of energy flows from the stones and into the Oozemaster's chest.
  An elementalist hero or a hero with the Magic skill can intuit the following:
  - Elemental power flows through the stones.
  - The stones once opened a portal to Quintessence, through which a furious torrent of water flowed into the surrounding cavern and up the tunnel.
  - The magic of the stones is presently shut down while the Oozemaster performs her ritual. The stones stand 6 squares high, rising nearly to the cavern ceiling and the tunnel mouth. The Oozemaster immediately sees the heroes when they arrive this way.

  Side Tunnels
  As long as the heroes entering from the side tunnels don't make a lot of noise, Oz won't notice them.

  Elemental Portal
  The portal within the standing stones is dormant while Oz's ritual attempts to reprogram its natural magic. As soon as Oz is reduced to 0 Stamina, the blue glow of the stones intensifies. Any hero who recognized the stones' power (see Standing Stones) understands that the portal is about to come back online. See the Conclusion for more details.

  Tiered Cavern Floor
  This cavern is divided into two sections. The standing stones sit at the highest point, with the next tier 2 squares below.
  The arch that Oz starts on top of stands about 2 squares high at its peak.

  Ooze Pools
  The crater pools across the cavern are 1 square deep and are difficult terrain for any creature who doesn't have swim as part of their movement. The water in the pools has been rendered highly caustic by the Oozemaster's activities. Each creature who enters the water for the first time in a round or starts their turn there takes 6 acid damage.

  Tactics
  The red ichors in this encounter are a special creation of the Oozemaster. They move aggressively and recklessly towards the heroes.
  They and all other oozes in this encounter can all swim at full speed while moving.
  Oz breaks off her ritual as soon as she is aware of the heroes, ordering her oozes to attack and unleashing the full brunt of her magic. She uses her Oozen Sling to slide heroes into the pools whenever possible.
  During the battle, Oz monologues to fill the heroes in on the nature of the elemental portal fueling the Sluice, providing any information in the delve introduction that the heroes don't already know. She also reveals that the purpose of her ritual is to transform the Sluice from a flow of water to a flow of endless oozes, filling the city sewers with an army under her command.

  Ending the Encounter
  The oozes are under Oz's control, and they fight until destroyed as long as the Oozemaster is alive. If Oz is reduced to 0 Stamina, her control of the oozes ends and they retreat into the nearest pool.
  Oz the Oozemaster can't conceive of being bested by any heroic rabble.
  She fights to the death.
  The heroes gain 2 Victories each for defeating Oz.

  Malice Features
  At the start of any ooze's turn, you can spend Malice to activate one of the following features. (Stat block in the book.)

  Loot
  A moldy leather satchel sits at the base of the bridge where Oz starts the encounter and can be grabbed during or after the fight. The satchel holds high-end elemental and ooze lore worth good coin to an appropriate sage or researcher, as well as the ruby item prerequisite to craft a Blood Essence Vial, and the project source for a Concealment Potion.

  Source: Draw Steel: Encounters, page 60.
