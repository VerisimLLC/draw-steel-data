description: |-
  Read aloud
  - "The deeper you venture into the cyst, the more wax you find. Huge ridges of hardened bile shield four large brewing vats."
  - "The vats are old and corroded. Their contents buzz and rumble loudly."
  - "A three-headed quadrupedal beast stares you down, compound eyes assessing you while rows of jagged maws eagerly salivate."
  - "Above the vats, unfurling themself upon an old walkway, an upright serpentine abomination composed of many faces embedded in a bluish, undulating mucus lets loose their terrible bellow - at once, as though a leash has snapped, the demons charge!"

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, add two soulraker praetorians to their own group, increase the grotesque chimeron's Stamina by 120, or start with 3 more Malice.

  Walkway
  The raised walkway is 4 squares off the ground. The stairs leading up to the walkway have corroded away.

  Vats
  In days past, disciples of Aurumvas attempted to synthesize gold in these vats. The leavings of these experiments form a toxic slurry that still lingers there. The first time a creature moves into the slurry on a turn, or if they start their turn there, they take 15 corruption damage and are weakened (save ends). As a maneuver, a creature adjacent to a vat can open the spigot on it, emptying the inside and filling a 5 x 2 square area in front of the vat with the slurry.

  Grotesque Chimeron
  The chimeron is encrusted with yellowish bile and appears to be growing wings much too small for their frame. They automatically destroy any wax in their path that is not touching the ceiling when they move or are force moved. Their skin burns through the sticky substance, causing it to emit a foul(er) odor.

  Tactics
  The soulraker stingers take position inside the vats, clinging to the edge to gain cover while harrying the heroes with Barb Launch. The chimeron and soulraker praetorians close with the heroes as quickly as possible and prevent them from closing with their less durable allies. The chorogaunt remains up on the raised platform to support and reposition their allies. If a hero engages the chorogaunt in melee combat, the demon uses Chaotic Entrancing Harmony to attempt to force that hero to fall into one of the vats, preferably one not containing their minions.
  If the chorogaunt is defeated, the demons abandon any pretext of strategy and violently throw themselves at the heroes as if lethe were active.

  Ending the Encounter
  All demons fight to the death. The heroes earn 1 Victory each for defeating the demons.

  Loot
  Behind one of the vats, a scroll case contains documentation of a few alchemical experiments attempted here, alongside a small vial of some strange, congealed gunk. Though most of these experiments failed, one produced Stygian Liquor, and the documentation of it serves as a project source for this item. The vial contains scrapings from an old cauldron, the item prerequisite for the liquor.

  Source: Draw Steel: Encounters, page 165.
