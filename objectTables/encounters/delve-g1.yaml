description: |-
  Captives
  The book marks 1 captive (not spawned) at square (-13, 0).

  Read aloud
  - "The cavern entrance, concealed by plant growth, is a shockingly steep decline into the dark. Inhuman snarls and giggling laughs echo up from within."
  - "The tunnel descends into the earth, and dirt gives way to stone and slick clay. Splinters of wood are a stark white against the mottled brown and gray of the cavern floor."
  - "There is light ahead, a flicker of fire from beyond a twist in the tunnel. Tatters of wagon canvas are hung from the rock like the pelts of hunted animals."
  - "As the tunnel turns, it opens into a large cavern where the remains of wagons have been hauled and heaped wildly about. Gnolls scurry and snap and laugh among themselves as some larger creature rumbles at the intrusion from within a makeshift pen."

  Encounter Adjustments
  - For three heroes, remove group 3, and and the tusker demon has only 60 Stamina.
  - For four heroes, remove remove group 3.
  - For each hero in the encounter above five, either add two gnoll cacklers or gnoll bonesplitters to their own group or start with 3 more Malice.

  Ruined Wagons
  The gnolls have dragged the husks of ruined wagons down into their lair. Each wagon section grants cover to size 1M or smaller creatures adjacent to them. The tusker demon destroys each square of cover they move through when charging.

  Hostage Situation
  A captive is tied up in the corner of the room behind some crates. If any gnoll notices a hero heading in that direction, they run towards the captive and threaten their life to ward off the heroes' assault.

  Tactics
  The tusker demon is a brute, as much a liability to the gnolls as it is an asset, destroying the gnoll's cover when the demon moves around the battlefield. The gnolls, for their part, do their best to stay out of the demon's path. The bonesplitter and chainflails work to disrupt the heroes' movement and leave them exposed to the tusker's abilities.

  Ending the Encounter
  The tusker demon, enraged, fights until destroyed. The gnolls fight until they are outnumbered by the heroes and flee the cavern with their tails between their legs. The heroes gain 1 Victory each for defeating the gnolls.

  Loot
  Among the ruined wagons is a small box containing dried leaves, which the gnolls ignored. The contents are two ounces of costmary leaves, a prerequisite item for Healing Potions.

  Source: Draw Steel: Encounters, page 29.
