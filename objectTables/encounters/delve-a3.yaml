description: |-
  Read aloud
  - "A rift in the wall takes you to yet another tier of the hollow. A deep hoarse voice chants loudly as you approach."
  - "A few trees dot the outer rim of this glade, but its center is completely open to the cloudy sky. There, a tall angulotl with golden skin stands behind a stone basin full of clear water."
  - "Now a dishonor to his title, Daybringer Acueyatl stops chanting and stares at you with rage-filled eyes. 'You dare tread on our sacred ground,' he croaks. 'Now this storm will be the last thing you see.'"
  - "As if by magic, several angulotls jump out from behind the trees to attack. Daybringer Acueyatl resumes the ritual, a green glow emanating from his skin."

  Secrets
  - Four angulotl slinks remain hidden behind the trees.

  Encounter Adjustments
  - For three heroes, remove two angulotl needlers from group 2 and two angulotls slinks from group 3, and Daybringer Acueyatl has only 60 Stamina.
  - For four heroes, remove two angulotl needlers from group 2.
  - For each hero in the encounter above five, add two angulotl waves to their own group, increase Daybringer Acueyatl's Stamina by 40, or start with 3 more Malice.

  Stragglers
  Any surviving angulotls from A2 take up positions near the front of the basin.

  Trees
  The trees found in this glade have thick and sturdy trunks that are 6 squares tall - beyond that height, their impenetrable canopies begin.
  Creatures size 1L or smaller adjacent to a tree have cover and are not exposed to the sky.

  Ritual Basin
  In the middle of the clearing rests a circular ritual basin that Daybringer Acueyatl uses to channel his spell. It occupies 4 squares and grants cover to size 1S or smaller creatures adjacent to it.
  An angulotl who is adjacent to the basin can touch it and teleport to any unoccupied space on a tree in this chamber by spending 1 square of movement to do so. An angulotl can also teleport from a tree to an unoccupied space adjacent to the basin in the same manner, as long as the Daybringer channels his spell.
  While adjacent to the basin, Daybringer Acueyatl is covered in a protective ward that gives him damage immunity 5. The basin also allows him to activate Rainfall for 3 Malice instead of 7 on his turns.
  The basin has 40 Stamina. If it is destroyed, it explodes in a geyser of water that deals 1d6 damage to each adjacent creature and makes them wet (see area A1).

  Thunderbringer
  At the start of his turn, Daybringer Acueyatl can spend Malice to activate the following feature: (Stat block in the book.)

  Tactics
  Daybringer Acueyatl tries to stay close to the ritual basin whenever possible while his allies goad the heroes. The needlers start 4 squares up on the tree trunks and target any hero doing significant damage to the Daybringer. The slinks start hiding behind the trees, ambushing the party when they move too close to Acueyatl. The waves start near their leader and use Noxious Bubble to block access to him.
  When wounded, the Daybringer uses New Dawn and takes advantage of the pollywogs' Quick Snack trait to regain Stamina. Should the situation become desperate, he stops the ritual to use It Is Day. This hopeless act temporarily interrupts the ritual and clears the sky. Until the end of the encounter, you can't activate Rainfall or Thunderbringer.

  Ending the Encounter
  The encounter ends when Daybringer Acueyatl is defeated. The rain ritual is finally stopped, and any remaining angulotls come back to their senses. The heroes gain 2 Victories each for defeating the Daybringer.

  Loot
  Daybringer Acueyatl's belt is a Divine Vine, and he wears a Revenger's Wrap on his back. In his personal stash, there are a set of wings from a flying carp, a set of chain mail rusted by seawater, and a recipe for Chain of the Sea and Sky.

  Source: Draw Steel: Encounters, page 14.
