description: |-
  Read aloud
  - "Beyond the double doors ahead, low voices and the noise of picks and shovels can be heard."
  - "What was once the main courtyard of the citadel is now a field of rubble and weeds within crumbling stone walls."
  - "War dogs work across the courtyard, digging holes in the rocky ground. By the state of that ground, they've been at it for some time."

  Encounter Adjustments
  - For three heroes, remove group 3, and the war dog breaker has only 100 Stamina.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add two war dog aerocites or war dog geomancers to their own group or start with 3 more Malice.

  Main Doors
  Heavy oak doors banded with iron mark the heroes' entry point to the courtyard if this area is the first one they explore. The half-hanging doors appear precariously balanced but are in no danger of falling.

  Citadel Doors
  The doors leading off the courtyard are all hanging open. Most lead to barracks chambers, kitchens, storerooms, training rooms, and other utilitarian areas that are thoroughly ransacked and hold nothing of value.
  The northeast doorway marked as "Hero Start" opens to a hallway leading to area L2. If the heroes haven't explored that area, raised voices can be heard in that direction. If the heroes have explored area L2, this doorway is their entry point to the courtyard.

  Pits
  These war dog squads have been tasked with uncovering hiding spots buried beneath the courtyard, and are systematically digging up the ground. Each pit is 1 square deep. Swords and maces wrapped in oil cloth near two of the pits mark where the war dogs have discovered an old weapons cache. A creature forced into a pit takes no damage, but climbing out of a pit costs 2 squares of movement.

  Rubble
  Areas of scattered rubble fallen from the walls of the courtyard are difficult terrain.

  Perimeter Corridor
  A 2-square-wide corridor runs around the outside perimeter of the courtyard.

  Tactics
  The war dog breaker focuses on the most significant-looking threats, while the aerocite and their shriketroop squad harry lesser foes. The geomancers take advantage of the courtyard by burrowing through the dirt and creating walls with their Siegeworks ability, hemming the heroes in. The geomancers can burrow horizontally into the dirt while in a pit without needing to use the Dig maneuver.
  Whenever the war dogs force move heroes or drive them away, they try to get the heroes into the pits if they can.

  Ending the Encounter
  Wanting to prove their worth to Castellan Hoplon, none of the war dogs here raise the alarm or break off combat to run for aid. All fight to the death. The heroes earn 1 Victory each for defeating the war dogs.
  If the heroes haven't explored area L2 yet, they hear a clamor from one of the citadel doorways (see Citadel Doors).

  Loot
  One of the war dog geomancers carries a 1st-echelon trinket called an Iron Eye, which they've used to seek out the hidden caches beneath the courtyard.
  If this is the second area the heroes explore, another of the geomancers carries a blue ceramic disk that glows with magic. The disk's function can't be determined initially, but is revealed at the start of area L3.

  Iron Eye
  This iron sphere is scribed to resemble an eyeball, its pupil pulsing faintly with light.

  Keywords: Magic
  Item Prerequisite: The eyeball of a metalsmith who died of old age while working Project Source: Texts or lore in Caelian Project Roll Characteristic: Reason or Intuition

  Project Goal: 150
  Effect: As a maneuver, you can sweep the Iron Eye around you, granting an innate sense of the location of any metal within 1 square of you.

  Source: Draw Steel: Encounters, page 143.
