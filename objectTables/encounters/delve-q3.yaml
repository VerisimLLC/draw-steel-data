description: |-
  Captives
  The book marks 1 captive (not spawned) at square (-5, 10).

  Read aloud
  - "The open door reveals a chamber with eight inset areas: two along the east wall, two along the west wall, and four along the north wall. These alcoves pulsate with purple energy."
  - A regal-looking shadow elf rides a dusky stag. She holds a chain attached to a metallic collar around the neck of a dwarf. They study more inscriptions etched into the center of the north wall. Other shadow elves study similar writings elsewhere in the room.
  - "When he sees you, the dwarf shouts, 'They are trying to use magic to stage an invasion! Close the portals!'" The shadow elf atop the brush stalker is Ra'elyrna, the leader of this expedition. She has staked her reputation in the local shadow elf hierarchy on the key to the domination of Orden lying within the returned monastery. She is using her own knowledge, and that of the captured dwarf archaeologist Gilferce, to begin attuning these portals to their home plane of Equinox. Alcoves The eight alcoves are currently consumed by portals connected to a plane of pure nonexistence, but the shadow elves are in the process of attuning the portals to connect instead to Equinox.

  Encounter Adjustments
  - For three heroes, remove one shadow elf panther from groups 3 and 4.
  - For four heroes, remove one shadow elf panther from group 4.
  - For each hero in the encounter above five, either add one shadow elf panther to their own group or start with 3 more Malice.

  Closing a Portal
  A hero who is adjacent to a portal can use a maneuver to close it. When a hero closes a portal, they must make a Presence test to resist the surge of magic energy created by the portal closing.

  Presence Test: Resist the Magic Energy
  ! The hero takes 10 corruption damage and is dazed (save ends). @ The hero takes 10 corruption damage. # The hero takes 5 corruption damage.
  If a portal was not deactivated on the previous round, a group of four shadow elf dusk mages appear in an active portal and join the battle at the start of the round.

  Tactics
  Ra'elyrna orders her troops to keep the heroes away from the alcoves so they don't interfere with the delicate process of attuning the portals to her home plane. As such, the shadow elves do not move themselves or the heroes into the alcoves on purpose.
  The shadow elves protect Gilferce at all costs, since they use his knowledge to understand how to open the portals.

  Gilferce The Archaeologist
  Dwarven archaeologist Gilferce is a noncombatant who knows about the history of this place. He can't move on his own, but stays adjacent to Ra'elyrna's mount, being dragged by the chain. The magic collar on his neck allows Ra'elyrna to read his mind. If the heroes can move Ra'elyrna or Gilferce 6 or more squares away from each other, she loses hold of his chain, and the dwarf can freely move.
  If the heroes save Gilferce, he can reveal the following information:
  - Gilferce knows the information about the history of the monastery detailed in the introduction of this delve.
  - The shadow elves arrived a few days ago, and they found Gilferce examining the area outside the monastery. They forced the dwarf to assist them in their investigation of the returned monastery. You can allow the heroes to recruit Gilferce as a sage follower. If they do, he has a Reason and Intuition score of 1, he has a 0 in all other characteristics, he knows Caelian, Illyvric, and Zaliac, and he has the History, Magic, Religion, and Timescape skills.

  Ending the Encounter
  The shadow elves continue fighting until one of two things happen:
  Ra'elyrna and her mount are defeated, or all the alcove portals are deactivated. At that point they surrender, as their mission cannot be achieved. If the shadow elves are defeated, the heroes earn 1 Victory each or 2 Victories each if they saved Gilferce.

  Loot
  Gilferce is grateful for being saved. He offers the heroes two clear lenses carved from volcanic glass. These are a prerequisite for creating Foesense Lenses. In addition to any valuable tomes or other writings collected or produced by Qiln, the heroes can find the recipe to make Foesense Lenses.
  There is also a set of brass gears inscribed with runes in silver dust that Qiln used in an orrery that predicted the moving of the planar realms in conjunction with each other. These are the prerequisites for the Reactive armor enhancement.

  Source: Draw Steel: Encounters, page 100.
