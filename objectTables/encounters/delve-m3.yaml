description: |-
  Read aloud
  - "A foul-smelling channel surrounds a stone platform with upper and lower tiers. The larger, lower level is lined with rows of broken, crumbling sarcophagi."
  - "Undead kneel in reverence, chanting praise through ragged throats. They face the upper level, where a cloth-bound figure in ceremonial regalia basks in the worship of the damned."
  - "The mummy smiles coldly with sunken, clouded eyes. At a gesture, the foul refuse in the channel rises and forms moaning amalgamations."

  Encounter Adjustments
  - For three heroes, remove groups 3 and 4.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, add two mummies to their own group, increase Tzermet's Stamina by 70, or start with 3 more Malice.

  Tiered Floor
  The perimeter of the room is a channel set 2 squares below the main chamber level. The upper level of the room is set 3 squares above the main level, reached by a steep staircase.

  Sarcophagi
  The large, stone coffins have been breached but remain otherwise intact. They each provide cover to size 1M smaller creatures adjacent to them.

  Tactics
  Tzermet and his allies seek to overwhelm the heroes with a lopsided action economy. Tzermet begins atop the second level while the mummies and skeletons start among the sarcophagi of the main level.
  The flesh mournlings are in the channel surrounding the first tier and will either directly flank the heroes as they advance, or take the extra time to go further around and emerge behind them.
  Effectively all of the undead in the encounter can inflict banes, bleeding, and fright in an effort to punish the heroes for their actions and make those actions as inefficient as possible.

  Ending the Encounter
  The undead are bound to Tzermet's will and presence. If he falls, so do they. The heroes gain 1 Victory each for defeating Tzermet.

  Loot
  A glistening eyeball hangs from a chain around Tzermet's neck - it's an Evilest Eye.
  The inner lid of Tzermet's own sarcophagus is marked with the fingernail-etched treatise on eternal life. It is written in the First Language and can act as a project source for a Scroll of Resurrection.

  Source: Draw Steel: Encounters, page 81.
