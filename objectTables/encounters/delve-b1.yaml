description: |-
  Read aloud
  - "The floor of this stone chamber is caked in a thick layer of that same pestilent wax that coats the outer hillside, while the walls secrete a caustic, steaming fluid."
  - "Large scorpion-like creatures snarl from wretched, toothy maws on the underside of their abdomen as you approach, and their jagged stingers raise as if in preparation for new prey."
  - "Further into the room, pustulant throngs of teeth and limbs crane themselves upright, their many gaping orifices overflowing with a pale-blue discharge."

  Encounter Adjustments
  - For three heroes, remove one blight phage from group 3, and remove group 4.
  - For four heroes, remove one blight phage from group 3, and one styrich from group 4.
  - For each hero in the encounter above five, either increase each blight phage's Stamina by 40 or start with 3 more Malice.

  Fly Traps
  The wax caking the floor conceals several small pits full of a sticky goo that are less than 1 square deep. A size 1L or smaller creature who enters one of these wax pits falls prone and can't stand (save ends). If a creature saves, they can immediately shift 1 square out of the pool (no action required). The demons step around or over these pits, which could warn heroes of their nature.

  Tactics
  The blight phages remain near the back of the room and use their Blight Rain ability to herd enemies toward the fly traps. The styrichs and praetorians use Hair Whip and Barbed Stinger to grab and drag enemies both into the fly traps and into pools of blight created by the blight phages wherever possible. The soulraker scouts swarm the first target to fall into a fly trap, or otherwise just swarm anyone who looks squishy.

  Ending the Encounter
  The demons fight until defeated. Each hero earns 1 Victory for defeating the demons.

  Loot
  One of the fly traps contains a skeletal hand clutching a brass-colored card with a horned crest in its center. This is a G'Allios Visiting Card.

  Source: Draw Steel: Encounters, page 163.
