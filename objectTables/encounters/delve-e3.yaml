description: "Read aloud\n- \"The ladder leads to a tunnel that exits from a crevasse atop the mountain.\
  \ A biting wind scours the summit.\"\n- \"The peak is split, like islands among the clouds, with cliffs\
  \ that fall away into the abyss.\"\n- \"Scorching jets of steam fitfully erupt from below, as if the\
  \ mountain itself is panicked.\"\n- \"Floating above the far island hovers a glowing portal, sealed\
  \ with a tattered curtain of void energy. On the other side, the shadowy form of a massive flying reptile\
  \ awaits.\"\n- \"Surrounded by assorted elementals and clad in a rust-stained cloak and scorched robes,\
  \ the amalgamist finishes reciting an arcane incantation. With a shudder, the portal begins to open.\"\
  \n\nEncounter Adjustments\n- For three heroes, remove group 3.\n- For four heroes, remove one enigma\
  \ of void from group 4.\n- For each hero in the encounter above five, add two rot bats to their own\
  \ group, increase Dulcaine's Stamina by 90, or start with 3 more Malice.\n\nIslands\nEach outcropping\
  \ floats at a different height. Relative to the heroes' starting island, the middle island floats 3\
  \ squares higher towards the north and gently slopes 4 squares higher towards the south, Dulcaine's\
  \ island floats 5 squares higher, and the smallest island floats 1 square lower.\nA vine bridge between\
  \ islands is immediately destroyed if it takes fire or corruption damage. It grows back at the start\
  \ of the next round.\n\nCliffs and Steam Vents\nA creature who falls off a cliff plummets 10 squares\
  \ before landing on a tiny outcropping below. If they don't make it above the surface of the lowest\
  \ island before the end of the next turn, jets from the steam vents blast them upward and cause them\
  \ to land prone on the nearest cliff edge. A creature who touches a jet takes 10 fire damage.\n\nRitual\
  \ Portal\nThe portal floats 5 squares above Dulcaine's island, crackling with lightning and wisps of\
  \ darkness. The portal opens fully in a certain number of rounds after the heroes arrive, depending\
  \ on how fast the heroes reach this area. \xAERitual Portal Results\xAE\n\nAdditional Effects\n1-3 At\
  \ the end of the fifth round  -  4-5 At the end of the fourth round The ground is constantly trembling.\
  \ Each creature's Stability is halved. 6-7 At the end of the third round Flowers rapidly bloom and die\
  \ across the encounter map. 8+ At the end of the second round The sky is dark, and the wind blows wildly.\
  \ Each creature's Stability is reduced to 0. \xA3 When the portal opens, an omen dragon flies through\
  \ to destroy everyone. If Dulcaine is alive, he makes his plea before being consumed.\nThe only way\
  \ a hero can stop the portal from opening is to make the following Reason, Intuition, or Presence test\
  \ as a maneuver once per turn while adjacent to the portal or standing on Dulcaine's island.\nReason,\
  \ Intuition, or Presence Test: Unravel the Portal ! The hero takes 10 psychic damage, and the portal\
  \ opens one round earlier (possibly immediately). @ The hero takes 5 psychic damage. The portal continues\
  \ to open. # The portal is destroyed.\n- Natural 19 or 20: The portal is destroyed, and the hero is\
  \ beset by an overwhelming epiphany about the nature of reality. At the end of the hero's next respite,\
  \ they gain the Enlightened title. Heroes who have skimmed Dulcaine's journal gain an edge on this test.\
  \ If the portal is destroyed while Dulcaine is alive, his rage gives him a double edge on power rolls\
  \ until the end of the encounter.\n\nTactics\nThe edifice of steel and the rot bats are positioned in\
  \ the middle island. They flank and slow down any enemies that don't pay enough attention to them. The\
  \ enigmas of void focus their support on allies taking the most damage while staying within range of\
  \ Dulcaine's abilities. Dulcaine floats above the fray, pushing enemies off the cliffs and relying on\
  \ Violate Causality to protect himself or the portal. He uses Translated Through Flame each round to\
  \ boost another elemental.\nHis goal is to simply run out the clock until the omen dragon appears. If\
  \ the heroes destroy the portal, he focuses everything on the culprit.\n\nEnding the Encounter\nIf Dulcaine\
  \ is defeated, the elementals lose coherence and return to nature. The heroes earn 1 Victory each for\
  \ ending the ritual, and 1 Victory each for defeating Dulcaine.\n\nLoot\nHeroes who survive the encounter\
  \ earn the Elemental Dabbler title, even if they already have it, choosing a damage type from the following\
  \ options: acid, cold, corruption, fire, lightning, poison, or sonic.\nThe heroes can discover a teleportation\
  \ platform buried beneath a thin layer of soil atop the mountain (see Craft Teleportation Platform downtime\
  \ project in Chapter 12 in Draw Steel: Heroes). The supernatural password is \"One and one is two,\"\
  \ a term of affection used between Dulcaine and his daughter, mentioned in passing in his journal. The\
  \ password can't be changed, and the platform can't be moved from its spot, but an enterprising party\
  \ might find a way to move the entire mountaintop.\n\nSource: Draw Steel: Encounters, page 119."
