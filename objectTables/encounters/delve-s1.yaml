description: |-
  Read aloud
  - "The center of the tunnel begins to drop into a deeper channel filled with stagnant water, though the stone floor to either side remains passable."
  - "Ahead, the tunnel is bisected by another tunnel of the same size, creating an intersection of crossing water-filled channels."
  - "The sound of dripping water intensifies to a hiss like rain. Ahead, a curtain of water falls from the bubbling ceiling to the central channel."
  - "A humanoid in the garb of a sewer worker lies motionless across the water. A number of translucent globes and mounds of slick putty stand along the walls of the tunnel intersection."

  Secrets
  - The body is one of the missing sewer workers, taken down while trying to flee an ooze attack.
  - The black ichors lurk unseen within the water.

  Encounter Adjustments
  - For three heroes, remove group 4, one gummy ball from group 3 and one imit putty from group 5.
  - For four heroes, remove one gummy ball from group 3 and one imit putty from group 5.
  - For each hero in the encounter above five, either add one gummy ball and one imit putty to their own group or start with 3 more Malice.

  Central Channel
  The central channel slopes down gently to start, but is 2 squares deep on the encounter map. The black ichors are automatically hidden while in the water.
  In addition to the threats it conceals, the water in the channel has been rendered highly caustic by the Oozemaster's activities. Each time a creature enters a square of the water or starts their turn in a square, they take 2 acid damage.
  Creatures without access to flying or teleportation must swim through or jump over the water to cross the channel.

  Tactics
  The sludgestorms rain acid down on any hero attempting to escape down a tunnel but primarily focus on super charging the other oozes with Storm Surge. The gummy balls attack as soon as the heroes enter the area, attempting to slide heroes into the water and damage them as much as possible. The black ichors emerge from the water only after the heroes have moved in, attempting to surround them.
  The imit putties attack creatures who are isolated, using Sputter to move in and out of melee distance. Otherwise, they use Uncanny Impression to mimic a hero's signature ability with a ranged distance to harm the heroes from afar.
  The oozes in this encounter can all swim at full speed while moving and use Split as often as they are able.

  Ending the Encounter
  All the oozes fight mindlessly until destroyed, but won't pursue heroes who flee the area. The heroes gain 1 Victory each for exiting the area through either the West, North, or East tunnels.

  Sewer Worker
  Heroes who investigate the body discover a dwarf wearing overalls and sturdy work boots. This unfortunate sewer worker tried to escape the assault on the maintenance crew at the Sluice outflow (area S2) and fell while fleeing southward.
  The bodies of the other workers are nowhere to be found, though heroes might spy tatters of similar looking clothing floating in the various tunnels further in.

  The Sewer Network
  The heroes must traverse a network of tunnels to go deeper into the sewers. While any path will eventually lead to the Sluice source, some channels take longer to get there. The eastern and western tunnels are dark, while the northern tunnel has a purple glow coming from it.
  Any hero must make up to three Reason tests to navigate the network.
  They reach area S2 after their third attempt or as soon as they get a tier 3 result. They gain an edge on the roll if they travel through the northern pipe. A hero takes a bane on the roll if they travel alone.

  Reason Test: Navigate the Tunnel Network
  ! The hero gets turned around in the tunnels. They and any creatures traveling with them lose a Recovery exerting themselves. @ The hero makes progress but is still lost. They and any creatures traveling with them lose 1d6 Stamina exerting themselves. # The hero and any creatures traveling with them find their way to the source.
  The first time a hero gets less than a tier 3 result on the test, their group gains an edge on their next attempt. The second time they fail, their group has a double edge on their last attempt. The hero and any creatures traveling with them eventually find their way to the source after resolving their third attempt.

  Source: Draw Steel: Encounters, page 55.
