description: |-
  Read aloud
  - "The marble doors open easily, revealing a worked stone chamber beyond. The walls are decorated with marble-inlaid friezes throughout. Wooden flinders cover the floor, perhaps remnants of destroyed furniture."
  - "The chamber contains many shadowy-featured elves. They slink carefully about, wary of a 15-foot-diameter sphere of utter darkness moving slowly through the room."
  - "A 10-foot-high stage dominates the eastern portion of the room. The edges of the stage are decorated with marble sculptures depicting strange shapes and runes, some of which are very sharp."

  Encounter Adjustments
  - For three heroes, remove group 2.
  - For four heroes, remove one shadow elf knightfell from group 4.
  - For each hero in the encounter above five, either add one shadow elf knightfell to their own group or start with 3 more Malice.

  Annihilation Bubble
  This floating mote of nonexistence damages creatures when it touches them. It also reacts to mental manipulation, so creatures may be able to control it.
  The annihilation bubble is size 1L and moves 1 square in a random direction (determined by the Director) at the end of each creature's turn. A creature who touches the annihilation bubble takes 10 corruption damage, once per round. The annihilation bubble is difficult terrain to move through.
  A creature can use a maneuver to make a Presence test to attempt to move the annihilation bubble. The shadow elves have an edge on this test.

  Presence Test: Move the Annihilation Bubble
  ! The creature fails to move the annihilation bubble.
  The psychic feedback caused by the failure deals 5 psychic damage to the creature attempting to move the annihilation bubble. @ The creature fails to move the annihilation bubble. # The creature can move the annihilation bubble 1 square plus 1 additional square for every number the result is above 17. Alternatively, the creature can remove the annihilation bubble from reality on a result of 21 or higher or with a natural 19 or 20.

  Raised Stage
  The stage at the eastern end of the room was where Qiln used to stand to deliver her lectures to her followers and visitors. The strange marble shapes and symbols were carved based on Qiln's visions of her utopia of nonexistence. A creature that is force moved into a square adjacent to the stage takes 10 damage from the sharp points of the sculptures, in addition to the normal damage from being force moved into an object.
  The stage is 2 squares high.
  The wooden stairs used to access the stage rotted long ago, making mounting the stage a chore. Climbing up onto the stage without making a test costs 4 squares of movement. A hero can make an Agility test to attempt to climb up onto the stage without spending any squares of movement.

  Agility Test: Climb Up the Stage
  ! The hero fails to climb up the stage and uses 4 squares of movement attempting to do so. In addition, they take 5 damage from the sharp sculptures decorating the edge of the stage. @ The hero fails to get onto the stage but doesn't use any movement in the attempt. # The hero gets on the stage without having to use extra movement and can continue moving.
  Jumping down safely from the stage requires no test or extra movement.

  Annihilation Runes
  The shapes and runes do not spell anything recognizable, but instead they draw power from some alternate plane of pure nothingness.
  Heroes can make a Reason test to understand the symbols, and heroes who read Illyvric gain an edge on the test.

  Reason Test: Interpret the Runes
  ! The hero fails to understand anything about the symbols, and they take 5 psychic damage from the effort. @ The hero recognizes that the runes draw in the power of total nothingness, of pure annihilation. This power has brought into existence the sphere of nothingness in the room. # The hero understands the purpose of the runes, and they automatically get a tier 3 result on tests made to move the annihilation bubble. They can still roll to see if they get a result that allows them to remove the bubble.

  Tactics
  The shadow elves here have been instructed to guard the place. Any intruders are to be captured and brought into Q3 to fuel their portals.
  The snipers stay in the shadows, harming the heroes from afar, while the cloaks dance in and out of the shadows, attempting to draw the heroes into disadvantageous positions. The mournblade and panthers engage the heroes directly. The panthers also use their maneuver to attempt to steer the orb toward the heroes.

  Ending the Encounter
  No shadow elves surrender if the mournblade and knightfells are alive.
  If those combatants are defeated and fewer enemies remain than heroes, the rest surrender and can provide the following information:
  - Their leader, a shadow elf called Ra'elyrna, led them here to investigate the monastery. They don't know anything about its history, but shadow elf leaders from the area seemed quite excited about the possibilities of its usefulness in an invasion.
  - Ra'elyrna led other shadow elves, her brush stalker mount, and a dwarven scholar they found nearby deeper into the monastery. They were told to remain here and guard the entrance to ensure no one came in behind them. If the shadow elves are defeated, the heroes earn 1 Victory each.

  Source: Draw Steel: Encounters, page 97.
