description: |-
  Read aloud
  - "A large crevice takes you to a higher tier of the hollow, one with verdant grass and tall trees."
  - "Large bushes peppered with pink flowers grow between the trees. Clinging to the tree trunks are frog folk wielding small darts."
  - "Dark purple angulotls stand on the far end of the chamber, croaking in unison. The sky rumbles in rhythm."

  Secrets
  - The pink flowers on the bushes are toxic plants.
  - Three angulotl slinks are hidden behind the bushes.

  Encounter Adjustments
  - For three heroes, remove group 4 and two angulotl slinks from group 1.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, either add two angulotl waves or angulotl slinks to their own group or start with 3 more Malice.

  Trees
  The trees found in this chamber have thick and sturdy trunks that are 6 squares tall - beyond that height, their impenetrable canopies begin.
  Creatures size 1L or smaller adjacent to a tree have cover and are not exposed to the sky.

  Ritual Wave
  While at least one wave is alive in the encounter, Rainfall costs 5 Malice to activate on their turn instead of 7.

  Toxic Plants
  Level 2 Hazard Hexer EV 2 per 10 x 10 field (Stat block in the book.)

  Tactics
  Each slink starts the encounter hiding behind one of the westernmost bushes and waits for the party to come into the center of the room before attacking. They use their tongues whenever possible to pull heroes into the toxic plants.
  All waves start near the tree opposite to the entrance and scatter when the party comes closer. They should hold off on immediately popping Noxious Bubble, instead using the bubbles to bait the heroes into cutting across the bushes.
  The darts start 4 squares up on the tree trunks, two on each tree. The group clinging to the easternmost trees fires against stragglers, while the group on the westernmost trees takes advantage of their increased range to pick off weak heroes.

  Ending the Encounter
  The angulotls in this encounter know that they are more useful fighting alongside their leader than dead. If the angulotls are outnumbered by the heroes, they flee to area A3 and join the ranks of Daybringer Acueyatl. The heroes gain 1 Victory each for defeating the angulotls.

  Loot
  Some of the waves' vials and pouches remain on the floor after the skirmish. One of them holds Catapult Dust, while another contains a Healing Potion.

  Source: Draw Steel: Encounters, page 13.
