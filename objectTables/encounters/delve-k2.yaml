description: |-
  Read aloud
  - "Behind the brass gates is a gargantuan cavern made from the partially enclosed caldera of the volcano and crossed by twin rivers of lava moving slowly beneath stone bridges."
  - "Two altars in the shape of giants can be seen in the room. The stone figures kneel, heads down, hands held up in offering. In their hands rest silver bowls containing burning incense. The incense mixes with the gases rising from the roiling lava and fills the enclosed room with suffocating vapors."
  - "Two giants sit cross-legged, eyes closed on opposite sides of the room. Each of them is facing a heavy obsidian door carved in the shape of a sneering face as they chant in monotonous tones."
  - "Another giant tends the altars and sees you enter. 'You have come to stop the awakening, but you will not succeed. Only the pure may lay eyes on the Mantleheart,' he says as he grabs the fiery lash from his waist."

  Encounter Adjustments
  - For three heroes, remove group 3.
  - For four heroes, one of the fire giant red fists has only 120 Stamina.
  - For each hero in the encounter above five, add one fire giant lightbearer with only 100 Stamina to their own group, increase one fire giant lightbearer's Stamina by 100, or start with 3 more Malice.

  Cavernous Cathedral
  The cathedral's ceiling is made of stone and is 20 squares above the floor.

  Lava Rivers
  The flowing lava runs 2 squares lower than the floor of the cathedral and from the center outward to the exits. Any creature of size 2 or smaller who starts their turn in lava slides 5 squares along the flow of the river.

  Ash Altars
  Two stone altars hold burning incense, which clouds the senses. Each altar emits a 3 aura of smoke. Whenever a non-fire giant creature enters or starts their turn in the smoke, they are weakened until the end of their next turn and gain fire weakness 10. Fire giants in the smoke can't be made weakened, frightened, or dazed.
  The altars grant cover and concealment to size 2 or smaller creatures adjacent to them. Fire giants can freely move through and share space with the altars.
  Each altar has 50 Stamina each. Destroying the altars puts out the incense in the bowls.
  A creature can snuff out the incense by using a main action while adjacent to an altar.

  Tactics
  The lightbearer immediately swaps itself with one of the red fists, who wades into a melee brawl and tries to knock heroes into the altars or the lava river. The other red fist uses Blazing Leap to get behind the party when enough space opens to target the backline. The lightbearer and at least one red fist should stay within 3 squares of each other so the red fist can use Guardian Block to protect the lightbearer. The lightbearer opens the fight providing extra damage, but once the red fists lose some Stamina switches to healing with Living Blaze. When possible, all giants stay within range of an ash altar's aura.

  Ending the Encounter
  The fire giants guard the doors to the sanctum until only one giant remains. When that giant is winded, they flee out the gates of the temple. The heroes earn 1 Victory each for defeating the giants.

  Source: Draw Steel: Encounters, page 157.
