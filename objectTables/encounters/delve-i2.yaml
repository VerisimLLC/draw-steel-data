description: |-
  Read aloud
  - "The vessel's hold is lined with sleeping niches, each of which contains an unconscious war dog connected to the ship by a glowing tube that feeds up into the scorpion's tail structure, powering it."
  - "The room is littered with chairs, crates, and tables."
  - "In the middle of the room, a giant's torso hangs from the ceiling on its massive arms - no head or legs."
  - "From the ceiling hang glowing red tubes that illuminate the room, handhold straps, and rolled-up hammocks."

  Encounter Adjustments
  - For three heroes, remove group 5, and the bredbeddle torso is inactive for 1 round or until three war dog juicer nozzles have used their main action to juice them up.
  - For four heroes, remove group 5.
  - For each hero in the encounter above five, add four war dog juicer nozzles to their own group, increase bredbeddle torso's Stamina by 130, or start with 3 more Malice.

  Acid Tank
  Against the back wall is a floor-to-ceiling glass cylinder filled with black acid (the ammunition for the scorpion tail on the deck). The acid tank has 1 Stamina. If the tank breaks, acid floods the floor of the hold. Each creature who touches the floor for the first time on a turn, or starts their turn on the flooded floor, takes 10 acid damage. Creatures standing on furniture or hanging from ceiling handholds are unaffected.
  At the end of the round if the tank isn't broken and there is at least one inert war dog juicer alive in a bed, the tank fires acid at the closest enemy of the war dogs. That enemy must make an Agility test.

  Agility Test: Dodge the Acid
  ! The hero takes acid damage equal to three times the number of inert war dogs in the juicer beds. @ The hero takes acid damage equal to twice the number of inert war dogs in the juicer beds. # The hero takes no damage.

  Ceiling Handholds
  A creature with a free hand can dangle from a ceiling handhold to avoid contact with the floor. A creature can use the handholds to climb around the ceiling.

  Juicer Beds
  There are eight wall niches, called "juicer beds" by the war dogs. Each contains an inert war dog juicer who is a noncombatant - not to be confused with the four active juicer nozzles. Each juicer is connected to the Iron Scorpion by a tube in their skull. When the Iron Scorpion uses its claws or scorpion tail or acid tank, or when a juicer nozzle uses an ability, the tubes suck red glowing liquid from the war dog juicers, causing the vessel's interior to pulse with red light. The war dog juicers in the beds have 1 Stamina each, as do their connecting tubes. If an inert war dog juicer is killed or their connecting tube is destroyed, that juicer bed is no longer active to power the Iron Scorpion's weapons.
  Special: If the heroes came to the Iron Scorpion by way of the Ghost Town delve hook, replace the war dog juicers on the beds with villagers powering the Iron Scorpion and the juicer nozzles. The heroes gain 1 hero token if at least four villagers survive.
  The other abducted villagers were transported ahead of the Iron Scorpion's path to a local war dog base to power new experimental weapons for Ajax's army.

  Tactics
  The war dogs focus on corralling the heroes into vulnerable positions near the bredbeddle torso. The juicer nozzles are quick to use Juice Up on their sturdier allies while they still have high Fuel Levels. Logostician Vesper leads the fight with a combination of Portals to the Firing Line and Portal to the Void, corralling the heroes into vulnerable positions near the bredbeddle torso. Once winded, the logostician uses an area ability that includes the acid tank, such as Portal to the Mantle, and then retreats to the cockpit.
  Once the room is flooded with acid, war dogs jump onto furniture. The bredbeddle torso never touches the floor unless knocked prone.

  Ending the Encounter
  Apart from Logostician Vesper, the hold's inhabitants fight to the death.
  The heroes earn 1 Victory each for defeating the war dogs.

  Loot
  Hanging from a hook next to the acid tank is a black coverall with a badge that says "Tank Scrubber." It is an Adaptive Second Skin of Toxins.

  Source: Draw Steel: Encounters, page 188.
