description: |-
  Read aloud
  - "Faded ancient frescoes depict terrible judgment wrought by rulers and gods upon wailing blasphemers below."
  - "Groaning zombies haul armloads of stone toward the entrance from up the sand-covered back steps, their labor overseen by ghostly figures."
  - "The wraiths flicker and hiss at the intrusion, their zombie minions dropping their burdens and lumbering forward."

  Secrets
  - Six umbral stalkers lurk in the shadows of the columns.

  Encounter Adjustments
  - For three heroes, remove two umbral stalkers from group 4, and remove group 1.
  - For four heroes, remove group 1.
  - For each hero in the encounter above five, either add two squads of four fleshflayed shambler zombies to their own group or start with 3 more Malice.

  Columns
  Each column in the room runs floor to ceiling and is 1 square in diameter. They provide cover for any size 1 creature adjacent to them.

  Tactics
  The hidden umbral stalkers harass and harry, using the pillars and darkness to their advantage. Their primary goal is to keep one or more targets occupied and blinded, so that the zombies have time to overwhelm a target. The wraiths marshal their own minion squads to this effect, using their abilities to keep weakened heroes from healing if they can.

  Ending the Encounter
  The corporeal undead are mindless and fight until destroyed. The remaining undead escape or dissipate when they are outnumbered by the heroes. Any surviving wraiths flee into area M2 to join their allies.
  The heroes gain 1 Victory each for defeating the undead.

  Loot
  One of the umbral stalkers leaves behind a clinging puddle of shadow, coagulated around a tiny vial of a slimy substance. The vial contains a Concealment Potion.

  Source: Draw Steel: Encounters, page 77.
