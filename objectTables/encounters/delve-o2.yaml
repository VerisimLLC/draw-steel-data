description: |-
  Read aloud
  - "Where travelers once slept, this chamber is soaked in blood and scattered with dismembered corpses that lie strewn about the room."
  - "In the center of the room, around a shattered statue of a now- indistinguishable saint, an infernal sigil has been painted in blood, staining the masonry of the floor."
  - "The sigil is faintly pulsating with crimson light."

  Secrets
  - The sigil is about to summon a small contingent of hobgoblins into the room. Allow the heroes to examine it and the room for a short time. Then, in a flash of crimson light and a cloud of pungent smoke, a group of hobgoblins accompanied by smiling, impish demons emerge from the sigil.

  Encounter Adjustments
  - For three heroes, remove one hobgoblin firerunner each from groups 2 and 3. Decrease the sigil's required instability to 4.
  - For four heroes, remove group 4. Decrease the sigil's required instability to 5.
  - For each hero in the encounter above five, increase the sigil's required instability by 2, and then either add one hobgoblin firerunner to their own group or start with 3 more Malice.

  Infernal Sigil
  Drawn in the blood of those sacrificed in this place, this sigil is used by the Iron Hollow to entreat with the devils of the Seven Cities of Hell and even allows them to travel there to make arrangements. At the end of each round, it disgorges the following reinforcements within 2 squares of itself if it hasn't been destroyed.
  - Round 1: Eight hobgoblin brandbearers
  - Round 2: One hobgoblin firerunner
  - Round 3: Eight grilps
  - Round 4: Two hobgoblin burning witches Each round's worth of reinforcements is a new initiative group. The heroes can attempt to prevent these emergences by disrupting the sigil. Whoever can reach the sigil can make a Reason test as a maneuver to try to disrupt it. While at least one enemy is adjacent to the sigil, they take a double bane on the test. If there are three or more enemies in the area, they can't get higher than a tier 1 result.

  Reason Test: Disrupt the Sigil
  ! The sigil gains 1 instability, but erupts in a backlash. The creature who made the test and all their allies in or adjacent to the sigil take 5 fire damage. @ The sigil gains 2 instability. # The sigil gains 3 instability.
  If the sigil accumulates 7 instability, it is destroyed in a burst of black smoke.

  Corpses and Beds
  The mounds of corpses are difficult terrain. Remember that the firerunners ignore difficult terrain. If a square containing a corpse or a bed catches fire, each consecutive square of corpse and bed also ignites.
  Any creature who enters a burning square for the first time in a round or starts their turn there takes 5 fire damage.

  Tactics
  The burning witch pulls back from the other hobgoblins, ducking into the lower section at the north side of the room for cover when the heroes close in. The firerunners both use their Blazing Trail to wall off the heroes and ignite the flammable clutter of the room, while the redglare picks fights with anyone who looks squishy.
  The grilps and brandbearers focus on bringing down whoever their captain is focused on.

  Ending the Encounter
  The hobgoblins continue to arrive and fight until only one hobgoblin remains or the heroes dispatch the burning witches who appear on round 4. The lingering hobgoblins flee to O3. The heroes earn 1 Victory each for defeating the hobgoblins.

  Loot
  The burning witch has a Telemagnet on their belt.

  Source: Draw Steel: Encounters, page 69.
