description: |-
  Read aloud
  - "As you climb the last of the ten thousand steps of the obsidian staircase, the front of a cathedral comes into clear view. Cut into the side of the volcano are towering pillars and immense friezes surrounding brass and iron gates sized for the largest of giants."
  - "Lava spews from spillways on each side of the gates, flowing freely and cascading viscously into terrifying lavafalls. The air is filled with an oppressive heat that only the stoutest wills can face."
  - "Fire giants loom attentively at the top of the stairs, alerted to your arrival. One positioned directly in front of the gates bears a fire- wreathed lash in their right hand and molten sigils depicting paired flames on their left."
  - "Another giant, the largest of the bunch, steps forward and speaks. 'This far and no further you come, small folk. Your bones will burn to honor Kunat.' They raise their flaming fist and bellow, and the attack begins."

  Encounter Adjustments
  - For three heroes, remove group 3, and the fire giant red fist has only 120 Stamina.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, add one fire giant red fist with only 120 Stamina to their own group, increase one fire giant red fist's Stamina by 120, or start with 3 more Malice.

  Lava Rivers
  A river of lava flows on each side of the map, culminating in a lavafall.
  Any creature of size 2 or smaller who starts their turn in lava on the upper level slides 5 toward the bottom of the encounter map. Any creature moved over the ledge this way falls 8 squares and creatures with m<3] are submerged under the lavafall and restrained (save ends).

  Giant Steps
  The plateau of the cathedral is 8 squares above the landing the players begin on. The final four steps of the obsidian staircase are each 2 squares high. Creatures size 2 or smaller with a<2] find that the sharp volcanic glass cuts them as they try to climb it and take 5 damage with each unaided step they climb. Creatures who have the Climb keyword in their speed ignore this effect. Giants on this staircase can stand on 2 levels without penalty but can't end their movement straddling 3 levels. If forced movement causes them to straddle 3 levels, they fall prone. A creature who is force moved into the stairs takes an additional 5 damage. The slippery stairs reduce the stability of each creature standing on them by 2.

  Tactics
  The fireballers and red fist immediately rush the heroes, trying to get adjacent to as many of them as possible to push them into the lava rivers if the opportunity arises. The lightbearer keeps the other giants between the heroes and themselves, using their signature ability to harass any heroes in range. If possible, the giants position themselves partially within the lava river, so the lightbearer can seize opportunities to utilize Travel by Fire.

  Ending the Encounter
  The fire giants zealously guard the doors to the cathedral and defend them to the death. The lightbearer and red fist have immense iron keys that unlock the brass gates.
  If the heroes defeat the giants, they gain 1 Victory each.

  Loot
  Two time crystals (used to create Timesplitters) are set into the lightbearer's diadem.

  Source: Draw Steel: Encounters, page 155.
