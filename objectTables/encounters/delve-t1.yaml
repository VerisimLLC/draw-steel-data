description: |-
  Read aloud
  - "It is hard to pick out an individual sight or smell entering the dark temple. The hall is wrecked by the fresh throes of battle. A deep pit scars the stone floors."
  - "Gashed and scraped carved pillars depicting draconian legends fill this room. Some look to be broken enough to push over."
  - "Four-armed figures loom over their fallen draconian opponents. They stand up to greet the intrusion with hushed sighs and grunts of exasperation before roaring back into battle."

  Encounter Adjustments
  - For three heroes, remove group 2.
  - For four heroes, remove one time raider nemesis from group 3.
  - For each hero in the encounter above five, either add one time raider mind punk (lightweight) or time raider nemesis to their own group or start with 3 more Malice.

  Floor Scar
  The scar in the ground appeared during the time raider's battle with the draconians. It is 6 squares deep and doesn't require a test to climb the walls.

  Damaged Pillars
  While standing, a pillar provides cover to each creature adjacent to it.
  However, the pillars are damaged. Dealing any damage to a pillar causes it to fall. The creature who damages the pillar chooses an adjacent creature to take 5 damage from the falling pillar. If no creature damaged the pillar, the Director chooses which creature takes the damage.
  The ceiling increasingly starts to buckle and crack after the first, third, and sixth pillars in the room fall. Should at least seven pillars fall, the ceiling in this room collapses. Each creature in the room when the ceiling collapses must make an Agility test.

  Agility Test: Avoid the Falling Ceiling
  ! 20 damage; prone and can't stand (EoT) @ 10 damage; prone # 5 damage The floor of the room then becomes difficult terrain.

  Source: Draw Steel: Encounters, page 47.
