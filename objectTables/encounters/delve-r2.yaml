description: |-
  Read aloud
  - "The great hall is collapsed on one side, stone and rubble burying the southern portion of the great hall and blocking the main gate."
  - "On each side of the hall are high balconies decorated with what was once fine oak railings, now rotted and listing."
  - "In the darkness above, the gaping hole in the half-collapsed ceiling lets in the gale which rattles the chains of the two remaining iron chandeliers hanging from the rafters."
  - "A squad of war dogs, interrupted in the midst of a meal which still sits on the table, have readied themselves for battle against the invading force."

  Encounter Adjustments
  - For three heroes, remove groups 3 and 5.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add two war dog boomdogs or war dog neuronites to their own group or start with 3 more Malice.

  Balconies
  There are two balconies in the great hall set against the north and south walls. They are 3 squares high and can be reached by stairs. There are railings lining the stairs and balconies, but they are ancient and fragile.
  Any creature force moved into them hurls through them without losing any remaining squares of forced movement and takes 3 damage.

  Chandeliers
  Two chandeliers hang precariously above the great hall. They are 4 squares above the floor, only 1 square higher than the balconies. When a creature uses a chandelier as part of their movement, roll a d6. On a 1 or 2, the chains break and the chandelier falls. A chandelier can also be intentionally dropped by dealing at least 3 damage to it. When it falls, a chandelier deals 10 damage to each creature and object below it, and any creature with a<2] becomes restrained (save ends). Another adjacent creature can end the restrained condition as a maneuver, either pulling the creature to safety or moving the chandelier off of them.

  Furniture
  Several chairs and a large table have been set up in the north of the great hall. They grant cover to size 1M or smaller creatures adjacent to them.
  The chairs have 3 Stamina each, and the table has 5 Stamina.

  Tactics
  In this battle, the war dogs have prepared for a straightforward clash.
  The boomdogs rush in to lock down whoever they can tackle while the conscripts and subcommanders surround and flank them. The neuronites focus on disrupting mobile heroes with their signature action while using The Voice to protect their allies, especially by having boomdogs taunt their enemies.

  Ending the Encounter
  After killing all three subcommanders, the remaining war dogs activate their loyalty collars. The heroes earn 1 Victory each for defeating the war dogs.

  Loot
  One of the subcommanders is wearing a Displacing Replacement Bracer.

  Source: Draw Steel: Encounters, page 39.
