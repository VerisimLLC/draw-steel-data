description: |-
  Read aloud
  - "This soaring cavern is littered with debris from various ships but dominated by a pair of large masts driven into the ground with a web of rigging between them."
  - "Sitting casually in the crow's nest of one of the masts is a translucent woman with a sword on her side, a maroon tricorn hat, and a long, patched-up admiral coat."
  - "Broken ballistae, once part of the ship, are embedded in the cavern walls."
  - "As the captain spots you, she looks down and calls, 'Aye, Captain Lamagne and his dogs've come to finish the job, they have! To arms, lads, the Horizon will never die!'"
  - "At her words, the whole cavern starts swaying like the deck of a ship on rough seas. Meanwhile, spectral figures rise from the wreckage, and rotting corpses push aside scrap wood to crawl to their feet, ready for battle."

  Encounter Adjustments
  - For three heroes, remove group 2, and Captain Cryx has only 60 Stamina.
  - For four heroes, remove two soulwights from group 3.
  - For each hero in the encounter above five, add two specters to their own group, increase Captain Cryx's Stamina by 40, or start with 3 more Malice.

  Masts
  The two 6-square-high masts driven into the ground are haunted by Captain Cryx's presence, and she can make use of them with Malice (see Stat Blocks). Each mast's yardarm is level with the ground and 1 square high. A mast can be destroyed by dealing 15 damage to its limbs, which renders it harmless. Each has a crow's nest at the top, which is big enough for two size 1 creatures to stand in.

  Rigging
  A web of rigging spans the space between the two masts, which any creature can climb with ease to a maximum height of 6 squares up, moving at normal speed while doing so. A character that becomes prone or suffers forced movement while on the rigging falls to the ground, while a weakened creature treats each square of movement on the rigging as 2 squares.
  Dealing 20 damage to the rigging destroys it.
  Even though Captain Cryx can fly, she mimes fighting from the rigging, as she did in life. If the rigging is destroyed while she's in it, she does not fall but floats down to the ground safely and engages the party directly.

  Captain Cryx Malice
  At the start of her turn, Cryx can spend Malice to activate one of the following features: (Stat block in the book.)

  Tactics
  Captain Cryx shouts orders to her crew while remaining up in the rigging, using Phantom Blade Storm and Awful Wail to assault the heroes from a relatively safe position. There's also plentiful debris for her to target with Paranormal Activity. Whenever she uses Paranormal Activity, she can fling up to three objects nearby. If she's wounded, her soulwights attempt to use Stolen Vitality to keep her alive, making it hard to single her out and execute her without dealing with her crew first. The specters focus their Decaying Touch on targets who climb the rigging to get close to Cryx. Skeletons start in the rigging beside the captain, firing arrows at heroes using ranged abilities to stay out of danger.

  Ending the Encounter
  Defeating Captain Cryx ends the encounter as the remaining undead in the dungeon are destroyed. The heroes gain 2 Victories each for defeating Captain Cryx.

  Loot
  Captain Cryx's sword is a Knife of Nine, and her coat is a Color Cloak (Yellow).

  Source: Draw Steel: Encounters, page 23.
