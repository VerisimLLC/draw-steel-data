description: "Read aloud\n- \"The curtain within the stage chamber gives way to a hallway. The hallway\
  \ travels a short distance east, then north, then back to the west. It ends at another curtain.\"\n\
  - \"The sound of muffled conversation carries from beyond the curtain. It's too faint to reveal exactly\
  \ what is being said.\" When the heroes proceed through this curtain, read or paraphrase:\n- \"The floor\
  \ of this chamber is carved with four distinct symbols. They glow with a faint purple light.\"\n- \"\
  Five shadow elf bodies lie dead on the floor. All are within the perimeter of these symbols.\"\n- \"\
  Two shadow elves ride large dusky mounts that look like stags. Other shadow elves mill about the room.\"\
  \n- \"A closed stone door in the north wall contains symbols similar to the ones on the floor.\"\n\n\
  Encounter Adjustments\n- For three heroes, remove one noctis mage from groups 1 and 2.\n- For four heroes,\
  \ remove one noctis mage from group 1.\n- For each hero in the encounter above five, either add one\
  \ noctis mage or brush stalker to their own group or start with 3 more Malice.\n\nAnnihilation Symbols\n\
  The annihilation symbols on the floor of this chamber are suffused with negative energy. When a creature\
  \ starts their turn touching an annihilation symbol, or touches it for the first time on a turn, they\
  \ and each creature touching a symbol take corruption damage based on the number of living creatures\
  \ touching any symbol at that time, as shown on the Annihilation Symbol Damage table.\nAdditionally,\
  \ whenever a creature takes damage that isn't corruption damage while touching an annihilation symbol,\
  \ they also take 2 corruption damage.\nA creature adjacent to a symbol can attempt to drain the magic\
  \ from it by using a maneuver to make a Reason, Intuition, or Presence test.\nReason, Intuition, or\
  \ Presence Test: Drain the Annihilation Symbol ! The creature activates the symbol as if they had touched\
  \ it. @ The annihilation symbol loses its magic. # The annihilation symbol loses its magic, and the\
  \ creature absorbs some of it. The next time the creature deals damage with an ability, they deal an\
  \ additional 5 corruption damage to all targets. \xAEAnnihilation Symbol Damage\xAE\n\nCorruption Damage\
  \ Taken\n1 10 2-3 8 4-6 5 7+ 2 \xA3\n\nTactics\nThe shadow elves know how the symbols work. The brush\
  \ stalkers and panthers get into melee with the heroes and use the Knockback maneuver to attempt to\
  \ push them onto the symbols. The brush stalkers and panthers are willing to stand on the symbols if\
  \ it means harming a hero. The noctis mages use Enemies in the Dark once two or more heroes are grouped\
  \ together to force those heroes to attack one another, preferably while at least one of them is touching\
  \ an annihilation symbol.\n\nEnding the Encounter\nAll of the shadow elves and brush stalkers fight\
  \ to the death. The thick walls and door make the area soundproof, so the foes in the next area do not\
  \ hear the combat unless the door is opened.\nIf the shadow elves are defeated, the heroes earn 1 Victory\
  \ each.\n\nSource: Draw Steel: Encounters, page 99."
