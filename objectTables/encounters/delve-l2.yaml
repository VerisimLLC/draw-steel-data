description: |-
  Read aloud
  - "Raised voices come from a chamber ahead."
  - "What was once a large meeting hall has been thoroughly ransacked, with furniture smashed and strewn about."
  - "War dogs are hard at work searching the ruined hall."
  - "A war dog taxiarch is ranting about how they want to be the one to 'deliver Hoplon's precious secrets to him in the vault,' and gives orders to tear the hall apart if necessary."

  Secrets
  - Part of what led these war dogs to thoroughly explore this area is the presence of still-functioning magic traps, noted on the map with an X. The war dogs have subtly marked the perimeter of each trap with scratches on the floor and can avoid them, but a hero must detect or spot them first (see Magic Traps).

  Encounter Adjustments
  - For three heroes, remove group 4, and the war dog taxiarch has only 120 Stamina.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, add two war dog iron priests to their own group, increase the war dog taxiarch's Stamina by 120, or start with 3 more Malice.

  Collapsed Wall
  If the heroes enter this area first, they do so through the collapsed wall marked "Hero Start."

  Doors
  Most of the doors opening off the meeting hall lead to barracks chambers, kitchens, storerooms, training rooms, and other utilitarian areas that are thoroughly ransacked and hold nothing of value.
  The door marked "Hero Start" opens to a short hallway leading to area L1. If the heroes haven't explored that area, light can be seen and the sound of digging heard in that direction. If the heroes have explored area L1, this door is their entry point to the meeting hall.

  Debris
  Areas of broken furniture, detritus, and rubble spread around the meeting hall are difficult terrain.

  Fallen Table
  A great oak meeting table that was once the centerpiece of the hall has collapsed at one end and now resembles a ramp, rising from floor level at the south end to 1 square high at the north end. A creature who ascends the ramp and leaps off it while using the Charge main action gains an edge on the ability used as part of the charge.

  Magic Traps
  Magic traps remain in this area from when the citadel was occupied, meant to hinder intruders seeking access to military maps and lore. The traps can be detected by anyone able to sense magic - including human heroes. Alternatively, a creature in the room can use a maneuver to make an Insight test to notice the traps.

  Insight Test: Notice a Trap
  ! The hero doesn't notice the traps on their own. @ The hero notices the closest trap of the Director's choice. # The hero notices all the traps in the room.
  Once a trap is noticed by any means, a hero can announce its location to the other heroes. The first time on a turn that a creature moves into a trap space, or if they start their turn there, they take 10 psychic damage and are slowed (save ends).

  Bookshelves
  A creature can use a maneuver to make a test to pull an adjacent heavy shelf down on top of other creatures. When a creature does this, enemies within the squares the shelf occupies and the 2 squares in front of the shelf take 10 damage each.

  Tactics
  The war dogs position themselves according to where the heroes enter this area, letting the heroes advance in the hope of them tripping the magic traps. They pull down bookshelves when they can if it means damaging at least one hero. The taxiarch teleports around the hall to steer clear of trouble while taking out the most formidable-looking heroes at range. The prismites attempt to pull heroes into traps and - if they can swing it - into a line so that the iron priests can make the most of their Houndcannon ability.
  Whenever the war dogs force move heroes or drive them away, they try to get the heroes into the magic traps if they can.

  Ending the Encounter
  Determined to not lose face with Castellan Hoplon, none of the war dogs raise the alarm or break off from the fight to run for aid. All fight to the death. The heroes earn 1 Victory each for defeating the war dogs.
  If the heroes haven't explored area L1 yet, they hear a clamor and digging from the one of the doorways (see Doors).

  Loot
  The war dog taxiarch wears a Mirage Band that the heroes can claim.
  If this is the second area the heroes explore, the taxiarch also carries a blue ceramic disk that glows with magic. The disk's function can't be determined initially, but is revealed at the start of area L3.
  Vault

  Source: Draw Steel: Encounters, page 145.
