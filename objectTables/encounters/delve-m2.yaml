description: |-
  Read aloud
  - "Four tall stone pillars occupy the corners of the room, stretching up to a vaulted ceiling. A decrepit stone dais at the center of the room is covered in a frenetic spiral of archaic glyphs and pictographs."
  - "The walls are lined from floor to ceiling with sarcophagi set into the walls, many of their stone lids burst apart from the inside."
  - "A huge, twisted form is ponderously slamming its enormous fists down onto the dais, though it seems to recoil with pain each time it does so."
  - "Lithe, pale figures swarm excitedly below the dais, slavering and screaming as they rush ahead."

  Secrets
  - Six umbral stalkers are hidden in sarcophagi along the walls.
  - One of the pillars has been rigged to collapse toward the center of the room.

  Encounter Adjustments
  - For three heroes, remove groups 2 and 4.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, either add two umbral stalkers to their own group or start with 3 more Malice.

  Raised Dais
  The center of the room is occupied by a great stone curse-sealed dais, which stands one square higher than the floor around it. The surface is rough and uneven, as the undead have been hard at work trying to dismantle it.

  Rigged Pillar
  Some of the undead have been weakening one of the pillars, rigging it to collapse onto the dais in an effort to break it. A hidden switch is concealed in the base of the column.

  Pillar
  Level 2 Hazard Hexer

  EV 3
  (Stat block in the book.)

  Tactics
  The ghouls act fast and aggressively. They want to isolate individual heroes and limit their mobility, making them easier targets for the zombie. They are happy to cede the center of the room, sacrificing what seems like an advantageous, slightly elevated position so that one or more heroes will position themselves in the path of the rigged pillar.
  The undead other than the giant zombie are clever. They hope to keep themselves out of the pillar's path and encourage the heroes to step into the danger zone.

  Ending the Encounter
  The ghouls are too driven by hunger to retreat and fight until destroyed, as does the giant zombie. If any incorporeal undead remain and are the last alive, they attempt to flee to area M1 and out of the front exit, taking their chances in the open desert. The heroes gain 1 Victory each for defeating the undead.
  Whether from the falling pillar, damage in battle, or the efforts of the undead, the great stone seal is broken by a fissure crack by the end of the encounter. A deep thrum resonates from below, and the dais vibrates with energy as it crumbles to dust. Beneath the disintegrating platform is an unlit staircase descending 20 squares down into area M3.

  Source: Draw Steel: Encounters, page 79.
