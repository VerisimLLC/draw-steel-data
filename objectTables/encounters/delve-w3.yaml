description: |-
  Read aloud
  - "A metal panel with two grooves hums loudly near the entrance to the command center. A label above the panel reads 'Captains Must Present ID Before Entering' in bright red ink."
  - If the heroes insert both captain ID keys into the grooves, the reinforced entrance makes an audible click and slides open. Provide the following information when they enter the tent:
  - "A massive war dog with a mug of milky white liquid in one hand, and two huge broadswords in her other two, stands in front of a huge wooden table. A retinue of war dogs hangs on her every word."
  - "A tall, onyx obelisk stands behind the table, humming with immense power. A beam of light from the obelisk falls on the table and displays a three-dimensional holographic map."

  Encounter Adjustments
  - For three heroes, remove groups 2 and 3.
  - For four heroes, remove group 2.
  - For each hero in the encounter above five, add two war dog michievites to their own group, increase Major Krund's Stamina by 90, or start with 3 more Malice.

  Obelisk
  The obelisk sits on the 1 square high elevated floor at the back of the tent. It has been manipulated to display the local area using data from the minds it has infiltrated. Whenever a hero comes close to the obelisk, the map it projects shifts to show their surface-most thoughts on the table.

  The Black Obelisk
  Level 3 Relic Controller

  EV 20
  (Stat block in the book.)

  Tactics
  The equivite and mischievites rush to get into melee with the heroes, coordinating with the doomthief to shield the arachnites and the tetrarch from harm, at least until she's ready to join the fight.
  Major Krund uses Enter the Fray once the other war dogs have had a chance to get into position. Her goal is to keep the pressure on the heroes and make liberal use of Get Them, You Dolts to whittle them down. Use Lay Waste either as a last resort, or as a means of clearing the tent if it falls in the scuffle.

  Ending the Encounter
  If Major Krund falls, the remaining war dogs activate their loyalty collars to catch any nearby heroes off guard. The heroes earn 2 Victories each for defeating Major Krund.

  Source: Draw Steel: Encounters, page 90.
