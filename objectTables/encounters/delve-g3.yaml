description: |-
  Captives
  The book marks 1 captive (not spawned) at square (19, 11).

  Read aloud
  - "Gnolls lurk among heaps of broken bones and pooling blood, their eyes glittering wickedly as they regard you."
  - "A jagged seat of bones sits atop a raised section of floor at the far end of the room, occupied by a hulking gnollish figure."
  - "The gnoll gestures toward you with a flick of her long whip, sending her lackeys careening toward you with howls of savage laughter!"

  Encounter Adjustments
  - For three heroes, remove four gnoll wildlings from group 1 and both gnoll abyssal archers.
  - For four heroes, remove four gnoll wildlings from group 1.
  - For each hero in the encounter above five, either add two gnoll abyssal archers or gnoll bonesplitters to their own group or start with 3 more Malice.

  Upper Tiers
  The ridges along the sides of the room are elevated 2 squares higher than the rest of the cavern. The far end of the room is 4 squares higher than the rest of the cavern. The ceiling remains 3 squares up from these raised sections.

  Bloodpool
  A demonic pool of blood ripples and thrums in the center of the room. This bloodpool has the same effects as the gnolls' Bloodpool Malice feature.

  Captive
  A captive cowers near the bones along the eastern upper ridge. The chainflails hover close to the captive to ward off any heroes from coming near them. However, they won't kill the captive until Riptongue commands them to.

  Tactics
  The bonesplitter starts the encounter hidden in a bone pile. For the first round or two, the gnolls want to keep the heroes occupied and controlled long enough for Riptongue to use her Deepest Wounds villain action effectively. The abyssal archers can either stay at their high vantage point or jump down and support the chainflails with their Cackletongue ability. The bonesplitter and the chainflails are especially keen to push heroes through as many bones as possible. Meanwhile, the wildlings try to stay close to the bloodpool and lap up every last drop of its benefits.

  Ending the Encounter
  So long as a gnoll is left standing, the power of the gnoll carnage leaps from form to form. When the last gnoll is defeated, a bloody haze rises from the body and dissipates with a last faint echo of frenzied laughter.
  The heroes gain 1 Victory each for putting a stop to the gnoll carnage.

  Loot
  Riptongue keeps a foul trophy on her person, a withered severed tongue. Torn from a fiend, it's a desiccated imp tongue and can be used as the core component for the item of the same name.

  Source: Draw Steel: Encounters, page 32.
