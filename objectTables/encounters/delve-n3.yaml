description: |-
  Read aloud
  - "This circular cave somehow reeks even more than the previous. Its uneven floor seems to be entirely composed of carcasses so old they have petrified."
  - "Puddles of foul-smelling sludge pool in three spots around the middle of the chamber. A few patches of spiky aerating roots shoot up from the ground near the walls."
  - "In the center of it all, a massive abomination wakes from their slumber. The Devourer, guided by their nose, stands up and stares at you, bellowing a single deafening word: 'Food!'"
  - "With surprising speed, more bloodthirsty trolls jump up from behind their leader, ready to consume the Devourer's scraps."

  Secrets
  - The puddles of sludge are toxic pools.

  Encounter Adjustments
  - For three heroes, remove group 3, the troll glutton in group 4 has only 80 Stamina, and the Devourer has only 124 Stamina.
  - For four heroes, the troll glutton in group 3 has only 80 Stamina.
  - For each hero in the encounter above five, add eight troll whelps to their own group, increase the Devourer's Stamina by 100, or start with 3 more Malice.

  Petrified Mounds
  Three mounds of petrified refuse are located around the room. Each mound is 1 square high, except for the mound to the northwest, which also has a second tier that is 1 square higher than the rest of the mound.

  Toxic Pools
  Three puddles of toxic sludge near the center of the room are highly volatile and can explode if exposed to fire.

  Toxic Pool
  Level 4 Hazard Hexer EV 6 per 10 x 10 pool (Stat block in the book.)

  Tactics
  The Devourer starts in the center of the room surrounded by their allies. They try to stay close to the heroes, using Delicious Assimilation to gain as many helpful immunities as possible, followed by Blasting Belch to force move them into environmental hazards. If an enemy has a particularly beneficial set of immunities, the Devourer tries to continually use Delicious Assimilation on that target.
  The gluttons remain close to their leader, using Food Frenzy to lure the heroes into attacking them while the whelps slide their enemies into the Devourer's vicinity. The butcher uses Rotten Scraps from far away to both heal their allies and damage the heroes.
  When desperate, the Devourer uses Go Out on a Limb to increase their chances of recovering Stamina through Delicious Assimilation. In a frenzy, the Devourer takes the Charge main action whenever possible without minding the toxic pools.

  Ending the Encounter
  Defeating the Devourer ends the encounter as all remaining trolls flee Mangrave and leave the Ealdbog. The heroes earn 2 Victories each for defeating the Devourer.

  Loot
  Among the mangled corpses of past meals lie a set of Bracers of Strife and a Brittlebreaker.

  Source: Draw Steel: Encounters, page 138.
