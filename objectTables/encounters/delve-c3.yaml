description: |-
  Read aloud
  - "A roiling black pool of liquid near the other end of the room is being chanted over by a robed figure."
  - "The robed figure looks up from her casting momentarily and says 'You have disturbed the ritual to restore my family to their glory!'"
  - "On the floor is a mosaic of runes and symbols detailing a myriad of elaborate necrotic rituals."

  Encounter Adjustments
  - For three heroes, remove groups 2 and 4.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, add two lithgekhs to their own group, increase Eranya's Stamina by 90, or start with 3 more Malice.

  Roiling Pool
  The essence of necromancy itself churns within this pool formed by Eranya. It is 6 inches deep and difficult terrain. At the start of each round of combat, four skeleton knights emerge from the pool.
  If the heroes destroyed at least two of the dark pillars in C2, the pool summons four of Eranya's skeletons into their own group instead of the skeleton knights. If more than half of the pillars were destroyed, the pool doesn't have enough power to summon any skeletons at all.

  Necrotic Mosaic
  The mosaic on the floor is full of necromantic knowledge. The first time on a turn that a creature who is not Eranya or undead touches the mosaic, they are frightened of the nearest enemy (save ends). If the creature is already frightened, they take 5 necrotic damage.
  Each time Eranya uses her Call Forth ability, the runes flash with purple light.
  A hero touching the runes can make a Reason test to interpret and manipulate the magic runes as a maneuver.

  Reason Test: Interpret the Magic Runes
  ! The runes lash out and deal 5 necrotic damage to the hero. @ The hero makes some progress interpreting the runes and gains an edge on the next test they make to do so. # The hero causes a disruption in necromantic magic, and Eranya can't use Call Forth until the end of her next turn.

  Tactics
  Eranya begins combat by using Call Forth to bring as many false vampire minions to bear as possible. She prefers to stay behind her undead and use Glimpse of the Grave to frighten melee heroes so they can't approach her.
  The lithgekhs stay near Eranya and protect her with their Devour Magic ability. They also use Heartstopper to keep creatures from approaching.
  The skeleton knights and undead summoned by Eranya engage the heroes in melee, attempting to slow the heroes' advance to their boss.

  Ending the Encounter
  Defeating Eranya Ala'ral ends the encounter as the remaining undead crumble to dust. The heroes earn 2 Victories each for defeating Eranya Ala'ral.

  Loot
  A Shifting Ring slips off Eranya's shriveled finger and rolls along the floor.
  The plans for a Gravekeeper's Lantern in Hyrallic are layered within the rituals as part of the mosaic's runes. A hero who copies them down can use this as a project source (see Chapter 12: Downtime Projects in Draw Steel: Heroes).

  Source: Draw Steel: Encounters, page 128.
