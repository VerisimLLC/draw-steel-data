description: |-
  Read aloud
  - "Waves of heat rise from the seething magma at the center of the inner sanctum. Smoke and ash billow upward to the open top of the caldera, seemingly hundreds of feet above you."
  - "Three altars in the shape of kneeling giants encrusted in ruby, amethyst, and garnet each hold an immense gemstone full of slowly shifting gold and crimson patterns. An energy radiates from each crystal that seems to reach out toward the center of the chamber."
  - "In front of each altar is a fire giant, all three wearing ceremonial robes made of thin strands of woven metals. Their hands are clasped in prayer, and their bodies radiate a dim golden light."
  - "Suspended in the open air over the center of the magma chamber is a great heart made of blood-red stone shot through with veins of molten gold. It beats, and with each beat the mountain seems to shiver. It is surrounded by a shimmering gold and crimson field."
  - "One of the giants, the largest of them, lifts her head and glares imperiously down at you. 'You think to stop me, vermin? Kunat ot Bahir will waken and drown your kind in fire and ash. Be honored: you will be the first to die.' She makes a silent gesture and readies herself for combat."

  Encounter Adjustments
  - For three heroes, remove group 3.
  - For four heroes, one of the fire giant red fists has only 120 Stamina.
  - For each hero in the encounter above five, increase either a fire giant red fist or Kalcin's Stamina by 120, or start with 3 more Malice.

  Blaze Altars
  Three blaze altars create a shield that protects and powers the Mantleheart: it can't be damaged until all three altars are broken.
  Additionally, any hero adjacent to an altar at the start of a round with p<3] loses 1 Recovery. For each Recovery lost this way, the Director gains 1 Malice. If a hero has no Recoveries left, they take damage equal to their recovery value. This damage can't be reduced in any way.
  The altars grant cover and concealment to size 2 or smaller creatures adjacent to them.
  Each blaze altar has 40 Stamina.

  Descent to the Magma Chamber
  The doors to the Mantleheart Sanctum open onto platforms that are 4 squares above the surface of the lava. Two flights of stairs descend to the floor of the chamber. Each step is 2 squares high and made of rough stone. Giants on this staircase can stand on 2 levels without penalty but can't end their movement straddling 3 levels. If forced movement causes them to straddle 3 levels, they fall prone.

  Lava Pool
  The lava pool is 2 squares deep.

  The Mantleheart
  The Mantleheart floats just above the magma chamber, at the same level as the stone platform accessing it. The Mantleheart has 100 Stamina. While it is active, each non-fire giant in the room loses any fire immunity they have. Each creature who didn't have a fire immunity to begin with gains fire weakness 5.
  At the start of each combat round while the Mantleheart is in this room, each hero must sacrifice one of the following to the artifact (their choice):
  - 1d3 heroic resources (the hero must have at least 3 to make this choice)
  - 3 surges (the hero must have at least 3 to make this choice)
  - 1 Recovery (the hero must have at least 1 to make this choice) If they can't sacrifice any of these things, they take damage equal to their recovery value. This damage can't be reduced in any way. If the heroes obtain the Mantleheart, it is an artifact with the following features:
  - Stoneseed: If the Mantleheart is buried deep in the earth and provided sufficient energy, it can cause a mountain to grow in that location. The growth occurs naturally over 100 years if no additional energy is supplied, at which point the Mantleheart reappears deep within a mountain cavern. Energy can be supplied via magical rituals, blood sacrifices, or the use of Upper World technology, which can speed up the process to a matter of days.
  - Burning Soul: A living creature can replace their own heart with the Mantleheart by pressing it into their chest. This binds the heart to them until their death. While bound to the Mantleheart, a creature has fire immunity 10 and any weapon ability that deals rolled damage using unarmed strikes deals an extra 5 fire damage. Additionally, if the creature is smaller than size 5, they increase their size by 1. When a creature bound to the Mantleheart becomes winded, they also become ignited (save ends). While ignited, they become enveloped in flame, dealing 5 fire damage at the start of their turn to each creature within 3 squares of them. An ignited creature is unable to distinguish between friend and foe, and makes a free strike against the nearest creature at the end of each of their turns.
  - Friend of the Flame: While in possession of the Mantleheart, fire giants, elementals, and residents of Quintessence treat the owner as a friend. They start all negotiations with the owner with 1 additional Patience and Interest.

  Great Balls of Fire
  At the start of any giant's turn in this encounter, they can spend Malice to activate the following feature: (Stat block in the book.)

  Tactics
  Each of the giants guard their respective blaze altar, but once their altar is destroyed move to protect Kalcin. All three move to protect the Mantleheart if the shield is brought down.

  Ending the Encounter
  The encounter ends when either the Mantleheart is destroyed or Kalcin is defeated. If the Mantleheart is destroyed, Kalcin curses the heroes, swears revenge, and flees along with the remaining fire giants. If Kalcin is defeated, the remaining fire giants flee and the ritual ends, leaving the Mantleheart as a reward/problem for the heroes.
  The heroes earn 2 Victories each for defeating the giants.

  Loot
  If Kalcin is defeated, a Thief of Joy can be found on her corpse.
  Additionally, the three blaze altars are made of innumerable precious stones and earn the heroes 1 Wealth. If the Mantleheart survives the encounter, it quiets and submits to the heroes.

  Source: Draw Steel: Encounters, page 158.
