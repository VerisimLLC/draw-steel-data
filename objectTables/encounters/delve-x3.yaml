description: |-
  Read aloud
  - "The wobbling of the ferryman's skiff beneath your feet ceases, replaced by hard scalding sandstone. Tar, bone, and gold churn in a hissing crucible far below."
  - "Stair-bridges twist over the pit. The sandstone trembles under the weight of snarling demons ready to defend their king."
  - "At the apex of the stair-bridges sprawls Aurumvas the demon lord, his scales slick with dripping gold and leaking souls. He reclines in the coiled tail of his own colossus, his mouth open to swallow a torrent of coins and jewels."
  - "Behind him is a golden statue of his likeness, its gems glittering with terrible power. Lesser statues at the far corners of the room seem to whisper praises to the unholy idol."

  Encounter Adjustments
  - For three heroes, remove groups 1 and 3.
  - For four heroes, remove group 4.
  - For each hero in the encounter above five, add two vicisitators to their own group, increase Aurumvas's Stamina by 130, or start with 3 more Malice.

  Tar, Bone, and Molten Gold Pit
  The pit below the walkways lays 6 squares down and is filled with hissing tar, charred bones, and molten gold.
  Non-demons who lack the Swim or Fly keywords in their speed treat the pit as difficult terrain. Non-demons who enter the pit for the first time on a turn or start their turn there take 15 acid damage.

  Idols
  Two lesser statues ward the crucible. A lesser statue has 60 Stamina.
  Any power roll made against a non-minion demon or the unholy idol takes a bane for each lesser statue still intact. If the roll is a damage dealing ability made by a non-demon creature, they are also pushed 3 squares away from their nearest target.
  While adjacent to a lesser idol, a creature can hear it whisper, "Let me know riches that He could only dream of." If the creature offers the idol a trinket or leveled item, the treasure and the idol both melt into sludge and are completely destroyed.
  The statue behind Aurumvas is an unholy idol. It appears to mimic Aurumvas's expressions on its face.

  Unholy Idol
  Level 8 Relic Support

  EV 20
  (Stat block in the book.)

  Tactics
  The lesser demons do everything they can to prevent the heroes from approaching Aurumvas. The izyaks daze and restrain heroes who have the potential to challenge Aurumvas in melee, the vicisitators use Warp Touch to weaken ranged heroes, the death-maidens attempt to fling heroes into the pit, and the optacus demons harass as many heroes as possible with Optical Flare.
  Aurumvas unleashes his fury on the heroes, obliterating them with Greedy Hands and No Matter the Cost.

  Ending the Encounter
  The encounter ends when Aurumvas is defeated, even if there are still demons alive. The pit roils and the Sloughed Coil begins to collapse.
  The heroes earn 2 Victories each for defeating Aurumvas.

  Loot
  The treasure bath of Aurumvas holds the Mortal Coil, a Molten Constrictor, a Chaldorb, a Grand Scarab, a Mirage Band, two Breaths of Creation, two Elixirs of Saint Elspeth, and five Healing Potions. There is also an abundance of mundane treasure, enough that each hero could increase their Wealth score by 5 if they manage to escape with all of it.
  See the Conclusion if the heroes attempt to collect the loot after the encounter.

  Source: Draw Steel: Encounters, page 200.
