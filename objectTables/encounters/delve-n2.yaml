description: |-
  Read aloud
  - "A short tunnel leads into a chamber where the smell of decay overpowers all others - the very air seems to be putrefying."
  - "Large sections of the ground are completely covered by bones, carrion, and waste. They crawl with maggots and roaches that feast on the endless banquet."
  - "In the center of the room is a large pit from which emanates a stench so repugnant it becomes oppressive."
  - "A pack of trolls regaling in the filth stands up as soon as you make your way into the room, attacking in a voracious frenzy."

  Encounter Adjustments
  - For three heroes, remove group 3, and the troll butcher in group 2 has only 60 Stamina.
  - For four heroes, remove group 3.
  - For each hero in the encounter above five, add one troll butcher with only 60 Stamina to their own group, increase one troll butcher's Stamina by 60, or start with 3 more Malice.

  Piles of Waste
  Two sections of this chamber are littered with sharp bones and decaying flesh. The squares in these areas are considered difficult terrain, except that a creature can shift into them. Any non-troll who enters a square of waste without shifting into it takes 5 poison damage per square of waste they enter.
  A troll adjacent to a pile can use a maneuver to hurl refuse at a non-troll creature within 10 squares. That creature takes 5 poison damage.
  Alternatively, a troll in a space that includes a pile can use a maneuver to leap up and down, splattering refuse everywhere. Each non-troll creature adjacent to the troll takes 5 poison damage.

  Refuse Pit
  A 3-square-by-3-square refuse pit contains meat the trolls throw away when it becomes too spoiled even for them. The pit is 2 squares deep.
  Any non-troll creature who falls into the pit takes 12 poison damage and is weakened (save ends). Climbing the walls of the pit doesn't require a test.
  The trolls in this chamber have adapted to fighting near the pit. If they are force moved into a pit, they can use a triggered action to attempt to pull an adjacent creature down with them when they fall. If the creature has a Might or Agility that is less than 3, they are pulled into the pit.

  Tactics
  Each butcher starts adjacent to one of the piles of waste, peppering the party with Rotten Scraps from a safe distance. Whenever threatened, they stay close to the minions, empowering them with their Bloody Feast trait. The crack troopers start opposite to the entrance, using the Charge main action to catch up to the heroes. The whelps stay close to the center of the room, strategically using their Jaws and Claws ability to slide the heroes into the piles of waste or into the refuse pit.

  Ending the Encounter
  The trolls in this encounter are better fed than most, so they know that they can survive a few days out in the swamp. They fight only until all non-minion creatures are defeated - any remaining minions flee from the cave. The heroes earn 1 Victory each for defeating the trolls.

  Loot
  At the bottom of the refuse pit, a skeletal finger still wears a silver ring that seems to disappear when viewed from certain angles - this is a Shifting Ring.

  Source: Draw Steel: Encounters, page 137.
