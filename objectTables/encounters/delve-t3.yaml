description: |-
  Read aloud
  - "The chaos and destruction that has touched the other rooms of the temple apparently didn't reach this area."
  - "Rows of large and heavy stone pews lead to a raised platform with finely carved statues flanking a podium. One of the pews hangs in midair."
  - "Looming behind the podium is the imposing figure of a time raider clad in an enormous suit of mechanical armor. Other time raiders wielding crackling firearms and hooked polearms wait on their captain's command to attack."

  Encounter Adjustments
  - For three heroes, remove group 4.
  - For four heroes, remove one time raider cannonfall from group 2.
  - For each hero in the encounter above five, either add one time raider nemesis or time raider cannonfall to their own group or start with 3 more Malice.

  Grand Chapel
  The vaulted ceiling rises to 10 squares. The platform with the podium and statues sits 2 square above the floor beneath it.

  Time Ward
  The magic ward on the temple is still unraveling in this room. The stone pews, suits of armor, and brazier move as if they had 0 Stability and all forced movement made against them is considered vertical. Any object that gets force moved into the air stays in place.
  A creature can target any of the aforementioned objects in this room with the Knockback maneuver. If a creature targets one of these objects with a damage-dealing ability that doesn't impose forced movement, they can push the object 1 square.
  The one pew already floating in midair is 2 squares off the floor.

  Tactics
  Dak'zir opens combat by using We Will Won to grant temporary Stamina and a speed boost to herself, each captain, and a cannonfall.
  She then uses Air Raid each round to help her allies rearrange themselves on the battlefield. She likes to teleport and hover above the action, targeting the most effective heroes with her Gatling Blaster.
  The helix and the nemesis engage the heroes directly, using forced movement to smash their targets into each other and group them for the cannonfalls' Sunderbuss and Buss Buffer abilities. When they can't get airborne, the myriads knock more pews into the air and take the high ground.

  Ending the Encounter
  When Dak'zir the Unruly is defeated, the remaining time raiders flee the temple or surrender if they are cornered. The heroes gain 2 Victories each for defeating Dak'zir.

  Loot
  The time raiders have been moving whatever they find that might be of value to this room. Buried within the piles is a flat, palm-sized triangular stone decorated with a starfield of tiny gems. This is a Scannerstone. After careful inspection, the heroes uncover the research needed to start projects for both the Scroll of Resurrection and the Mask of Oversight.

  Source: Draw Steel: Encounters, page 50.
