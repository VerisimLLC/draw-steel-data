id: 63a4e6d8-b14b-4da4-9a54-8bb148f621aa
name: "Downtime Event: Build or Repair Roads"
_table: adventureTables
__typeName: RollTable
ctime: 1788006111155
mtime: 1788006267491
rows:
- id: c4df925d-db8f-4290-8375-e19ec46852c8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, crews uncover an ancient road following the intended route, crafted with remarkable techniques that make it a sturdy base on which to build. The project gains an automatic breakthrough and the project goal is halved if it was not already halved.
- id: 3b8531d8-013f-4e8e-81f7-9e1b478e3ec1
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the local population grows in excitement with each completed portion of the road. The name of the hero making the project roll spreads as a builder of bridges both literal and social. If the project roll is 12 or higher, the local community comes together to complete the project alongside the hero's hired crew. The hero doubles the renown earned at the end of the project.
- id: 5980eaac-1482-4fc4-a44d-5d3298b71f0f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a local religious or civic authority hears of the project and sends laborers to accelerate it -- in exchange for a future favor. The hero gains an immediate 50 project points for the project if they accept the help.
- id: 3a595c15-9ebe-437a-8ee8-46931a9a17a8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, local hired hands and the project engineers find themselves at odds, hindering the project. If the hero can't help defuse the situation, the project requires an additional 50 project points to complete.
- id: 06a4856b-40cc-450c-8c30-909ba0c0e3a0
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, supply caravans are disrupted by bandits, requiring extra guards. If the hero can't deal with the bandit threat personally, the project requires an additional 50 project points to complete.
- id: 2038f0e7-cdf8-4480-9de9-5f19246350af
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, word is heard that not everyone in the local area is happy about the road being built. The project is hindered by supernatural curses that cause stones to move, vines and overgrowth to reclaim sections already built, or churning earth to restore the road back to its previous form. The hero must make amends to the local supernatural community or have the renown earned by completing the project not extend to that community.
- id: feab6055-1337-43d2-a777-aabb0ca32f17
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, ditchers working on the project hit an ancient well, retaining wall, or hidden stream that results in an immediate flood. The work is delayed, but the new water source ultimately provides a boon to local farming communities. Project points earned by this roll are halved, but upon the project's completion, the hero earns 1 additional renown.
- id: ec28745a-72fb-4ab9-b7c7-b12c9c8bd36f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a new engineer arrives with specialist experience such as building sturdy wooden bridges, using bilge pumps to keep rainwater from slowing the work, and so forth. They want to work on the project, but insist on receiving a consumable treasure first. If they are hired, the project gains an automatic breakthrough.
- id: 53644b87-8753-4b2f-8225-b06ef3e5ff65
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the proposed road touches on a supernatural intersection -- a crossing place between multiple worlds that draws interest from a powerful devil. The completion of the project becomes the personal interest of this being, who offers to increase progress -- but demands a future favor from the hero. If the deal is accepted, each project roll for the project is doubled until its completion.
- id: 3a23feea-a508-45ef-b0b9-0e6f86909171
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a guildmaster has it out for the hero. Whether from a past conflict or something about the way this project has unfolded, the guildmaster has made it their mission to hinder the project by dragging the hero's name through the mud. The hero's renown is treated as 1 less than usual while these rumors persist.
text: true
