id: 34b34ed4-8c13-4c99-9445-85b1816cff42
name: "Downtime Event: Community Service"
_table: adventureTables
__typeName: RollTable
ctime: 1788006401348
mtime: 1788006401348
rows:
- id: 2b31380e-666e-4410-a096-b97bab21eb23
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero's service is recognized by the local nobility or authorities. Upon completion of the project, the hero earns 1 Renown.
- id: e89b2b01-f02b-4cb3-96c1-66edc51280d8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a mysterious force hinders the work in an unfortunate way, with tools going missing, tutoring materials vanishing, cleaning supplies turning up already filthy, and so forth. The hero can't continue the project until the culprit -- a maligned devil or spirit connected to the hero's past -- is identified and dealt with.
- id: 9b84f25c-fb07-4170-8752-7db6ec68e38a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the community is so excited by the project that they join in to lend a hand. The project gains an automatic breakthrough.
- id: 4480fe09-18e5-4587-8517-90af9f80beed
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a sympathetic NPC -- perhaps a friend or ally from the community or from the hero's past -- offers to assist with the project. The hero gains a +3 bonus to the project roll.
- id: b5c1cc90-9e6f-4ad0-a450-20f75bd68845
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, work on the project unearths a previously lost detail of the community -- a lost or hidden section of a settlement, a surprising historical detail, a secret regarding a prominent local, and so forth. The locals take a keen interest in the development, but the revelation threatens to tear the community apart. If the character can't take steps to undo this strife, they take a bane on the project roll.
- id: f206f8b9-16cd-4d01-b739-2416326d154a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a seemingly benign action taken by the hero curses them with bad luck. Until they break the curse, all project rolls they make are halved.
- id: 7d6272b6-358e-43b3-9797-dcb6734d4a3d
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a saint blesses the hero's work. The hero feels supernaturally rejuvenated, increasing their Recoveries by 1 until the end of their next respite. If the character is a conduit, they also gain an automatic breakthrough on the project.
- id: e60248ec-3b3d-47ad-9cbb-e8ed4121e30c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero becomes aware of a previously unknown radenwight warren within the community, which has the potential to become a point of tension and conflict. The hero must engage with the radenwights and other locals to create understanding between the two communities or take a bane on the project roll.
- id: 39c5b191-18ea-4397-8891-42be03da9221
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a local malcontent has turned their focus on the hero and roused the people against them. The hero must either contend with angry locals preventing them from resting (losing the usual benefit of the respite) or find the malcontent and win them over before proceeding.
- id: bea4a6e4-d5e8-4d93-9c94-6412bdd6519e
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a thief, assassin, or other criminal offers to assist the hero. They can offer 50 points toward the completion of the project, as long as the hero looks the other way if they ever cross paths again.
text: true
