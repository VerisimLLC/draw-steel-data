id: e790711d-30b0-4511-a2d3-f4bcd3426fef
name: "Downtime Event: Spend Time With Loved Ones"
_table: adventureTables
__typeName: RollTable
ctime: 1788006445429
mtime: 1788006445429
rows:
- id: 0594251e-a1bd-416b-ab87-fcacde29129b
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero is presented with an heirloom, artifact, or secret that aids another project they've undertaken or want to undertake. They can immediately make a project roll for that project as well as for this one.
- id: 87cf7d96-a6ae-4a88-ba4b-d1f2355b386f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero's people embrace their loved one's companions as their own. Additional party members can make one project roll each for this project without doing so as a respite activity. When the project is completed, each character who contributed a project roll gains the benefit of completion.
- id: f9d22b13-9aab-4d11-baaa-587ad049b0c0
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero's enemies track them to the home or community of their loved ones. These enemies immediately launch an attack, hoping to catch the hero off guard.
- id: e0d8996f-c66e-4a4c-88a2-0aacca5a699f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero learns that a distant friend or family member has joined the cause of their enemies. Their loved ones plead with the hero to bring this person back home safely.
- id: 00aa52b4-c2c9-4bf0-acf0-f6e3e628ccb3
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a loved one gives the hero a consumable treasure to aid them in their travels.
- id: 268341e8-0ba7-4da7-8088-005c1e512d2a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero's loved ones share that they have been subjected to a curse. The only way to lift the curse is by returning an heirloom to its place of origin.
- id: 1c3465df-0f71-4dd7-b049-95c6c34b5531
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero meets an old friend who is a more experienced adventurer. They offer to mentor the hero in exchange for a treasure or favor. If the hero accepts, they also complete the Learn From a Master project when this project is complete, with the Director choosing the NPC's class.
- id: 61e2a284-9c05-4726-b7c5-73d672c810f2
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero discovers that by returning, they've put the community surrounding their loved ones in danger, either with the authorities or an opposing power in the region. To complete the project, the hero needs to earn the trust of that community.
- id: c8bd7586-e6c2-4bd5-9754-2279cd7e869e
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero learns that spending time with loved ones isn't always as rejuvenating as one hopes. Completing the project requires an additional 20 project points thanks to difficult friends or relatives.
- id: 429ebaea-81c4-4526-a0bf-9853372e35f6
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero's loved ones ask if the hero would like to cook with them. If the hero accepts, they can apply their project roll both to this project and to the Perfect New Recipe project. If the hero is not currently undertaking the Perfect New Recipe project, they start that project and their loved ones provide the item prerequisite and project source.
text: true
