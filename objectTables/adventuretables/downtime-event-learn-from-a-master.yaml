rows:
- id: da2f45c1-36cf-4817-993e-1573931ef5ed
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero experiences a revelation and all their training snaps into place. The hero makes two additional project rolls for this project.
- id: 9de9c58d-07b9-423e-9672-8c87fb12db78
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the master dies midway through training, or the lore they left behind is found to be incomplete. To complete the project, the hero must seek out another master who was trained by the first master, or find another copy of the records of their teaching.
- id: cb84596f-27c4-4879-af44-c3c67bf2a9a8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero discovers that although the master's knowledge is sound, they are less adept at the teaching of that knowledge. The project requires an additional 50 project points to complete.
- id: 3a1ef98a-2736-4aaa-8f5a-0f87d6e5f0d7
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the master requires the hero's aid with manual labor before their training can begin. The hero must spend this respite completing that labor, earning a hero token for their efforts instead of making a project roll.
- id: faea0103-8448-4562-875f-8173d46b2832
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero must undertake the master's grueling training regimen. The hero rolls an additional d10 for the project roll during this respite, but at the end of the respite, they regain 1 fewer Recoveries than usual.
- id: 5eadf517-2570-4d4c-8f21-8497bafa56ab
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero's relationship with the master deepens. In addition to the current project, the master provides information relevant to the hero's goals, another project, or a surprising connection to a mystery from the hero's past.
- id: 9d0b0492-d6f6-4e34-8282-5c20b462395c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero discovers that the master has been working with an enemy of the hero by covertly providing them information about the hero's activities. The hero can continue learning from the master, but risks exposing themself and their allies to danger by doing so.
- id: 9a721f7d-5fb0-4831-ba9b-548818097dc2
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, an accident, fire, or other natural disaster disrupts the hero's training. The project points rolled for this respite are halved, but if the hero acts to stop the disaster, their heroism sees them earn 1 Renown.
- id: 3d732344-87bb-4058-8517-6e8aa22243f4
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the master gifts the hero with an item prerequisite for a crafting project.
- id: 9be1dabc-fffb-4fff-8589-47164185d687
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero uncovers a secret in their studies, something that the master had never anticipated or that their teachings hadn't covered. The project goal is halved.
text: true
