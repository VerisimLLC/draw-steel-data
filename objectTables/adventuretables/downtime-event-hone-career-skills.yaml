id: caaca2df-8a27-4abc-b25d-f23336283b45
name: "Downtime Event: Hone Career Skills"
_table: adventureTables
__typeName: RollTable
ctime: 1788006249710
mtime: 1788006249710
rows:
- id: 562d385b-1c01-4282-bc71-ac4705dc6c34
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, an old colleague from the hero's past asks the hero to give up adventuring and come back to their former career. A hero who reaffirms their intent to remain a hero gains a hero token. However, if they do so -- or if they lie to say they will return to their old career -- the project goal increases by 50 points as their old colleague refuses to help them.
- id: 15009f39-5585-47c3-b58f-16ebb25843de
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero is hurt on the job. They end the respite with 1 fewer Recoveries than usual.
- id: e31f4874-d4a6-4fc5-87ad-9fc49e1d584e
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero stumbles upon an individual seeking guidance about entering the same career as the hero. If the hero forgoes their project roll to help this NPC, the individual becomes one of the hero's followers, which they gain in addition to any followers acquired through Renown or other means. The follower is an artisan or a sage depending on the hero's career, as the Director determines.
- id: 11244c73-2df9-43c5-9ac1-e85996580211
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero finds inspiration from their old life that helps out with a different project they or another hero are currently working on. The hero working on the second project can immediately make a project roll for that project.
- id: adfbbc7e-de15-4196-b773-800151050af0
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero stumbles into a negative aspect of their career that they forgot was particularly grueling. If the project roll is 11 or lower, it is halved.
- id: bb634b6c-03c8-45ea-95fa-f6e6a017df3a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero learns rumors of a treasure of the Director's choice that other members of the hero's previous career are seeking. If the hero doesn't seek the treasure ahead of time, they automatically determine where the treasure is to be found when they complete their project.
- id: f36c8ec5-569e-4a15-a2ac-dd85e0221cb0
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a vaguely familiar stranger in the same career asks if they can work with the hero on their project. If the hero accepts their help, the stranger makes one project roll for the project with a +2 modifier. Only afterward does the hero learn whether the stranger supports their motivation for working on the project or whether they work for the campaign's villain.
- id: 99f18a20-d469-460c-9fc9-beaad99fc944
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero strangely feels 5 years younger. Any character familiar with psionics recognizes the phenomena as a chrono-anomaly. The hero grows younger each time they make progress on the project -- but will cease to exist if they complete the project without first finding and stopping the source of the anomaly.
- id: f3baa775-2645-4996-9a3f-492198d60fdf
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero stumbles upon an old memento from when they worked their former career. They can choose between gaining an automatic breakthrough on the project roll or gaining a hero token.
- id: 4323219d-eb12-4826-a407-84295233b98c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero gets back into the rhythm of their former career. They can make two additional project rolls.
text: true
