id: 93ca7f30-7efa-454d-a5cb-a136046eae14
name: "Downtime Event: Crafting and Research"
_table: adventureTables
__typeName: RollTable
ctime: 1788006559824
mtime: 1788006902389
rows:
- id: a18c1977-e72d-4f45-9e3c-66919cfbafcc
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a thief who wants the project source or an item needed for the project approaches the hero and pretends to be someone who wants to help. The thief might want to sell the project source or item, or use it to undertake the same project as the hero.
  weight: 2
- id: f22fbba6-de68-426e-92ea-dac5e4c7c9aa
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a traveler in need of food, shelter, or some other necessity happens upon the heroes and asks for their help. If the heroes show kindness, the traveler reveals themself to be an artisan or sage who can help with the project. The traveler can contribute one project roll to the project with a +3 modifier.
  weight: 2
- id: 28db9c5c-4c9d-4e40-936d-b68539d32e06
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, an NPC who is already friendly with the characters and has helped them before asks the hero to let them join the project. The NPC explains that they need the project source or the object being crafted for a personal matter of great importance (saving someone's life, righting a great wrong, and so forth). The NPC can contribute one project roll to the project with a +3 modifier, but the characters must commit to letting the NPC use the finished project before they can do so.
  weight: 2
- id: 128b5649-69a5-4bc1-8c12-97a32bedcf3a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero receives a mysterious note from a person who wants to exchange a treasure or other reward for the project source when the project is complete. The buyer could be someone with their own interest in a similar project, an enemy eager to exploit what the hero is working on, or a superfan who wants to emulate the hero.
  weight: 2
- id: 5c7118c2-9f3a-4502-9495-bc621e6b1dbc
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a pest starts devouring important components of the project. This could be rats gnawing at alchemical components, moths eating rare silks, mites devouring a printed project source, and so forth. If the pests aren't dealt with quickly, some of the components will need to be replaced.
  weight: 2
- id: c1ced062-7f3e-4680-b735-ece148047a92
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a powerful supernatural entity sends an agent or premonition to the hero, offering them knowledge that will let them complete the project immediately. In exchange, the hero must agree to do a favor for the entity, which might not be specified at the time of the bargain.
  weight: 2
- id: 5412a8d2-5ac0-45b3-bcb8-4a164baa39be
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a rumor arises that the project is being worked on in service to an evil entity. People start showing up to the hero's place of respite, demanding that they repent their wicked ways. If the rumors aren't disproved, locals form a mob to stop the project.
  weight: 2
- id: ea668361-9f58-4f8a-9e8a-e17401e134fa
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero's rival comes to visit and shows off a guide for the project. The rival is willing to hand the guide over ... provided the hero publicly humiliates themself by proclaiming that the rival is their better.
  weight: 2
- id: 99d40d36-8b69-4951-8b49-e14594a614ed
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: The project source is cursed. Before the roll, the hero must succeed on a hard Intuition test or become obsessed with the project. Until the project is complete, the hero can't use Victories to increase their Heroic Resource. The curse can be broken by slaying the creature who bestowed it, or by finding a priest to perform a holy ritual over the project source.
  weight: 2
- id: 1617d663-a724-4614-b775-cb281c7559c8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero finds that a significant amount of the project has been completed by a group of fairies. The fairies might have completed the job out of boredom, or they might want something from the hero in return.
  weight: 2
- id: efc6d184-3b70-4288-a73c-835b1ca592f1
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero realizes that the project source contains only half the information they need, and they must find the rest of the information to complete the project.
  weight: 2
- id: 2a04bb11-88b9-4199-aa34-5febc313380c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero discovers a new bit of knowledge or a technique that allows them to immediately start and finish a second project with a project goal of 50 or lower.
  weight: 2
- id: 65d07ac6-f8a1-4a78-b6d9-e4e51535a280
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero finds that someone has attempted to sabotage their project, resulting in damage to notes, the project source, or crafting components. The damage is negligible, but the creature responsible will strike again to worse effect if not discovered.
  weight: 2
- id: 18cd0442-1c00-4e7e-bf82-2215c568471c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the project source is found to hold additional information, letting the hero treat the project roll as an automatic breakthrough. The note could have been left by a helpful visitor, or by someone who wants the hero's work to be finished for their own gain.
  weight: 2
- id: ffbd1b02-e9fb-40d7-9382-bc73b619ff04
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the project draws the attention of a devil, who tries to subtly change the project source from the Seven Cities of Hell. If the hero doesn't notice, the devil is summoned the next time the hero makes a project roll, with goals of the Director's determination.
  weight: 2
- id: 0360a7a2-ed3d-45e4-8eb8-a8eac9f5ce40
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero stumbles upon a tool, expert, or book that helps them with the project, letting them treat the project roll as an automatic breakthrough.
  weight: 2
- id: 1ba7d78a-2ed0-425f-8d43-19ceb41b9b29
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the project source suddenly becomes impossible to understand. A psionic NPC has used a mighty power to obscure or corrupt the project source to prevent a potential catastrophe they foresaw. If the heroes can help prevent the catastrophe in another way, the NPC will end the effect.
  weight: 2
- id: f0fffea8-2ef8-45b0-bf2f-a2404b354575
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero discovers that the project source contains a piece of helpful knowledge unrelated to the current project.
  weight: 2
- id: 279b6156-ea19-4131-94c8-b6a8ac949846
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero learns that several sages working on similar projects have all mysteriously disappeared. Someone or something is abducting these experts for some nefarious purpose ... and the hero could be next!
  weight: 2
- id: 67918d0a-58ed-4ff2-9558-ee87a95658a2
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a group of scholars approach the hero and ask if they can review the project source, promising to help the hero complete the project in return. If the hero accepts, the scholars take the project source until the end of the hero's next respite. Three of the scholars then contribute project rolls during the following respite, each with a +3 modifier.
  weight: 2
- id: cb6cf7c8-83bc-43a4-b03e-27f139a33b09
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a physical project source or crafting components come to life and attack the hero. Magic within these items has become corrupted! If the hero can fix the corruption without destroying the items, the project is saved, but doing so requires a special ritual.
  weight: 2
- id: ab3b10fc-2db7-4bf1-9770-48848b00761b
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, an otherworldly specter appears and warns the hero not to complete the project, explaining that they died attempting the same project and are now attached to the project source. If the hero can convince the spirit that they will not die similarly, the creature shares their knowledge, contributing one project roll to the project with a +3 modifier.
  weight: 2
- id: fcc48034-52bc-4eb2-8154-cb6b78c2ca5b
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the servants of a dragon appear and demand that the hero hand over the project source. If the hero refuses, the servants warn that the dragon will come to claim the project source for themself.
  weight: 2
- id: 944550b3-78bb-4cf5-9b71-ceb93e0e04f6
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero notices a contract written on a physical project source or other accompanying materials that appears only under certain conditions (in the presence of magic, in the light of a full moon, and so forth). The contract promises that anyone who signs it in blood will receive the true and full answer to three questions, in exchange for a week of service to the hag Corrine Withersnipe. The hag appears instantly if the contract is signed.
  weight: 2
- id: 5e0eb182-bcf7-4084-9e86-786d94ef4f61
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, an unexpected total eclipse of the sun occurs, lasting 1 hour. Once per respite when any creature makes another project roll for the project, another eclipse occurs and lasts twice as long as the previous. Some take this phenomenon as a sign of impending doom that will descend when the project is completed. Others believe that a powerful enemy is trying to scare the heroes into not finishing the project.
  weight: 2
- id: 4f6f8923-aa27-4656-aa30-ab4b8964523f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero gets a visit from an NPC who they helped in the past. The NPC has found a guide that relates to the project and gives it to the hero as a gift of thanks.
  weight: 2
- id: cf37ac8a-cb57-4edd-83f9-b8e3ebbdc72d
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a local officer of the law appears and tells the hero to stop working on their project. The nature of the hero's project has just become outlawed in the region, and the constable insists on locking up the project source and arresting anyone who gets in the way.
  weight: 2
- id: 303e56af-84f6-43fa-ac25-4bf4bf55da31
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero determines that the research or crafting they are planning requires only part of their attention. They can either make two project rolls for their current project, or can make one for that project and one for another project.
  weight: 2
- id: 9c5ab366-5ad8-4a44-9aa3-382354d69b6a
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a component or tool the hero is using for the project suddenly reveals itself to be magic or psionic as it starts to hum with energy and glow red hot. If the item isn't quickly cooled, it explodes, and work on the project can't continue until a replacement is found.
  weight: 2
- id: 645c0da8-826a-4927-9300-2f3e22ce6f7c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero realizes they're at a critical point in the project, and can achieve more if they just shave off a few hours of rest. By choosing to lose some sleep, the character can make two project rolls for the project, but when they end the current respite, they do so with 1 fewer Recoveries than usual.
  weight: 2
- id: 840e0dd4-deb4-4b6f-850c-dcb6409136c7
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a sage approaches the hero and offers to help with the project. This NPC isn't really a sage, however -- they're an assassin hoping to catch the hero off guard.
  weight: 2
- id: 8da063e4-1c28-44a5-bf3f-01bf769cf8a1
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a sage approaches the hero and offers to help with the project. This NPC isn't really a sage, however -- they're a bard who wishes to compose a song about the hero's deeds. The idea is to ingratiate themself to the hero while contributing nothing to the actual project.
  weight: 2
- id: f0dbe569-a490-48d2-8d63-641a34f67a6c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, a physical project source or a component of the project creates an unstable portal to another world related to the nature of the project. Tiny devils, elementals, or other creatures start clawing their way out of the item and causing mischief.
  weight: 2
- id: d7284d59-3b80-4c07-8524-3b63d894ccbc
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero realizes that the project source also holds information regarding the location of another project source or certain items, which are needed for another project the hero or one of their allies wants to pursue.
  weight: 2
- id: 496a7292-37f5-484a-b1c9-7febf097aa22
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a group of enemies working for the campaign's villain attacks the hero, intent on destroying as much of the project source or other resources as possible.
  weight: 2
- id: a22f55e8-2c42-43bc-bac0-6d64cb6edd3b
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a storm moves into the area that threatens to persist until the project is completed. The closer to completion the hero gets on the project, the more violent the storm becomes. It's possible that the storm is conscious, or that someone is controlling the storm to stand in the hero's way.
  weight: 2
- id: ff2d34ef-9b41-4c43-b232-b21a9aa1e9d8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero falls asleep. They go on to complete the project in their dreams, but they have no access to that progress while they're awake. The hero can rectify this by finding a way to physically enter into their dreams, where the completed project can be found.
  weight: 2
- id: a9205adb-53bd-4ef6-80d9-75146cae8179
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, a band of goblins barge in on the hero. If the hero has been fighting goblins on their recent adventures, the goblins attempt to run away with the project source. Otherwise, the goblins are merely curious about the project, and the hero can make two project rolls if they choose to explain it and have the goblins help.
  weight: 2
- id: d596433d-71f2-443f-a620-8a6c3b963d64
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero watches as any progress made is reversed -- as if the project were moving backward through time. Any character familiar with psionics recognizes the phenomena as a chrono-anomaly. The project loses the same amount of progress each successive night until the hero finds and stops the source of the anomaly, which restores the project's progress.
  weight: 2
- id: bc559037-e37a-4a69-92db-8f0d9bdc8650
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero hears a voice beckoning them into the nearest wode to work on their project. Each time the hero makes a project roll in the wode, they make three times the progress but feel more pressure to stay in the wode forever.
  weight: 2
- id: 5dee49ad-e0d1-48d7-bf0f-944764a2e544
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero stumbles upon knowledge of an expert a day's travel away who could complete the project, and who possesses a project source or guide for another hero's project.
  weight: 2
- id: c34c18ea-c4f1-460d-a742-aa1141b3a6a2
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, fire rips through the hero's project source or other materials and threatens to destroy the entire project. If the hero puts out the fire before everything is lost, they find that the fire activated secret notes that double each subsequent project roll for the project.
  weight: 2
- id: 40c5771a-1aa0-4655-bdf7-91cb5d3529f8
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, an auteur NPC approaches the hero and asks if they would like to make the project "a little more exciting." If the hero agrees, the auteur narrates the hero's progress on the project, prompting another project roll. If the second roll is lower than the first, the hero subtracts the second roll from the original roll. If it's equal or higher, the hero adds the second roll to the original roll.
  weight: 2
- id: f28c2cae-a0ce-4f4f-8776-d5a61fe51d28
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero's rival reluctantly comes seeking the hero's help on their own project. If the hero agrees, the hero makes their project roll toward the rival's project, and the Director makes the rival's project roll toward the hero's project.
  weight: 2
- id: 1cea3815-865f-4843-8e59-7bd07f774f9e
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero completes their work on the project earlier than expected, and can either relax or go carousing with other heroes who are free. The hero and every character who joins them starts the next encounter with 10 temporary Stamina.
  weight: 2
- id: af489864-665b-4d21-a193-530c1ce5110c
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, the hero is approached by a wagoneer who needs help fixing their wagon. If the hero helps, they find out that the wagoneer is allied with the campaign's villain. If the hero doesn't attack or threaten the wagoneer, then in some future combat, an NPC of the Director's choice turns out to be a friend or relative of the wagoneer. They leave the battle peacefully when they recognize the hero.
  weight: 2
- id: 864b8733-d9e8-40b7-a04c-db52fb1fba6f
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the project source and any evidence of the project disappear into thin air. Any investigation of the area turns up footprints fleeing the scene and traces of gnoll hair.
  weight: 2
- id: de39a53e-85d8-4e9a-a0e6-be81d3919d62
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: After the roll, the hero suddenly no longer understands or comprehends the project source after focusing on those materials for too long. If they continue with the project, they take a bane on its project rolls for the next two respites. If they leave the project alone for the next two respites, they'll be able to comprehend the research again, gaining an automatic breakthrough before the next project roll.
  weight: 2
- id: bcef19bc-2062-4c9d-a5bf-5f851fc8249e
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, part of the hero's project source or other materials shrinks and is pulled through a mousehole. A group of radenwights sent magical mice to steal the resources so they can finish their own project. The radenwights are willing to negotiate if the hero doesn't approach them aggressively.
  weight: 2
- id: e82352d2-14c5-4843-af7f-7b72aa711bea
  __typeName: RollTableRow
  value:
    __typeName: VariantCollection
    items:
    - __typeName: Variant
      type: text
      value: Before the roll, an elemental springs forth from the project source and pulls the hero into a duel. If the hero can survive 3 rounds of combat with the elemental on their own, the elemental vanishes and leaves behind a completed project. If the hero flees, falls unconscious, or gets help from an ally, the elemental destroys the project source as they disappear.
  weight: 2
text: true
