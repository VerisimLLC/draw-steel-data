        - name: Jump Scare
          description: Surprised to see me?
          __typeName: CharacterModifier
          activatedAbility:
            name: Jump Scare
            description: |-
              Your companion shifts up to a number of squares equal to their Intuition score. During this movement, they are invisible. They then make the following power roll against each enemy in the 2 burst.

              Special: Targets only enemies with line of effect to your companion.
            __typeName: ActivatedAbility
            abilityType: none
            actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
            behaviors:
            - __typeName: ActivatedAbilityPowerRollBehavior
              filterTarget: 0 {Display only - real roll runs inside the burst sub-ability.}
              roll: 2d10 + Intuition
              tiers:
              - 4 damage; P < Weak, frightened (save ends)
              - 6 damage; P < Average, frightened (save ends)
              - 10 damage; P < Strong, frightened (save ends)
            - __typeName: ActivatedAbilityDrawSteelCommandBehavior
              applyto: caster
              rule: shift {Intuition}
            - __typeName: ActivatedAbilityInvokeAbilityBehavior
              abilityType: custom
              applyto: caster
