        - name: On You Like Your Shadow
          description: Your companion darts around their target, staying out of reach and using them as a shield.
          __typeName: CharacterModifier
          activatedAbility:
            name: On You Like Your Shadow
            description: Your companion enters the target's space. Until your companion is no longer in the target's space, they can end their turn in that space, strikes against them also affect the target, and your strikes against the target gain an edge.
