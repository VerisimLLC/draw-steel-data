            implementation: 2
            implementationDetails: Power roll and damage are automated. Companion entering the target's space is approximated by teleporting the companion adjacent to the target (Draw Steel does not allow two creatures to share a space by default). The persistent shared-space rider (strikes against companion also affect target, your strikes vs target gain an edge, companion can end turn in target's space) is not automated.
