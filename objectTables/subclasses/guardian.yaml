      - id: a12d4864-f702-412c-815d-5ac08a48d9b8
        name: Omnomnom
        description: Your companion swallows a grabbed creature whole.
        __typeName: CharacterFeature
        classid: 6ebd1424-e99c-4656-a58f-f0e3e2850dee
        domains:
          class:0380181e-acad-4cdb-ae6d-c7cd11df6ad2: true
          class:6ebd1424-e99c-4656-a58f-f0e3e2850dee: true
        guid: a12d4864-f702-412c-815d-5ac08a48d9b8
        implementation: 2
        modifiers:
        - name: Omnomnom
          description: ""
          __typeName: CharacterModifier
          activatedAbility:
            name: Omnomnom
            description: |-
              Your companion attempts to swallow a grabbed creature of their size or smaller.

              A swallowed creature shares your companion's space, is grabbed and restrained, and has line of effect only to your companion. Nothing has line of effect to the swallowed creature. Once per round at the start of your turn, the swallowed creature takes acid damage equal to 1 + your companion's Might. If the swallowed creature escapes the grab, your companion immediately regurgitates the creature, who lands prone in an adjacent unoccupied square. Your companion can also regurgitate as a free maneuver. Your companion can have only one creature swallowed at a time.
            __typeName: ActivatedAbility
            abilityType: none
            actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
            behaviors:
            - __typeName: ActivatedAbilityPowerRollBehavior
              roll: 2d10 + Might
              tiers:
              - 6 + M damage; M < {Weak}, grabbed
              - 10 + M damage; M < {Average}, grabbed
              - 14 + M damage; M < {Strong}, grabbed
