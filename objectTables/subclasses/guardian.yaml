              class:6ebd1424-e99c-4656-a58f-f0e3e2850dee: true
            flavor: What do you have in your mouth? No! Bad boy!
            guid: 06dd65cc-477e-4a1a-a902-07f575de8610
            iconid: ui-icons/skills/1.png
            implementation: 2
            implementationDetails: Swallowed sub-state (shared space, restricted LoE, recurring acid damage, regurgitation on escape) is narrative -- only the grabbed condition is mechanically applied.
