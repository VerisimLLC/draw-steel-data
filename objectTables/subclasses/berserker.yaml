    features:
    - name: Immovable Object
      description: |-
        You add your level to your effective size for the purpose of interacting
        with creatures and objects, including determining whether you can lift
        an object, are affected by forced movement, and so forth. This has no
        effect on whether you can be grabbed.

        Additionally, you have a bonus to stability equal to your Might score
