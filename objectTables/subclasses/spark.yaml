        implementation: 2
        implementationDetails: T3 'can't stand (EoT)' is approximated as prone (EoT) - the engine has no exact 'can't stand' condition. Damage-type choice between fire and lightning is offered via modeList.
        modifiers:
        - name: Burning Lash
          description: A blazing tongue of energy entangles a foe.
          __typeName: CharacterModifier
          activatedAbility:
            name: Burning Lash
            description: "Tier 1 (<=11): 6 + I fire or lightning damage; M < Weak: prone. Tier 2 (12-16): 9 + I fire or lightning damage; M < Average: prone. Tier 3 (17+): 14 + I fire or lightning damage; M < Strong: prone and can't stand (EoT). Spend 1 Ferocity: If within distance of the target, use a free maneuver to wield a second whip, dealing extra fire or lightning damage equal to your Intuition score."
