              - 9 + I fire damage; M < [Average] prone
              - 14 + I fire damage; M < [Strong] prone (EoT)
            - __typeName: ActivatedAbilityPowerRollBehavior
              attrid: inu
              modesSelected:
              - 2
              - 4
              roll: 2d10 + Intuition
              tiers:
              - 6 + I lightning damage; M < [Weak] prone
