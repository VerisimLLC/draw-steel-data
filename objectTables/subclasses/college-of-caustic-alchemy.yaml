      numChoices: 1
      options:
      - name: Sticky Bomb
        description: You attach a small bomb to a creature. If you are hidden from the creature, they don’t notice it. If they notice the bomb, the creature can remove it as an action. At the end of your next turn, the bomb detonates. You can detonate it earlier as no action. When it detonates, make one power roll targeting each enemy within 3 squares of the bomb.
