    - name: Elemental Affinity
      description: |-
        Whenever you use Call Forth to summon one or more non-signature elemental minions, you can summon one bonus signature minion at no cost. You can choose between a signature minion that shares an Element keyword with the minions you summoned (such as Fire,
        Earth, or Air) or an elemental mote.
