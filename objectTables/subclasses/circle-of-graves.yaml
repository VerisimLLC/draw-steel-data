_table: subclasses
__typeName: Class
details: The collective of necromancers that raise undead creatures from the Necropolitan Ruin. The corporeal and incorporeal creatures under your command are hardy and numerous. You can communicate with creatures that have the undead keyword even if you don't share a language.
