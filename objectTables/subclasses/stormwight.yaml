    features:
    - name: Nature’s Knight
      description: You can speak with all animals and elementals regardless of what form you are in. You automatically sense the presence of any animal or elemental within 10 squares of you, even if they are hidden. You are considered to have 1 higher Renown if negotiation with an animal or elemental comes into play. This stacks with the Renown bonus for animals of your type that your animal form gives you.
