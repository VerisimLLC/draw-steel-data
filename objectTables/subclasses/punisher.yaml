      - name: Foe Bowling
        description: Your companion charges, slams into a foe, and shoves them through anything in their way.
        __typeName: CharacterFeature
        canHavePrerequisites: true
        classid: cc89a950-5ff0-4048-bd43-1f2875446034
        domains:
          class:0380181e-acad-4cdb-ae6d-c7cd11df6ad2: true
          class:cc89a950-5ff0-4048-bd43-1f2875446034: true
        guid: bdec98ba-6d5b-4d4d-baba-52c57fe5d6e7
        implementation: 2
        modifiers:
        - name: Foe Bowling
          description: Your companion charges, slams into a foe, and shoves them through anything in their way.
          __typeName: CharacterModifier
          activatedAbility:
            name: Foe Bowling
            description: |-
              Make a power roll against one creature within Melee 1.

              - Tier 1 (<=11): 3 + M damage; push 2; M < Weak the target is prone.
              - Tier 2 (12-16): 5 + M damage; push 3; M < Average the target is prone.
              - Tier 3 (17+): 8 + M damage; push 4; M < Strong the target is prone.

              Effect: If the target is force moved at least 1 square, an enemy adjacent to the target at the end of this forced movement is also targeted by this ability's power roll, but they don't trigger this effect.
            __typeName: ActivatedAbility
            actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
            behaviors:
            - __typeName: ActivatedAbilityPowerRollBehavior
              attrid: mgt
              roll: 2d10 + Might
              tiers:
              - "{3 + Might} damage; push 2; M<[Weak] Prone"
              - "{5 + Might} damage; push 3; M<[Average] Prone"
              - "{8 + Might} damage; push 4; M<[Strong] Prone"
            castImmediately: true
            categorization: Heroic Ability
            display:
              bgcolor: "#ffffffff"
              brightness: 1
              hueshift: 0
              saturation: 1
            domains:
              class:0380181e-acad-4cdb-ae6d-c7cd11df6ad2: true
              class:cc89a950-5ff0-4048-bd43-1f2875446034: true
            flavor: Your companion barrels into the foe and bowls them straight into whoever's standing next to them.
            guid: 7d28ba2d-f899-44d5-bd9e-76ded13f959e
            iconid: ui-icons/skills/1.png
            implementation: 2
            implementationDetails: Cascade-to-adjacent-enemy-at-end-of-push rider is not automated; resolve the secondary target manually.
