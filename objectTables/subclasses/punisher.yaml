      implementationDetails: "Part A (+2 damage to damaging maneuvers) is fully automated for you and the companion. Part B (vertical push): the vertical-push option is offered when you use a standalone push (e.g. Knockback); pushes baked into other abilities (Foe Bowling, Thunderclap, This One is Yours, etc.) are adjudicated manually."
