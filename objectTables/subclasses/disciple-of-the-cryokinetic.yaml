        progression:
        - description: Knockback targets an additional creature. You can change untyped damage to cold damage.
          level: 0
          resources: 2
          tooltip: Whenever you use the Knockback maneuver, you can target one additional creature. Additionally, whenever you deal untyped damage with a psionic ability, you can change it to cold damage instead.
        - description: When you grab a creature or an enemy moves in your Null Field, you gain 1 surge (1/turn).
          level: 0
          resources: 4
          tooltip: The first time on a turn that you grab a creature or an enemy moves 1 or more squares in the area of your Null Field ability, you gain 1 surge.
        - description: You gain an edge on Grab and Knockback.
          level: 0
          resources: 6
          tooltip: You gain an edge on the Grab and Knockback maneuvers.
        - description: When you grab a creature or an enemy moves in your Null Field, you gain 2 surges (1/turn).
          level: 4
          resources: 8
          tooltip: The first time on a turn that you grab a creature or an enemy moves 1 or more squares in the area of your Null Field ability, you gain 2 surges.
        - description: You have a double edge on Grab and Knockback.
          level: 7
          resources: 10
          tooltip: You have a double edge on the Grab and Knockback maneuvers.
        - description: Forced movement +{Intuition}. When you use a heroic ability, gain 10 temporary Stamina.
          level: 10
          resources: 12
          tooltip: Whenever you force move a target, the forced movement distance gains a bonus equal to your Intuition score. Additionally, whenever you use a heroic ability, you gain 10 temporary Stamina.
