  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 2cf13459-5ad9-47de-9c73-fcd73ca366a6
  implementationDetails: In combat, using an ability with an elemental keyword you are not attuned to offers a prompt listing only that ability's unattuned elements, plus a Keep option for your current attunement. Attuning replaces any previous element until the end of the encounter, and the edge then applies automatically to power rolls with that keyword. Declining or keeping leaves the current attunement in place.
