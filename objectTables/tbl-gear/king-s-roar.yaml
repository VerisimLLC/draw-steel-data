        **5th Level:** When you cause the shield to roar, you target one creature or object within 3 squares and push that target up to 4 squares.
        **9th Level:** When you cause the shield to roar, you target one creature or object within 6 squares, you push that target up to 5 squares, and the target is slowed until the end of their next turn.
