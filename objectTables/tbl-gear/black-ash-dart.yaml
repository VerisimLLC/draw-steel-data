name: Black Ash Dart
description: |-
  As a maneuver, you make a ranged free strike using a black ash dart. The strike deals an extra 1 damage and adds the following effects to the tier outcomes of the power roll:

  Tier 1: You can teleport the target up to 2 squares.
  Tier 2: You can teleport the target up to 4 squares.
  Tier 3: You can teleport the target up to 6 squares.
