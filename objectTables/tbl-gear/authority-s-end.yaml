level5: The weapon’s damage bonus increases to +2. Additionally, you and each ally within 2 squares of you gains a +1 bonus to saving throws.
level9: The weapon’s damage bonus increases to +3. Additionally, you no longer need to use a maneuver to end one effect when you damage a creature with the weapon. The weapon also refuses to vie for control of your psyche, and no longer counts against the limit of leveled treasures you can carry safely.
