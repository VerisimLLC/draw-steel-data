- name: Lightning Treads Momentum
  description: At 5th level, each square you moved this turn adds 1 extra lightning damage, capped so the treads' total extra damage does not exceed 4 (6 at 9th level).
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 997db852-ba34-43f2-a74e-5a3f3b44b8d4
  implementation: 4
  itemAttached: true
  modifiers:
  # The base treads bonus is already 2 at 5th level and 3 at 9th, so this ramp is capped at
  # 2 / 3 to land on the printed maximums of 4 and 6.
  - name: Lightning Treads Momentum
    description: Each square you moved this turn adds 1 extra lightning damage, up to the treads' maximum.
    __typeName: CharacterModifier
    activationCondition: "1"
    behavior: power
    damageModifier:
      id: table
      __typeName: GoblinScriptTable
      editableField: true
      entries:
      - script: "0"
        threshold: 1
      - script: MovedThisTurn when MovedThisTurn <= 2 else 2
        threshold: 5
      - script: MovedThisTurn when MovedThisTurn <= 3 else 3
        threshold: 9
      field: Level
    damageModifierType: lightning
    displayCondition: Level >= 5
    filterCondition: Level >= 5
