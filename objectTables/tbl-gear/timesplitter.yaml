name: Timesplitter
description: |-
  As a maneuver, you make a ranged free strike using the Timesplitter, which shatters upon impact. The strike deals an extra 1d6 psychic damage and adds the following effects to the tier outcomes of the power roll:
  Tier 1: The target and each creature within 3 squares of them is slowed (save ends).Tier 2: The target and each creature within 5 squares of them is slowed (save ends).
  Tier 3: The target and each creature within 8 squares of them is slowed (save ends).
