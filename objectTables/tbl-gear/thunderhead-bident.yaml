- name: Thunderhead Bident Forced Movement
  description: When used with an ability that pushes a target, the push gains +1 distance. When used with a damage-dealing ability that does not impose forced movement, you can push the target 1 square.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: aefd4b37-8569-4ee5-9c73-e543a3f0cb7a
  implementation: 3
  implementationDetails: Both halves are applied to the power roll automatically; the added push is offered on every qualifying strike rather than left as an option to decline.
  itemAttached: true
  modifiers:
  - name: Thunderhead Bident Push Bonus
    description: A weapon ability that pushes gains a bonus to the forced movement distance.
    __typeName: CharacterModifier
    activationCondition: true
    adjustments:
    - type: push
      value: 2 when Level >= 5 else 1
    behavior: power
    displayCondition: Ability.hasforcedmovement
    guid: 308b73eb-7a63-4c7f-b91d-03b839bb42b3
