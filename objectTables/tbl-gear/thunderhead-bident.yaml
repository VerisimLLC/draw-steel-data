  source: Item
- name: Thunderhead Bident Hurled Power
  description: A ranged strike with this weapon deals an extra 1 sonic damage for every 2 squares it travels to the target, rising to 1 per square at 9th level.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 42c2f92e-51fd-4fa2-ab0a-28fa08185633
  implementation: 4
  implementationDetails: Scoped to Ranged Weapon Strike abilities, matching the printed "ranged strike". Distance is measured from you to each target when the roll resolves, so a multi-target strike scales per target.
  itemAttached: true
  modifiers:
  - name: Thunderhead Bident Hurled Power
    description: Extra sonic damage scaled by how far the weapon was hurled.
    __typeName: CharacterModifier
    activationCondition: true
    adjustments: []
    behavior: power
    damageModifier: Distance(Target) when Level >= 9 else floor(Distance(Target) / 2)
    damageModifierType: sonic
