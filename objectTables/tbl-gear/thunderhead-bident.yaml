      Weapon: true
    modtype: none
    rollType: ability_power_roll
    source: Item
    sourceguid: aefd4b37-8569-4ee5-9c73-e543a3f0cb7a
  - name: Thunderhead Bident Push
    description: A damage-dealing weapon ability that does not already impose forced movement pushes the target.
    __typeName: CharacterModifier
    activationCondition: true
    addText: push {2 when Level >= 5 else 1}
    adjustments: []
    behavior: power
    displayCondition: Ability.doesdamage and not Ability.hasforcedmovement
    guid: 48a989d9-bab3-431b-a3f4-4d12748b2a22
