- name: Lance of the Sundered Star Skyward Step
  description: When a weapon ability using this weapon pushes a target, you can shift after the push to end up beside them.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 859ac2b1-7289-4085-a234-ac71f39d8ee3
  implementation: 3
  itemAttached: true
  modifiers:
  # The book grants a shift to any square adjacent to the pushed target; the closest the
  # rules engine expresses is a shift capped at the wielder's own movement speed, which is
  # enough to close a push of that distance. Opt-in, because the book says "you can".
  - name: Lance of the Sundered Star Skyward Step
    description: Shift up to your speed after the push, letting you end up adjacent to the target.
    __typeName: CharacterModifier
    activationCondition: false
    addText: you shift {MovementSpeed}
    behavior: power
    displayCondition: Ability.HasForcedMovement
    guid: 3c5070ee-d495-47ea-88b9-902a04a856f0
    keywords:
      Melee: true
      Weapon: true
    modtype: none
    rollType: ability_power_roll
    source: Item
    sourceguid: 859ac2b1-7289-4085-a234-ac71f39d8ee3
  source: Item
- name: Lance of the Sundered Star Vertical Force
  description: At 9th level, a push or slide from a weapon ability using this weapon can be vertical.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 5a74d84e-e1dd-42c8-9d24-8c42e99cdd90
  implementation: 4
  itemAttached: true
  modifiers:
  # Two modifiers because replacePattern is a single literal: one rewrites "push" in the
  # tier text to "vertical push", the other does the same for "slide".
  - name: Lance of the Sundered Star Vertical Force
    description: Make the push vertical.
    __typeName: CharacterModifier
