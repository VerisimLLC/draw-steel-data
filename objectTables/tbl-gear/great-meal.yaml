name: Great Meal
description: A serving of a meal prepared with fish caught while fishing. The eater increases their Recoveries by 1 until the end of their next respite, and gains 10 temporary Stamina that lasts until the end of their next respite if it isn't lost first. A creature can benefit from only one serving of this meal or another like it, such as from the Perfect New Recipe project, at a time.
