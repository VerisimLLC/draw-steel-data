  description: Only a beastheart can wield or carry this shield. You gain a +3 bonus to Stamina and the painting on the shield changes to resemble your companion. Additionally, your companion can see as if they were in your space as well as their own, and whenever your companion uses an ability, they can do so as if they were in either your space or their own.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: d2c0d815-8cfd-4a40-bfa6-afd9623c2f43
  implementation: 2
  implementationDetails: "Bronze: the Stamina bonus is fully automated and scales to +6 at 5th and +9 at 9th. The two origin-sharing clauses are not automated - the engine gives a creature a single vision origin and a single ability origin, so the companion seeing and acting from your space as well as their own must be adjudicated at the table. Restricting the wielder to a beastheart is left to the director."
