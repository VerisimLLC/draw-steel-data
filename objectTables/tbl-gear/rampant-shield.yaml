  implementation: 1
  implementationDetails: The Stamina increase is carried by the 1st Level scaling table. The shield making opportunity attacks in its own right is not automated - an item cannot be an attack origin in the engine, and there is no creature to hang the opportunity attack on. Adjudicate at the table.
