- name: 5th Level
  description: The shield's bonus to Stamina increases to +6. Additionally, your companion can use 2 squares of movement to teleport from their current location and leap out of the shield, landing in a space adjacent to you.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: a983164a-deae-4aa1-8626-ab121c925a9f
  implementation: 2
  implementationDetails: "Bronze: the Stamina increase is carried by the 1st Level scaling table. The leap is offered to the companion as a no-action ability that teleports them adjacent to you. The 2 squares of movement are NOT deducted - the engine has no mechanism to spend part of a creature's movement - so the player must subtract them manually."
