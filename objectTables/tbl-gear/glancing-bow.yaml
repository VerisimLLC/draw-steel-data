name: Glancing Bow
description: Only a beastheart can wield this bow. Any weapon ability that deals rolled damage using this weapon deals an extra 1 damage. Additionally, you can target your companion with a ranged weapon strike using this bow, making a glancing shot. The companion can use a free triggered action to redirect the strike to another target as if the companion were the source of the ability, using the ability's original distance. You can't make more than one glancing shot as part of the same ability.
