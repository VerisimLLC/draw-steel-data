  modifiers:
  # Charging Speed is the attribute the Charge action uses for its range, so a flat
  # +5 here only ever shows up on a charge.
  - name: Hellcharger Helm
    description: Whenever you use the Charge main action, you gain a +5 bonus to speed until the end of your current turn.
