    description: Use a maneuver to choose a creature in your line of effect and learn their level. If their level is higher than yours the torque grants you envy; if it is equal to or lower than yours it grants you disdain.
    __typeName: CharacterModifier
    activatedAbility:
      name: Thief of Joy
      description: Choose a creature in your line of effect and learn their level. The torque grants you envy if they are a higher level than you, or disdain if they are your level or lower.
      implementationDetails: Fully automated. Pick a creature and the torque compares their level to yours by itself, then puts envy or disdain on you - you do not choose which. At 5th level, when the creature is exactly your level, the torque always gives you disdain; ask your Director if you want envy instead.
      __typeName: ActivatedAbility
      abilityType: none
      actionResourceId: a513b9a6-f311-4b0f-88b8-4e9c7bf92d0b
      attributeOverride: no_attribute
      behaviors:
      # The torque branches on its own. Both behaviors land on the wearer, so the
      # gate cannot read the target directly - applyto is resolved before filterTarget
      # runs, which leaves Target bound to the caster. Cast.FirstTarget is the chosen
      # creature, and bare Level is the wearer's.
      - __typeName: ActivatedAbilityApplyOngoingEffectBehavior
        applyto: caster
        duration: eoe
        filterTarget: Cast.FirstTarget.Level > Level
        ongoingEffect: 4d1a7f92-3c86-4e05-9b73-8a2f610d54c7
        ongoingEffectCustom: false
        ongoingEffectSource: specific
      - __typeName: ActivatedAbilityApplyOngoingEffectBehavior
        applyto: caster
        duration: eoe
        filterTarget: Cast.FirstTarget.Level <= Level
        ongoingEffect: b8e35c07-9d42-4a16-8f5b-2c7196e0ab34
