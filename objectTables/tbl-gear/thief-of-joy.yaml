- name: Thief of Joy Stamina Increase
  description: |-
    While you wear this torque, you gain a bonus to Stamina equal to twice your highest characteristic score.

    5th Level: The torque’s bonus to Stamina increases to three times your highest characteristic score.

    9th Level: The torque’s bonus to Stamina increases to five times your highest characteristic score. 

    5*Strong when Level >= 9 else 3*Strong when Level >= 5 else 2*Strong is added to your Stamina
