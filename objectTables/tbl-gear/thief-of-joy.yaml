- name: Envy's Due
  description: Deal damage equal to the triggering damage to a creature adjacent to you.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: 4b0a7d16-52ce-4f8b-9a37-6d1c8e30f245
  implementation: 4
  itemAttached: true
  modifiers:
  - name: Envy's Due
    description: Deal damage equal to the triggering damage to a creature adjacent to you.
    __typeName: CharacterModifier
    behavior: activated
    guid: 9f2c6b40-1d85-4e73-bc09-3a5f78e1d602
    source: Item
    sourceguid: 4b0a7d16-52ce-4f8b-9a37-6d1c8e30f245
    # The delivery half of the envy reaction. It has to live on the ITEM, not on the
    # Envy effect: the trigger removes Envy before it invokes this by name, so an
    # ability carried by the effect would be gone by the time the invoke ran.
    activatedAbility:
      name: Envy's Due
      description: One creature adjacent to you takes damage equal to the damage that triggered your envy.
      implementationDetails: Fully automated. Taking the envy triggered action in the attacker's roll dialog banks the damage and then prompts you to pick the adjacent creature that takes it. This button is the fallback for a prompt you cancelled or missed - it costs no action and only lights up while envy damage is still banked. The redirected damage is untyped rather than matching the type of the damage that triggered it.
      __typeName: ActivatedAbility
      abilityType: none
      actionResourceId: none
      attributeOverride: no_attribute
      categorization: Trigger
      targeting: direct
      targetType: target
      numTargets: "1"
      range: "1"
      repeatTargets: false
      objectTarget: false
      selfTarget: false
      rangeTextOverride: Melee 1
      targetTextOverride: One creature adjacent to you
      keywords:
        Psionic: true
      iconid: 6d808f51-23bc-4fbe-b786-ae33e8cc48db
      display:
        bgcolor: "#ffffffff"
        brightness: 1
        hueshift: 0
        saturation: 1
      domains: []
      guid: 6c81f394-0a27-4d5e-b8f1-27e409cb5a83
      implementation: 4
      modifiers: []
      persistence: []
      strain: []
      abilityFilters:
      - reason: Your envy has not banked any damage to deal.
        formula: ConditionStacks("Envy Payload") > 0
      behaviors:
      - __typeName: ActivatedAbilityDamageBehavior
        applyto: targets
        roll: Caster.ConditionStacks("Envy Payload")
        # Untyped: the banked amount crosses over as a stack count, which carries a
        # number and nothing else, so the triggering damage's type cannot follow it.
        damageType: untyped
        separateRolls: true
        titleText: Envy's Due
        chatMessage: The torque repays the envy it took.
      - __typeName: ActivatedAbilityPurgeEffectsBehavior
        applyto: caster
        mode: effect
        ongoingEffect: ac93f501-7e62-4d18-b035-8c1746fa20e9
        purgeType: all
  source: Item
