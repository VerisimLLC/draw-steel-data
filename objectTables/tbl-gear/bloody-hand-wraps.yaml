name: Bloody Hand Wraps
description: While you wear these hand wraps, any weapon ability that deals rolled damage using your unarmed strikes gains a +1 damage bonus. Additionally, once per turn, you can take 5 damage that can’t be reduced in any way to use the Grab maneuver (no action required).
