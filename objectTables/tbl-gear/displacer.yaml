    activatedAbility:
      name: Displacer Trade Places
      description: |-
        **1st Level:** After you deal rolled damage to a creature, trade places with it, provided you both fit into each other's spaces.
        **5th Level:** You can instead trade places with any creature within 4 squares of the one you damaged (range 5).
        **9th Level:** You can instead trade places with any creature within 8 squares of the one you damaged (range 9).
