name: Ruby Ring of Recall
description: While wearing this ring, you can pull a willing, unconscious, or dead creature within 2 squares into the ring's ruby as a maneuver. If the creature inside the ring is conscious, they can see and hear the ring's surroundings. Either you or the creature inside the ring can use a maneuver to recall the creature from the ring, causing the creature to appear in an unoccupied space within 2 squares. A creature inside the ring can't act except to exit the ring.
