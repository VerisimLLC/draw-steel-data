- name: Unimpeded Charge
  description: When you or your companion uses the Charge main action, the movement doesn't provoke opportunity attacks.
  __typeName: CharacterFeature
  addText: Add Magical Property
  guid: f823fc83-c99f-4fd5-8906-d3494e4a2c5b
  implementation: 1
  implementationDetails: Not automated; opportunity-attack immunity cannot be scoped to the Charge movement, and granting it outright would cover all movement.
