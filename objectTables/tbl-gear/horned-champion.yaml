  addText: Add Magical Property
  guid: d587a022-25bf-42f1-a2ab-000e8f04c090
  implementation: 3
  implementationDetails: Offered as three opt-in triggers on a tier 3 charge outcome, each prompting for the creature you attacked. Push covers both the flat 2 squares and lengthening a charge push. Choosing only one is not enforced. The engine exposes no reliable was-this-a-charge signal, so the options offer on any tier 3 hit with a Melee and Weapon ability.
