id: b257401e-4d61-56ff-b135-75857ba10959
name: Strategy
description: Call for a test that uses the Strategy skill only if the result impacts the course of the story or can have significant consequences for the hero and their allies. The players can have their heroes engage in tactical thinking during combat without the need to make a test. The Strategy skill is for those tests where a hero might have more expertise in the matter than a player, and is recalling lore about historical strategies that could aid the hero in their adventures.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 1c837bdc-17cc-4c7a-9814-f2f8b92cf55a
