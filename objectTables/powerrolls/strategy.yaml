tables:
- name: "Easy: Plan an Ambush"
  description: A hero surveys a wide landscape and attempts to determine the best possible location to ambush an approaching enemy.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero determines the best location for the ambush, but the enemy arrives sooner than expected. The hero and their allies get to go first in the combat encounter, but their enemies are not surprised."
  - "(Success): The hero determines the best location for the ambush and catches their enemies surprised."
  - "(Success with Reward): As 12-16, and the hero has a double edge on ability rolls that target surprised enemies during this combat encounter."
- name: "Medium: Anticipate an Army's Plans"
  description: A hero attempts to anticipate where an invading army will strike next based on the force and the general's previous conquests.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero is unsure of what move the army will make next."
  - "(Success with Consequence): The hero correctly predicts which settlement or military site the army will seize next. However, the siege is already underway, giving the hero little time to prepare for the fight. The Director gains 2 additional Malice at the start of each combat encounter in this settlement with the army's force."
  - "(Success): The hero correctly predicts which settlement or military site the army will seize next."
  - "(Success with Reward): As 17+, and the hero is able to act quickly. Any test they make to prepare defenses or reach the settlement before the army does gains an edge."
- name: "Hard: Allocate Troops and Resources"
  description: In preparation for a large-scale battle on multiple fronts, a hero attempts to determine the best troop movements and where to send specific resources to best suit the anticipated fights.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero makes a critical mistake, leading their troops to become mired in a swamp and delayed. With the hero's army spread thin, the Director gains 3 additional Malice at the start of each combat encounter related to the battle."
  - "(Failure): The hero can't see a clear best strategy and must make a decision based on their gut. They gain no advantage during combat encounters related to the battle."
  - "(Success): The hero places their troops and resources in advantageous positions. Each hero gains 1 additional Heroic Resource at the start of each combat encounter related to the battle."
  - "(Success with Reward): As 17+, except the heroes gain 2 additional Heroic Resources at the start of each combat encounter related to the battle instead of 1 additional Heroic Resource."
