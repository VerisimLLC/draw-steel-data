id: 850d8c56-bf48-5828-b8f3-852c1321776c
name: Sabotage
description: Given a lot of time and no risk, a hero doesn't need to make a test to disable a mill's waterwheel. Call for a test that uses the Sabotage skill when a hero engages in skullduggery or spycraft and there's a risk of failure. A hero may seek to damage or destroy something important to an enemy, disable a mechanical trap, or improvise a way to harm foes.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: cab282ce-2063-4ce3-b94c-209e81b22e0b
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Disable a Crossbow Trap"
  description: A hero attempts to disable or bypass a crossbow and tripwire trap set by bandits to guard their lair.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero disables the trap but unwittingly leaves a sign of their passage. A bandit returns to the lair a minute later and takes notice, alerting the place."
  - "(Success): The hero disables the trap without incident."
  - "(Success with Reward): As 12-16, and the hero can alter the trigger slightly, so it fires on any bandit approaching the trap."
- name: "Medium: Identify the Support Beam"
  description: A hero attempts to remove a single support beam to send barrels rolling down onto the bandits below.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero identifies the wrong support beam."
  - "(Success with Consequence): The hero finds the right beam, but the beam also drops a barrel on them or an ally (your choice). Each target is knocked prone."
  - "(Success): The hero identifies the critical support beam and removes it, sending barrels rolling down onto the bandits, knocking them prone."
  - "(Success with Reward): As 17+, and each target takes 2d6 damage."
- name: "Hard: Construct a Back Door"
  description: A hero constructs a second concealed entrance into a room, vehicle, or other location to ambush or eavesdrop on their foes.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The back door appears to be well-constructed but is noticed at an inopportune moment, such as right before the hero would launch an ambush or hear vital information."
  - "(Failure): The hero fails to construct the back door."
  - "(Success): The hero constructs a concealed door, which can be used for the intended purpose."
  - "(Success with Reward): As 17+, and the hero constructs the door so well they gain an edge on a test associated with the door's intended purpose."
- name: "Hard: Deactivate a Disintegration Beam"
  description: A hero tries to determine which lever to pull to deactivate a master trapsmith's disintegration beam trap.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails and pulls the wrong lever. The next time the trap activates, it fires twice!"
  - "(Failure): The hero fails to determine which lever to pull."
  - "(Success): The hero pulls the correct lever, deactivating the trap."
  - "(Success with Reward): As 17+, except before deactivating the trap, the hero can fire it at one creature or object of their choice."
