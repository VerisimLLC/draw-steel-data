id: d1e582ff-089c-5742-9e0d-3151e372c3a0
name: Empathize
description: Tests that use the Empathize skill are all about rapport, not reasoning. The only requirement is that the concerned parties must share something meaningful that binds them together as equals, across ancestry, culture, religion--even across opposed objectives.
_table: powerRolls
__typeName: PowerRollTableGroup
