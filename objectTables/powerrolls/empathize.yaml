tables:
- name: "Easy: Offer a Bribe"
  description: Working stiff to working stiff, a hero attempts to bribe a housekeeper to reveal which room at the inn the villain rents.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The housekeeper demands double payment for the information. If the hero can't or won't pay, the housekeeper takes the initial offer but quietly sends a \"friend\" to steal an important item from the hero. They'll make up the difference one way or another."
  - "(Success): The housekeeper accepts the bribe and divulges the correct information. For the greater good, of course."
  - "(Success with Reward): As 12-16, and as a gesture of solidarity, the housekeeper tells the hero where the innkeeper stores the spare keys to the rooms, trusting that the hero will use only the one they need."
- name: "Medium: Sway a Bounty Hunter"
  description: Appealing to their wounded honor, a hero attempts to convince a dragon knight turned bounty hunter to set their quarry free.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The dragon knight refuses the request. Honor is dead, and even the noble of heart must eat."
  - "(Success with Consequence): The dragon knight releases their quarry, but only if the hero pays them the bounty first. The honorable road is no longer theirs to travel, but they recognize those still on it."
  - "(Success): The dragon knight releases their quarry. Perhaps there is a better way after all."
  - "(Success with Reward): As 17+, and the dragon vows to help throw other bounty hunters off the trail. No other bounty hunters come looking for the quarry until the heroes finish at least three respites."
- name: "Hard: Console a Revenant"
  description: A hero pleads with the revenant of their deceased lover to finally forsake vengeance and rest.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The revenant regards the request as a terrible betrayal and places a vengeance mark on the hero, which doesn't count toward the revenant's maximum number of vengeance marks (see Revenant Traits in Chapter 3 in Draw Steel: Heroes). The revenant uses the sigil to keep tabs on the hero's whereabouts at all times. If the hero or their allies attack the revenant, the revenant doesn't hesitate to detonate the sigil."
  - "(Failure): The revenant refuses, clinging to their rage and pain. The hero can attempt this test again, but the revenant has little patience left for meddling. A subsequent failure is treated as a failure with a consequence."
  - "(Success): The revenant releases the bitterness that tied them to undeath, and passes on to the afterlife."
  - "(Success with Reward): As 17+, except first the revenant gifts the hero a token of affection, such as a Breath of Dawn or other 2nd-echelon or lower consumable of your choice (see Chapter 13 in Draw Steel: Heroes). A project source for a downtime project of the hero's choice is also appropriate. The dead hold many secrets."
