id: 96849c96-cb1d-5cd8-8df4-d07e9f609357
name: Handle Animals
description: A hero doesn't need to make a test to get a trained dog to sit while no danger or distractions are present. Call for a test that uses the Handle Animals skill whenever a hero attempts to get a non-sapient animal to behave contrary to their natural tendencies or training.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Bypass a Guard Animal"
  description: A hero attempts to convince a trained attack dog or other wild animal to ignore the hero and let them pass through their territory.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The guard animal appears to let the hero pass, but not before a single warning nip. The hero loses 1d6 Stamina before placating the animal."
  - "(Success): The guard animal allows the hero to pass through their territory without incident."
  - "(Success with Reward): As 12-16, and the animal remembers the hero as a friendly face. The hero never needs to make another test to placate this animal unless they or their allies harm the animal."
- name: "Medium: Calm a Runaway Horse"
  description: A scared horse flees recklessly while dragging a rider or carriage with it. A hero attempts to get the horse to relax and come to a stop.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero can't calm the horse."
  - "(Success with Consequence): The hero calms the horse, but not before the horse gives them a good kick in the ribs. The hero takes 2d6 damage."
  - "(Success): The hero calms the horse and is unharmed."
  - "(Success with Reward): As 17+, and the hero earns an extra special thank you from the people dragged by the horse ... the hero can keep the horse as a mount!"
- name: "Medium: Perform a Task"
  description: A hero attempts to have a tiger or other wild predator perform a single task, such as changing their target, retrieving an item, running away, or following the hero to a nearby location.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to convince the predator, and the predator makes a free strike against the hero."
  - "(Success with Consequence): The predator achieves the task for the hero, but they get their hairs raised. If the hero attempts to get them to perform another task, the predator makes a free strike against the hero."
  - "(Success): The predator performs the task for the hero without lashing out at them."
  - "(Success with Reward): As 17+, and the hero can convince the predator to perform another task without needing to make another test."
- name: "Hard: Gain a Mount"
  description: A hero attempts to break a wild horse or other creature so that the animal accepts the hero as a mount.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to gain the creature as a mount, and the creature makes a free strike against the hero."
  - "(Failure): The hero fails to gain the creature as a mount."
  - "(Success): The hero gains the creature as a mount until the hero takes a respite. The hero can continue to attempt to tame the creature, and after a total of three tier 3 results on this test in a row, the creature permanently accepts the hero as a rider."
  - "(Success with Reward): The creature permanently accepts the hero as a rider."
