id: 253f92b2-f18f-523a-8f28-8345dde4ece3
name: Endurance
description: A simple day's march over easy terrain requires no test to endure. Tests that use the Endurance skill are best utilized when a hero faces grueling travel conditions or prolonged exertion under dangerous circumstances, such as crossing a scorching desert before supplies run out.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: a1a8f269-3223-476c-bae6-2f8904680e7f
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Traverse a Toxic Bog"
  description: A hero attempts to traverse a poisonous bog filled with choking, toxic fumes.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero traverses the bog, but they become queasy from the stench and are weakened until they gain at least 1 Victory."
  - "(Success): The hero traverses the bog without incident."
  - "(Success with Reward): The hero traverses the bog so well that they're able to carry an ally over the muck. The ally doesn't need to make this test."
- name: "Medium: Absorb Lighting"
  description: A hero attempts to absorb the shock of a magic lightning trap, allowing their allies to pass unharmed.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to absorb enough of the lightning. The hero and each of their allies take 3d6 lightning damage."
  - "(Success with Consequence): The hero's allies can pass unharmed, but the hero takes 3d6 lightning damage."
  - "(Success): The hero's allies can pass unharmed, and the hero takes 1d6 lightning damage."
  - "(Success with Reward): As 17+, except the hero weathers the lightning shocks like a champ and takes no damage from the trap."
- name: "Medium: Survive Without Food"
  description: A hero must survive weeks on a deserted island without food.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero begins to starve. Their maximum number of Recoveries is halved, and they are weakened. Both of these effects last until the hero eats a full meal during a respite."
  - "(Success with Consequence): The hero is able to maintain some of their strength. Their maximum number of Recoveries is reduced by 2 until they eat a full meal during a respite."
  - "(Success): The hero is unaffected by the lack of food."
  - "(Success with Reward): As 17+, and the hero has the strength to forage in the sea, where they discover a garden of edible seaweed."
- name: "Hard: Be a Human Bridge"
  description: A hero holds both ends of a broken chain to allow their allies to climb up over their body from one end of chain to another.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero collapses under the terrible strain. They and any allies on the chain fall."
  - "(Failure): The hero loses their grip, causing the chain to slip from their grasp. Their allies fall."
  - "(Success): The hero holds both ends of the broken chain successfully, allowing their allies to safely cross to the other side."
  - "(Success with Reward): The hero uses their impressive physique to hold both ends of the chain to successfully allow their allies to cross. A passing villager sees this feat of strength and spreads word to the nearby areas of a hero who is part god and deserving of tribute."
