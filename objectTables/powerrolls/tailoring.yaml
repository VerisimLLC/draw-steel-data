id: deb2f9da-6bbf-5778-b3c2-eedbb778e5bc
name: Tailoring
description: Like with other crafting skills, you should call for a test that uses the Tailoring skill only when a hero is under time pressure or faces failure consequences while working with cloth. A hero sewing shirts or repairing garments that have no narrative importance doesn't require a test. The making of supernatural clothes typically happens as part of a downtime project and not a typical test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Fix a Torn Uniform"
  description: A hero has stolen a uniform to use as part of a disguise, but it's been damaged in the scuffle in which it was earned. The hero attempts to quickly repair a rip in the jacket before enemies approach, and the stitches must be delicate enough to not be noticeable at a glance.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero is successful but uses up their best thread in the process, leaving none for any additional repairs to other uniforms."
  - "(Success): The hero repairs the uniform before enemies arrive."
  - "(Success with Reward): The hero repairs the uniform and any other damaged clothing items they acquired before enemies arrive."
- name: "Medium: Sew a Hidden Hem"
  description: A hero attempts to sew stolen jewelry into the hem of their clothing to get it past the guards.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hem and jewels are lumpy and obvious. This will never do!"
  - "(Success with Consequence): The hero sews the jewels into the hem, but pricks their finger and bleeds on the fabric. They'll have to answer questions about that!"
  - "(Success): The hero sews the jewels into the hem perfectly."
  - "(Success with Reward): As 17+, and the hero adds an additional hidden pocket to the garment, allowing them to steal another item on the way out and conceal it without needing to make another test."
- name: "Hard: Repair a Crashing Airship"
  description: A hero attempts to repair an airship's torn sail as the vessel plummets toward the ground.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero attempts to repair the sail but slips, tearing the sail completely free from the mast. The sail is caught in the wind and is lost."
  - "(Failure): The sail whips in the wind, confounding the hero, who fails to repair the sail. The hero can try again, but if they get this result again, treat it as a tier 1 result."
  - "(Success): The hero repairs the sail, allowing the airship to right itself and avoid a catastrophic crash."
  - "(Success with Reward): As 17+, and the hero's repairs are so sturdy that the vessel's speed is increased by 25 percent for the next 24 hours."
