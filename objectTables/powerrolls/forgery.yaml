id: b6ed7c3e-6ca8-561c-ba3f-148f9cbf1952
name: Forgery
description: The Forgery skill is used with tests a hero makes to replicate writing with enough talent that they pass as the original artifact. Copying a simple note with no time constraints and a low level of scrutiny requires no test to complete.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Counterfeit a Night's Watch Pass"
  description: A hero attempts to make a counterfeit night's watch pass to move through a locked-down city with ease.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero crafts a counterfeit night's watch pass, but the pass can be used only for minor access and infractions and doesn't hold up to a prolonged scrutiny of someone handling the pass."
  - "(Success): The hero crafts a counterfeit night's watch pass that stands up to strong scrutiny."
  - "(Success with Reward): As 12-16, and the hero is able to replicate a special signature, which allows them a guarded escort upon request."
- name: "Medium: Forge a Judge's Signature"
  description: A hero attempts to forge a judge's signature on a legal document to get law enforcement to free a prisoner or arrest someone.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to forge a convincing signature."
  - "(Success with Consequence): The hero forges the signature, but after the action is taken, the authorities immediately begin hunting the hero."
  - "(Success): The hero forges the signature and has at least 24 hours before the forgery is traced back to them."
  - "(Success with Reward): The hero forges the signature, and it can't be traced back to them."
- name: "Medium: Copy a Noble's Seal"
  description: A hero attempts to recreate a noble's seal to make it look like a letter comes from the noble.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to craft a convincing noble's seal."
  - "(Success with Consequence): The hero copies the noble's seal, but uses a slightly wrong color of wax. They need to find some way to explain the discrepancy or risk being exposed."
  - "(Success): The hero crafts a convincing copy of the seal."
  - "(Success with Reward): As 17+, and the hero can craft another copy of the seal any time without needing to make another test."
- name: "Hard: Counterfeit Religious Scripture"
  description: A hero attempts to create an authentic copy of a temple's most holy scripture.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The copy doesn't seem authentic, and the hero is plagued with religiously themed nightmares the next time they attempt to take a respite. The hero regains 1 fewer Recoveries than they would normally at the end of the respite."
  - "(Failure): The copy doesn't seem authentic."
  - "(Success): The hero creates an authentic copy of the holy scripture."
  - "(Success with Reward): As 17+, and the copy is so authentic that if it is compared to the original, an expert would think the original was the counterfeit."
