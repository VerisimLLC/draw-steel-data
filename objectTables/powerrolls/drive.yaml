id: 952b9d15-f0f5-58cc-9760-98e941ee5a41
name: Drive
description: The best opportunities to call for a test that uses the Drive skill are when a hero attempts to pilot a vehicle that is either unfamiliar, under pursuit, or traveling through rough terrain that could damage it. Piloting a carriage down a road or a boat on calm waters requires no roll.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Keep the Wagon Rolling"
  description: A hero attempts to steer a horse-drawn carriage through muddy or rough terrain without losing a wheel or getting mired in the muck.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero successfully finds the path with the least mud and rocks, and the carriage makes it through unscathed. But the ride is bumpy, and passengers lose 1 Recovery."
  - "(Success): The hero makes the journey without damaging the carriage."
  - "(Success with Reward): The hero and the road are one. They make the journey without a scratch on the carriage. Brimming with confidence, the hero has a double edge on their next power roll."
- name: "Medium: Lose a Pursuer in a Cart Chase"
  description: A hero attempts to out-drive and lose a pursuing vehicle in the middle of a crowded city.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to lose the pursuers and ends up on a dead-end street, with little choice but to engage their pursuers."
  - "(Success with Consequence): The hero loses their pursuers for now and makes it to their destination, but the rough driving damages the vehicle. If they want to use it again, it'll need repairs."
  - "(Success): The hero loses their pursuers for at least 1d10 days."
  - "(Success with Reward): The hero leaves the pursuers in the dust, and the attempt leaves at least one of their pursuers so frustrated that they give up the chase for good."
- name: "Hard: Fly a Ship"
  description: A hero attempts to master the controls of an unfamiliar timescape ship before it's boarded by hostiles.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to start up the ship and activates a psionic trap that deals 2d10 psychic damage to each creature aboard."
  - "(Failure): The hero fails to start up the ship before hostiles arrive."
  - "(Success): The hero starts up the ship before the hostiles can board."
  - "(Success with Reward): As 17+, and the propulsion system blasts the approaching hostiles, preventing pursuit."
- name: "Hard: Avoid Lightning While Sailing"
  description: A hero attempts to pilot a ship through a vicious lightning storm without getting struck.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): Multiple bolts strike the deck and the hero, dealing 1d10 lightning damage to them and 3d10 damage to the vessel."
  - "(Failure): Lighting strikes the ship, dealing 2d10 lightning damage to it."
  - "(Success): The hero avoids the lightning."
  - "(Success with Reward): As 17+, and the hero catches a fierce tailwind in the direction of their destination, getting them there twice as fast."
