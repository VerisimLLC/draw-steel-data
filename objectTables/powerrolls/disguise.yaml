id: e38e8d18-599b-5a29-82f7-13c545d241c5
name: Disguise
description: Call for a test that uses the Disguise skill only in risky situations where the hero is under scrutiny. For example, a hero disguising themself to sit in a tavern and drink doesn't require a test unless the hero is wearing the disguise to hide from the bounty hunters searching the same tavern.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: b0bf2f97-6776-4a9e-b691-4845275df2f8
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Impersonate a VIP"
  description: A hero attempts to impersonate a minor celebrity to get into an exclusive party.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero gains access to the event but attracts a gaggle of groupies who follow their every move. While followed by the groupies, the hero can't hide or sneak."
  - "(Success): The hero gains access to the event without incident."
  - "(Success with Reward): As 12-16, and once during the event, the hero can leverage their false identity for a favor from someone without having to make another test."
- name: "Medium: Impersonate a Thief"
  description: A hero attempts to impersonate a new member of a thieves' guild to get into their hideout.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to convince the guards they belong to the guild. They can try again when the shift changes, but if they get this result a second time, the guards attack."
  - "(Success with Consequence): The hero gains access, but they have to leave their allies and weapons at the door."
  - "(Success): The hero gains access to the hideout and can keep their gear."
  - "(Success with Reward): As 17+, and the hero learns information from the guard about the mood of the guild's leader."
- name: "Medium: Play Undead"
  description: A hero attempts to look like a zombie so they can infiltrate a necromancer's tower.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to blend in with the other undead and the necromancer catches them at the gates of the tower."
  - "(Success with Consequence): The hero gains access, but the necromancer's apprentice immediately assigns them the task of cleaning the floors. The apprentice comes back to check on them every few minutes."
  - "(Success): The hero gains access to the tower without being noticed."
  - "(Success with Reward): As 17+, and the hero is told by the necromancer's apprentice to go clean a secure chamber that has exactly what the hero came for. The apprentice gives the hero access to the chamber."
- name: "Hard: Impersonate a Diplomat"
  description: A hero attempts to impersonate a diplomat to gain access to a secure office inside a monarch's castle.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero is detained by the guards and arrested."
  - "(Failure): The hero is turned away by the guards."
  - "(Success): The hero infiltrates the office."
  - "(Success with Reward): As 17+, and an aide gives the hero additional valuable documents, information, or items without the need for another test."
