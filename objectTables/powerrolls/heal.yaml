id: 8d973aec-b82b-57fb-8071-54f67b68a3ef
name: Heal
description: Tests that use the Heal skill tend to the health and wholeness of mortal bodies. They are by their very nature matters of life and death. Unhurried, straightforward medical examinations or routine treatments don't require tests. But nothing is straightforward in the heat of battle, or as blood pools after the last arrow has loosed.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Cure a Poison"
  description: A hero attempts to purge a single poison from a creature's body.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero creates a medicinal extract or helps expel tainted blood. The poison is neutralized, ending any effect caused by it. The afflicted creature takes 1d4 poison damage as the toxin burns through their system."
  - "(Success): The hero creates a medicinal extract or helps expel tainted blood. The poison is neutralized, ending any effect caused by it."
  - "(Success with Reward): As 12-16, except the afflicted creature retains a measure of protection, gaining poison immunity equal to the hero's level until the end of the next combat encounter."
- name: "Medium: Slow a Disease"
  description: "A hero attempts to halt the progress of an agressive disease. To permanently remove the disease, the hero must undertake the Find a Cure downtime project (see Chapter 12 in Draw Steel: Heroes)."
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero's ministrations fail, and the disease continues to run its normal course. The hero can attempt this test again, but each subsequent failure by anyone making this test deals 1d4 damage to the patient."
  - "(Success with Consequence): The hero bolsters the body's response. The disease's progress is halted for a number of days equal to the patient's Might score (minimum 1). If the patient is infected with the same disease again, the progression picks up where it left off."
  - "(Success): The hero discovers a regimen of care that halts the progress of the disease indefinitely. The patient doesn't improve, but they don't get worse."
  - "(Success with Reward): As 17+, and the patient can't become sicker from the disease again but can still infect others if the disease is contagious. The hero also gains an edge on project rolls made to permanently remove the disease."
- name: "Hard: Revive the Recently Deceased"
  description: A hero attempts to resuscitate a creature who just died moments ago and has most of their body parts intact. Call for a test only if the creature has been dead for no longer than 5 minutes (or 1 round) times their highest characteristic score, to a minimum of 1 minute or 1 round.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The creature is too far gone for mortal medicine. They remain dead and can't be revived by anything less than supernatural means."
  - "(Failure): Despite the hero's valiant efforts, the creature remains dead, but there might be one thing left to try. The hero can attempt this test again, but a subsequent failure by anyone making this test is treated as a failure with a consequence."
  - "(Success): The hero does it! The creature regains Stamina equal to one-third their Stamina maximum and revives. If they die again before completing a respite, they can't be revived this way again."
  - "(Success with Reward): As 17+, except the creature regains Stamina equal to two-thirds their Stamina maximum and returns to life. If they die again before completing a respite, they can't be revived this way again."
