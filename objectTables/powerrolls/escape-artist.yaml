id: 65799f8c-6aa7-5a33-90da-86aed66a1861
name: Escape Artist
description: Call for a test that uses the Escape Artist skill only when a hero attempts to break free from secure bonds or under time pressure. Loosely tied or frayed ropes in a quiet, unguarded room require no test to escape.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 772f0953-2cee-4aad-a2ed-de9af9fa9b47
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Slip the Manacles"
  description: A hero attempts to slip out of locked iron manacles.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero successfully slips out of their manacles and escapes, but the iron rings loudly, alerting anyone nearby that something is amiss."
  - "(Success): The hero quietly slips out of their manacles."
  - "(Success with Reward): The hero slips out of their manacles in such a way that they can attach them to a nearby enemy in the same deft movement without needing to make an additional test."
- name: "Medium: Squeeze Through Bars"
  description: A hero attempts to squeeze through their thin prison cell bars.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to fit through the bars."
  - "(Success with Consequence): The hero forces their body through the bars, but the effort leaves them bruised and exhausted. The hero loses 1 Recovery."
  - "(Success): The hero squeezes through the bars with ease."
  - "(Success with Reward): As 17+, and the hero finds the keys to the other prison cells on a nearby hook on the wall."
- name: "Hard: Escape From a Locked Chest"
  description: Locked inside a chest that's been hurled into the ocean, a hero attempts to escape.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails and lets water fill the chest as they do. They begin to suffocate."
  - "(Failure): The hero can't break free in time, and they grow lightheaded from the lack of oxygen. They can attempt to make this check again, but they take a bane on the attempt."
  - "(Success): The hero breaks free and can swim to the surface."
  - "(Success with Reward): As 17+, and after the hero exits the chest, they notice the entrance to a forgotten tomb that sank into the sea."
- name: "Hard: Escape the Spinning Wheel"
  description: A hero chained to a spinning metal wheel must escape as their body is constantly flipped around in all directions.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to escape and gets violently ill. They lose 1 Recovery."
  - "(Failure): The hero fails to break free from the wheel."
  - "(Success): The hero breaks free from the wheel."
  - "(Success with Reward): As 17+, and the hero can remain clinging to the wheel for the time being and escape at the moment that is most convenient for them."
