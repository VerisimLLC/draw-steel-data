id: e73b1a11-bca4-5d5b-b2ad-c4c118fa7791
name: Flirt
description: Call for a test that uses the Flirt skill only if the hero's success or failure has an impact on the plot or action and if the person they flirt with is someone who might resist being charmed. A hero flirting in a pub to pass the time requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 9f41a684-4b8c-4026-8175-df136fc5134f
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Distract a Guard"
  description: A hero attempts to distract a guard on patrol, allowing their allies to sneak by.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero distracts the guard-- a little too successfully. The guard insists the hero keep them company. Rebuffing their advances angers the guard, who raises the alarm."
  - "(Success): The hero distracts the guard, and their friends can sneak by without a test."
  - "(Success with Reward): As 12-16, and if the hero encounters the same guard again, the guard is friendly to them and defends them in the face of any accusations. They might even help the hero escape a tricky situation."
- name: "Medium: Charm a Spy"
  description: A hero flirts with a spy to gain insights into upcoming battle strategies.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to get any information from the spy."
  - "(Success with Consequence): The hero gets the information they want from the spy but draws the suspicions of the spy's allies who have the hero followed for a day."
  - "(Success): The hero gets the information they want from the spy without drawing suspicion."
  - "(Success with Reward): As 17+, and the spy gives them a Snapdragon (or other 1st-echelon consumable of your choice) (see Chapter 13 in Draw Steel: Heroes)."
- name: "Hard: Gain Royal Secrets"
  description: A hero flirts with a betrothed member of the royal family to get them to show the hero a secret path into the palace.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero unintentionally insults the royal's honor. They are removed from the royal's presence and barred from future audiences."
  - "(Failure): The hero fails to learn the location of the secret path."
  - "(Success): The royal reveals the location of the secret path."
  - "(Success with Reward): As 17+, and the royal provides the hero with a favor that the palace guards will recognize, allowing them safe passage through the halls if discovered."
- name: "Hard: Out-Charm a Rival"
  description: A hero flirts with a famous troubadour at the same time as a rival, competing for affection and services.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The rival gains the services of the troubadour, and the troubadour writes a ballad about the hero's clumsy flirting that temporarily reduces the hero's Renown by 1 for 30 days."
  - "(Failure): The rival gains the services of the troubadour."
  - "(Success): The hero gains the services of the troubadour."
  - "(Success with Reward): As 17+, and the troubadour writes a song about how clever and suave the hero is, which temporarily increases the hero's Renown by 1 for 30 days."
