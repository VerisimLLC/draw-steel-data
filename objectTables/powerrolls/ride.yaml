id: 4ecb9cee-091b-5832-8f66-d48c0eab150b
name: Ride
description: Call for a test that uses the Ride skill only when a hero tries to ride and control a mount through treacherous terrain such as jumping over a wide crevasse or across a broken ice floe. Controlling a mount in a peaceful forest does not require a test to ride.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 9522f7af-6d83-4b82-a962-075ac80a367d
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Coax a Mount Out of a Swamp"
  description: A hero attempts to coax a mount out of a swamp as they sink into the mud.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero coaxes the mount out of the swamp, but the mount's speed is halved until the hero gains at least 1 Victory."
  - "(Success): The hero safely coaxes the mount out of the sinking swamp."
  - "(Success with Reward): As 12-16, and the mount is emboldened by the encouragement. The hero gains an edge on the next test they make while riding the mount."
- name: "Easy: Ford a River"
  description: A hero attempts to ford a river while riding on the back of a mount who doesn't naturally swim.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The mount fords the river, but not before dousing the hero a few times. The hero loses 1 Recovery after almost drowning."
  - "(Success): The mount fords the river without incident."
  - "(Success with Reward): As 12-16, and the hero discovers an ounce of costmary leaves growing on the bank of the river, which can be used to craft a Healing Potion."
- name: "Medium: Leap Over an Acid Pool"
  description: A hero tries to convince a mount to leap over a pool of bubbling acid.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to convince the mount to make the leap."
  - "(Success with Consequence): The hero convinces the mount to make the leap, but the mount takes 1d6 acid damage as the bubbling pool snaps a few drops upon them."
  - "(Success): The hero coaxes the mount to make the leap without incident."
  - "(Success with Reward): As 17+, and allies attempting the same leap on mounts don't need to make a test as the hero's mount leads the way and sets the example."
- name: "Hard: Safely Ride Through Fire"
  description: A hero tries to safely ride a mount through fiery terrain.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to coax the mount. During the attempt, the mount suffers 6 fire damage and must be healed or finish a respite before continuing the journey."
  - "(Failure): The hero fails to coax the mount through the fiery terrain."
  - "(Success): The hero safely rides through the fiery terrain."
  - "(Success with Reward): As 17+, and the wind the swift mount creates as they pass through the fire douses the flames, causing the fiery squares the mount passed through to extinguish."
