id: 0aa1a86c-854c-5a4c-ac58-42c65bf64503
name: History
description: Call for a test that uses the History skill when a hero attempts to recall obscure details to help them understand the backgrounds of events, people, and places important to the story. Recalling well-known history doesn't require a test. Historical (or any) information that the heroes need to advance the plot should never be locked solely behind a single test to avoid the game screeching to a halt.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 0df23459-ab2f-4659-8a2d-ae5820dc889f
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Why Is This Place Like This?"
  description: A hero exploring a ruin attempts to recall the purpose of the place and why it fell.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero knows the ancient ruin used to be an elementalist's library, but they can't recall why it fell."
  - "(Success): The hero knows the ancient ruin used to be the library of Kara the Blue, a void elementalist, and the place was ransacked by demons her jealous rival summoned."
  - "(Success with Reward): As 12-16, and the hero also recalls that Kara is said to have locked her most precious books, which detailed the creation process for several supernatural items, in a magically concealed trunk in her old bedchambers within the library."
- name: "Medium: Identify Heraldry"
  description: A hero attempts to assess the friendliness of a rapidly approaching warrior flying the banner of a griffon with a snake in its talons on a green field.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero knows nothing about the banner presented."
  - "(Success with Consequence): The hero knows the banner belongs to a secluded knight, Lady Vangir, over a hundred miles from the region. They also know this knight and their wards were all killed by a band of gnolls."
  - "(Success): As 12-16, and the hero also knows Lady Vangir returned to life as a revenant and now rides across the land seeking to bring justice to evil-doers."
  - "(Success with Reward): As 17+, and the hero recalls an ancient greeting that endears them to Lady Vangir. The first test they make to interact with the knight after using the greeting for the first time automatically succeeds."
- name: "Hard: Identify Allegiances"
  description: A hero sits down to discuss a peace treaty with several different organizations who have been at war with each other for centuries. Before the arguments begin, the hero attempts to recall which of these nations have historically been allies, rivals, and enemies with one another.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero screws it up and thinks that allies are enemies and enemies are allies. They begin the proceedings on the wrong foot and take a bane on any tests made to influence the groups during the discussions, including side negotiations."
  - "(Failure): The hero can't recall the organizations' allegiances."
  - "(Success): The hero recalls the organizations' allegiances and is able to leverage that information to gain an edge on tests made to influence the groups during discussions and negotiations for 24 hours."
  - "(Success with Reward): As 17+, but the hero's knowledge is so great that they have a double edge on tests made to influence the groups during the discussions and negotiations for 24 hours."
