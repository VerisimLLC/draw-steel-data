id: 875d1614-8a1a-5c06-8730-14d76e1b8747
name: Navigate
description: When a hero must make an urgent journey to a new destination or find a safe path through perilous terrain, call for a test that uses the Navigate skill. Finding a way through a well-traveled forest or traveling along an unchanged path they've been down before doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 0c7d0c53-2056-4579-8c83-1bec3098cc56
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Travel Quickly Through a Marsh"
  description: A hero attempts to quickly travel through a marsh to deliver an urgent message.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero navigates through the marsh in time but, in the rush, loses an item they carry of your choice."
  - "(Success): The hero quickly travels through the marsh and delivers the message in time."
  - "(Success with Reward): As 12-16, and the hero is able to thoroughly learn their way around the marsh. They never need to make a test to navigate through this marsh again, even if they travel to a new destination by way of it."
- name: "Medium: Navigate an Uncharted Forest"
  description: A hero tries to escort a political envoy safely through an uncharted forest in time for a special meeting.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero and envoy don't make it through the forest in time for the meeting."
  - "(Success with Consequence): The hero escorts the envoy safely to their meeting, but a hostile entity in the forest awakens and marks the hero as quarry."
  - "(Success): The hero escorts the envoy to through the forest without incident, arriving in time for the meeting."
  - "(Success with Reward): As 17+, and the envoy is impressed by the hero's skills. The envoy gives the hero a Bullshot (or other consumable of your choice)."
- name: "Hard: Cut Off Enemies at the Pass"
  description: A hero tries to find a path to reach a desert valley pass ahead of the enemies and get the jump on them.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to get to the pass ahead of the enemies. The enemies catch the hero and their allies surprised when they arrive at the pass."
  - "(Failure): The hero fails to cut the enemies off and meets them at the pass at the same time."
  - "(Success): The hero succeeds at cutting the enemies off at the pass and catches them surprised."
  - "(Success with Reward): As 17+, but the enemies are so surprised that ability rolls against them have a double edge."
