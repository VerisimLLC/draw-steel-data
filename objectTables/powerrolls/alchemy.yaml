id: c0eae9f6-4048-5fb7-9a93-12f13a1ad864
name: Alchemy
description: When a hero wants to quickly jury-rig or assess the nature of an alchemical device or substance, call for a test that uses the Alchemy skill. Making reliable potions, bombs, and the like typically happens as part of a downtime project, not a typical test. Identifying a common alchemical creation, such as a Healing Potion, requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: cdae52cd-ef20-461d-ae18-253023cdb827
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Make a Smoke Bomb"
  description: A hero attempts to create an impromptu smoke bomb to conceal movement or escape.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero makes a smoke bomb, but its wispy smoke isn't quite what they had in mind. A creature in the smoke is only partially hidden by it, giving them a bane on tests made to hide and sneak."
  - "(Success): The hero makes a smoke bomb that provides a creature concealment for 1 round if used immediately."
  - "(Success with Reward): As 12-16, except the smoke bomb provides a creature with concealment for 3 rounds if used immediately."
- name: "Medium: Identify Poison"
  description: A hero tries to determine if a meal is poisoned before eating it.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to determine if the meal is poisoned."
  - "(Success with Consequence): The hero can tell the meal is poisoned, but unfortunately just the scent of the food is enough to harm them. The hero takes 1d6 poison damage."
  - "(Success): The hero can tell the meal is poisoned."
  - "(Success with Reward): As 17+, and the hero doesn't require a test to convincingly pretend to eat the meal."
- name: "Medium: Make Fool's Gold"
  description: A hero tries to turn metal into fool's gold to pass as real gold.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to transmute metal."
  - "(Success with Consequence): The hero turns metal into fool's gold, but the forgery is detected after it's used. The Director chooses if the fooled individual reports the fraud or uses it as blackmail against the hero."
  - "(Success): The hero turns metal into fool's gold that passes as real gold."
  - "(Success with Reward): As 17+, and the hero can replicate the result without needing to make another test for the next 24 hours."
- name: "Hard: Jury-Rig a Bomb"
  description: A hero attempts to rig an impromptu bomb in the middle of combat using found materials.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The bomb goes off accidentally, causing the hero and any creature within 3 squares of them to take 2d6 fire damage."
  - "(Failure): The hero fails to make a bomb, and the materials are ruined."
  - "(Success): The hero creates a bomb. As a main action, it can be hurled up to 5 squares and explodes in a 3 cube, dealing 2d6 fire damage to each creature in the area."
  - "(Success with Reward): As 17+, except the hero can hurl the bomb as a maneuver."
