id: 7553d533-9b5f-559d-a631-edb8ab2319b2
name: Persuade
description: A test that uses the Persuade skill doesn't determine the validity of an argument. Rather, it measures a hero's ability to employ rhetoric to convincingly convey their position. No test is needed to convince someone of what's apparent in front of their eyes.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 28573ee3-e9df-47fe-98f1-2ac0bfee797a
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Talk Your Way Into a Party"
  description: It's the event of the season, and a hero needs to get inside to finish their quest. All that stands between the hero and an evening of opulent revelry is 263 pounds of muscle with a no-nonsense attitude and a hangover.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero is just convincing enough to get into the party. However, behind their back, the bouncer tells the other guards to watch that hero carefully. Any tests the hero makes to avoid the attention of the guards or deceive them during the party takes a bane."
  - "(Success): The hero convinces the bouncer to let them into the party and doesn't raise further suspicion."
  - "(Success with Reward): Something the hero says strikes just the right chord in the bouncer's heart. The bouncer lets them in and gives them special access to VIP-only areas of the party."
- name: "Medium: Get a Killer to Reveal a Client"
  description: Most assassins are famously close-lipped when it comes to giving up the names of their clients, but a determined hero wants to discover who offered a large sum to off a noble.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The assassin refuses to answer the question."
  - "(Success with Consequence): The assassin is willing to provide the requested information ... at a price. If the hero pays up, reducing their Wealth by 1, the client's name is provided."
  - "(Success): The assassin gives the name of the client."
  - "(Success with Reward): As 17+, and the assassin gives the hero all of their knowledge of the person that placed the hit, including information about a hidden passage in the client's home."
- name: "Hard: Turn a Cultist"
  description: A hero attempts to convince a cultist of an evil god to turn away from their wicked devotion.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The cultist feels nothing but contempt for this blasphemy. They clutch a talisman around their neck and teleport away in a burst of magic, dealing 1d6 corruption damage to each creature within 10 squares."
  - "(Failure): The cultist's faith is unshakeable."
  - "(Success): The cultist is convinced to leave the cult behind."
  - "(Success with Reward): As 17+, and the cultist offers the hero as much damning information as possible about the organization, including a secret weakness and the daily habits of the cult's leader."
