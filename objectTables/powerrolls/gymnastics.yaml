id: 70f323f6-2c32-5f09-b977-472abd45beda
name: Gymnastics
description: You should call for a test that uses the Gymnastics skill whenever a hero attempts a feat that could result in serious injury or complications, such as balancing on a narrow beam high above a mead hall filled with enemies. Walking atop a wide, low wall requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Balance in the Rafters"
  description: A hero attempts to move along the rafters of a barn as they spy on a group of bandits below.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero slips and remains in the rafters, but the noise draws the attention of the bandits."
  - "(Success): The hero moves in the rafters without incident."
  - "(Success with Reward): As 12-16, and the hero discovers a weak beam, which they could kick as a maneuver to collapse onto the bandits below, dealing 3d6 damage to each bandit on the floor of the barn."
- name: "Easy: Cross a Slippery Log Bridge"
  description: A hero attempts to cross a slippery and narrow log bridge over a fast-moving river.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero slips but catches themself, and then crosses the log bridge. Their stumble unsettles the log, causing it to wobble. Any other creatures attempting to cross after the hero make the test with a bane."
  - "(Success): The hero crosses the log bridge safely."
  - "(Success with Reward): As 12-16, and the hero can anchor the log with a good kick once they reach the other side. Any creature attempting to cross after the hero gains an edge on their test."
- name: "Medium: Cross a Crumbling Bridge"
  description: A hero attempts to move quickly across a crumbling bridge.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The bridge crumbles faster than the hero can cross it. They catch themself on a ledge and pull themself back up to where they started, now with no bridge to cross."
  - "(Success with Consequence): The hero crosses the bridge before it completely collapses, but they slip and nearly fall in the process. They drop an important item of your choice."
  - "(Success): The hero crosses the bridge without harm."
  - "(Success with Reward): As 17+, and as the hero runs, they can pull another creature with them who also safely crosses without needing to make a test. Or, if they choose, they can push a creature off the bridge."
- name: "Hard: Move Through Tripwires"
  description: A hero attempts to move through a room rigged with tripwires that activate various deadly traps.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero triggers a trap. They take 3d6 damage and are knocked back to where they started. The hero can try again."
  - "(Failure): The hero nearly triggers a trap and is forced to retreat back to where they started. The hero can try again, but they take a bane, since they also have to avoid spinning blades and gouts of flame."
  - "(Success): The hero crosses the room without triggering a trap."
  - "(Success with Reward): As 17+, and while crossing the room, the hero locates a lever that disables the traps in the room."
