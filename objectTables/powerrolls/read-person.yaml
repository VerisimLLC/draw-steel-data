id: fedcb701-a9bf-5c05-8640-181fad2f60ff
name: Read Person
description: The Read Person skill is best reserved for tests where a hero is attempting to discern motivations, emotions, or intentions from a person trying to hide their feelings and whose feelings change the true meaning of their words. Casual conversation with a person making no attempt to hide their feelings doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 30a30090-3699-48f1-b252-ce7d0445abee
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Spot the Scammer"
  description: A hero attempts to discern if the cheerful merchant is running a scam. (They are.)
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero can tell the merchant is attempting to scam them. However, the merchant also realizes the hero is on to them. The merchant ends the conversation and immediately leaves to spread the rumor to honest merchants that the hero isn't trustworthy. The hero takes a bane on social interactions made with merchants in the area for the next 24 hours."
  - "(Success): The hero can tell the merchant is running a scam without drawing suspicion."
  - "(Success with Reward): As 12-16, and the hero also knows that, if called out on it, the merchant will give the hero one of what they sell for free without the need to make another test."
- name: "Medium: Trust Your Rival?"
  description: A hero being chased by a mob of monsters attempts to judge in a split second if the escape route offered by their rival is a trap or not. (It's not a trap!)
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero can't discern the rival's intentions."
  - "(Success with Consequence): The route is safe, but the hero wastes precious seconds hesitating. A handful of the monsters chasing them get their scent and follow the route."
  - "(Success): The hero can tell the rival's offer is genuine."
  - "(Success with Reward): As 17+, and the hero accepts the offer so quickly that their rival considers making amends."
- name: "Hard: Read a Memonek's Mood"
  description: While on Axiom, the Plane of Uttermost Law, a hero attempts to discern a memonek leader's motivations before asking them for a favor. Here, a memonek often feels or shows very little emotion.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero can't determine the memonek's motivations, and the memonek notices the hero watching them. The hero takes a bane on the next test they make to interact with the memonek."
  - "(Failure): The hero can't read the memonek's mood."
  - "(Success): The hero discerns the memonek's motivations."
  - "(Success with Reward): As 17+, and the hero gains an edge on the next test they make to interact with the memonek."
- name: "Hard: Sense a Noble's Honesty"
  description: A hero attempts to sense if the noble's promise of peace with the hero holds loyalty or betrayal. (It's betrayal!)
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero trusts the noble to stick to their word."
  - "(Failure): The hero fails to determine if the noble's offer of peace is sincere."
  - "(Success): The hero knows the noble is planning to betray them."
  - "(Success with Reward): As 17+, but the hero can convince the noble that they believe the offer of peace without needing to make another test."
