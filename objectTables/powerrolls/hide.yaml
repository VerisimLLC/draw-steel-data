id: 9a78b7dc-e0dc-5aae-b5f8-158b5cc3ff38
name: Hide
description: Call for a test that uses the Hide skill when a hero attempts to hide themself or an ally in a moment of tension, where time is of the essence, or there's no readily available shadow to disappear into. Hiding on a dark night surrounded by fog requires no roll.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Lose a Pursuer in a Crowd"
  description: A hero is attempting to fade into the crowd and lose a pursuer.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero disappears into the crowd, but as they do, they lose a consumable treasure they carry to a pickpocket."
  - "(Success): The hero disappears into the crowd, losing their pursuer."
  - "(Success with Reward): As 12-16, and the hero can turn around and track their pursuer to their next location without notice or the need to make another test."
- name: "Medium: Hide a Friend in Underbrush"
  description: A hero attempts to hide one of their less stealth-inclined allies in an area of underbrush as enemies approach.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to hide their friend and themself before enemies arrive."
  - "(Success with Consequence): The hero hides their friend, but the attempt leaves them with limited time to hide before the enemies arrive. The hero takes a bane on any test they make after this to hide themself or another creature before the enemies arrive."
  - "(Success): The hero hides their friend and can make a follow-up attempt to hide themself before enemies arrive."
  - "(Success with Reward): The hero hides their friend and can hide themself without the need to make another test."
- name: "Medium: Hide in the Hoard"
  description: A hero attempts to use a monster's hoard to hide themself.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to hide, spilling coins, gems, and loot everywhere. The monster has them in its sights."
  - "(Success with Consequence): The hero hides in the loot pile as the monster falls asleep right on top of them. They must now successfully sneak out without waking the monster."
  - "(Success): The hero hides in the loot pile without incident."
  - "(Success with Reward): As 17+, and the hero manages to quietly fill their pockets without gaining attention. Their Wealth increases by 1."
- name: "Hard: Look Over There!"
  description: While being keenly observed, a hero attempts to hide by pointing out a distraction and then quickly ducking away.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to distract the observer and fumbles their footing as they attempt to hide. Their next power roll takes a bane as they get distracted."
  - "(Failure): The hero fails to distract the observer."
  - "(Success): The hero hides from the observer."
  - "(Success with Reward): As 17+, and the hero can pull an adjacent ally into hiding with them."
