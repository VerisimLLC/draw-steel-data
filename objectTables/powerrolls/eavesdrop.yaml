id: 5141bd74-7098-585e-898c-4d0072022cc6
name: Eavesdrop
description: When a hero tries to actively listen to a conversation that's difficult to hear and glean important information without being caught, a test that uses the Eavesdrop skill could be called for. Listening through a door to a conversation at normal volume doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Listen in a Crowded Room"
  description: A hero attempts to isolate and listen to a conversation in a crowded and noisy room.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero listens in on the conversation but is noticed by the speakers halfway through, who end the conversation."
  - "(Success): The hero listens in on the entire conversation without being noticed."
  - "(Success with Reward): As 12-16, and the hero overhears the information they desire, plus information that can lead them to a leveled treasure."
- name: "Medium: Navigate via Sound"
  description: A hero attempts to navigate toward the distant sound of rushing water in a series of tunnels to reach an underground river.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to find the river."
  - "(Success with Consequence): The hero finds the river, but it takes them hours of crawling through tight spaces to do so. They lose 1 Recovery."
  - "(Success): The hero finds the river without incident."
  - "(Success with Reward): The hero finds a shortcut that leads them to the river quickly. Along the way, they discover a backpack with a Healing Potion (or other 1st-echelon consumable)."
- name: "Medium: Listen Through Stone"
  description: A hero attempts to listen to a council meeting through a stone floor or ceiling.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to hear the council meeting."
  - "(Success with Consequence): The hero overhears the council meeting, but an ambitious clerk notices and privately alerts an official."
  - "(Success): The hero listens to the council meeting without being discovered."
  - "(Success with Reward): As 17+, and in addition to gaining the information they want, the hero learns a motivation or pitfall of a member of the council."
- name: "Hard: Read Lips From a Distance"
  description: A hero tries to read lips of a person speaking across a busy city square.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to read the target's lips, and the target notices the hero watching and leaves the square."
  - "(Failure): The hero fails to read the target's lips."
  - "(Success): The hero reads the target's lips."
  - "(Success with Reward): As 17+, and the hero can trail the target to their next destination without needing to make another test."
