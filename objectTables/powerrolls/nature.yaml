id: 2f51d739-141d-5c99-83aa-4f83acd5207c
name: Nature
description: When a hero seeks to identify rare plants or animals, predict weather patterns or natural hazards, or recall obscure lore about the natural world, you should call for a test that uses the Nature skill. Recognizing common herbs or recalling common nature facts requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Find the Healing Herb"
  description: A hero attempts to identify which herb will soothe a child's fever and start them on the path to healing.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero identifies the herb, but it's less potent than some other options. The child's fever breaks eventually, but it takes an extra week of time."
  - "(Success): The hero identifies the herb that soothes the child's fever immediately."
  - "(Success with Reward): As 12-16, and the hero knows where to find the herb in abundance so anyone else who gets the illness can recover quickly."
- name: "Medium: Identify the Predator"
  description: A hero attempts to recognize an animal who has been terrorizing a local community by examining the scene of the attacks.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero incorrectly identifies the animal attacking the community."
  - "(Success with Consequence): The hero correctly identifies the animal making the attacks but doesn't figure it out until after the animal strikes again."
  - "(Success): The hero correctly identifies the animal before it strikes again."
  - "(Success with Reward): As 17+, and the hero knows how to track the creature without needing to make another test."
- name: "Medium: Predict a Storm's Path"
  description: Noticing a gathering storm, a hero attempts to predict its path so they can travel around it.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero incorrectly predicts the storm's path and must travel through it or wait it out."
  - "(Success with Consequence): The hero correctly predicts the storm's path ... but didn't predict that the storm would grow. They are caught at the very edge of the storm, and their travel is slowed by it."
  - "(Success): The hero correctly predicts the path of the storm and can travel through it without incident."
  - "(Success with Reward): As 17+, and the hero is able to put the wind at their back, hastening their travel."
- name: "Hard: Find the Unique Animal"
  description: A hero attempts to find an elusive, legendary, and unique animal in an extremely vast forest based on obscure folklore they know.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero recalls the wrong legend and ends up at the lair of a far more dangerous and angry creature instead."
  - "(Failure): The hero can't recall any helpful lore about the animal."
  - "(Success): The hero recalls lore that leads them to the animal's den."
  - "(Success with Reward): As 17+, and the hero also recalls a special food or some other offering they can bring to appease the creature."
