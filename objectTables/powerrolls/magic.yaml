id: 505629c4-f199-5282-b741-375778aaa847
name: Magic
description: A hero makes a test that uses the Magic skill to recall obscure or vital information, improvise a magical effect when there is risk of failure, or interact with dangerous magical elements. A hero doesn't need to make a test to know that an elementalist shooting fire from their hands is casting a spell.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Fake a Magic Trick"
  description: A hero explains how magic works, attempting to convince someone who knows nothing about magic that the hero can cast a spell or magical curse upon them.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The target believes the hero can cast such a spell, but they are informed 1 hour later by a friend that they have been duped."
  - "(Success): The target believes the hero cast a spell and does whatever the hero next requests of them (within reason). Perhaps they assist with a single task or tell others of the hero's greatness."
  - "(Success with Reward): The target is convinced the hero is a mighty wielder of magic and reacts as the hero requests. Furthermore, they follow the hero's requests for 1 hour."
- name: "Medium: Study a Summoning Ritual"
  description: A hero attempts to learn the nature of a summoning ritual, including what's being summoned and how it might be interrupted.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to learn about the ritual."
  - "(Success with Consequence): The hero can ask two questions about the ritual, which the Director should answer truthfully. However, the hero becomes linked to the ritual and loses 1 Stamina each time someone tries to interfere with the ritual or when a creature is summoned by the ritual."
  - "(Success): The hero can ask two questions about the ritual, which the Director should answer truthfully."
  - "(Success with Reward): The hero learns everything about the ritual and gains an edge on any tests made to disrupt it."
- name: "Hard: Duplicate a Ward"
  description: A hero attempts to recreate a magic ward they've encountered.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to duplicate the ward. A magical backlash prevents them from using skills from the lore skill group for the next 1d6 hours."
  - "(Failure): The hero fails to duplicate the ward."
  - "(Success): The hero can duplicate the ward they encountered previously. The ward lasts 1d3 + 1 minutes."
  - "(Success with Reward): As 17+, except the ward lasts until the hero wills it to end."
- name: "Hard: Traverse the Warded Gate"
  description: A hero wishes to travel through a magically warded gate safely.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to bypass the warded gate. In addition, the gate's ward saps the life from the hero, who loses 1 Recovery."
  - "(Failure): The hero fails to bypass the warded gate and is repelled back from it."
  - "(Success): The hero bypasses the warded gate without triggering defenses or leaving signs of their passage."
  - "(Success with Reward): As 17+, and for the next minute, any creature the hero designates can also pass through the warded gate without making a test."
