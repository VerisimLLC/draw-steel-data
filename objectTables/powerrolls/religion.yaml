id: 8149907a-3816-59f7-8977-17214b95ab40
name: Religion
description: Try calling for a test that uses the Religion skill if a hero attempts to recall obscure religious details that could aid them in their adventures, and if the knowing (or not knowing) of that detail would add drama to the story. Recalling common religious lore doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: afd26a9a-22e2-4341-b171-f7e3182c8744
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Identify a Saint in a Mural"
  description: A hero attempts to identify a human saint depicted in a faded mural so they can better relate to the ghost of the priest within the ruins of a church.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero knows the saint is either Llewellyn the Valiant or Pentalion the Paladin, but the details of the mural are too faded to make out. If the hero mentions Llewellyn in a positive way, the ghost doesn't attack them. If the hero mentions Pentalion in a positive way, the ghost attacks and can't be convinced to stop."
  - "(Success): The hero knows the saint is Llewellyn the Valiant. If the hero mentions Llewellyn in a positive way, the ghost doesn't attack them."
  - "(Success with Reward): As 12-16, and the hero also recalls that Llewellyn used to be in a specific sect of warrior priests called the Justicars. If the hero invokes this name while speaking to the ghost, they have a double edge on the next test made to influence them."
- name: "Medium: Identify a Religious Ritual"
  description: A hero attempts to assess the purpose of a religious ritual that is already in progress. Robed priests chant and hold candles as they slowly walk around and throw diamond dust on a human lying down on an altar.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero knows nothing about the ritual."
  - "(Success with Consequence): The hero knows the ritual is meant to transform the human on the altar, but ... into what?"
  - "(Success): The hero knows the ritual is meant to remove the curse of werewolf lycanthropy from the human on the altar."
  - "(Success with Reward): As 17+, and as the hero observes the ritual, they learn it for themself and can replicate the result if they have an altar, diamond dust, and enough people."
- name: "Hard: Identify a New Cult's Symbol"
  description: A hero recovers the holy symbol of a cultist who attacked them. The cult is new, but their symbol hints at an ancient malevolent force as the idol--the symbol depicts a clawed hand grasping a fistful of gold and bones.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero can't tell who the symbol belongs to, but their examination of the symbol triggers a magic ward on the item that allows the leader of the cult to spy on them through the symbol for as long as they carry it."
  - "(Failure): The hero can't tell who the symbol belongs to."
  - "(Success): The hero knows the symbol depicts the hand of Aurumvas, the archdemon of greed."
  - "(Success with Reward): As 17+, and the hero notices the symbol has a ward that, if tripped, allows the cult's leader to spy on whoever carries it."
