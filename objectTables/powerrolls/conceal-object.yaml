id: aa9a3799-054c-5a07-aa41-c08b421202f7
name: Conceal Object
description: Call for a test that uses the Conceal Object skill either when a hero attempts to hide an object that is too large to conceal on their person, or when their attempt to conceal a small object is under the pressure of discovery or some other duress.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Conceal Armor With Formal Wear"
  description: A hero is attempting to infiltrate a formal event but doesn't want to sacrifice their protection.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero's armor is technically concealed, but they look a mess. They take a bane on tests made to interact with the other guests and any guards at the gathering."
  - "(Success): The hero's armor is concealed perfectly."
  - "(Success with Reward): The hero's armor is incorporated into the formal wear in a way that is fashion-forward and absolutely divine. They gain an edge on tests made to interact with other guests and the host of the party."
- name: "Medium: Swap With a Fake"
  description: A hero attempts to swap an object with a replica in plain sight, while making the original disappear into their pockets.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails the swap, with the fake clattering onto the ground next to them."
  - "(Success with Consequence): The hero makes the swap without initial notice, but 1 minute later, someone notices the original is missing and has been swapped with a fake."
  - "(Success): The hero swaps the original and the fake without notice."
  - "(Success with Reward): As 17+, and the hero is able to palm a second nearby item without the need for another test."
- name: "Hard: Conceal a Vehicle"
  description: A hero attempts to hide their vehicle, camouflaging it from pursuers or anyone who stumbles upon it.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to hide the vehicle, and their attempt damages it. The vehicle requires repair before it can function again."
  - "(Failure): The hero fails to hide the vehicle."
  - "(Success): The hero conceals the vehicle."
  - "(Success with Reward): The hero conceals the vehicle really, really well. Anyone searching for it has a double bane on the test to do so."
- name: "Hard: Thwart a Search"
  description: A hero attempts to move contraband around on their person during a pat-down search.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero is caught with the contraband and gets tangled in their own equipment. They are restrained (save ends). And probably embarrassed."
  - "(Failure): The hero is caught with the contraband."
  - "(Success): The hero keeps the contraband concealed."
  - "(Success with Reward): As 17+, and the hero gains an edge on the next test they make to converse with the person searching them."
