id: 958c9244-c639-58fa-a061-1c595b3864c5
name: Pick Pocket
description: You can call for a test that uses the Pick Pocket skill whenever a hero attempts to steal from someone who is vigilant, moving quickly, or under observation. Taking coins from the unconscious drunk in the tavern requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Pocket a Potion"
  description: A hero attempts to steal a rare potion in a delicate glass vial from a crowded laboratory without breaking the decorative container.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero steals the potion but cracks the vial. The vial becomes even more fragile, and some of its fluid slowly leaks out until the crack is repaired."
  - "(Success): The hero steals the potion without incident."
  - "(Success with Reward): As 12-16, and the hero has time to grab a second potion without being noticed or needing another test."
- name: "Medium: Snatch the Keys"
  description: An imprisoned hero attempts to steal the keys to their cell from the belt of a passing prison guard.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to steal the keys."
  - "(Success with Consequence): The hero steals the keys, but the guard notices 1 minute later and comes back to check every cell."
  - "(Success): The hero steals the keys. The guard doesn't notice until they need to use them."
  - "(Success with Reward): As 17+, and the hero can also lift a weapon from the guard's belt without being noticed."
- name: "Medium: Steal a Sacred Dagger"
  description: A hero attempts to steal a unique, ritualistic dagger from a priest's belt during a sacred rite that uses the weapon.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to steal the dagger."
  - "(Success with Consequence): The hero steals the dagger. The moment the dagger is needed in the ritual, the person performing it realizes the hero is the one who has it."
  - "(Success): The hero steals the dagger without notice."
  - "(Success with Reward): The hero steals the dagger just as it is imbued with magic power. For the next 24 hours, any damage-dealing weapon abilities that use the dagger deal an additional 3 damage."
- name: "Hard: Steal a Master Thief's Ring"
  description: A hero attempts to steal the signet ring from the powerful and skilled master thief's hand.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The master thief easily spots the hero's clumsy efforts at taking their precious signet ring. They keep the ring and instead filch something from the hero."
  - "(Failure): The hero fails to take the ring."
  - "(Success): The hero steals the ring without the thief noticing."
  - "(Success with Reward): As 17+, and the hero can filch another item of their choice from the thief's clothing."
