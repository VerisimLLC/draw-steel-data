id: 1502458f-bb4c-5344-82ec-96cf8326d67e
name: Gamble
description: Call for a test that uses the Gamble skill only when the stakes are high, the pot is huge, the game is rigged, or the opponents have powers beyond mortal ken. Playing a normal tavern game of cards or dice doesn't require a roll.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 81442e8b-10cb-41f5-8aa9-110a2256b663
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Win Against a Rigged House"
  description: A hero attempts to win a rigged parlor game in a gambling house.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero wins the game, but the house realizes they've been figured out and makes plans to get rid of the hero."
  - "(Success): The hero wins the game without drawing suspicion."
  - "(Success with Reward): The hero plays the rigged game like a fiddle. They win and increase their Wealth by 1."
- name: "Medium: Notice the Cheaters"
  description: A hero attempts to determine which card sharks in a game are cheaters and how those people are breaking the rules.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to identify any cheaters."
  - "(Success with Consequence): The hero figures out which players are cheating, but they can't figure out or prove how they did it without further investigation."
  - "(Success): The hero identifies the cheaters and their modes of cheating."
  - "(Success with Reward): As 17+, and the hero knows exactly how to use those cheats against the cheaters. If they participate in a game with these gamblers, they can choose to win against them without making any other tests."
- name: "Hard: Win at the Devil's Carnival"
  description: A hero attempts to out-game a devil, whose terrifying and completely unfair carnival games have tempting rewards but a heavy cost for failure.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails miserably at the games, earning the devil's scorn and pockets full of holes. The hero is banished from the carnival until they finish their next respite. They gain the Curse of Poverty complication (see Chapter 8 in Draw Steel: Heroes). The complication lasts until they kill the carnival's leader, a devil adjudicator (or other devil of your choice)."
  - "(Failure): The hero fails to win the carnival games. They lose 3 Wealth or 1 Recovery (your choice)."
  - "(Success): The hero wins the carnival games. They gain a 2nd-echelon consumable of your choice."
  - "(Success with Reward): As 17+, except the hero chooses between your choice of two 2nd-echelon consumables or a 2nd-echelon trinket as an award for winning."
