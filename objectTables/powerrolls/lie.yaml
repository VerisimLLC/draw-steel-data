id: df3988e7-d6e1-50fc-83a8-73bb31cf9ff0
name: Lie
description: Call for a test using the Lie skill when there are stakes to making a falsehood believable. A white lie told to spare a friend's feelings, such as telling them their hideous new robe isn't ugly, doesn't require a test.
