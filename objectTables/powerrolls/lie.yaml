tables:
- name: "Easy: Make Friends With a Bandit"
  description: A hero approaches a drunken bandit in a tavern, pretending to be a new recruit who needs the location of the brigand's base.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The bandit is convinced, and notes that the hero doesn't yet have the sigil on their neck marking them as a member. The bandit pulls a brand from a nearby fire and presses it against the hero's neck, dealing 1d6 fire damage to them and branding the hero a brigand. A hero can perform a magic healing ritual as a respite activity to remove the brand."
  - "(Success): The bandit shares the details of the hideout's location (slurringly)."
  - "(Success with Reward): The bandit nods sagely, remarking that they remember seeing the hero on the last raid. After relaying the details of the hideout's location, they give the hero a key that grants them entry into the bandit crew's chest of weapons."
- name: "Medium: Justify Trespassing"
  description: A hero, caught in the act of trespassing, attempts to convince a suspicious guard that they're supposed to be in a restricted area.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The guard sees through the ruse and immediately summons backup."
  - "(Success with Consequence): The guard lets the hero pass but then seeks out someone who can corroborate the story. The hero has 10 minutes before they're found out and the search begins."
  - "(Success): The guard is convinced and permits the hero to go."
  - "(Success with Reward): The guard, indignant that a guest has been left without guidance, offers to escort the hero anywhere they wish to go, unlocking doors and bypassing traps and other guards."
- name: "Hard: Pose as a Double Agent"
  description: A hero attempts to convince a villain that they've been secretly working to undermine and take down the other heroes.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The villain pretends to believe the hero, and asks them to undertake a job to prove their competence. However, the job is a setup for the villain to ambush the entire party."
  - "(Failure): The villain sees through the hero's lie and immediately attacks."
  - "(Success): The villain believes the hero, and asks them to undertake a job to prove their competence."
  - "(Success with Reward): The villain believes the hero and trusts them, offering up an important piece of information (such as the location of their lair) to make a show of good faith and impress their new ally."
