id: a3af217c-1639-5fc4-a296-d9e6b81fe64a
name: Fletching
description: Tests that use the Fletching skill are best reserved for when the hero attempts to modify or create ammunition under pressure and with limited resources or find tactical applications for archers on a large scale. Making mundane arrows or bolts doesn't require a roll. The making of supernatural weapons, ammunition, and the like typically happens as part of a downtime project and not a typical test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Identify Ammunition Origin"
  description: A hero is attempting to discern the origin of a piece of ammunition.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero has to break a piece of ammunition to figure out the origin, but once they do, they identify where it was created."
  - "(Success): The hero identifies the origin of the ammunition without damaging it."
  - "(Success with Reward): As 12-16, and the hero finds a mark on the ammunition that allows them to identify the specific creator."
- name: "Medium: Jury-Rig a Bow"
  description: A hero stripped of their equipment attempts to build a bow or crossbow from junk, scrap wood, or whatever other trash is around.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to make a weapon."
  - "(Success with Consequence): The hero jury-rigs a weapon, but it's low quality. When making an ability roll with an ability that uses this weapon, it breaks on a result of 11 or lower."
  - "(Success): The hero builds a sturdy weapon."
  - "(Success with Reward): As 17+, and the first damage-dealing ability that uses the weapon gains a 1d6 bonus to damage."
- name: "Hard: Jury-Rig Explosive Ammunition"
  description: A hero attempts to retip an arrow with dangerous explosive heads they previously acquired from a stash of broken arrows inside an alchemist's laboratory.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero drops the explosive tip. The hero and each creature within 3 squares of them takes 3d6 fire damage."
  - "(Failure): The hero fails to retip the arrow and the head is ruined."
  - "(Success): The hero swaps out the arrow tip. If this arrow is used in an ability that deals damage to a target, the target takes an additional 3d6 fire damage and is pushed 5 squares."
  - "(Success with Reward): As 17+, and the hero rebalances the arrow so well, they gain an edge on any ability roll made with the ability that uses the arrow."
- name: "Hard: Train Peasants in Archery"
  description: A hero attempts to teach a large band of peasants how to use a bow properly before a great battle.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to teach the peasants anything, and they are even more demoralized than before. They take a bane on ranged weapon abilities made during the battle."
  - "(Failure): The hero fails to teach the peasants anything."
  - "(Success): The hero teaches the peasants the best ways to handle a bow. Their ranged weapon abilities, including free strikes, gain a +2 damage bonus for the battle."
  - "(Success with Reward): As 17+, except the damage bonus rises to +3 and the peasants' ranged distance with ranged weapon abilities increases by 5 squares for the battle."
