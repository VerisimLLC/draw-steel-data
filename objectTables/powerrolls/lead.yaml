id: b81fdf80-9b22-5d21-a955-64cee2b21902
name: Lead
description: It's best to call for a test that uses the Lead skill when a hero tries to inspire people to take action that puts them at risk emotionally, physically, or socially. Motivating a group of peasants in a burning village to follow a hero to safety does not require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Get Wounded to Retreat"
  description: A hero attempts to convince a group of wounded bodyguards to retreat and allow the adventurers to step in and protect their charge.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero convinces the bodyguards, but their charge doesn't trust the hero and takes off running."
  - "(Success): The hero convinces the bodyguards and gains the trust of their charge."
  - "(Success with Reward): As 12-16, and as the bodyguards retreat, they fire off arrows as a distraction, granting the hero an edge on the next power roll they make using an ability that targets the enemy."
- name: "Medium: Make Peasants Into Soldiers"
  description: A hero attempts to sway a group of farmers to take up arms and defend the village against marauders.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to convince the farmers to fight."
  - "(Success with Consequence): The hero convinces the farmers to fight, but looters take advantage of the subsequent social upheaval and raid their farms. The hero gets blamed."
  - "(Success): The hero sways the farmers to fight."
  - "(Success with Reward): As 17+, and when the marauders arrive, the enemy combatants are caught surprised by the overwhelming force."
- name: "Hard: Influence a Council Vote"
  description: A hero tries to convince a ruling counsel to pardon a criminal who has changed for the better.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to convince the council, and the council votes to bar the hero from future meetings."
  - "(Failure): The hero fails to convince the council."
  - "(Success): The hero convinces the council to pardon the criminal."
  - "(Success with Reward): As 17+, and the hero's Renown is temporarily increased by 1 for the next month."
- name: "Hard: Sway Your Assassins"
  description: A hero tries to convince the group of assassins sent to kill them to turn on their leader and join the hero.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to convince the assassins, who leave and then return with a larger force to put an end to the hero."
  - "(Failure): The hero fails to convince the assassins, who attack immediately."
  - "(Success): The hero convinces the assassins to join their side."
  - "(Success with Reward): As 17+, and the assassins turn over the money paid to them to kill the hero. The hero gains 1 Wealth."
