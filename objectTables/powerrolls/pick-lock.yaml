id: 8561a46b-5696-5d93-af11-4ba594f5a308
name: Pick Lock
description: Picking the lock on a farmer's tool shed doesn't require a test. Call for a test that uses the Pick Lock skill when a hero attempts picking a lock while under time pressure or when trying to get out of or into a particularly secure location or object.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: fc095c29-84cd-4e3f-8f65-03cd7a7736ad
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Open a Noble's Office"
  description: A hero wants to gain access to a noble's office (for totally legitimate reasons, certainly), but they'd prefer to avoid incorporating explosions into the plan. They grab a lockpick and get to work.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero unlocks the noble's office, but it takes them some time. Just as the lock clicks, guards notice the hero and approach them for questioning."
  - "(Success): The hero unlocks the door without drawing suspicion."
  - "(Success with Reward): As 12-16, and the hero learns a trick to disarming similar locks. The hero no longer needs to make a test to pick any locks at this location."
- name: "Medium: Unlock a Villain's Vault"
  description: A hero attempts to unlock the vault door in a villain's lair.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to pick the lock."
  - "(Success with Consequence): The hero is so concentrated on opening the lock that they don't notice the trap. They unlock the door, but not before a needle darts out, coated with poison. The hero takes 2d10 poison damage."
  - "(Success): The hero unlocks the door without incident."
  - "(Success with Reward): As 17+, and as the hero unlocks the door, they notice a hidden wall panel next to it. The wall panel contains several occult books, which count as project sources for finding forbidden lore with the Discover Lore downtime project (see Chapter 12 in Draw Steel: Heroes)."
- name: "Medium: Unlock Hanging Manacles"
  description: A hero in a set of hanging manacles has managed to hide a lockpick in their palm. Now they have a chance to get free.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to pick the lock."
  - "(Success with Consequence): The hero picks the lock and frees themself, but their pick breaks, preventing them from using it again."
  - "(Success): The hero picks the lock and frees themself."
  - "(Success with Reward): As 17+, and the hero manages to rig the manacles in such a way that they can get back in them and have the cuffs appear to be locked."
- name: "Hard: Get by a Soul Scanner"
  description: Aboard a voiceless talker vessel, a hero attempts to get through a locked door that scans your body to allow only synlirii through. Just because a lock doesn't require a key doesn't mean it can't be picked.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to get the door open, and their tampering immediately raises the alarm. Guards are on the way."
  - "(Failure): The hero fails to open the door."
  - "(Success): The hero gets the door open."
  - "(Success with Reward): As 17+, and the hero manages to add their own form to the system, allowing them to open any door in the vessel without needing to make another test."
