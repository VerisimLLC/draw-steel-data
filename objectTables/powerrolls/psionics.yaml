id: bafed26a-bd48-51d3-9790-06338334e4fd
name: Psionics
description: A hero makes a test that uses the Psionics skill to recall vital information about psionic powers and those who employ them, or to interact with or bypass a psionic effect when there's risk of failure. Knowing that someone speaking telepathically is using psionics doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 4dc7f5ed-c9f8-466a-81fb-b4abec2a0b45
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Determine Psionic Use"
  description: A hero attempts to discern whether a foe they are observing is using magic or psionics.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero identifies that the foe is using psionics, but the foe senses the hero's scrutiny and gains an edge on the first power roll made against the hero."
  - "(Success): The hero slyly identifies that the foe is using psionics."
  - "(Success with Reward): As 12-16, and the hero understands how two of the foe's psionic abilities work."
- name: "Medium: Recall the Psionicist"
  description: Trying to gain access to a restricted area, a hero attempts to recall the name of a famed psionics instructor who tutors nobles in this city.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to recall the name of the psionicist."
  - "(Success with Consequence): The hero recalls the name of the psionicist but hesitates when providing the name. The NPC being told the name complies for now but later becomes suspicious and takes action to investigate or oppose the hero."
  - "(Success): The hero recalls the name of the psionicist and doesn't raise further suspicion."
  - "(Success with Reward): As 17+, and the NPC hearing this allows the hero into the restricted area and gives them a tour of the place, taking the hero directly to wherever they want to go and then leaving them alone."
- name: "Hard: Disable a Psionic Shield"
  description: A hero attempts to disable a psionic shield that guards a valuable treasure.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to disable the shield and takes 2d6 psychic damage."
  - "(Failure): The hero fails to disable the psionic shield."
  - "(Success): The hero disables the psionic shield."
  - "(Success with Reward): As 17+, and the hero absorbs the psionic energy of the shield. At the start of the next combat encounter, they gain 2 surges."
- name: "Hard: Find the Hidden Academy"
  description: A hero tries to determine which of several mountain peaks holds a hidden talent academy.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero selects the wrong mountain, resulting in an encounter with monsters or a significant loss of time."
  - "(Failure): The hero is unsure which mountain holds the academy."
  - "(Success): The hero identifies the correct mountain."
  - "(Success with Reward): As 17+, and the hero knows about any dangerous creatures guarding the mountain pass, giving them an edge on tests made to sneak by the foes."
