id: 62776200-58ec-51c4-a460-605c543242d2
name: Timescape
description: The timescape is vast and practically covers all of existence! Call for a test that uses the Timescape skill when a hero attempts to recall obscure lore about specific worlds of the timescape outside of the mundane world that could aid them in their adventures, and if the knowing (or not knowing) of that detail would add drama to the story. Recalling trivial timescape lore doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Identify Home World"
  description: A hero meets an aspiring retainer human with a strange accent who claims to be from Dalrath. The hero knows their accent isn't from there ... or any place on Orden! Most humans are born and raised on Orden, but there are exceptions. This person is clearly one ... but which world is their home?
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero knows the potential retainer comes from the sun, speaking with an accent that is the language of the heliox, the elemental folk native to the sun. The retainer realizes that the hero has figured them out and asks them to keep it a secret."
  - "(Success): The hero identifies the aspiring retainer without drawing suspicion."
  - "(Success with Reward): As 12-16, and the aspiring retainer trusts the human if asked about it. They tell the human they are on the run from heliox bounty hunters trying to collect a massive gambling debt."
- name: "Medium: Know Bilocation Destination"
  description: A hero enters a metal temple full of shifting gears and machinery that is an area of bilocation--a place where the borders between worlds is thin. A portal to another world opens and closes in this place randomly, but where does it lead? The hero can attempt to divine the portal's location by examining their surroundings while the portal is open.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero doesn't know where the portal leads."
  - "(Success with Consequence): The hero knows the portal leads to Axiom, the Plane of Uttermost Law. However, they take so long to figure this out that the portal closes, and they can't predict when it will open again."
  - "(Success): The hero determines the portal leads to Axiom, the Plane of Uttermost Law, before the portal closes."
  - "(Success with Reward): As 17+, and the hero also knows the portal leads to the Temple of Order, a nearly identical temple to the one they currently occupy, just several worlds away and full of memonek."
- name: "Hard: Operate a Synliroi Blaster"
  description: A hero finds the psionic blaster of a voiceless talker and attempts to activate it.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero attempts to operate the blaster, and it explodes in their hand. They take 3d6 damage."
  - "(Failure): The hero can't operate the blaster. They can repeat the test, but if they get this result again, treat it as a tier 1 result."
  - "(Success): The hero knows how to operate the blaster. They gain a +1 damage bonus with ranged weapon abilities while using the blaster."
  - "(Success with Reward): As 17+, and the hero can teach anyone else how to use the blaster as a respite activity."
