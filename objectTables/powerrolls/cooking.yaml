id: f10cf42d-1ff5-509a-a021-90a5ac4a955a
name: Cooking
description: Cooking a nutritious meal for friends and loved ones doesn't require a test. Call for a test that uses the Cooking skill when a hero is preparing a meal of an extraordinary nature, if they lack time or cooking utensils, or when those who eat the meal are particularly discerning.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Cook to Impress"
  description: A hero cooks a meal to impress someone important, using rare methods and ingredients. The goal is for the guest to converse with the hero after the meal.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero creates a good meal, but the guest is whelmed. The guest agrees to meet, but the hero takes a bane on tests made to influence the guest during the conversation."
  - "(Success): The hero creates an excellent meal, and the guest is willing to engage in conversation with the hero."
  - "(Success with Reward): The hero prepares a memorable meal that becomes the guest's new favorite. For the next hour, the hero gains an edge on tests made to influence the guest."
- name: "Medium: Cook Under Duress"
  description: A hero must prepare a critical meal with no time and few ingredients.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The meal is a disaster. If served, it leaves those who dine deeply dissatisfied and the hero has a double bane on tests made to influence them during and for 1 hour after the meal."
  - "(Success with Consequence): The hero cooks a great meal for most guests, but the guest the hero most hoped to impress falls ill from the meal. The guest is unavailable for the next hour, and the hero takes a bane on the test they make to influence the guest."
  - "(Success): The hero cooks a great meal!"
  - "(Success with Reward): The meal is a success, and diners shower the hero with accolades. For the next year, whenever the hero negotiates with anyone in attendance, their Renown is equal to that person's impression score."
- name: "Medium: Cover the Taste of Poison"
  description: A hero prepares a poisoned meal and doesn't want their guest to realize something is amiss.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to cover the taste of the poison, and the guest refuses to try the meal after smelling it, worried something is off (though not necessarily suspecting foul play)."
  - "(Success with Consequence): The guest eats the meal but realizes they have been poisoned just as the poison does its thing. They accuse the hero of this publicly as the toxin takes hold."
  - "(Success): The guest eats the meal and is oblivious to the poison until its effects are in full swing."
  - "(Success with Reward): As 17+, and the hero is able to make a little poison go a long way thanks to their culinary skills. They get to keep an extra dose."
- name: "Hard: Craft Tools From Food"
  description: In a pinch, a hero can use ingredients to fashion crude tools or weapons, such as baking a key or fashioning a club from bread!
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The first time the tool or weapon is used, it breaks and the attempt to use the item fails disastrously."
  - "(Failure): The attempt to craft the item from food fails."
  - "(Success): The hero crafts a tool or weapon that lasts for 1 hour."
  - "(Success with Reward): As 17+, except the tool or weapon lasts indefinitely."
