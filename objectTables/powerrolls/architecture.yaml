id: e4c739c8-674e-5e57-bec9-49c54fc5cd75
name: Architecture
description: The Architecture skill should be reserved for tests where a hero attempts a dangerous or pivotal task that relies on their knowledge of creating and destroying structures. No test is required to read a standard blueprint at a well-lit desk, but deciphering ancient schematics on horseback or while hostages wait to be rescued requires a hero, not just a scholar.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Create a Shelter"
  description: A hero attempts to build a makeshift shelter during a sandstorm.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The shelter is crudely constructed, allowing biting sand to whip through its gaps. The hero loses 1d6 Stamina, and the structure collapses once the storm has passed."
  - "(Success): The shelter is simple but sturdy, protecting the hero from the storm. After the storm passes, the hero can choose to dismantle the shelter, leaving no sign that it was there. Otherwise, it stands on its own for up to 1d6 days."
  - "(Success with Reward): The shelter protects the hero and up to 10 other creatures from the storm. After the storm passes, the hero can choose to dismantle the shelter, leaving no sign that it was there. Otherwise, it stands on its own for up to 1d6 months."
- name: "Medium: Surpass a Vehicle's Limits"
  description: A hero attempts to keep a moving vehicle functional even after it's been destroyed.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The vehicle remains destroyed and ceases to function."
  - "(Success with Consequence): The hero prevents the vehicle's total destruction, but it can take only one more hit. The vehicle regains 1 Stamina. It can benefit from this result only once before being properly repaired."
  - "(Success): The hero jury-rigs broken parts or lashes the structure together, keeping it from falling apart for a little while longer. The vehicle regains Stamina equal to half its Stamina maximum. It can benefit from this result only once before being properly repaired."
  - "(Success with Reward): The hero is able to improvise actual repairs on the fly. The vehicle regains Stamina equal to the hero's level plus half its Stamina maximum. It can benefit from this result only once before being properly repaired."
- name: "Hard: Topple a Tower"
  description: A hero attempts to collapse an abandoned sentry tower on top of an invading army of war dogs.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero loses 2d6 Stamina from overexertion. The tower stands resolute and stubborn. The war dogs spot the hero and realize what they're trying to do."
  - "(Failure): The tower is sturdier than it looks and does not fall. The hero can attempt this test again, but another failure is treated as a failure with a consequence."
  - "(Success): The tower topples onto the invaders, and the crush of stone and timber decimates their forces. During the next war dog encounter, the Director reduces the amount of Malice they gain each round by 1."
  - "(Success with Reward): As 17+, and the entire area becomes difficult terrain. The war dogs' advance is delayed by 1d6 hours as they regroup. During the next war dogs encounter, the Director reduces the amount of Malice they gain each round by 2."
