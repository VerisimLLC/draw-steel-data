id: c1b1c0e5-a6d6-5b66-8621-f3781ed63d13
name: Monsters
description: The Monsters skill is generally good for tests where a hero attempts to recall obscure and important information about a monster. Knowing that a fire-breathing dragon is resistant to fire damage doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: bfcd8bd5-af82-4e2e-bea9-2a1d6dfe558a
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Inspect Monster Anatomy"
  description: A hero examines a monster's corpse to understand the creature's origins.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero figures out the creature is a demon from the Abyssal Wasteland, but their venture through viscera left them stinking terribly. They take a bane on tests made to influence other creatures until they take time to clean up during a respite."
  - "(Success): The hero figures out the creature is a demon from the Abyssal Wasteland."
  - "(Success with Reward): As 12-16, and the hero knows any resistances and weaknesses the creature has."
- name: "Medium: Examine a Victim's Corpse"
  description: A hero attempts to figure out what kind of monster killed a person by examining the victim's corpse.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to identify the creature."
  - "(Success with Consequence): The hero can't identify the creature, but can identify the weapon (such as an axe or claws) or supernatural effect that killed the victim."
  - "(Success): The hero identifies the creature."
  - "(Success with Reward): As 17+, and the hero can track the creature's position from the victim's corpse without needing to make another test."
- name: "Hard: Assess a Monster's Lair"
  description: A hero finds themself in what is clearly the lair of a monster, but they don't know what sort of creature inhabits the place. They attempt to figure out who lives here based on the environmental clues.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero incorrectly believes they are in the lair of an ogre."
  - "(Failure): The hero doesn't know what type of creature lives here."
  - "(Success): The hero correctly realizes they are in the lair of a troll."
  - "(Success with Reward): As 17+, and the hero knows which direction the troll is in relative to them without needing to make another test."
- name: "Hard: Care for a Monster Egg"
  description: A hero attempts to figure out how to best care for a monster egg they found.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero doesn't know how to best care for the egg and while examining it, they drop the egg and crack it. If the egg isn't taken to a monster expert in 24 hours, the creature inside will die."
  - "(Failure): The hero doesn't know how to best care for the egg."
  - "(Success): The hero successfully determines the best care routine for the egg. The hero can start a downtime project to care for the egg, which has 3,000 project points. Once the project is complete, the egg hatches."
  - "(Success with Reward): As 17+, except the hero starts the downtime project with 500 project points already invested."
