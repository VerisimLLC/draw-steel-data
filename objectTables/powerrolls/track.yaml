id: 5b3ea338-bb75-5465-97d6-a5edc741a228
name: Track
description: No test is required to track a creature leaving an obvious trail through mud. Call for a test that uses the Track skill whenever a creature's trail is hard to follow and time is of the essence. The failure of a test made to track a creature shouldn't grind the story to a halt but rather make life harder for the hero.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Track a Band of Creatures"
  description: A hero attempts to track a band of creatures across grassy plains.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Complication): The hero tracks the band, but the hero unwittingly alerts the creatures that they're being followed and can't catch them surprised ... and the hero might get ambushed!"
  - "(Success): The hero tracks the band of creatures without being noticed."
  - "(Success with Reward): As 12-16, and the hero sneaks up on the creatures before they reach their intended destination."
- name: "Medium: Track Across Hard Earth"
  description: A hero tries to track an individual creature across hard earth.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to track their quarry."
  - "(Success with Consequence): The hero succeeds in tracking their quarry but loses 1d6 Stamina trying to keep up with the creature."
  - "(Success): The hero tracks their quarry without incident."
  - "(Success with Reward): As 17+, and the hero learns an important detail about their quarry, such as a disease they have, a favorite food, a phobia, or a weakness to a particular damage type."
- name: "Hard: Follow the Monkey"
  description: A hero races to track a monkey who stole something of value. The monkey leaps from tree to tree, making the trail hard to follow.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero loses the trail, stumbling into brambles and losing 2d6 Stamina."
  - "(Failure): The hero loses the monkey's trail."
  - "(Success): The hero tracks the monkey to their nest."
  - "(Success with Reward): As 17+, and the surprised monkey drops the stolen item and flees without any mischief."
- name: "Hard: Follow Snow-Covered Tracks"
  description: A hero tracks a creature after snow has covered their tracks.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero wanders into a frigid snow-covered stream. The hero loses the trail and 1 Recovery."
  - "(Failure): The hero loses the trail."
  - "(Success): The hero tracks the creature to their destination."
  - "(Success with Reward): As 17+, and thanks to howling winds, the hero automatically succeeds at tests to approach the creature undetected."
