id: cf75d8ee-e236-57da-bff7-b4cee797b0ae
name: Climb
description: A tree with low-hanging branches requires no test to climb. Reserve tests that use the Climb skill for instances where a hero attempts to scale a structure with few or perilous grips and that includes danger or time pressure, such as a pack of wolves nipping at the hero's heels.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Climb a Crumbling Tower"
  description: A hero attempts to climb to the top of an old tower with crumbling, unstable walls.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero climbs the tower poorly, getting scraped and scuffed. The hero loses 1d6 Stamina but reaches the top of the tower."
  - "(Success): The hero reaches the top of the tower without incident."
  - "(Success with Reward): As 12-16, and the hero can remember the exact path they took. Any creature they direct on climbing the tower automatically reaches the top without making a test."
- name: "Medium: Climb a Giant Spider Web"
  description: A hero attempts to climb up the web of a giant war spider in a goblin cave.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to climb the web. The hero can try again, but if they get this result a second time, they are restrained (save ends), and their attempt draws the attention of nearby spiders."
  - "(Success with Consequence): The hero climbs the web, but an important item they carry (your choice) gets caught in the web. Cutting it free draws the attention of nearby spiders."
  - "(Success): The hero reaches the top of the web without incident."
  - "(Success with Reward): As 17+, and the hero finds a Healing Potion (or other 1st-echelon consumable of your choice) stuck in the web, which can be removed without incident."
- name: "Hard: Climb a Flying Airship"
  description: A hero attempts to scale the side of a flying airship to which they cling.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero slides to the bottom of the airship. They can attempt the test again, but if they get this result a second time, they plummet."
  - "(Failure): The hero fails to scale the side of the airship. They can attempt this test again."
  - "(Success): The hero reaches the deck of the airship."
  - "(Success with Reward): As 17+, and the hero avoids notice when climbing over the side of the vessel."
- name: "Hard: Climb Rigging in a Storm"
  description: A hero attempts to climb up a ship's rigging during a thunderstorm as the vessel sails through choppy seas.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero climbs up to 1d6 squares and then falls off the rigging. If the result of the die roll was even, they land on deck. On an odd result, they land in the water."
  - "(Failure): The hero fails to climb up the rigging. They can attempt this test again."
  - "(Success): The hero reaches the top of the rigging."
  - "(Success with Reward): As 17+, and once during this storm, the hero can swing to any location on the rigging or on the ship's deck where the rigging can reach as a free maneuver without needing to make another test."
