id: 84c69393-6a1a-5fbb-b81d-082fd90dcb60
name: Intimidate
description: Convincing someone already frightened for their life when the hero clearly has the upper hand requires no test to intimidate! You can usually call for a test that uses the Intimidate skill when a hero attempts to coerce, frighten, or pressure someone into action who has a good reason and the will to resist the hero.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: cb214a42-7f8c-4d02-b6ac-1399724a8b5f
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Get a Cheating Confession"
  description: A hero attempts to scare a cheater into confessing and returning their ill-gotten winnings to the person swindled.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The cheater whines and protests before finally confessing loudly--too loudly. They draw the attention of the guards who wish to have more than a word with the cheater and anyone near them."
  - "(Success): The hero scares the cheater into confessing and returning their winnings."
  - "(Success with Reward): As 12-16, and the cheater slips in an interesting rumor about other shady dealings as they leave."
- name: "Medium: Scare Away the Lookout"
  description: A hero attempts to terrify a lookout into abandoning their post.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The lookout refuses to leave their post and threatens to sound the alarm if the hero doesn't leave immediately."
  - "(Success with Consequence): The lookout abandons their post but runs away screaming as they do, drawing the attention of those nearby who arrive soon after."
  - "(Success): The lookout abandons their post quietly and doesn't warn anyone on the way."
  - "(Success with Reward): As 17+, and the lookout also gives the heroes a password that allows them to get into some of the more restricted areas of the place they guard."
- name: "Hard: Shout Out a Monarch in Court"
  description: A hero attempts to convince a monarch to sit down and shut up during a public argument in front of their court.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The monarch won't be silenced and orders the hero arrested for insolence."
  - "(Failure): The monarch won't be silenced."
  - "(Success): The monarch shuts up."
  - "(Success with Reward): As 17+, and the monarch publicly apologizes to the hero for losing their temper. The hero gains an edge on tests made to influence the monarch for the next 24 hours."
- name: "Hard: Stare Down an Invading Army"
  description: A hero attempts to stare down the head general of an invading army, daring them to continue with the city's assault and face their wrath.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The general shows no fear and orders their forces to attack the hero directly to make an example of them."
  - "(Failure): The general ignores the hero."
  - "(Success): The general hesitates, ordering their army to halt their assault, but doesn't order a retreat either. The army is paused ... for the moment."
  - "(Success with Reward): The general has their army fall back to regroup and form a plan for dealing with the elite warrior they just saw on the battlefield."
