id: d927b731-ea72-5809-b69e-c7aac802f0e0
name: Lift
description: There's no need for a test when a hero is lifting up anything that's less than their body weight. Reserve tests that use the Lift skill for situations where hoisting an object puts the hero or others at risk of injury due to the weight involved and the peril of the moment.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Lift a Keg to Win a Bet"
  description: A hero, having talked up their physical prowess in a tavern, attempts to lift a keg overhead to impress the incredulous bar patrons.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero hoists the keg overhead and grits their teeth so no one can tell how badly their back hurts. They lose 1d6 Stamina."
  - "(Success): The hero lifts the keg without issue."
  - "(Success with Reward): The hero tosses the keg from hand to hand overhead, winning over the crowd. They gain an edge on the next test made to interact with anyone who just saw them do it."
- name: "Medium: Lift a Wagon"
  description: A hero attempts to free a trapped civilian from the wreckage of a crashed wagon pressing down upon him.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to lift the wagon."
  - "(Success with Consequence): The hero strains beyond their limit. The civilian is freed from the wreckage, but the hero loses 1 Recovery from the massive strain on their body."
  - "(Success): The hero lifts the wagon, saving the civilian."
  - "(Success with Reward): The hero hurls the wagon from the civilian, freeing them. The deed impresses a group of passersby, who share the story wherever they go. For the next 30 days, the hero's Renown is 1 higher than normal."
- name: "Hard: Pull a Magic Gem From an Altar"
  description: With only moments to spare before the completion of a murderous ritual, a hero attempts to rip a corrupting soulgem from a sacrificial altar.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero can't withstand the soulgem's evil power, and it tears through their body. They are unable to pull it free, falling prone and gaining corruption weakness 5 until they finish a respite."
  - "(Failure): The hero's grip fails. They are unable to pull the soulgem from the altar."
  - "(Success): The hero pulls the soulgem free from its setting."
  - "(Success with Reward): The hero rips the soulgem free with incredible strength, siphoning some of the jewel's power and gaining corruption immunity 5 until they finish a respite."
- name: "Hard: Brace a Falling Statue"
  description: A hero attempts to catch and hold a massive falling statue, giving those beneath it time to escape.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The statue crashes down on top of the hero and the people below, dealing 3d10 damage to each creature it falls on and knocking them prone."
  - "(Failure): The hero catches the statue, giving everyone time to move except for themself. The statue falls on the hero, dealing 3d10 damage to them and knocking them prone."
  - "(Success): The hero catches the statue, allowing everyone beneath it to escape, and then safely guides it to the ground."
  - "(Success with Reward): As 17+, except that a Healing Potion or other consumable treasure of the hero's echelon or lower falls from the statue's mouth at the hero's feet."
