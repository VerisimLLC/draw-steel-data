id: 2db479c6-3c41-57e9-b4dc-db7589a2a90a
name: Culture
description: Tests using the Culture skill work best when a hero attempts to recall obscure anthropological lore that will help them influence a leader or group of people who are important to the plot. Understanding well-known customs of large cultures doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 61709a09-1a95-4726-b722-c40639cae405
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Impress a Local Leader"
  description: A hero attempts to impress a leader with a ritual greeting that is important to the local culture.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero performs the greeting clumsily. The leader appreciates the effort, and the hero gains an edge on tests made to interact with the leader for the next 24 hours. The leader's advisors are insulted, and the hero takes a bane on tests made to interact with the advisors for the next 24 hours."
  - "(Success): The hero performs the greeting well and gains an edge on the next test made to interact with the leader for the next 24 hours."
  - "(Success with Reward): As 12-16, and the hero impresses the leader's advisors and gains an edge on tests made to interact with them for the next 24 hours."
- name: "Medium: Identify Rank"
  description: A hero attempts to learn how much authority a person has within a culture based on the clothing they wear.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero is unable to determine the person's rank."
  - "(Success with Consequence): The hero determines the person is the leader of a specific group of elite warriors who act within a greater army. While uncovering this information, they offend the person and take a bane on the next test they make to influence them."
  - "(Success): The hero determines the person is the leader of a specific group of elite warriors who act within a greater army."
  - "(Success with Reward): As 17+, and the hero recalls a specific cultural sign of respect to show the leader, which gains the hero an edge on the next test they make to interact with them."
- name: "Hard: Recover From a Faux Pas"
  description: As an important political meeting with a group of dwarves from Kal Kalavar suddenly takes a turn for the worst, a hero attempts to figure out how they might have accidentally offended the group.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero believes they offended the dwarves with a joke they made earlier. This isn't the case. If they apologize for the joke, the dwarves shake their heads at the ignorance of the hero and walk away from the conversation."
  - "(Failure): The hero fails to figure out how they have offended the dwarves."
  - "(Success): The hero figures out that while speaking to the dwarves, they accidentally made a hand gesture considered quite rude in Kal Kalavar. If they apologize for the gaff, the dwarves are impressed, and the hero gains an edge on the next test they make to interact with the dwarves."
  - "(Success with Reward): As 17+, except the hero is so impressive in their apology and knowledge of Kal Kalavar's culture that they have a double edge on the test they make to interact with the dwarves."
