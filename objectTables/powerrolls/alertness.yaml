id: 778f7fbe-a530-578a-99ce-66f426bfe960
name: Alertness
description: Tests that use the Alertness skill are often reactive--tiptoed or blundered into through carelessness or distraction. But the Alertness skill also covers proactive searches, deliberate scrutiny, and dutiful vigilance. The prudent hero is ever alert, knowing that adventure often comes when it's least expected--especially to those who don't seek it.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: db532974-aa0a-41a9-aacf-4adc1e6121d3
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Notice an Ambush"
  description: A hero attempts to notice a gnoll ambush before it's sprung.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero spots the ambush at the last minute. The gnolls are no longer hidden, but it's too late to avoid a confrontation. Neither side is surprised."
  - "(Success): The hero spots the ambush with enough time to prepare for battle or even avoid it entirely, if they choose. Neither side is surprised."
  - "(Success with Reward): The hero spots the ambush well in advance, and the party catches the gnolls surprised."
- name: "Medium: Track a Distant Plea"
  description: A hero attempts to follow a distant cry for help to its source.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The cry fades away almost as suddenly as it rang out, leaving nothing but eerie silence. The hero can't locate the source of the cry but can attempt this test again."
  - "(Success with Consequence): The hero tracks the cry to its origin but must pause often to reorient themself. By the time they arrive at the scene where the cry was made, whoever or whatever called for help has already left the area."
  - "(Success): Moving quickly, the hero tracks the cry to its source."
  - "(Success with Reward): As 17+, and the hero can choose to arrive hidden to assess the situation before making their presence known."
- name: "Hard: Spot an Explosive Rune"
  description: A hero attempts to spot a tiny explosive rune carved into the side of a coin.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero triggers the trap. The rune explodes in a 2 burst, catching each creature and object in the area in the conflagration (see the next test). The hero takes a bane on the test made to avoid the explosion."
  - "(Failure): The hero triggers the trap. The rune explodes in a 2 burst, catching each creature and object in the area in the conflagration (see the next test)."
  - "(Success): The hero notices the rune and does not trigger it."
  - "(Success with Reward): As 17+, and the hero understands how to bypass or disable the rune, though they may not have the means to do so at hand."
- name: "Hard: Avoid an Exploding Rune"
  description: After a rune trap ignites, a hero attempts to dodge the explosion.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The explosion throws the hero high into the air. They take 18 fire damage and are vertical pushed 6 squares."
  - "(Failure): The hero takes 9 fire damage and is vertical pushed 3 squares."
  - "(Success): The hero avoids the blast."
  - "(Success with Reward): As 17+, and the hero can grab one creature as they avoid the blast, allowing that creature to automatically succeed on this same test."
