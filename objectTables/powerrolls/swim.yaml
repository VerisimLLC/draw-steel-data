id: 9f8342fc-379e-5b26-bc94-ab70637dee66
name: Swim
description: You can call for a test that uses the Swim skill when a hero tries to navigate rough waters, dive long distances, or avoid a dangerous, watery obstacle such as a whirlpool. Crossing a calm, shallow river requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 91ee7ea9-f331-42df-8f4b-e4a475d37a98
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Swim to the Wreck"
  description: A hero attempts to swim down and explore the depths of a sunken pirate ship.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero swims down to the pirate ship without issue, but their movements cause sediment and debris to stir in the water, clouding visibility. They take a bane on tests made to find creatures and objects while in the water."
  - "(Success): The hero swims to the wreck without incident."
  - "(Success with Reward): As 12-16, and the hero can immediately identify whatever it is they came down for without another test."
- name: "Medium: Dive off the Waterfall"
  description: A hero attempts to dive off a waterfall into a river below and avoid the sharp rocks at the base.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero falls into the rocks. They start the next combat encounter weakened and slowed (save ends)."
  - "(Success with Consequence): The hero dives into the water and avoids the rocks, but they hit the water incorrectly and take 1d6 damage."
  - "(Success): The hero dives into the river safely."
  - "(Success with Reward): As 17+, and the hero can direct other creatures on how to dive safely. Any creature directed by the hero gains an edge on their test to dive."
- name: "Medium: Navigate the Rapids"
  description: A hero cast into a rough, rocky river must navigate rapids to make it to shore.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero is caught in the river's current and begins to suffocate."
  - "(Success with Consequence): The hero makes it to shore but is slammed against rocks on the way, taking 2d6 damage."
  - "(Success): The hero swims to shore safely."
  - "(Success with Reward): As 17+, and when the hero reaches the banks of the shore, they discover the project materials for a downtime crafting project they or one of their allies already has the project source for."
- name: "Hard: Swim Through a Whirlpool"
  description: A hero attempts to swim through a whirlpool.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero makes no progress as they get caught in the whirlpool and lose 1 Recovery as they are tossed about. They begin to suffocate."
  - "(Failure): The hero makes no progress as they get caught in the whirlpool and begin to suffocate."
  - "(Success): The hero swims through the whirlpool safely."
  - "(Success with Reward): As 17+, and the hero can bring another creature along who doesn't need to make a test."
