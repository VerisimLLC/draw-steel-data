id: 305c1186-fe58-51ab-b2d5-1da65d1b9305
name: Jewelry
description: Call for a test that uses the Jewelry skill only when a hero attempts to repair a piece of jewelry or work with gems in a limited time or dangerous situation or tries to identify a rare piece. The making of jewelry typically happens as part of a downtime project and not a typical test. Making slight alterations to a piece of jewelry without any time pressure requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 192827b0-ef39-4d5f-840a-b3c654e7b158
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Change an Engraving"
  description: A hero attempts to quickly change an engraving inside a pendant to make it look like the necklace belongs to them.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero changes the engraving, but the hasty job means they don't get to make it personal to themself. Anyone could claim ownership of the necklace."
  - "(Success): The hero changes the engraving and makes it personal to themself."
  - "(Success with Reward): As 12-16, and the hero can also alter the pendant in another way to make it appear as a different necklace."
- name: "Medium: Find the Real Ring"
  description: A hero must determine which ring is real among a pile of fifty counterfeits rigged to explode.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero chooses the wrong ring and takes 2d6 fire damage as the ring explodes."
  - "(Success with Consequence): The hero grabs the right ring, but knocks another down in the process. The ring explodes at their feet, and the hero takes 1d6 fire damage."
  - "(Success): The hero chooses the right ring without triggering the traps."
  - "(Success with Reward): As 17+, and the hero can also scoop up one of the other rings gently enough to keep it as a consumable. The fake ring can be hurled up to 5 squares at a creature or object as a maneuver, and the target takes 2d6 fire damage."
- name: "Medium: Replace a Crown Jewel"
  description: A hero manages to be alone with a monarch's crown for only a few minutes. They attempt to remove the biggest stone and replace it with a fake.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to remove the gemstone."
  - "(Success with Consequence): The hero swaps the gemstone, but damages the setting. Each time the crown is moved, there is a 10 percent chance that the fake jewel falls from it."
  - "(Success): The hero swaps the gemstones without incident."
  - "(Success with Reward): As 17+, and the hero has time to swap a second stone without making another test."
- name: "Hard: Remove a Gemstone Set to Blow"
  description: A hero attempts to remove a rigged gemstone from a magic mosaic that threatens to blast them with fire.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to remove the gemstone and sets off the trap, taking 3d6 fire damage."
  - "(Failure): The hero fails to remove the gemstone."
  - "(Success): The hero removes the gemstone, and the trap deactivates."
  - "(Success with Reward): As 17+, and the hero can also remove a section of the mosaic around the gem, which reveals a hidden compartment containing a Healing Potion (or other 1st-echelon consumable of your choice)."
