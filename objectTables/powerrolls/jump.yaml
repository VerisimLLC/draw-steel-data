id: 5d9dcd50-48fc-5133-b05d-1ac364e1ca0d
name: Jump
description: If a hero tries to reach an area or clear an obstacle by jumping, call for a test that uses the Jump skill if there's time pressure or the leap is particularly difficult or dangerous. In normal situations, a creature can automatically jump a number of squares up to their Might or Agility score (minimum 1 square) and reach a height of 1 square as part of that movement without needing to make a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 7edbc5b3-92f7-4c39-bd05-165bb2990924
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Grab the Ledge"
  description: A hero leaps up to grab a ledge just beyond their reach.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero manages to jump higher than they usually can reach, but this requires significant exertion to grasp the ledge and pull themself up. The hero loses 1d4 Stamina in the process."
  - "(Success): The hero pulls themself up onto the ledge safely."
  - "(Success with Reward): As 12-16, and the feat leaves the hero brimming with confidence. They gain 1 additional Heroic Resource at the start of their next combat encounter."
- name: "Medium: Grab the Rope and Swing"
  description: A hero leaps across a chasm to grab a swinging rope and land safely on the other side.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to time their leap and doesn't swing far enough, returning to where they started."
  - "(Success with Consequence): The hero grabs the rope and swings across the chasm, but they land prone on the other side and lose 1d4 Stamina."
  - "(Success): The hero grabs the rope and swings across the chasm safely."
  - "(Success with Reward): As 17+, and the hero lands on the other side with momentum on their side. As a free maneuver, the hero can choose to either move up to their speed, use the Knockback maneuver, or assist the next creature attempting to cross the chasm, giving them a double edge on their test."
- name: "Hard: Leap the Blade"
  description: A hero vaults past a scythe blade trap they previously detected.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to get past the trap, and it deals maximum damage to the hero."
  - "(Failure): The hero tries to get past the trap but is forced to turn back. They can attempt this test again with a bane."
  - "(Success): The hero vaults past the trap."
  - "(Success with Reward): As 17+, and any creatures the hero directs on making it past the trap have a double edge when making this test."
- name: "Hard: Make a High-Speed Jump"
  description: A hero attempts to jump from their mount and through a moving carriage's window.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero slams into the side of the carriage and falls to the ground prone."
  - "(Failure): The hero fails to jump across but falls back onto their mount."
  - "(Success): The hero jumps into the moving vehicle."
  - "(Success with Reward): As 17+, and the momentum gives them an edge on the next Might or Agility test they make."
