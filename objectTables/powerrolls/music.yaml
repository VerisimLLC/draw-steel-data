id: a1e161a0-ca70-53cc-8c86-68acd933f6d2
name: Music
description: Call for a test that uses the Music skill only when the hero's performance could have an impact on the action or plot in a significant way. A hero strumming their lute on the corner for coin doesn't require a test, but that same hero playing a scandalous song to incite a riot does.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Distract a Crowd"
  description: A hero attempts to entertain and distract a crowd to allow their allies to move unseen.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero distracts the crowd but rouses the jealousy of a fellow entertainer, who won't leave the hero alone for 1 hour after the performance."
  - "(Success): The hero distracts the crowd."
  - "(Success with Reward): As 12-16, and the hero gives such a good performance that their Renown increases by 1 while they are in the same neighborhood or settlement."
- name: "Medium: Play a Magic Melody"
  description: To progress through a room in a dungeon, a hero must play a complex melody correctly to open a door.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero makes too many mistakes and is unsuccessful."
  - "(Success with Consequence): The hero successfully plays the melody, but damages their instrument such that it can't be used again until it's repaired as a respite activity."
  - "(Success): The hero plays the song perfectly, and the door opens."
  - "(Success with Reward): As 17+, and the hero's melody inspires the hero and their allies to greatness. Each hero gains 1 additional Heroic Resource at the start of their next combat encounter."
- name: "Hard: Compete in a Musical Duel"
  description: An archdevil challenges a hero to a musical duel for their soul. If the hero wins, they get a favor from the devil.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero loses the duel. The devil smirks and teleports away, promising to claim the hero's soul when they shake off this mortal coil."
  - "(Failure): The hero plays well but loses the duel. The impressed devil offers to modify the deal--instead of the hero's soul, the devil is happy to take a leveled treasure the hero or one of their allies possesses."
  - "(Success): The hero wins the duel, and the devil promises them a favor. The archdevil isn't omnipotent, but their magic is vast and they have an army of devils at their disposal."
  - "(Success with Reward): As 17+, except the devil is so impressed that they grant the hero two favors."
- name: "Hard: Soothe the Beast"
  description: A hero plays a soothing song to attempt to calm a rampaging wyvern.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to calm the wyvern, who turns to attack them."
  - "(Failure): The wyvern ignores the hero."
  - "(Success): The wyvern stops their rampage and listens to the hero. They remain distracted for 1 minute or until they take damage."
  - "(Success with Reward): As 17+, except the wyvern flees the area once the song is done, provided no one harms them during the performance."
