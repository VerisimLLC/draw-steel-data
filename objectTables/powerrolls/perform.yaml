id: 75f9caf0-76a1-5824-ba93-66c674b9de38
name: Perform
description: All the world's a stage, but few players are worthy to tread the boards. Call for a test that uses the Perform skill when a hero's attempt to soak up the limelight could persuade others and affect the plot. Acting in a play at a festival for fun doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Attract Attention"
  description: Appearing as part of an acting troupe, a hero attempts to get the attention of a VIP audience member so they might secure a meeting with them after the performance.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero impresses the VIP, but they aren't the only one. Several other members of the troupe are also invited to meet with the VIP, so the hero has time for only two questions with the person."
  - "(Success): The hero secures a private meeting with the VIP."
  - "(Success with Reward): As 12-16, and the VIP is so impressed with the hero that they're willing to perform one (reasonable) favor for the hero without the need for the hero to make another test."
- name: "Medium: Rally Public Outrage"
  description: A hero attempts to spread the word of an innocent soul convicted for a crime they didn't commit by performing speeches, poems, or short plays in public spaces to anyone who will listen. If they rile up enough people, they might get the innocent freed.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero's message fails to move the people in power enough to care about the wrongfully accused."
  - "(Success with Consequence): The hero's message reaches the right magistrates, and the innocent party is set free. However, the hero has embarrassed the local authorities, who now follow the hero around, waiting for them to break a trivial law so they can strike."
  - "(Success): The hero's message reaches the right magistrates, and the innocent party is set free."
  - "(Success with Reward): As 17+, and the magistrates reach out to the hero, giving them the status of honorary constable for helping them solve a crime and right a wrong."
- name: "Hard: Perform a Poem to Stop a War"
  description: A high elf monarch is ready to declare war on a neighboring kingdom to avenge a fallen lover, but a hero hopes an epic poem in Hyrallic that tells of the suffering of troops dying in a bloody conflict can appease a ruler's desire for revenge.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The monarch believes the hero's performance is meant to mock him. He orders the hero removed from his presence by force."
  - "(Failure): The monarch is unmoved by the hero's performance."
  - "(Success): The performance convinces the monarch to not march to war and pursue another route to get justice for their lover. They might ask the heroes for help in this regard."
  - "(Success with Reward): As 17+, and the monarch is so grateful to the hero for opening their eyes that they give them a consumable treasure of the hero's echelon or lower."
