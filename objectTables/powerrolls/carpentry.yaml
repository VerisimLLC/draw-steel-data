id: 73ad4763-3dbd-5b55-ae9e-26046b718862
name: Carpentry
description: Anyone can sharpen a stick without a test. You should call for a test that uses the Carpentry skill when a hero's expertise means the difference between a functional piece of equipment and a pile of scrap wood.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 436ea6c1-6386-43b2-b074-020992cc73fd
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Carve a Clear Likeness"
  description: A hero attempts to carve the likeness of a building, object, or person out of a block of wood. They whittle and hew until it springs forth.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): Splinters! Horrible splinters! The likeness is complete, but at what cost? Well, the hero loses 1d6 Stamina, that's what cost."
  - "(Success): The hero creates an immediately recognizable likeness."
  - "(Success with Reward): The hero's work transcends imitation. It is art. It's so beautiful that giving it to a sapient creature grants the hero an edge on the next test made to interact with them."
- name: "Medium: Reinforce Windows"
  description: A hero attempts to quickly board up a building's windows with wood before it is besieged by a pack of zombies or other foes who are adept at murder (but terrible at woodcraft).
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to reinforce the windows."
  - "(Success with Consequence): The hero is able to produce a ramshackle defense. These sparse reinforcements break upon receiving any damage."
  - "(Success): The hero secures the windows, giving each 20 Stamina."
  - "(Success with Reward): As 17+, and the hero constructs redoubts with clever angles that allow heroes to attack the outside while preventing entry."
- name: "Hard: Construct a Siege Ladder"
  description: A hero attempts to jury-rig a ladder that can surmount a fortress wall. It's probably just a social visit.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): What's worse than no ladder? An unreliable ladder. The first person to climb the ladder gets halfway up it before it falls apart."
  - "(Failure): The hero fails to build the ladder."
  - "(Success): The hero builds the ladder."
  - "(Success with Reward): Through an ingenious application of small hinges, the hero develops a ladder that, while perfectly robust, can be quickly folded into a handheld mode for transport and concealment."
- name: "Hard: Jury-Rig a Glider"
  description: The only way to escape an oncoming disaster is by leaping off a cliff! A hero attempts to build a vehicle that can glide to safety.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to build the glider and leaves them with no lumber or supplies to attempt building anything else."
  - "(Failure): The hero fails to build the glider."
  - "(Success): The hero builds a glider that can support the weight of up to six creatures for one flight. The glider can move up to 10 squares horizontally or down at the end of each round and always descends 1 square at the end of this movement. The glider has 30 Stamina."
  - "(Success with Reward): At 17+, except the glider can be used for more than one flight. It lasts until destroyed."
