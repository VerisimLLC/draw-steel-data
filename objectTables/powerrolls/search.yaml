id: fb275799-8ee6-507a-a4c5-536e1763efb8
name: Search
description: Call for a test that uses the Search skill when the hero attempts to locate clues, objects, or people that are hard to find and they have limited time to do so. There's no need to call for a test if the hero has time to overturn every item of furniture in a room. You should never call for a test with failure as a possible outcome if the hero must find the thing for the story to advance.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 7f6d9375-0ab0-415c-8196-4d99e98aa12b
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Identify the Most Significant Item"
  description: A hero attempts to find the most significant item in a collection. Let the hero specify how the item is significant. It could be that they want to find the most valuable item, the item most important to the collection's owner, or an item that stands out in some other way.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero narrows their search down to two items, but can't determine which of the two is the most significant."
  - "(Success): The hero identifies the item correctly."
  - "(Success with Reward): As 12-16, and while examining the item, the hero learns another piece of useful information about its owner or creator or about a similar item."
- name: "Medium: Find the Mechanism"
  description: A hero in a manor parlor attempts to find a mechanism that opens a secret door.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to find the mechanism."
  - "(Success with Consequence): The hero finds the mechanism, but takes so long to do so that the manor's host comes down before they get a chance to engage the secret door."
  - "(Success): The hero finds the mechanism without being discovered."
  - "(Success with Reward): As 17+, and the hero also identifies a second nearby switch that turns off traps in the corridor beyond the secret door."
- name: "Medium: Locate the Pressure Plate"
  description: A hero searches a hallway floor, attempting to find a secret pressure plate that triggers a poison dart trap when engaged.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to find the plate."
  - "(Success with Consequence): The hero finds the pressure plate ... after stepping on it. If they raise their foot, the trap will go off!"
  - "(Success): The hero finds the plate before stepping on it."
  - "(Success with Reward): As 17+, and the hero also takes note of the pressure plate's unique make. They gain an edge on tests made to find other traps in this location."
- name: "Hard: Reconstruct a Murder"
  description: A hero attempts to learn what exactly went down at the scene of a murder by looking for clues.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero gets it totally wrong. They create a narrative with clues they find, but that narrative is nowhere close to what actually happened."
  - "(Failure): The hero fails to learn anything about the murder."
  - "(Success): The hero is able to recreate what happened at the murder scene, albeit without the name of the killer (unless they already know who did it)."
  - "(Success with Reward): As 17+, and the hero picks up so many clues that they gain an edge on the next test they make to gather further information about the murder."
