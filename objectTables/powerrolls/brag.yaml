id: 04cf4925-b76a-50e4-ba2e-e2520a4697d1
name: Brag
description: To achieve access to high-reward jobs, important social circles, or resources, sometimes a hero need to impress the right individual at the right time. Call for a test that uses the Brag skill when a hero seeks the favor of someone important by giving an account of their accomplishments. Impressing the average farmer doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: d533510d-0f1f-4ce3-a48c-cc21acadb6c6
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: One-Up a Rival"
  description: A hero attempts to convince the mayor that they are more worthy of a job than a rival adventurer.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero gets the job, but the rival will later attempt to make the hero fail."
  - "(Success): The hero gets the job."
  - "(Success with Reward): As 12-16, and the hero earns the respect and aid of the rival."
- name: "Medium: Impress a Diplomat"
  description: A hero attempts to get in the good graces of an important diplomat to secure a meeting with a foreign head of state.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The diplomat blows off the hero and doesn't set up the meeting."
  - "(Success with Consequence): The diplomat is impressed but threatened by the hero. The diplomat arranges the meeting, but tells the head of state that the hero is a bit of an egomaniac. The hero takes a bane on the first test they make to influence the head of state."
  - "(Success): The diplomat sets up the meeting."
  - "(Success with Reward): As 17+, and the diplomat tells the head of state that the hero is impressive. The hero gains an edge on the first test they make to influence the head of state."
- name: "Hard: Gain Notice of a Secret Society"
  description: A hero attempts to gain the attention of a secret organization of knights who protect the mundane world from otherworldly evils by spreading stories of the hero's deeds, hoping the organization will make contact.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): Rumors spread about the hero being a braggart who tells tall tales and can't keep a secret. The organization actively avoids them."
  - "(Failure): The hero fails to gain the notice of the organization."
  - "(Success): The hero gets an invitation to meet with a member of the organization."
  - "(Success with Reward): The hero gains the notice of the secret society and is asked to join the organization."
- name: "Hard: Win a Council Seat"
  description: A hero attempts to win an elected seat on a village council by making a speech about their accomplishments to a group of villagers.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to win the council seat. Most villagers decide they don't even like the hero as a person because of how much they brag. For a month, the villagers actively avoid interactions with the hero in public."
  - "(Failure): The hero doesn't win the council seat."
  - "(Success): The hero wins the council seat."
  - "(Success with Reward): As 17+, and the hero is named head of the council."
