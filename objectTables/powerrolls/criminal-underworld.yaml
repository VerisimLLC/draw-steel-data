id: c20d0708-204c-5e07-b5e6-e5deb8af22bd
name: Criminal Underworld
description: You can call for a test that uses the Criminal Underworld skill when a hero attempts to dig up information about criminal organizations that could lead to being caught, or attempts to recall obscure information about an illegal enterprise. Finding out about a low-level pickpocket in a small-time criminal organization doesn't require a test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 80526c1a-3cfd-40dc-9065-eb840df8601d
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Locate a Bandit Lair"
  description: A hero attempts to uncover the location of a bandit lair.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero discovers the location of the bandit lair but also learns the incorrect password to enter."
  - "(Success): The hero uncovers the location of the bandit lair."
  - "(Success with Reward): As 12-16, and the hero finds a secret way into the bandit lair."
- name: "Medium: Determine a Hierarchy"
  description: A hero attempts to learn about the hierarchy of a thieves' guild to determine who is second in line for the guild leader position.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero is unable to determine the second-in-line."
  - "(Success with Consequence): The hero discovers the organization's hierarchy, but their snooping raises the suspicion of the guild leader, who calls the hero in for a private meeting."
  - "(Success): The hero determines the thieves' guild hierarchy without drawing suspicion."
  - "(Success with Reward): As 17+, and the hero learns a damning secret about the second-in-line."
- name: "Medium: Find Criminal Signs"
  description: A hero searches a city for secret signs left by a group of assassins that indicate when and where the organization and their clients meet.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero is unable to find any signs."
  - "(Success with Consequence): The hero discovers the signs, but can't decipher them and needs to get a member of the organization to translate them."
  - "(Success): The hero finds and deciphers the signs."
  - "(Success with Reward): As 17+, and the hero discovers a sign that indicates who the guild's next target is."
- name: "Hard: Get Information About a Boss"
  description: A hero attempts to get detailed information about a crime boss to learn their motivations and pitfalls.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to get information, but their investigation leads the crime boss to send an assassin to take out the hero."
  - "(Failure): The hero fails to get information."
  - "(Success): The hero learns the crime boss's motivations and pitfalls."
  - "(Success with Reward): As 17+, and the hero discovers a secret vice the crime boss has."
