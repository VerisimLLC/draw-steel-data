id: ae521107-e5f1-523a-86ed-cc39ac381d1f
name: Sneak
description: Call for a test that uses the Sneak skill when the hero's success or failure could get them into trouble or gain them an important advantage, such as getting caught sneaking in the back door of a bank or successfully spying on two nobles plotting a coup. A hero skulking in an alleyway for the aesthetic or sneaking by a distracted farmer requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: ae13b5cf-718a-42a4-ab5e-18d46b289ac6
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Sneak Through a Crowd"
  description: A hero attempts to sneak past guards while in a crowd of people gathered outside the gates of a castle.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero avoids the notice of the guards but draws the suspicion of someone in the crowd who immediately demands a favor or item from the hero in exchange for silence."
  - "(Success): The hero reaches their destination unnoticed."
  - "(Success with Reward): As 12-16, and the hero can grab the keys off a guard's belt as they pass without needing to make another test."
- name: "Medium: Don't Wake the Dragon"
  description: A hero attempts to pass through a cavern where a dragon slumbers.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero makes a noise that wakes the dragon. They have 1 turn to act before the dragon is fully awake."
  - "(Success with Consequence): The hero makes it through the cavern without waking the dragon, but they make a small amount of noise that causes the dragon to shift their weight and change the position of their head. Any subsequent tests made to sneak by the dragon take a bane."
  - "(Success): The hero sneaks by the dragon without waking them."
  - "(Success with Reward): As 17+, and the hero can swipe one item from the dragon's hoard in this chamber without needing to make another test."
- name: "Hard: Sneak by Hidden Lookouts"
  description: A hero attempts to sneak through a silent forest they know is being watched by guards, whose exact positions are unknown.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero is caught by guards who attack them from trees above. The hero is surprised at the start of this encounter."
  - "(Failure): The hero and guards notice each other at the same time. The guards attack, but no one is surprised."
  - "(Success): The hero sneaks through the forest unnoticed."
  - "(Success with Reward): As 17+, and the hero notices the positions of the guards as they pass. Any ally who is also making this test has a double edge on it."
- name: "Hard: Sneak Into Royal Chambers"
  description: A hero attempts to sneak into the bedchambers of a monarch during a party at a castle.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): Guards catch the hero sneaking and attack, intent on arresting them."
  - "(Failure): Guards catch the hero leaving the party and politely give them a warning to return to the festivities before attacking."
  - "(Success): The hero sneaks into the monarch's chambers."
  - "(Success with Reward): As 17+, and the hero can make it to one other room of their choice in the castle without needing to make a test to sneak by more guards."
