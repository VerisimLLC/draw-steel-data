id: 70162a7d-0df2-588d-9ce5-f3db555b6a9f
name: Society
description: The Society skill works for tests where a hero attempts to recall obscure social lore that has an outcome important for their adventures. Recalling the name of an influential member of the royal court requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Address a Noble Correctly"
  description: A hero attempts to address an important noble with the correct title before a negotiation.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero gets the greeting right ... for the most part. They didn't say every single tiny syllable, but they basically said the title. The noble's starting Interest decreases by 1."
  - "(Success): The hero gets the greeting right, impressing the noble. The noble's starting Patience increases by 1."
  - "(Success with Reward): As 12-16, and the hero is so impressive and charismatic that they gain an edge on the next test made to influence the noble."
- name: "Medium: Know Their Place"
  description: During a royal court meeting, a hero attempts to figure out where each noble house ranks under the monarch.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to learn anything about the house rankings."
  - "(Success with Consequence): The hero figures out where each noble house stands, but all the nobles notice the scrutiny during the meeting. The hero is asked to not attend future meetings because their stare is so off-putting."
  - "(Success): The hero figures out where each noble house stands without drawing suspicion."
  - "(Success with Reward): As 17+, and the hero can gain a meeting with one noble of their choice after the meeting without needing to make another test."
- name: "Hard: Identify Rival Houses"
  description: A hero attempts to recall which noble houses are allies or enemies in a heavily stratified city.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero gets no useful information, and one house gets wind of a nosy adventurer snooping around. They send a group of goons to rough up the hero and their allies the next time they take a respite in the city."
  - "(Failure): The hero recalls no useful information."
  - "(Success): The hero recalls the information they want."
  - "(Success with Reward): As 17+, and the hero recalls the names of the leaders of each house and a motivation for each."
- name: "Hard: Identify a Forgotten Family"
  description: A hero attempts to identify an ancient, forgotten noble house from a broken crest that brims with cursed energy within a ruined manor.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to identify the house and is struck with a curse. They gain the Voice in Your Head complication (see Chapter 8 in Draw Steel: Heroes) as the rotten and cruel matriarch of the house inhabits a nook in their mind."
  - "(Failure): The hero fails to identify the house."
  - "(Success): The hero discovers the identity of the house."
  - "(Success with Reward): As 17+, and the hero manages to dispel the cursed energy from the seal."
