id: 0eaac25c-7661-5fac-9a6e-3aac65b8ab84
name: Blacksmithing
description: Call for a test that uses the Blacksmithing skill only when a hero attempts to forge or repair a unique metal item or use their specialized knowledge to make a timely assessment. Forging mundane metal weapons and armor does not require a Blacksmithing skill test. The making of weapons, armor, and the like typically happens as part of a downtime project and not a typical test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Repair an Item for Immediate Use"
  description: A hero attempts to mend a difficult-to-repair, mundane metal weapon or piece of armor to an operational state outside of a workshop.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero repairs the item, but the benefit it provides is reduced. If the item is a weapon, any damage bonus provided by a kit it's part of is reduced by 1. If it's armor, any Stamina bonus provided by a kit it's part of is reduced by 3. These penalties can be removed if the hero further fixes the item as a downtime activity."
  - "(Success): The hero repairs the item."
  - "(Success with Reward): As 12-16, and the hero makes some temporary improvements. If the item is a weapon, the next damage-dealing ability that is used with the item's kit deals additional damage equal to the hero's level. If the item is armor, the armor grants the wearer temporary Stamina equal to the hero's level that lasts until the end of the wearer's next encounter."
- name: "Medium: Forge a Magic Replica"
  description: A hero attempts to forge a mundane lookalike Blade of Quintessence to pass as the real thing.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to make the replica."
  - "(Success with Consequence): The hero makes a reasonable facsimile of the weapon that passes an initial inspection. However, 1 hour later, the person who it was intended to fool realizes they were duped and word spreads among their inner circle that the hero is not to be trusted."
  - "(Success): The facsimile of the weapon looks and feels just like the real thing to anyone interacting with it in a mundane way."
  - "(Success with Reward): The hero forges a replica of the blade that fools even folks who use supernatural senses to cursorily examine the sword."
- name: "Hard: Find the Weak Point on a Gate"
  description: A hero attempts to assess a metal gate for weak points to quickly break it down.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero can't identify a weak point. Their investigation takes so long that they draw the attention of guards."
  - "(Failure): The hero can't identify a weak point in the metal gate."
  - "(Success): The hero identifies a weak point in the metal gate."
  - "(Success with Reward): As 17+, and the hero can open the gate without drawing attention."
