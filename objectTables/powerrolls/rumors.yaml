id: 0089011f-7342-57ed-b55c-e704cffb3eb9
name: Rumors
description: Call for a test that uses the Rumors skill when a hero attempts to learn or recall local gossip or folklore that is speculative and not widely available. If the rumor is the kind of thing everyone in town already knows, there's no need for a test.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Discover a Noble's Secret Lover"
  description: A hero attempts to learn the name of a noble's secret paramour by interacting with others who gossip.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): Informants prove harder to convince than usual. The hero finds a willing confidant, but they demand payment. The hero can learn the name of the lover if they lose 1 Wealth."
  - "(Success): The hero learns the lover's name without paying a bribe."
  - "(Success with Reward): As 12-16, and the hero also recalls a friendly NPC who knows the lover and would be willing to make an introduction."
- name: "Medium: Recall a Captain's Vice"
  description: A hero attempts to recall the vice of a captain in an enemy army so they might be manipulated into giving up strategy and secrets.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to recall the vice."
  - "(Success with Consequence): The hero believes the captain has one of three different vices, though they can't recall which is correct."
  - "(Success): The hero recalls the specific vice."
  - "(Success with Reward): As 17+, and the hero also recalls the captain's particular way of engaging with the vice. For example, if the captain's vice is drinking, the hero knows the exact vintage of wine they prefer. If the captain loves gambling, the hero knows they particularly enjoy playing cards over dice. When the hero appeals to this specific vice while making a test to interact with the captain, the test gains an edge."
- name: "Hard: Discover a Villain's Fear"
  description: A hero attempts to learn a villain's greatest fear.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to learn the villain's greatest fear, and the attempt to do so is reported back to the villain, who sends lackeys to attack."
  - "(Failure): The hero fails to learn the villain's greatest fear."
  - "(Success): The hero learns the villain's greatest fear. The first time a hero presents this fear to the villain, they gain an edge on the next power roll they make against them or to influence them."
  - "(Success with Reward): As 17+, and the hero also learns why the villain fears what they do, allowing them to craft a more personal nightmare for the villain. This hero has a double edge on the next power roll made against or to influence the villain after they present the villain their fear."
