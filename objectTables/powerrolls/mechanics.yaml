id: 804f8d8e-910d-5646-b444-fedba4795386
name: Mechanics
description: Call for a test that uses the Mechanics skill when a device must be repaired under duress or when identifying how a complex mechanical item works under time pressure. Figuring out the intricacies of a tinkerer's latest invention requires no test if the hero has plenty of time to examine the item.
_table: powerRolls
__typeName: PowerRollTableGroup
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Improvise a Temporary Fix"
  description: A hero fixes an object with moving parts, such as a broken wagon wheel or well crank, just long enough to last for one trip or use.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero improvises a repair, but it creates a loud noise during use. This draws the attention of creatures in the area, making it impossible to hide while using the device."
  - "(Success): The hero improvises a temporary repair without incident."
  - "(Success with Reward): The hero repairs the item so well, it can either be permanent or allow anyone using the repaired item to gain an edge on associated tests (hero's choice)."
- name: "Medium: Break the Machine"
  description: A hero tries to break a fire-spitting machine in a single, swift blow by hitting the right spot at the right time.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to break the machine."
  - "(Success with Consequence): The hero breaks the machine, but the machine then explodes, dealing 2d6 fire damage to the hero and each creature adjacent to the machine."
  - "(Success): The hero breaks the machine without issue."
  - "(Success with Reward): As 17+, and the hero knows just how to repair the machine as a free maneuver, so they can use it against their enemies when the time is right."
- name: "Medium: Cover Up Damage"
  description: A hero attempts to cover up signs they interacted with a device or entered an area, such as repairing a scratched door lock or removing the ash created by flame jets.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails, and the damage is still readily apparent."
  - "(Success with Consequence): The hero covers up the damage. However, any creature who spends at least 5 minutes inspecting the area discovers the damage."
  - "(Success): The hero convincingly covers up the damage."
  - "(Success with Reward): As 17+, and while tidying up, the hero discovers project materials for a downtime project they want to start."
- name: "Hard: Fix a Ship's Steering"
  description: A ship's steering mechanism was broken during battle, and a hero tries to fix it while combat rages.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero worsens the damage, causing the ship to come to a complete stop as well as not being able to be steered."
  - "(Failure): The hero fails to repair the airship's steering mechanism."
  - "(Success): The hero repairs the airship's steering mechanism."
  - "(Success with Reward): As 17+, and the hero can immediately steer the ship as a free maneuver."
