id: 75021737-71d6-5ee9-af85-ede70afe5ea8
name: Interrogate
description: Call for a test that uses the Interrogate skill only when a hero attempts to coerce important information out of a hostile or uncooperative party. Getting information from a creature who is already cooperative requires no test.
_table: powerRolls
__typeName: PowerRollTableGroup
skill: 4290580d-9e08-4bd2-859c-7ac147f108aa
ctime: 1789954969094
mtime: 1789954969094
tables:
- name: "Easy: Steamroll a Terrified Bandit"
  description: A hero attempts to interrogate a member of a bandit crew to locate the group's hideout.
  __typeName: PowerRollTable
  tiers:
  - "(Success with Consequence): The hero gets the location of the hideout, but the bandit neglects to mention all the guard posts along the way. The hero takes a bane on tests made to sneak when approaching the bandit hideout."
  - "(Success): The hero gets the location of the hideout and nearby guard posts."
  - "(Success with Reward): As 12-16, and the hero also gets a detailed layout of the bandit captain's lair. The hero gains an edge on tests made to sneak into the hideout."
- name: "Medium: Break a Master Assassin"
  description: A hero attempts to crack a master assassin's defense and learn the identity of their client.
  __typeName: PowerRollTable
  tiers:
  - "(Failure): The hero fails to get any answers."
  - "(Success with Consequence): The hero gets the name of the client, but as the bandit gives a name, they slip their bonds and start to flee back to warn their client."
  - "(Success): The hero gets the name of the client."
  - "(Success with Reward): As 17+, and the assassin is honor bound to serve the hero in exchange for sparing their life. The assassin uses the statistics of a shadow elf shade retainer (see Retainers in Draw Steel: Monsters)."
- name: "Hard: Bamboozle a Corrupt Merchant"
  description: A hero attempts to coerce a corrupt merchant into self-incriminating without realizing it.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero fails to get information from the merchant, and insults them in the process. The merchant bans the hero from their shop."
  - "(Failure): The hero fails to get information from the merchant."
  - "(Success): The hero gets the merchant to give up information that incriminates them in several crimes."
  - "(Success with Reward): As 17+, and the merchant immediately decides to turn themself in, realizing the jig is up."
- name: "Hard: Trick the Trickster"
  description: A hero attempts to trick a mercurial fey creature into giving up the answer to their riddle.
  __typeName: PowerRollTable
  tiers:
  - "(Failure with Consequence): The hero is six steps behind the creature and suddenly binds themself into a contract with the fey without realizing it. The hero gains the Stolen Face complication (see Chapter 8 in Draw Steel: Heroes)."
  - "(Failure): The hero fails to get the answer to the riddle."
  - "(Success): The hero tricks the creature into giving up the answer to the riddle."
  - "(Success with Reward): As 17+, and the creature is so delighted at being tricked that they give the hero a Restorative of the Bright Court (see Chapter 13 in Draw Steel: Heroes)."
