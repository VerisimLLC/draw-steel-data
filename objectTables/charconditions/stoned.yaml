name: Stoned
description: A stoned creature is magically turning to stone. Each time it fails the saving throw, it takes corruption damage equal to the basilisk's Might. A stoned creature or adjacent creature can use a maneuver to cut away the stone, ending the effect and dealing damage equal to twice the basilisk's Might (can't be reduced). A creature reduced to 0 Stamina while stoned is turned to stone until restored by magical means.
