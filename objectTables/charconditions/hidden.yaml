description: |-
  While you are hidden from another creature, that creature can’t target you with abilities that don’t have the Area keyword. You also gain an edge on ability rolls made against that creature, and that edge lasts until the end of the turn in which you are no longer hidden.

  You are no longer hidden from a creature if you don’t have cover or concealment from them. If you use an ability, interact with an enemy, move without sneaking, or otherwise make noise or reveal yourself, you stop being hidden once the activity that reveals you resolves. A creature can also search for you with a maneuver, using an opposed test to end the condition.
