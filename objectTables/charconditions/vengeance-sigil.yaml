name: Vengeance Sigil
description: |-
  The revenant who placed this sigil always knows the direction to your exact location while you are both on the same world. The sigil may be visible to every creature or only to the revenant, who can remove it at will (no action required). They can also target you at will with Detonate Sigil, a ranged strike that damages and slides you, and then removes the sigil.

  A revenant can maintain only as many sigils as their level. If they place another beyond that limit, their oldest sigil disappears with no other effect.
