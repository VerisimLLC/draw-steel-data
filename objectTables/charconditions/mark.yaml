id: 5c54050a-de9c-410f-94a7-f31b8f57daf3
name: Mark
description: |-
  While this creature is within the Tactician's line of effect, the Tactician and any allies who are also within that line of effect gain an edge on power rolls made against this creature.

  Whenever this creature takes rolled damage from the Tactician or one of their allies, the Tactician can spend 1 Focus as a free triggered action to gain one of the following benefits:

  - The ability deals extra damage equal to twice the Tactician's Reason score.
  - The creature that dealt the damage can spend a Recovery.
  - The creature that dealt the damage can shift up to a number of squares equal to the Tactician's Reason score.
  - If the Tactician dealt the damage with a melee ability, this creature is taunted by the Tactician until the end of this creature's next turn.

  Only one benefit can be chosen per trigger.
