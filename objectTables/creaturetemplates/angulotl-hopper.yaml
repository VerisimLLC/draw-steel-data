  features:
  - name: Level 4 Retainer Advancement Ability
    description: |-
      When a retainer reaches level 4, 7, or 10, they can gain one of the following abilities based on their role, rather than gaining the retainer advancement ability presented alongside their stat block. A retainer qualifies only for the role advancement ability that matches their role and level.

      If a role advancement ability has the Magic or Psionic keyword, a
      retainer can swap the Magic keyword for Psionic or vice versa. They
      can also lose the keyword if they can achieve the ability's effects
      through gadgetry, martial prowess, or other nonsupernatural means.
    __typeName: CharacterFeatureChoice
    allowDuplicateChoices: false
    guid: c7e92414-082c-4193-b000-0ac4d5a245d9
