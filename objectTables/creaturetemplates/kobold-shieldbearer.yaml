      modifiers:
      - name: Living Backpack
        description: ""
        __typeName: CharacterModifier
        activatedAbility:
          name: Living Backpack
          description: The shieldbearer straps their shield on their back and climbs onto their mentor's back, entering the mentor's space. While the shieldbearer is on their mentor's back, each of them gains 10 temporary Stamina and can use Shield Block as a triggered action targeting an ally instead of the shieldbearer's mentor. Additionally, the shieldbearer moves with the mentor, and they can't use main actions, maneuvers, or move actions except to end this effect as a maneuver. The effect also ends if the shieldbearer is force moved away from their mentor or knocked prone. If the shieldbearer is still in their mentor's space when the effect ends, they move into an adjacent unoccupied space of their choice.
          __typeName: ActivatedAbility
          abilityType: none
          actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
          behaviors:
          - __typeName: ActivatedAbilityGrantTemporaryStaminaBehavior
