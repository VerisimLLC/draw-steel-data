traits:
- name: Higher Authority
  kind: motivation
  line: That’s above my pay grade. If my superiors sign off on it, then so do I.
  id: b3c85f92-52e5-45d1-904f-9bb75f8892b2
- name: Justice
  kind: motivation
  line: Thank you for bringing this to my attention. I agree, this must be put right. The only question is how.
  id: f8622de9-3e31-4466-8a6c-8b46ed46a999
- name: Peace
  kind: motivation
  line: People like us, we fight so that the common folk don’t have to. If I must, I’ll draw my sword again to keep the peace.
  id: d5d5dcca-203f-4ff4-bc2b-bcb4789ccc0d
- name: Revelry
  kind: motivation
  line: Every agreement should be sealed with a toast. Huzzah!
  id: 61a09f76-bc9d-40de-a5a1-19ce36bbf784
- name: Benevolence
  kind: pitfall
  line: These people don’t need charity, they need order. Let them go to the town hall and they’ll get a full belly in exchange for an honest day’s work.
  id: 95a8ad5a-4288-407f-92ee-9520f7a936bd
- name: Freedom
  kind: pitfall
  line: None of us are free, from the lowliest servant on up. Even a monarch has a duty to their people.
  id: 8ca8d558-ab51-4d9f-ae87-e4085b879c29
- name: Power
  kind: pitfall
  line: My power comes to me through my lawful oath, not by some dirty deal made in secret.
  id: d870f027-166e-474a-a43c-d7a6219e82a8
- name: Vengeance
  kind: pitfall
  line: I believe in law, not vengeance, and law is decided by higher courts. I’m just a functionary.
  id: 62ffae78-d92e-42af-8d4e-028703809e0e
npcDesc: Although not always an idealist, the knight is a loyal servant of their liege and a stickler for duty. A knight knows their place in a regimented society, and believes that everyone else should keep to their own place.
