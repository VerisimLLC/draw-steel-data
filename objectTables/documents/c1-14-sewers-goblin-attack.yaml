  # Sewers - Goblin Attack

  *combat, failure branch - Chapter 1: Firefall - opportunists in the dark.*

  The heroes are ambushed by goblins looking to rob the desperate people fleeing the violence above. Use the Sewer map.

  ## The Encounter

  [[encounter]]

  {Adjustments: six heroes, add two goblin cursespitters as their own group; four heroes, remove one stinker and one worg; three heroes, remove one war spider.}

  {Tactics: the goblins surround and pin the heroes. Stinkers flood the area with Swamp Gas while their worgs attack, then keep enemies hindered in the haze with Toxic Winds. The cursespitters shoot from the side passages and flee between them if pressed.}

  + Terrain - Sewer
    Sewage flows through the largest passageways: difficult terrain. At the start of combat the goblins throw vials of irradiant green acid into it - those spaces become a Corrosive Pool. Passage height is 4 squares.

  + Corrosive Pool - Level 2 Hazard
    Stamina 12 per square; immunity 20 to all but cold or fire. Entering or starting a turn in it: 3 acid damage (per square entered). If the pool takes fire damage, Explosive Reaction: 3-burst, tiered 3 / 6 / 9 fire damage with burning (save ends) by Might, double edge against targets in the pool, and the liquid is consumed. {Allied Awareness: armed allies carry torches; any ally can throw one 5 squares as a maneuver, dealing 1 fire damage to the pool and triggering the explosion.}

  **Ending the encounter:** the goblins flee when two or fewer remain.

  **Victories:** 2 Victories each. [ ] awarded

  ---

  ## Exit

  **The goblins scatter** -> [C1-15 - Unsafe House](C1-15 - Unsafe House)
