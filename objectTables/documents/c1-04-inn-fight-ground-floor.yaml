content: |
  # Inn Fight - Ground Floor

  *combat - Chapter 1: Firefall - the final floor. An open common room surrounded by side chambers, most of it in ruins.*

  ::: read-aloud
  "The bodies of guests and staff alike litter the ground floor, their corpses either charred or rendered to bloody heaps of shredded flesh."

  "Several packs of fiends are clustered around a black-iron ball hovering in midair, set with deep ridges and burning with a wicked flame not of this world."

  "Worse still is the sight of Blackbottom through the windows and rubble beyond. Hundreds of these iron balls have cratered sections of the city and are disgorging fiends faster than people can flee from them."
  :::

  ## The Encounter

  [[encounter]]

  {Adjustments: six heroes, add one ruinant and four ensnarers as their own group; four heroes, remove one torlas and four frenzieds; three heroes, remove one torlas, four frenzieds, one ruinant, and four ensnarers.}

  {Tactics: ruinants and ensnarers take the front lines and lock enemies down. The remasch and pitlings teleport around the inn, isolating vulnerable targets. The torlases harass from a distance, using Floor to Flesh to shift heroes into fires and each other.}

  + The Iron Orb - Level 3 Fortification
    A magical black-iron gateway to the Abyssal Wasteland (Stamina 50, Size 3, EV 20). At the start of each combat round its Abyssal Aura activates: on a tier 1 roll each demon within 5 squares gains an edge until next round; tier 2, each demon within 10 squares; tier 3, each demon within 10 squares AND the orb summons four frenzieds into unoccupied spaces within 5. {The heroes do not need to destroy it - but an easy Reason test, or knowledge of the Abyssal Wasteland, reveals that they can. You can also convey it through narration: the orb cracks when it summons, takes splash damage, is struck by debris.}

  + Civilians in the Kitchen
    {Dwinn, Captain Oriole, and Dinah hide in the kitchen with every named NPC the heroes saved above. They emerge when the encounter ends and the coast is clear - or, if the heroes go into the Iron Orb, when the heroes return.}

  **Ending the encounter:** the encounter ends when all the demons are defeated.

  **Victories:** 1 Victory each for escaping the inn; +1 each if at least half the civilians were saved; 1 hero token if ALL civilians were saved. [ ] awarded

  ---

  ## Exit

  This card has two exits:

  **Demons defeated - ignore the orb** -> [C1-06 - To Safety](C1-06 - To Safety)

  **Press the black-iron plate into the orb** -> [C1-05 - Into the Iron Orb](C1-05 - Into the Iron Orb) {The plate drops from the last captain to fall. Touching it to the orb opens a slit; pressing it in transforms the orb into a portal.}

  Writes: {victories awarded above; inn_rescue_total final.}
