content: |
  # Every Good Adventure...

  *interlude - Chapter 1: Firefall - The Fall of Blackbottom*

  ... starts in a tavern. The heroes arrive at the Drunken Fool as night begins and the first-floor tavern comes to life.

  ::: read-aloud
  "It's a chilly evening in the port city of Blackbottom, the largest city in Vasloria. This ocean port is a free city where different factions, national diplomats, and more can meet in peace and break bread together."

  "You have found rooms in the Drunken Fool, known for its luxurious wooden bathtubs. Though the salt-scented air outside is brisk, the inn is a warm refuge from the chill."

  "The first floor is a tavern, with a full kitchen and ales from across the world on tap. Many customers, both overnight guests and tavern regulars, rush in from the cold and contribute to a lively, jovial atmosphere."
  :::

  The heroes are here at this famous inn and spa to celebrate a job well done. Ask the players to introduce their heroes. What do they look like? What do they order to eat and drink? How do they know each other?

  Run **at least two** of the following vignettes to build a solid foundation:

  + Tell Your Story
    [ ] ran it - At least one of the heroes looks a little banged up from their last adventure. Dwinn, the proprietor, notices and asks the heroes to tell the tale. What heroic deed have the heroes just accomplished? How do the "other guys" look?

  + Sweating Smuggler
    [ ] ran it - A nervous Captain Oriole sits by the fire, waiting for a potential buyer for what her crew has brought into Blackbottom. None of tonight's visitors can pay what she is asking. Before she gives up for the night, she mistakes one of the heroes for a potential buyer, approaching them and speaking in vague terms only someone familiar with the black market would understand. {Director: whether Oriole survives this adventure decides if the Revelation escape lead exists in Chapter 2. Introduce her warmly.}

  + High-Profile Guest
    [ ] ran it - All dragon knights attract unwanted attention. When Artistoxilath enters the Drunken Fool, everything stops for a good thirty seconds. Then the whispers begin. Wanting to avoid trouble, Artistoxilath nurses a drink in a barren corner of the inn before moving to their room on the third floor for the night. {If one of the heroes is also a dragon knight, this happens twice - once when they walk in, and again when Artistoxilath enters.}

  + Drinking Contest
    [ ] ran it - One guest challenges anyone who will listen to a drinking contest. Dwinn encourages this behavior - it makes him more money. Oriole, Artistoxilath, and Dwinn himself can be convinced to participate with a successful opposed Presence test (the NPCs get no bonuses to tests). Each participating character makes a Might or Agility test (their choice) opposed by the others; the highest score wins. In the case of a tie, run a second round. The winner gets bragging rights and Dwinn's admiration.

  ---

  ## Exit

  When the players have introduced their characters and gotten to know the NPCs, tell the heroes it is time to retire to their rooms and end the scene.

  **Heroes retire to their rooms** -> [C1-02 - Inn Fight: Third Floor](C1-02 - Inn Fight: Third Floor)

  {No state writes on this exit. In the staged version this is a button; for now, open the next page.}
