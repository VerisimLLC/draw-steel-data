content: |
  # Into the Iron Orb

  *combat, optional - Chapter 1: Firefall - through the portal into the Abyssal Wasteland.*

  ::: read-aloud
  "A stone platform opens up over a roiling field of entropic energy, a single human chained to an altar at its far end. His body bears the marks of endless and unimaginable torture."

  "Around him, priests dressed in Ajax's colors chant, that chanting combining with the victim's agony to draw demons into this realm. Just as the demons appear, they vanish, drawn across planar boundaries into Blackbottom."
  :::

  ## The Encounter

  [[encounter]]

  {Adjustments: six heroes, add two remasches to group 5; four heroes, remove one torlas and four frenzieds; three heroes, remove one torlas, four frenzieds, and two remasches.}

  {Tactics: the death cultists and acolytes stay back, weakening powerful-looking foes at range; the acolytes hug their cultists to heal them via Necrotic Bolt. The torlases put Floor to Flesh on the major egress points to slow the heroes and push them off the edge; frenzieds charge the choke points.}

  **Objective:** free Colm - any hero adjacent to him can release his restraints as a main action. The foes must leave him alive for the ritual, so once he is freed they focus entirely on the heroes. The encounter ends when all heroes AND Colm are back through the portal. **Fleeing is a valid win.** {If they flee before defeating everyone, the remaining enemies can follow them through - but if everyone made it out, it is probably more fun to narrate the orb's destruction and end it there.}

  ## Hazards

  + Abyssal Howl - every round
    At the start of each combat round, abyssal energy wracks all non-demonic creatures. Each hero tests Might: 5 corruption damage and slowed EoT / 2 corruption damage / no damage. (One-tap group roll when staged.)

  + Abyssal Field
    Creatures can be pushed off the platform edge. Any creature with M below 1 entering the field or starting a turn there is weakened EoT. The field turns solid 3 squares down and can be climbed back at 2 movement per square. {If heroes push demons in, spend Malice to open an Abyssal Rift and walk them back onto the map.}

  + TRIGGER - Pitlings, round 3
    At the start of the third combat round, if Colm is still being tortured on the altar, eight pitlings attracted by his pain appear in unoccupied spaces of your choice. (Authored as a wave.) [ ] fired

  + Colm's Story
    {Colm is barely conscious when rescued: he gives his name, thanks the heroes, urges them to safety. He already knows what is happening above - "The Crysopolis has arrived ... there is truly no escape from his iron will." He was a Crysopolis administrator who refused to prepare the Iron Orbs for the siege; Ajax condemned him to power the summoning ritual. He shares this freely at the safehouse - but a hero familiar with Ajax's army who has the Culture, Society, or Strategy skill can recognize his Crysopolis uniform right now.}

  **Victories:** 2 Victories each. [ ] awarded

  ---

  ## Exit

  **Everyone back through the portal** -> [C1-06 - To Safety](C1-06 - To Safety)

  Writes: {iron_orb_completed = true (reduces the Alleys Demon Assault groups); colm.rescued = true.}
