traits:
- id: bc1f2f8d-f703-44df-869f-9c78b4fbf3e2
  line: I follow my muse, my only master. Who would dare put handcuffs on art?
  name: Freedom
  kind: motivation
- id: fed9d30b-c902-4c57-b93a-8ed59c41601c
  line: Castles will crumble. Empires will fall. But if only I can produce a work worthy of my talents, my name will live forever.
  name: Legacy
  kind: motivation
- id: 1d1de58d-5efc-49d4-9f13-3e1a22bf0f88
  line: In war, bronze statues are melted down for armor. Money is wasted on ballistae instead of ballads. War is a crime against the god of art.
  name: Peace
  kind: motivation
- id: 8a3e6a24-ce4e-44ec-9fb2-2ea3a99d55b4
  line: Yes, tonight let us celebrate! Inspiration looks down kindly on those who drink life to the dregs.
  name: Revelry
  kind: motivation
- id: ace51046-5e0e-4455-8de6-a5f3686cee21
  line: You offer me money? Money comes to geniuses—it is our due. I can get it from a thousand admirers.
  name: Greed
  kind: pitfall
- id: 09bfc6d5-eb2a-4f8c-8dd9-0e7678d8910c
  line: I have no ambitions beyond this opera house. For me to leave this place, even for a palace or a throne ... it would be an exile for me.
  name: Power
  kind: pitfall
- id: 340305aa-69e9-4416-85f5-b457d40a682f
  line: I’m not afraid. The god of music will look after her own.
  name: Protection
  kind: pitfall
- id: 12a4d143-26cf-4f12-b70d-476e4b35a6e8
  line: Perhaps there are some who hate me—those who think I stand in their way, or whose accomplishments I have eclipsed. But I hate no one and am jealous of no one.
  name: Vengeance
  kind: pitfall
