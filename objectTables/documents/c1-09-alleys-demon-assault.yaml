content: |
  # Alleys - Demon Assault

  *combat, conditional - Chapter 1: Firefall - two demon bands fight over the fallen.*

  **BYPASS RULE:** if the heroes earned a **total success** on Clear a Path, skip this encounter entirely and proceed to [C1-10 - Alleys: Abduction](C1-10 - Alleys: Abduction). {In the staged version this card auto-skips with a note.}

  ::: read-aloud
  "The twisting, turning alleyways of Blackbottom are quieter than the main streets, but only just."

  "The people under your escort keep their heads low as they follow you."

  "As you enter the space between a cluster of buildings, you notice two bands of demons fighting over a pile of fallen bodies."
  :::

  **Sneak option:** one hero can lead the group around the demons with a hard Agility test:

  |Sneak Past: Agility (hard)
  |The demons spot the heroes and attack; the heroes are surprised at the start of combat.
  |The demons spot the heroes and attack.
  |The heroes and their charges navigate the alleys without alerting the demons.

  ## The Encounter

  [[encounter]]

  {Adjustments: if iron_orb_completed, remove four pitlings from group 1 and four ensnarers from group 3 - applied automatically with a note when staged. Six heroes, add one ruinant and four ensnarers as their own group; four heroes, remove one ruinant; three heroes, remove one ruinant and two remasches.}

  {Tactics: the bands are rivals - if a hero leaves a demon at low Stamina, the other band finishes it off to prove superiority. Band one: remasches keep everyone mobile with Grasping Shadow and Abyssal Strike while pitlings swarm. Band two: ruinants kill healers first, ensnarers dragging those heroes into the fray.}

  + Terrain - Alleys
    The buildings are 5 squares high. The well in the north of the map is 4 squares deep with less than 1 square of water in it.

  + TRIGGER - Competitive Demons, round 2 or 3
    At the start of the second or third round (your choice), the rivalry breaks: choose one minion from each band; each immediately takes a free turn with immunity to all damage and a double edge on power rolls. When both turns are done, the more effective one instantly kills the other, gaining their consumed souls and transforming via Abyssal Evolution without spending Malice. [ ] fired

  **Ending the encounter:** the demons fight until all non-minion enemies are defeated and the remaining fiends are outnumbered two to one; then they flee.

  **Victories:** 1 Victory each. [ ] awarded

  ---

  ## Exit

  **The alley clears** -> [C1-10 - Alleys: Abduction](C1-10 - Alleys: Abduction)
