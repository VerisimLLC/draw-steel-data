content: |
  # Interlude - What Now?

  *transition and respite choice - Chapter 1: Firefall - the end of the first day.*

  After the negotiation with Tch'dorit concludes, read:

  ::: read-aloud
  "The hours slip by underground. Day turns to dusk, then dusk to dead of night. Eventually, the thunderous sounds of war die down."

  "The silence that remains is somehow even louder than the explosions and screams."
  :::

  **Ask your players:** *How are you going to get all these people out of Blackbottom safely?*

  {This is a drama payload, not flavor - render the question to the players and let them actually plan. Their answer tells you which Chapter 2 leads they will chase first.}

  ## The Respite

  The heroes can take a respite here - in fact, it is **strongly recommended**. But while they lie low for a day or two, the city above them changes dramatically.

  Respite taken? [ ] respite

  {Costs: respite_taken_ch1 = true starts the Chapter 2 countdown 2 lower (15 -> 13). If the safehouse was NOT secured, sewers respites restore 2 fewer Recoveries. In the staged version this toggle shows its countdown price inline.}

  ---

  ## Exit

  **Begin Chapter 2** -> Chapter 2: Cover of Night

  Writes: {respite_taken_ch1; then Chapter 2 initialization runs - countdown computed from the Chapter 1 flags (base 15, -2 respite, -2 no safehouse, +2 interest 5), the four escape leads unlock from griffons_saved / oriole alive / tchdorit_interest / vonder_rescued, and milestone 15 (Wanted by Ajax) fires immediately.}
