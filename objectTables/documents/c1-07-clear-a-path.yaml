content: |
  # Clear a Path

  *montage - Chapter 1: Firefall - through the burning streets to the sewers.*

  Hunt leads the group down a street with sewer access, but the ground and aerial assaults rage on. The heroes must clear a path through the mayhem for their charges. Read:

  ::: read-aloud
  "As you make your way through what's left of Blackbottom, the giant iron orbs continue to fall and demons stalk the streets."

  "The fires burn bright and hot, dropping debris that blocks off streets."

  "The people traveling with you shrink from the scene, overwhelmed by the chaos and bloodshed around them."

  "Finding a safe path through the chaos won't be easy."
  :::

  ## The Montage Test

  **Success limit = failure limit = the number of heroes** (3/3 at three, up to 6/6 at six). {In the staged version these limits are pre-filled from party size.}

  **Standing assist:** once per round, Hunt assists one hero's test, granting an edge.

  Successes: [[0]] Failures: [[0]]

  + Challenges
    Avoid Bombardment (Agility, Intuition - Alertness, Gymnastics). Avoid Demons (Agility, Presence - Lie, Perform, Sneak). Avoid Fire (Might, Agility - Endurance, Gymnastics, Lift). Calm Civilians (Presence - Lead, Navigate). Clear Rubble (Might, Presence - Endurance, Lead, Lift). Scout Ahead (Agility, Intuition - Alertness, Climb, Search).

  ## Outcomes

  |Result|Effect|
  |Total success|A path cleared quickly and efficiently: 1 Victory each, and the FIRST combat on whichever path the heroes pick (alleys or rooftops) is bypassed.|
  |Partial success|A path cleared, but no future encounters avoided.|
  |Total failure|A path cleared after great strife: the civilians take five hits - at least one civilian dies. {Director picks who; roster prompt.}|

  ---

  ## Exit

  **The street is clear** -> [C1-08 - Farewell to Hunt](C1-08 - Farewell to Hunt)

  Writes: {clear_a_path_result = total, partial, or failure; Victory if total; civilian hits if failure.}
