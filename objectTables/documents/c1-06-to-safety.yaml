content: |
  # To Safety

  *transition - Chapter 1: Firefall - Hunt arrives; the escape begins.*

  After the heroes defeat the final demon (or exit from the orb), read:

  ::: read-aloud
  "What remains of the inn's walls fall, revealing that what was once Blackbottom has become a hellscape!"

  "Looming over all the mayhem, casting a shadow that turns day into hellish, burning night, is the Crysopolis - the giant, floating headquarters of Ajax the Invincible."

  "Giant iron orbs fall from the sky, dropped by Hawklords flying to and from the gigantic airship."

  "Buildings burn and collapse as patchwork humanoids with heavy collars gleefully roam the streets hurling alchemical flasks to hasten the flames."

  "Demons emerge from orbs, sniffing around for their next meal and finding it in the form of fresh corpses - though they would prefer something wriggling."

  "A group of civilians, huddled together nearby, calls out for your help. You recognize them as patrons of the inn you just saved."
  :::

  Tell your players which civilians are outside calling for help - everyone they saved among Oriole, Dwinn, Dinah, Artistoxilath, Percival, Moonlight, Lorelei, and Colm. {In the staged version this roster line is computed from the rescued flags - the Director never reconstructs it.} They begin arguing about what to do next; let the heroes join in, then interrupt:

  ::: read-aloud
  "From an alley, a hulking demon with gnarled claws and fangs dripping with blood surges toward the group. The people around you recoil."

  "An axe buries itself into the demon's head, and as the demon's cleaved sides fall to the ground, a human man in leather armor steps forward through the viscera."

  "The warrior's insignia identifies him as a senior officer of the Chain of Acheron. He glances your way and furrows his brow."

  "'What are you doing standing around?' he barks. 'Come with me. We'll get these people to safety.'"
  :::

  This is **Hunt**, a high-ranking member of the Chain of Acheron. He recognizes the heroes as people he can delegate to. As he leads everyone through the streets, he explains he has an underground safehouse with a few weeks of supplies: lie low until the bombing stops, then get everyone out. If anyone gets separated: get to the sewers, then follow the Chain's coat of arms - an X with a sword through it.

  + Why not just leave
    {If the players suggest fleeing the city now: Hunt says the safehouse is closer than any exit. Oriole says the closest escape is the west docks, but any crew with a brain has already left (has hers left without her?). Colm says the army's goal is destruction - they will have placed troops at the exits to pick off escapees.}

  + Escape-phase civilian rules - now active
    Civilians are noncombatants sharing a hit pool: every three hits, one dies (usually the last one hit; on montage deaths the Director picks). A hero within 1 square can absorb a hit as a free triggered action. Any hero can, as a maneuver, move any number of civilians up to 5 squares. Civilians count as allies for hero abilities. Outside combat, a hero can spend a Recovery to reset the pool to zero (this does not bring anyone back). {These rules persist through the whole adventure - the Rail pins the hit pool from here on.}

  ---

  ## Exit

  **Hunt leads the way** -> [C1-07 - Clear a Path](C1-07 - Clear a Path)

  Writes: {civilian hit pool active at 0; roster = everyone rescued from the inn.}
