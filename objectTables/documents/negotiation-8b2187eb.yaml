traits:
- kind: motivation
  name: Freedom
  line: No one tells me what to do—not if they want to keep their head on their shoulders. And no one tells my toughs what to do except me!
  id: 4395b08c-1baf-48bd-ab23-91f3e0dc0cd1
- kind: motivation
  name: Greed
  line: Gold! I love the feel of shining, clinking coins running between my fingers. I never found anything to spend it on that I like as much as just having gold.
  id: 52c4540f-f316-433a-95f4-37f3c759ab02
- kind: motivation
  name: Power
  line: I want a stronger hideout, more toughs, and a bigger share of the loot. Get me that, and I’ll do your dirty work for you.
  id: ee4220c9-a856-4677-a540-803ceb6dfc69
- kind: motivation
  name: Revelry
  line: If you don’t get drunk after a raid, then why have a raid?
  id: 5644e726-4819-4400-809d-07bd2fafeede
- kind: pitfall
  name: Higher Authority
  line: By order of the baron? You can keep your fancy titles and lands. I give the orders around here!
  id: 33f70490-5612-4399-8387-88eeaae3ca26
- kind: pitfall
  name: Justice
  line: Only the weak whine for justice. The strong make their own rules.
  id: 0fa90c0e-370a-428c-9215-75d75d4c1bba
- kind: pitfall
  name: Legacy
  line: Listen, I don’t care what happens when I’m gone. I want my followers shouting my name now, not in a hundred years
  id: 76315ebb-7b1d-46bd-876d-3272a99b80ed
- kind: pitfall
  name: Peace
  line: In times of peace, if you pick up a silver coin that’s not yours, the sheriff comes knocking on your door. In war, whole caravans disappear and nobody blinks. Give me war
  id: b24f4c89-5fc3-481d-a775-22dedf3c4858
