  # Farewell to Hunt

  *choice - Chapter 1: Firefall - Hunt dies; the party picks its path.*

  With the civilians escorted to the end of the street, everyone can breathe easier - for a second. Read:

  ::: read-aloud
  "There's just one more block to go until the closest sewer grate. But that's when explosions erupt behind you, and gleeful screeches ring through the air."

  "A freakish humanoid shaped from stitched-together limbs and wearing mangled armor swoops down from the sky toward a civilian."

  "Hunt pushes the civilian out of the way, leaving himself in the monster's clutches."

  "As the horror drags Hunt into the air, he screams at you to 'Go! Get to the safehouse!'"

  "When the monster reaches the apex of their flight, they drop Hunt, letting his body crash onto the cobbled streets with a bone-crunching, fatal crack. Alerted by the noise, a gruesome horde of stitched-together soldiers turns its attention to you - war dogs, Ajax's patchwork strike force."
  :::

  **The heroes cannot save Hunt - make it clear he is beyond help.** Their mission is to take charge in his stead and get the civilians to the safehouse. {Foreshadow flag, do not hint: Hunt returns in Chapter 3 as the war dog ground commander, rebuilt from his parts.}

  ## The Choice

  Two paths to the nearest sewer entrance - assign each hook to a random hero:

  - **Alleys** - a randomly chosen hero notices the neighboring alleys are clear of immediate threats, easy to slip through, and full of places to hide.
  - **Rooftops** - a randomly chosen hero notices a fallen chimney forming a rough ramp to the roof; Blackbottom's rooftops are close together, connected by ladders and makeshift bridges, a path above the chaos.

  Let the players choose.

  ---

  ## Exit

  This card has two exits - the unchosen path locks {but may reopen from the safehouse if Tch'dorit's negotiation lands on interest 3}:

  **Take the alleys** -> [C1-09 - Alleys: Demon Assault](C1-09 - Alleys: Demon Assault)

  **Take the rooftops** -> [C1-11 - Rooftops: War Dog Showdown](C1-11 - Rooftops: War Dog Showdown)

  Writes: {path_taken = alleys or rooftops.}
