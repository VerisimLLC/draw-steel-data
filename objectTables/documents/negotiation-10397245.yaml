- id: 102f98e1-6a28-4ebc-9fce-3ccc5f8827fe
  kind: motivation
  name: Benevolence
  line: It’s not for nothing I’m called “the Good.”
- id: b1747565-ea37-4512-95ab-a1911d5a9684
  kind: motivation
  name: Greed
  line: Your offer intrigues me. In truth, our coffers are not as full as I should like.
- id: 5abfb5e3-abb4-4b51-87cc-9afc3d28d4a7
  kind: motivation
  name: Justice
  line: Ah, do the villains ignore my laws? They must be punished!
- id: abd677df-4082-4a27-a352-6cda91ed13fa
  kind: motivation
  name: Legacy
  line: "If I should die, promise me this: You will serve my heir as loyally as you have served me."
- id: a520bfc7-cc0b-4fd1-9cc9-7d607a01d68e
  kind: pitfall
  name: Discovery
  line: Keep your secrets to yourself. I’m a monarch, not a spymaster.
- id: e2f17ffe-a831-46f8-938d-97cca858aa36
  kind: pitfall
  name: Freedom
  line: Freedom? Some of my disloyal subjects speak that word a little too often for my liking. I hope you’re not one of them.
- id: 499fab21-11ae-43e2-ae38-88c5d71c3741
  kind: pitfall
  name: Higher Authority
  line: You dare give orders to me? Never forget, no matter who sent you, I rule here!
- id: f17c3592-d878-4f5a-bda2-cd50ec37d4d1
  kind: pitfall
  name: Vengeance
  line: Revenge is an exciting sport. Sadly, it’s one I’ve had to give up. It’s policy, not revenge, that rules here.
