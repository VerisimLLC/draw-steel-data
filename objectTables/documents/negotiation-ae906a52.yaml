traits:
- id: cd116e88-ca2e-455b-aeee-901c82e03954
  line: My agents have brought me many whispers, but this is news to me. Who else knows of this?
  name: Discovery
  kind: motivation
- id: 5758cb9e-1e31-4997-a2d7-003839cbb767
  line: I must do as my liege commands. So tell me how you seek to serve them as well.
  name: Higher Authority
  kind: motivation
- id: a5ed4ebd-5077-4d69-8723-8ddda487773d
  line: We must have stability. I will sacrifice anything—and anyone—for this.
  name: Peace
  kind: motivation
- id: b6605dc0-728f-4861-bb3e-029dc889fe79
  line: There is one—I will not speak their name—who thinks I have forgotten what they did to me. Someday they will discover that I have a long memory.
  name: Vengeance
  kind: motivation
- id: 1d8bc81b-681c-4143-a373-251d43f0f0d9
  line: Do you think I act because I love my fellow people? Half of them are worthless, and the other half are villains. But without them, I’d be the Duke of Nothing, so I must preserve them.
  name: Benevolence
  kind: pitfall
- id: bb9614b3-e0e9-4bde-9067-5a25c93f176d
  line: Put away your gold. I’m far too busy to spend it.
  name: Greed
  kind: pitfall
- id: 9449035c-e7dc-4ba7-82ed-07abe046a0b3
  line: Right and wrong? There is no right except what strengthens the kingdom, and there is no wrong except what hurts it.
  name: Justice
  kind: pitfall
- id: 993f741f-30af-44c2-a8d0-2af4aae02265
  line: I don’t care about saving lives. We’re all doomed to die. The question is, what will live on after us?
  name: Protection
  kind: pitfall
