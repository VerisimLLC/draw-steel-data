content: |
  # Unsafe House

  *negotiation - Chapter 1: Firefall*

  The heroes follow the sewer passage to a ladder, which leads up to the basement of a carpentry shop. When they arrive, read:

  ::: read-aloud
  "The trapdoor above you opens into a dark room with stale air that smells of sawdust and pine."

  "A match is struck, and a lantern illuminates a large basement room - with an old woodworking bench in the corner, tools hung on the walls, and crates of materials spread throughout."

  "Holding the lamp is an aging radenwight dressed in expensive clothing. He wrinkles his nose and glares. As a troop of radenwights behind him scatters to the back wall, he says, 'You're not Hunt.'"
  :::

  The elderly radenwight is **Tch'dorit** - *protective, wise, inquisitive; loves pyrotechnics* - who has led the mercenary Radenwight Blackenblues for decades. The group was on an underground delivery for Hunt and was told to wait at the safehouse for instructions. Tch'dorit does not know who he was delivering to or what he was delivering, and he refuses to elaborate on the basis of professional confidentiality.

  He does not trust the heroes - he does not know them, and the world is ending just above him. He prioritizes his crew's safety and does not want to jeopardize it by sharing this space with strangers. But the heroes can negotiate.

  ## Negotiation

  **Interest 2 - Patience 2 - Impression 1 - native language Szetch**

  To run it: select Tch'dorit's token and open the **Negotiation** panel. Track his interest as it moves: [[2]]

  **Motivations**

  - **Higher Authority** - Tch'dorit respected Hunt as a client and a friend. Invoking the heroes' connection to Hunt, and their intention to follow in his footsteps as a protector, can sway him.
  - **Protection** - Tch'dorit wants the Blackenblues to get out of this alive. Arguments that allying with the heroes is the best way to leave the city unharmed appeal to this motivation.

  <color=#c94040>**Pitfall - Greed:** Tch'dorit does not need material goods and is disgusted and offended by the very insinuation that he or his comrades can be bought. Never offer payment.</color>

  **Outcomes**

  |Interest|Outcome|
  |5|The Blackenblues share the space AND their resources. Tch'dorit gifts the heroes a Blutapiece. {Chapter 2 countdown +2.}|
  |4|They share the space but not their resources. {Affects the Chapter 2 countdown.}|
  |3|They will clear out IF the heroes clear a path through the other Chapter 1 route (alleys or rooftops, whichever was not taken) and escort them through.|
  |2|They keep the safehouse but provision the heroes: each hero regains Stamina up to twice their recovery value without spending a Recovery.|
  |1|They refuse the heroes the space and their resources.|
  |0|Frustrated and suspicious, Tch'dorit orders swords drawn. {A bluff - see below.}|

  {Even if the negotiation fails, the Blackenblues will not fight - drawn swords are a bluff to scare the heroes. But if the heroes draw their own weapons or threaten violence, the Blackenblues scatter and detonate explosives throughout the warehouse to cover their escape: 6 damage to each hero, and 1d3 civilians die.}

  {Fallback: if the heroes do not secure the safehouse, they can recuperate in the sewers. A respite in the sewers restores Recoveries only up to 2 fewer than maximum.}

  **Victory:** if the negotiation ends with Tch'dorit's interest at 3 or higher, each hero earns 1 Victory. [ ] awarded

  ---

  ## Exit

  **End negotiation** -> [C1-16 - Interlude: What Now?](C1-16 - Interlude: What Now?)

  Writes: {tchdorit_interest = the counter's final value; safehouse_secured = interest 2 or higher.} [ ] recorded
