traits:
- id: 8f963966-a3fb-4b8e-9fc2-73e60657cf20
  kind: motivation
  name: Freedom
  line: Yes, my ambitions have been bound to the earth for far too long. It’s time I took flight.
- id: 31e4f7a2-be76-486f-b05c-94c990c71f0a
  kind: motivation
  name: Greed
  line: Bring me tribute now, and when I rule, I will not forget you.
- id: afdd38b2-93d2-40ca-8310-6bd3df44f8d5
  kind: motivation
  name: Protection
  line: My people have been mistreated for centuries. It ends now!
- id: 3d89c4cc-cef7-4888-9d56-f98d69ce0a0c
  kind: motivation
  name: Vengeance
  line: This land, these people, their treasures, all rightfully mine. Stolen from me!
- id: 22c4b49d-32a4-403f-a566-6de07582dcac
  kind: pitfall
  name: Legacy
  line: No heir will outlive me, no legend will remember my past glory ... for I shall never die!
- id: 2d286005-8dc4-455e-8c58-ce8c2fc5c7c7
  kind: pitfall
  name: Peace
  line: You want to make peace? When there are still things in the world that are not yet mine?
- id: 86c45d79-5bc5-45cb-929e-4d4e62764952
  kind: pitfall
  name: Power
  line: How can you possibly offer me power?
- id: 83240c62-08cf-43fc-bde1-30c2a742a21a
  kind: pitfall
  name: Revelry
  line: My pleasures are as far beyond your comprehension as yours are to a worm.
