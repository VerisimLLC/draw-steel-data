traits:
- id: ac672500-ed78-4f90-b984-6aa56a7414e1
  line: Keep talking. I’m sure we can come to an agreement that benefits all parties. A rising tide and all that.
  name: Greed
  kind: motivation
- id: 115c7668-4128-4e41-b9bf-2c3c11c5b71c
  line: No one can accuse me of being disloyal. What my duty demands, I do—but let’s determine the most sensible way to go about it.
  name: Higher Authority
  kind: motivation
- id: c1ea33c1-fc38-4de4-b94a-785ea24935dc
  line: The rule of law must be preserved. If you have evidence of crimes, those responsible must be punished.
  name: Justice
  kind: motivation
- id: 4f39c183-3c19-4841-aef3-abc1c54410d0
  line: The weak, the helpless—they depend upon me. And, to a lesser extent, civic-minded heroes like yourselves. Together, we’ll make sure the people come to no harm.
  name: Protection
  kind: motivation
- id: e69e6718-a572-425a-ad6b-ee9f3a82dbc1
  line: Trust me. No good is going to come from poking that particular beehive.
  name: Discovery
  kind: pitfall
- id: eae003ab-2683-42e3-8f43-dd273b8b9b56
  line: Freedom, eh? What’s next, freedom from taxes? No one is born free except the gods, and only fools believe otherwise.
  name: Freedom
  kind: pitfall
- id: 08b42ca2-20bf-4ffc-ada4-161e62de83c1
  line: Put that bottle away. I’m a public figure! I can’t be seen carousing and gallivanting and who knows what else.
  name: Revelry
  kind: pitfall
- id: 32b94c60-c26c-4570-84aa-bf3864887c7d
  line: In politics, you have to have a short memory. Your enemy today might be your ally tomorrow. There’s no need to make things personal.
  name: Vengeance
  kind: pitfall
