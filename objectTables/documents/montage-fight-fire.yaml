    yz: |+
      ## Montage Challenges

    yzA: |+
      {You can adjust the difficulty of the test by selecting the text to the right of it and cycling between them.}


    yzB: |
      * **Bucket Brigades:** Characters can organize the would-be firefighters into disciplined bucket brigades, or can fight the fire directly in some other way.
    yzC: |
      *Suggested Characteristics*: Presence or Reason
    yzD: |
      *Suggested Skills*: Architecture, Intimidate, Lead.
    yzE: |
      [ ]
      {
    yzF: |
      |Bucket Brigades: Presence or Reason (Architecture, Intimidate, Lead.)
    yzG: |+
      |Medium
      }

    yzH: |
      * **Clearing a Firebreak:** Preventing the fire from spreading might involve clearing the ground of flammable materials, either by moving it or burning it away under controlled conditions.
    yzI: |
      *Suggested Characteristics*: Might or Reason
    yzJ: |
      *Suggested Skills*: Endurance, Lift
    yzK: |
      *Suggested Abilities*: Any that deal fire damage
    yzL: |
      *Special*: A creature loses a Recovery if they incur a consequence on the test for this challenge.
    yzM: |
      [ ]
      {
    yzN: |
      |Clearing a Firebreak: Might or Reason(Endurance, Lift)
    yzO: |+
      |Medium
      }

    yzP: |
      * **Evacuating Buildings:** Characters must save people trapped in burning buildings.
    yzQ: |
      *Suggested Characteristics*: Might or Presence
    yzR: |
      *Suggested Skills*: Climb, Endurance, Persuade
    yzS: |
      *Special*: A creature who doesn’t have fire immunity loses a Recovery if they incur a consequence on the test for this challenge. The heroes can attempt this challenge twice during the montage test. 
    yzT: |
      [ ] [ ] 
      {
    yzU: |
      |Evacuating Buildings: Might or Presence (Climb, Endurance, Persuade)
    yzV: |+
      |Medium
      }

    yzW: |
      * **Find More Firefighters:** By finding groups that aren’t fighting the fire,such as fleeing civilians, characters can convince them to help.
    yzX: |
      *Suggested Characteristics*: Presence
    yzY: |
      *Suggested Skills*: Intimidate, Lead, Persuade.
    yzZ: |
      [ ]
      {
    yza: |
      |Find More Firefighters: Presence (Intimidate, Lead, Persuade)
    yzb: |+
      |Medium
      }

    yzc: |
      * **Free the Horses:** Characters can loose the stabled horses threatened by the fire and lead them to safety.
    yzd: |
      *Suggested Characteristics*: Might or Presence
    yze: |
      *Suggested Skills*: Handle Animals, Lift, Ride.
    yzf: |
      [ ]
      {
    yzg: |
      |Free the Horses: Might or Presence (Handle Animals, Lift, Ride.)
    yzh: |+
      |Medium
      }

    yzi: |
      * **Move Burning Rubble:** Shifting burning debris blocking doorways can allow people to escape the blaze.
    yzj: |
      *Suggested Characteristics*: Might
    yzk: |
      *Suggested Skills*: Endurance, Lift.
    yzl: |
      [ ]
      {
    yzm: |
      |Move Burning Rubble: Might (Endurance, Lift)
    yzn: |+
      |Medium
      }

    yzo: |
      * **Use the Freed Horses (if the Free the Horses challenge was successful):** Characters can put the horses to work clearing rubble or bringing people to safety.
    yzp: |
      *Suggested Characteristics*: Reason or Presence
    yzq: |
      *Suggested Skills*: Drive, Handle Animals, Ride
    yzr: |
      [ ]
      {
    yzs: |
      |Use the Freed Horses: Reason or Presence (Drive, Handle Animals, Ride)
    yzt: |
      |Medium
      }

      {
    yzu: |+
      ## Optional Twists

    yzv: |
      At the end of the first montage test round, an emergency crops up. One or more heroes, selected by the players, must deal with the situation before the end of the round. If the heroes successfully deal with the twist, they earn a success for the montage test. Otherwise, they earn a failure.
      }
      {
    yzw: |
      * **Building Collapse:** While a hero is in or near a blazing building, it starts to collapse. The hero must escape before the building crumbles.
    yzx: |
      *Suggested Characteristics*: Agility or Intuition
    yzy: |
      *Suggested Skills*: Climb, Gymnastics, Jump.
    yzz: |
      [ ]
      }
      {
    yzzB: |
      |Building Collapse: Agility or Intuition (Climb, Gymnastics, Jump)
    yzzD: |
      |Medium
      }
      {
    yzzF: |
      * **Cause of the Fire:** 
    yzzH: |
      At the end of the first round of the montage test, the hostile cause of the fire appears—a squad of an invading army, a dragon, a team of arsonists, and so forth. The characters must engage in a standard or hard encounter with this threat. 
      }
      {
    yzzJ: |
      * **Help!:** Townsfolk are about to run into a burning building to save a trapped relative. This twist requires two tests, each of which nets a success or a failure for the montage test. One hero can try to prevent the townspeople from entering the burning building while another rescues the relative.
    yzzL: |
      *Suggested Characteristics*: Might or Agility or Reason or Intuition or Presence
    yzzN: |
      *Suggested Skills*: Lift, Persuade.
    yzzP: |
      [ ] [ ]
      }
      {
    yzzR: |
      |Help!: Might or Presence (Lift, Persuade.)
    yzzT: |
      |Medium
      }


      {
    yzzV: |+
      **Common Tests you may present to your players during a montage:**

    yzzX: |
      [:Tests]
      }

      {
    yzzZ: |+
      ## Montage Outcomes


    yzzc: |+
      #### Total Success

    yzzf: |
      The fire is extinguished. Buildings are damaged but no lives were lost. Each character earns 2 Victories if the montage test was hard, or 1 Victory if it was easy or moderate, in addition to any Victories earned from combat during the montage test.
    yzzi: |+
      [[//awardvp 1 |Award Heroes 1 Victory]] or [[//awardvp 2|Award Heroes 2 Victories]]


    yzzl: |+
      #### Partial Success

    yzzo: |
      The fire is quenched, although many buildings burned and a few lives were lost. Each character earns 1 Victory if the montage test was moderate or hard, in addition to any Victories earned from combat during the montage test.
    yzzr: |+
      [[//awardvp 1 |Award Heroes 1 Victory]]


    yzzu: |+
      #### Total Failure

    yzzx: |+
      When the fire finally burns out, the town lies in ruins. Townsfolk mourn their dead or grimly prepare to find a new home. Characters earn no Victories from the montage test, but might earn Victories from combat undertaken during the montage test. 

      }


