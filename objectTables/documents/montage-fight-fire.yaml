    B: |
      # Montage Test: Fight Fire

      {
    C: |+
      Fire has broken out in the town! The heroes must prevent the conflagration from spreading while saving as many townsfolk as possible. Their efforts might be made more difficult if the cause of the fire—such as a marauding dragon or an invading army—is still around causing trouble.
      }

    D: |+
      *(see Montage Tests in [Draw Steel Heroes](pdf:Draw Steel Heroes:261))*

    E: |+
      ## Setting the Scene

    F: |
      * Fire blazes in several buildings whose occupants need to be rescued.
    G: |
      * Elsewhere, some townsfolk flee while others throw water on the fire with no organization or plan. 
    H: |
      * Without leadership and a way to stop its spread, the fire could easily consume everything. 
    I: |
      * In a nearby stable, horses are panicking as their hay smolders. Burning rubble blocks pathways everywhere.

      {
    J: |
      Add a Scene here to show to your players while the montage is happening. Make sure to select **ShowBelow UI** so that they can still access their character panel and roll dice. 
    K: |+
      :<>[[scene:image]]
      }


    L: |
      ## Party

      {
    M: |
      **Montage Test Difficulty**
    N: |
      |**Heroes**|**Easy**||**Medium**||**Hard**||
    O: |
      |**Limits**|**Success**|**Failure**|**Success**|**Failure**|**Success**|**Failure**|
    P: |
      |**Three**|3|3|4|2|5|2|
    Q: |
      |**Four**|4|4|5|3|6|2|
    R: |
      |**Five**|5|5|6|4|7|3|
    S: |+
      |**Six**|6|6|7|5|8|4|


    T: |
      **Montage Test Adjustment**
    U: |
      * For four or fewer heroes, decrease the success limit and failure limits by 1 (to a minimum of 2) for every hero fewer than five.
    V: |+
      * For six or more heroes, increase the success and failure limits by 1 for every hero more than five.

    W: |+
      *Use the buttons below to adjust the montage difficulty*

    X: |+
      [[setting:Number of Heroes]] 

    Y: |
      :<> [[/setvar montage_difficulty 1|Easy]][[/setvar montage_difficulty 2|Medium]][[/setvar montage_difficulty 3|Hard]] 

      }

