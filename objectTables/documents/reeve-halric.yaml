__typeName: NegotiationDocument
npcName: Reeve Halric
updateid: 175dea73-a41f-49f5-ae56-add72e886ded
portrait: e57e3d47-ba00-456a-8777-f2ef3718dc1f
attitude: suspicious
opening: He blocks the gate, arms folded. "State your business."
traits:
- kind: motivation
  name: Benevolence
  line: The people can’t take care of themselves. Somebody’s got to look after them, the poor lambs.
  id: 775f7daf-5da8-4d8c-8ef5-6a3f97708a87
- kind: motivation
  name: Discovery
  line: It would be highly unethical for you to show me those schematics you obtained from a rival guild. Likewise, it would be highly unethical for me to slide you this bag of gold.
  id: a74fb022-ba87-4a86-8e12-6d67de4cd048
- kind: motivation
  name: Power
  line: Who do you think will be in charge in the next age? The nobles? Pah! They still count their wealth in cows. Whoever controls information will rule the world—and I intend for that to be us.
  id: 7192247b-fe38-4238-afa9-9edda79872de
- kind: motivation
  name: Protection
  line: We have rivals—hungry opportunists who will stop at nothing. If I want to protect my guild, I’ve got to do unto them before they do unto us.
  id: 25ae6325-cd4c-4501-9064-a8d1ad248df2
- kind: pitfall
  name: Higher Authority
  line: My loyalty is to the guild—not the burgomaster, not the king, not Ajax himself. But don’t tell them I said that.
  id: 92485fee-5ca3-436f-81ba-60f2c57e84f4
- kind: pitfall
  name: Justice
  line: We’re reshaping the world here. Of course, some people who can’t adapt are going to find themselves on the bottom. But why should anyone blame us for that?
  id: 3eec90f5-9d97-435b-b950-501bb3306696
- kind: pitfall
  name: Peace
  line: Conflict isn’t bad in and of itself. It drives innovation. The key is to not be on the losing side.
  id: 2d6cc0dc-86f3-4a18-8c52-42e9c434a607
- kind: pitfall
  name: Revelry
  line: I don’t have time for this foolishness. Come talk to me again when you have something of value to show me.
  id: 9d66c437-8aff-408a-8a14-55211dc74e35
stakes: "Deal: the gate opens at dusk. No deal: the party goes over the wall."
summaries:
- "**Run:** walked away. Final Interest 3, Patience 3. Revealed: nothing."
- "**Run:** deal struck - \"Yes.\". Final Interest 4, Patience 3. Revealed: Benevolence, Discovery, Protection, Justice, Revelry."
offers:
- terms: ""
- terms: ""
- terms: A name, nothing more. And you never heard it from me.
- terms: The gate opens at dusk - and you owe me a favor.
- terms: The gate opens, no questions asked.
- terms: ""
