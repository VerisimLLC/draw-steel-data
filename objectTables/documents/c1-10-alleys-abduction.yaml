  # Alleys - Abduction

  *combat and rescue - Chapter 1: Firefall - Vonder, and the men who are not what they seem.*

  As the heroes continue through the alley, they hear ecstatic whooping over thundering boots. Read:

  ::: read-aloud
  "In a small courtyard within a tight cluster of buildings, three men in dark, nondescript clothing run from a contingent of seven collared war dogs."

  "It's too cramped for the men to break into a full sprint, so one of them jams his last dagger through a war dog's gut, killing them. The collar on the monster's neck flashes and beeps - then the beast explodes."

  "The men jump away just in time. Seeing your group has no collars, the one who stabbed the war dog calls out, 'A little help would even the odds, you know!'"
  :::

  This is **Vonder**, a high-ranking member of the Road, a thieves' guild in Blackbottom - *shifty, suspicious*. {Director reveal: the two men beside him are NOT Road members. They are war dog hypokrites in disguise, and the chase is a ruse - they hoped to follow Vonder to the Road's hideout and massacre the guild. They never expected him to stand and fight.}

  **The choice:** the heroes can help Vonder, or proceed to the sewer grate. {Skipping writes vonder_rescued = false and forfeits the Merchant's Carriage lead in Chapter 2.}

  ## The Encounter

  [[encounter]]

  {Adjustments: six heroes, add one war dog amalgamite as their own group; four heroes, remove one amalgamite; three heroes, remove one lesser hypokrite.}

  {Tactics: the war dogs revel in violence and jump at the chance to fight the heroes. Amalgamites charge for a fight to the death. The lesser hypokrites reveal themselves on their first turn, keeping Vonder from running. Sharpshooters target whoever looks threatening with Bolt Launcher. When winded, war dogs position to maximize their Loyalty Collar explosions.}

  + Vonder in the fight
    Vonder is out of weapons and tricks: a noncombatant with a personal three-hit counter, counted separately from the group during this encounter. While any hero is adjacent to him, he takes no damage from enemies. Vonder's hits: [[0]]

  + Terrain - Alleys
    The buildings are 5 squares high. The northern well is 4 squares deep with less than 1 square of water.

  **Victories:** 1 Victory each for clearing the alleyways - 2 each if Vonder was saved. [ ] awarded

  {If Vonder survives: he realizes he trusts the heroes more than his own men now - how many of the Road are war dogs in disguise? He asks to join the crew, and shares the civilian hit pool from here on.}

  ---

  ## Exit

  **Into the sewers** -> [C1-13 - Sewers: Navigate and Collapse](C1-13 - Sewers: Navigate and Collapse)

  Writes: {vonder_rescued = true or false; Vonder joins the roster if saved (unlocks the Merchant's Carriage lead in Chapter 2).}
