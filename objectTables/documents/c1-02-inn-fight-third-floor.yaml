content: |
  # Inn Fight - Third Floor

  *combat - Chapter 1: Firefall - one continuous encounter across all three floors. Do not stop the action between floors; keep the pressure on!*

  ## Death in the Morning

  ::: read-aloud
  "The smell of breakfast - smoked fish and herbs on crisp bread, sizzling eggs with lobster folded in - and the gentle scent of the baths stir the inn's guests awake as they go about their morning routines."

  "And then the world erupts into chaos. A deafening crash that is earthquake and thunder and lightning all at once explodes around and within the inn, white-hot and all-consuming."
  :::

  The heroes wake in the third-floor guest quarters, already partially destroyed by the Hawklords' bombardment. Use the **Drunken Fool Third Floor** map. Place the heroes in the starting area, along with the fiends and noncombatants immediately visible in areas T1, T2, and T3. When you are ready to begin, read:

  ::: read-aloud
  "Through the shattered outside walls of the inn, the scent of alchemical explosives fills the air."

  "Whole rooms in the inn are destroyed beyond recognition, flames eating at snapped wooden supports and destroyed furniture."

  "A massive hole has been torn in the center of the floor, a burning maw that further complicates egress from the inn."

  "Frenzied fiends with wicked claws, barbed tongues, and foul saliva prowl toward you, underscored by cries of pain and screams for help."

  "The groaning of the building's timbers tells you that the inn cannot be protected from its imminent collapse, but the civilians inside can be saved - if you act quickly."
  :::

  ## The Encounter

  [[encounter]]

  {Adjustments (the widget balances to party size): six heroes, add 4 pitlings and 4 frenzieds; four heroes, remove 1 ruinant; three heroes, remove 2 ruinants and the T6 civilians.}

  **Reinforcements:** at the start of the second combat round, another ruinant teleports in from the Iron Orb the heroes will soon discover, appearing adjacent to the hero with the highest Stamina remaining. [[checkbox]] fired

  {!Tactics: the T1 ruinants engage immediately, injuring the two nearest characters to enable Salt Wounds. The remasch assesses, teleports in to attack a spellcasting hero, then spends Malice to drag that target away to the opposite side, isolating them. All other demons harry the closest civilians until a hero draws their attention.}

  ## Hazards

  ### Fire

  Any creature who enters a patch of fire for the first time in a round or starts their turn there takes 3 fire damage. Demons avoid moving through fire if they can.

  ### Collapsing Rooms (T4, T9)

  These rooms collapse as soon as any creature enters. Any creature within 1 square can use a maneuver to make an easy Intuition test, spotting the risk on a success. When a room collapses, the creature who entered makes an Agility test:

  |Room Collapse: Agility
  |The creature takes 4 damage and 4 fire damage.
  |The creature takes 2 damage and 2 fire damage.
  |The creature takes no damage.

  ### Climbing

  The roof has been torn off, and each floor is 3 squares high. A hero can climb through the hole in the center of the ceiling; doing so costs 2 squares of movement per 1 square climbed (no test required).

  ## Civilians

  Rescued on this floor: [[counter]]

  - One civilian in **T2**, cornered by four pitlings (defeating them frees the civilian)
  - Two civilians in **T3**, trapped by debris - Lorelei and Moonlight (see below)
  - Two civilians on the **T6** balcony, crying out for help
  - One civilian in **T8**, unconscious on the floor
  - Two civilians in **T11**, cornered by four frenzieds

  {!Fifteen civilians are endangered across the whole inn (eleven at three heroes). Bonus Victory if at least 8 escape (6 of 11 at three heroes). Do NOT tell the players the number. Named civilians gather in the ground-floor kitchens.}

  ### T3 - Trapped!

  Lorelei cries out for help but refuses to leave unless her partner, Waves of Moonlight on a Shore of Glass, is freed from the fallen debris. Convincing Lorelei to leave first is a medium Presence test made as a maneuver:

  |Convince Lorelei: Presence
  |Lorelei will not leave unless Moonlight is saved.
  |Rubble falls on Lorelei and the hero - she is convinced, but the hero takes 1d6 damage.
  |Lorelei leaves the inn safely.

  Freeing Moonlight is a Might test made as a maneuver:

  |Free Moonlight: Might
  |Moonlight takes 1d6 damage, crushed under the rubble.
  |Moonlight is freed and flees, but heroes involved take 1d6 damage from collapsing debris.
  |Moonlight is freed and flees the inn.

  + T5 - Medic's Room
    Thick smoke obscures the open, largely undamaged room. Any creature who enters must make a Might test: tier one, 5 fire damage now and 3 fire damage at the start of each turn inside; tier two, 3 fire damage; tier three, no damage. {Secret: any hero who searches and succeeds on an easy Reason test discovers a satchel holding five Healing Potions.}

  + T6 - Collapsed Balcony
    This room is largely destroyed and the balcony door has collapsed. {Secret: a hero who approaches the door hears two civilians crying for help outside. An easy Might test clears the debris; on a 17+, both civilians are freed at once.}

  + T8 - Unconscious
    {!Behind the closed door, one civilian lies unconscious on the floor. A maneuver wakes them, and they flee to safety.}

  ## CUE - The Floor Collapses

  At the **end of the third combat round**, or when **all third-floor civilians have been rescued** (whichever comes first), the third floor collapses into the second. [[checkbox]] fired

  1. Any demons or civilians still on this floor die; the floor below is unharmed. {Mark any unrescued third-floor civilians as lost.}
  2. If the collapse happens mid-round: pick a number of demon groups on the floor below equal to the number of heroes who have not yet acted. Those groups act during the current round.
  3. Each falling hero makes an Agility or Might test:

  |Fall to the Second Floor: Agility or Might
  |The creature takes 5 damage and falls prone.
  |The creature falls prone.
  |The creature lands on their feet.

  4. Malice resets to 0. Open abyssal rifts close. Heroes keep their Heroic Resources.

  {In the staged version this is a five-step guided prompt (CARD-3 of the plan). Until then, run the numbered list top to bottom.}

  ---

  ## Exit

  **The floor gives way** -> [C1-03 - Inn Fight: Second Floor](C1-03 - Inn Fight: Second Floor)

  Writes: {rescued flags for each third-floor civilian (the counter above), Malice = 0.}
