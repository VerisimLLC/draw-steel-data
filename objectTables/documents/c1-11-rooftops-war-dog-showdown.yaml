content: |
  # Rooftops - War Dog Showdown

  *combat, conditional - Chapter 1: Firefall - above the chaos, into the patchwork soldiers.*

  **BYPASS RULE:** if the heroes earned a **total success** on Clear a Path, skip this encounter entirely and proceed to [C1-12 - Rooftops: Disturbed Griffons](C1-12 - Rooftops: Disturbed Griffons). {In the staged version this card auto-skips with a note.}

  ::: read-aloud
  "From this high vantage point, the extent of Blackbottom's destruction is plain to see."

  "The way forward is clear: you'll move between rooftops along ladders and rickety planks of wood, keeping the civilians behind you and above the chaos."

  "A pair of winged soldiers flank the rooftops ahead, above two packs of hulking, misshapen soldiers."
  :::

  ## The Encounter

  [[encounter]]

  {Adjustments: six heroes, add two war dog teletalites as their own group; four heroes, remove two eviscerites; three heroes, remove two eviscerites and two teletalites.}

  {Tactics: the winged neuronites take to the air immediately, using Synlirii Grafts to force heroes off the rooftops and follow up from above. Eviscerites lock threats down with Chainsaw Whip pulls and grabs; commandos strike from range; teletalites teleport across the rooftops to overwhelm.}

  + Terrain - Rooftops
    Each building is 6 squares tall.

  + TRIGGER - BOOM, round 2
    At the start of the second combat round, the war dogs blow up the building with the most heroes on it. Each creature on the heroes' side on that building tests Agility: 8 damage and prone / 5 damage / no damage. (One-tap group roll when staged.) [ ] fired

  **Ending the encounter:** the war dogs fight to the death; the encounter ends when they are all dead.

  **Victories:** 1 Victory each. [ ] awarded

  ---

  ## Exit

  **The rooftops fall silent** -> [C1-12 - Rooftops: Disturbed Griffons](C1-12 - Rooftops: Disturbed Griffons)
