content: |
  # Rooftops - Disturbed Griffons

  *skill scene - Chapter 1: Firefall - Bora, and two very upset griffons.*

  Standing on the rooftops, exposed to the violence raining from the heavens, is **Bora** - *sentimental, oblivious, nurturing* - a human merchant who deals in exotic animals. Two griffons she brought to Blackbottom to sell are a few feet away, startled and shrieking as the carnage blooms around them.

  Any hero can make a medium Intuition test (the Handle Animals skill applies) to calm the creatures:

  |Calm the Griffons: Intuition (medium)
  |The hero only angers the griffons, who knock one of the civilians off the roof, killing them instantly.
  |The hero calms the creatures but takes 6 damage from the griffons' talons.
  |The hero calms the griffons unharmed - and one takes a shine to them, offering a token of affection: a felt toy Fetching Mouse.

  {Tier 1 is an instant civilian death - roster prompt, Director picks. Tier 3's Fetching Mouse is Cinematic Assistance for Chapter 3 - add it to treasures and hold the reveal.}

  If the heroes calm the griffons, Bora thanks them; she must get her animals to safety, but asks where the heroes are headed and plans to check in when things calm down.

  **Victories:** 1 Victory each for clearing the way through the rooftops. [ ] awarded

  ---

  ## Exit

  **Down to the sewer grate** -> [C1-13 - Sewers: Navigate and Collapse](C1-13 - Sewers: Navigate and Collapse)

  Writes: {griffons_saved = true on tier 2 or 3 (unlocks the Hawk Transport lead in Chapter 2); bora.rescued = true; Fetching Mouse to treasures on tier 3; a civilian death on tier 1.}
