  # Sewers - Navigate and Collapse

  *montage x2 - Chapter 1: Firefall - the last stretch to the safehouse.*

  ::: read-aloud
  "The damp, dark tunnels of the storm sewer system beneath the city muffle the sounds of destruction from above, though the screams of the dying still echo faintly like lingering ghosts."

  "Your movement and the shuffling footsteps of the civilians following you add to the eerie chorus of noise."
  :::

  {Sewer Folk complication: a hero with it auto-succeeds on Navigating the Sewer and gains an edge on power rolls during the Sewer Collapse montage.}

  ## Part A - Navigating the Sewer

  Hunt's marker is the Chain's coat of arms - an X with a sword through it - carved where it is hard to spot at certain intersections. Any hero can search with a medium Reason test:

  |Find the Safehouse: Reason (medium)
  |A dead end - everyone takes 3 poison damage, and the civilians take one hit.
  |The path is found, but the hero wades through sewage and takes 3 poison damage.
  |A clear path to the safehouse.

  ## Part B - Sewer Collapse

  ::: read-aloud
  "An ear-splitting explosion erupts on the streets above, quaking the sewers. For a few seconds, only trickles of sand and rock fall from the ceiling. Then large chunks of stone plummet, crashing down and sinking into the sludge below."

  "The path forward, in your grasp just moments ago, is now flooded and buried under rocks and debris, unscalable by the weak and injured in your party."

  "The sewers continue to shake. Excited shouts and lupine yips echo in the distance behind you. Friend or foe, you cannot know, but it's a bad idea to stick around and find out."
  :::

  **Limits by party size:** three heroes 4/2 - four 5/3 - five 6/4 - six 7/5. {Pre-filled from party size when staged.}

  Successes: [[0]] Failures: [[0]]

  + Challenges
    Avoid Goblins (Agility, Presence - Handle Animals, Lie, Sabotage). Cross Sewage River (Agility, Might - Endurance, Swim). Deal With Falling Ceiling (Might - Endurance, Lift; usable TWICE). Delegate Tasks (Intuition, Presence - Empathy, Lead). Uncover Structural Secrets (Reason, Intuition - Architecture, Search).

  ## Outcomes

  |Result|Effect|
  |Total success|The passage is cleared AND hidden behind debris (a civilian suggests it if the heroes do not). 2 Victories each.|
  |Partial success|The rubble is cleared; each hero takes 5 damage from falling debris. 1 Victory each.|
  |Total failure|Opportunistic goblins discover the group -> run C1-14 - Goblin Attack.|

  ---

  ## Exit

  This card has two exits:

  **Path cleared (total or partial)** -> [C1-15 - Unsafe House](C1-15 - Unsafe House)

  **Total failure** -> [C1-14 - Sewers: Goblin Attack](C1-14 - Sewers: Goblin Attack)

  Writes: {sewer outcome; victories; damage or the goblin branch.}
