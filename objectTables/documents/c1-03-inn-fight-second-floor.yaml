content: |
  # Inn Fight - Second Floor

  *combat - Chapter 1: Firefall - same encounter, no break. Flames engulf the second floor; only sparse structural supports remain.*

  Place the heroes near the south stairs if they descended, or at the location where they fell if the third floor collapsed under them. When the heroes arrive, read:

  ::: read-aloud
  "The building groans, sagging into itself as detritus rains down, meteoric and foreboding."

  "Distant screams are barely heard over the frantic shrieks of a group of humans fleeing for the stairs, a pack of fiends hot on their heels."

  "Between humans and demons stands Artistoxilath, right arm slack at their side, brandishing a blazing wooden support beam in their other hand."
  :::

  ## The Encounter

  [[encounter]]

  {Adjustments (the widget balances to party size): six heroes, add 4 frenzieds to group 1 and 4 pitlings to group 2; four heroes, move the S10 remasch and civilian to the northeast corner of S1; three heroes, also remove the two S9 civilians.}

  {Tactics: group 1 harries Artistoxilath. Group 2 searches the northwest rooms for victims, busting down the S11 door and continuing counterclockwise until it finds civilians or the heroes stop it.}

  + Artistoxilath holds the line - S1
    The dragon knight is holding off a remasch and four frenzieds with an improvised weapon and a broken dominant arm, covering two civilians running for the stairs. Once the heroes clear the demons here, Artistoxilath joins the other civilians and keeps watch over them.

  ## Hazards

  + Collapsing Rooms - S2 and S7
    Closed doors; these rooms collapse when entered. Same rules as the third floor: a maneuver within 1 square with an easy Intuition test spots the risk; the enterer tests Agility: 4 damage and 4 fire / 2 and 2 / none.

  + Burning Room - S3
    The whole room is on fire; smoke pours around the hot, closed door. A medium Reason test knows opening it feeds the fire: if any creature opens the door, fire spreads down the west side of S1 from S5 to S10 at the end of the round.

  + Baths - S10 and S11
    Hot water, bath oils, and fire make the floor hazardous: difficult terrain, or a hero can treat it as normal terrain by taking 3 fire damage each round they move through.

  ## Civilians

  Rescued on this floor:

  [[0]]

  - Two civilians running for the stairs behind Artistoxilath in **S1**
  - One civilian barricaded in **S4**
  - One civilian trapped in the corner of **S6**
  - Two civilians hiding on the **S9** balcony
  - One civilian cowering from a remasch in **S10**

  + S4 - Barricade
    The door is blocked from inside. {Secret: a stunned civilian barricaded it after hearing demons. An easy Presence test as a maneuver convinces them to move the furniture and flee; or an easy Might test as a maneuver breaks through, and they flee without argument. If demons reach this area first, the civilian cowers until killed or rescued.}

  + S6 - Trapped Across the Gap
    A civilian is trapped in the far corner, cut off by a 4-square gap where the floor fell, growing flames, and smoke flooding up from below. Any hero who reaches them can get them across or lower them down, no test - hurl them to another hero's arms, affix a rope, any reasonable approach. Once freed, they flee to safety.

  + S9 - Hiding Place
    The room looks destroyed and empty; the balcony door is closed. {Secret: two civilians hide on the balcony, too terrified to call out, unable to climb down past the fire. Opening the door finds them; or an easy Intuition test (no action) hears their frightened sobbing. Encouraged to leave as a maneuver, they flee to safety.}

  + S5 - Room With a View Down
    The floor has completely collapsed, leaving a hole to the ground floor.

  + TRIGGER - Reinforcement, round 2
    At the start of the second combat round of this floor, one remasch appears adjacent to the hero with the highest Stamina remaining. (Authored as a wave on the encounter.) [ ] fired

  + TRIGGER - The Floor Collapses
    At the end of the sixth overall combat round, or when all second-floor civilians have been rescued (whichever comes first), the second floor collapses into the ground floor: same collapse sequence as the third floor - deaths on this floor, mid-round activations below, the Agility or Might fall test (5 and prone / prone / clean), Malice to 0, rifts close. [ ] fired

  ---

  ## Exit

  **The floor gives way** -> [C1-04 - Inn Fight: Ground Floor](C1-04 - Inn Fight: Ground Floor)

  Writes: {rescued flags for each second-floor civilian; Malice = 0.}
