id: 93c751b4-5a0c-49b7-a082-a60b6a6fdcdc
name: Charge Allows Jump
_table: customAttributes
__typeName: CustomAttribute
baseValue: "0"
category: Movement
documentation: Allows the Charge action to include one automatically planned jump using the creature's guaranteed jump distance and height. The charge remains straight and within its movement allowance. Jumps requiring a roll are not supported.
