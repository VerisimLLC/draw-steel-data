id: 93c751b4-5a0c-49b7-a082-a60b6a6fdcdc
name: Charge Allows Jump
_table: customAttributes
__typeName: CustomAttribute
baseValue: "0"
category: Movement
documentation: Allows the Charge action to include one automatically planned jump. Guaranteed routes are preferred; otherwise a jump test at the fixed takeoff determines the actual landing. The charge remains straight and within its movement allowance. A shortfall ends movement and permits an attack only against a legal target from the actual landing.
