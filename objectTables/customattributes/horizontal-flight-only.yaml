documentation: If greater than zero, this creature can fly only horizontally. It can't fly up or down (the Fly Up / Fly Down controls and Drop to Ground are refused), though effects such as levitation can still lift it. Used by the "Levitated, slowed and weakened" effect of the Ghost's Spirited Away.
