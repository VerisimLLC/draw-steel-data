name: Not Treated As Enemy
_table: customAttributes
__typeName: CustomAttribute
baseValue: "0"
category: Combat
ctime: 1795311115029
documentation: A creature with a positive number can't be treated as an enemy by anyone who isn't already its ally. To them it is neither ally nor enemy, so only abilities that can target any creature reach it, and enemy-only triggers, free strikes, flanking and Enemies auras skip it. Used by Guise.
