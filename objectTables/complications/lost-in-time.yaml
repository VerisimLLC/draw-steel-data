id: a5419cbd-f23f-48b0-b2a8-e0b7c589e432
name: Lost in Time
description: In a long-ago age, a cataclysm overtook your city. You weren't killed, but some arcane accident caused you to be suspended in time until now. Alone, you must navigate the world around you with a head full of outdated memories -- and a few ancient secrets.
_table: complications
__typeName: CharacterComplication
_fork: 
benefit: Choose a damage type from acid, cold, corruption, fire, holy, lightning, poison, psychic, or sonic. Whenever you use a signature ability, you can have it deal your chosen damage type instead of its usual damage.
ctime: 1775047661605
drawback: 'You automatically fail any test made to recall information from the period during which you were suspended in time. '
