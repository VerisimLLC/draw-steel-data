name: Mundane
description: You're hopelessly nonmagical. When you try to use magic abilities, or even when they're used on you, they never work right. Even magic devices seem to fizzle in your presence.
_table: complications
__typeName: CharacterComplication
benefit: You have immunity to corruption, holy, and psychic damage equal to your level.
ctime: 1775132956152
drawback: Whenever you carry more than three magic treasures, you take a bane on power rolls.
