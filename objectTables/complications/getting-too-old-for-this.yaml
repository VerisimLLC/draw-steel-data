  - name: Getting Too Old for This - Benefit
    description: On your turn, you can choose a heroic ability that you would be able to learn if you were one level higher. Provided you meet the ability's other prerequisites and can spend any required Heroic Resource, you can use the ability. Once you use this benefit, you can't do so again until you earn 2 or more Victories.
    __typeName: CharacterFeature
    canHavePrerequisites: true
    guid: b7433e7b-8ca7-4b63-8ea7-779e7866c316
    implementation: 3
    modifiers:
    # The "2 or more Victories" cooldown is modelled as a 2-point resource rather than a
    # usage limit, because no refresh type tracks victories. Using the benefit spends both
    # points; each Victory earned refunds one, so the second Victory is what makes it
    # available again. RefreshResource clamps at full, so banking extra Victories does not
    # let the benefit be used twice in a row.
    - name: Getting Too Old for This - Benefit
      description: On your turn, you can choose a heroic ability that you would be able to learn if you were one level higher. Provided you meet the ability's other prerequisites and can spend any required Heroic Resource, you can use the ability. Once you use this benefit, you can't do so again until you earn 2 or more Victories.
