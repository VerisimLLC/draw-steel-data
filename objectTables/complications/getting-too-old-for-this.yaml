    - name: Getting Too Old for This - Benefit
      description: On your turn, you can choose a heroic ability that you would be able to learn if you were one level higher. Provided you meet the ability's other prerequisites and can spend any required Heroic Resource, you can use the ability. Once you use this benefit, you can't do so again until you earn 2 or more Victories.
      __typeName: CharacterModifier
      activatedAbility:
        name: One Last Trick
        description: Choose a heroic ability you would be able to learn if you were one level higher, and use it. You must still pay its costs.
        __typeName: ActivatedAbility
        # Costs a Main Action, and suppressInvokedActionCost below stops the borrowed
        # ability charging its own action on top -- without that the pair is unaffordable.
        # The borrowed ability still pays its own Heroic Resource.
        actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
        behaviors:
        - __typeName: ActivatedAbilityInvokeAbilityBehavior
          # "<= 1" not "= 1": everything a character one level higher could have,
          # which includes the level-1 choices this character passed over. Most classes
          # unlock heroic abilities only every few levels, so "= 1" leaves the benefit
          # inert at most levels.
          abilityFilter: Ability.Levels Above <= 1 and Ability.Categorization = "Heroic Ability" and not Ability.Known and Ability.Prerequisites Met
          abilityType: chooseClassAbility
          applyto: caster
          chooseAbilityEmptyText: You have no heroic abilities available one level above your own right now.
          chooseAbilityTitle: One Last Trick
          suppressInvokedActionCost: true
        # Skips the action bar's "Confirm" step -- a self-targeted ability has no
        # targeting choices to make, so the picker should open straight away.
        castImmediately: true
        categorization: Ability
        display:
          bgcolor: "#ffffffff"
          brightness: 1
          hueshift: 0
          saturation: 1
        flavor: You still remember some of your old tricks.
