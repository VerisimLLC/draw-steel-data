name: Betrothed
description: Your parents made a deal, and as part of that deal, you’re supposed to marry someone—or something—you didn’t choose. But no one is going to tell you what to do! They’ll all be sorry to find that you’ve run away to become a mighty adventurer.
_table: complications
__typeName: CharacterComplication
benefit: "You escaped with a dowry present - a 1st-echelon trinket of your choice (see Treasures in Chapter 13: Rewards)."
ctime: 1774441065495
drawback: All those who learn of you running out on your commitment think less of you and spread nasty rumors about you. Your Renown can’t ever be more than your level - 1.
