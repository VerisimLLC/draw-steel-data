id: 6ffbf527-6dd5-46f6-946d-66603b8b6b57
name: Infernal Contract
description: You made a deal (perhaps unknowingly) with an archdevil that has tied you to that fiend's service. When you first learned of this deal, you were taken to the Seven Cities of Hell, where some of the timescape's best minds taught you the ways of battle. The archdevil allows you to use these gifts as you will... until they require a favor from you.
_table: complications
__typeName: CharacterComplication
benefit: "Whenever you are present for a battle in which both sides have creatures who aren't surprised, your side determines who goes first if the d10 roll is a 4 or higher (see Combat Round in Chapter 10: Combat)."
ctime: 1775047635538
drawback: The archdevil occasionally asks you to defeat enemies on their behalf. If you refuse, your fiendish patron sends devils after you and those you care about.
