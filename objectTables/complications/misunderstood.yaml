id: 46580447-080c-4946-9a87-773f8f7b9901
name: Misunderstood
description: Your appearance marks you as part of a group that is universally feared. You might be a gentle soul, but you’re not often given a chance to prove it. It’s no wonder you usually wear a hood.
_table: complications
__typeName: CharacterComplication
benefit: When you reveal your appearance to creatures who don’t know you personally, you gain an edge on any test involving those creatures where the Brag or Intimidate skill could be applied, but you take a bane on any test where the Flirt, Lead, or Persuade skill could be applied.
