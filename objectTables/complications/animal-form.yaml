id: d059cf60-9222-4a76-a0be-612822435644
name: Animal Form
description: Due to a magical accident, your being has fused with that of a small, harmless animal. You turn into this animal when it’s convenient—and sometimes when it’s inconvenient as well.
_table: complications
__typeName: CharacterComplication
benefit: 'As a maneuver, you take the form of a specific animal of size 1T. You retain all your other statistics aside from your size, but you can’t talk or use main actions, and the only maneuvers you can use are Escape Grab, Hide, and Stand Up. Based on the animal you can turn into, you might be able to burrow or fly, or to automatically climb or swim at full speed while moving. If your animal form doesn’t provide such additional movement, you have a +2 bonus to speed. Unless you use this benefit again, you return to your true form at the start of your next turn. '
ctime: 1774438615053
drawback: At the start of any turn while you are winded, the Director can spend 1 Malice to force you to take your animal form. Once the Director has done so, they can’t do so again until you have finished a respite.
