name: Grifter
description: You used to be a con artist, but those days are pretty much behind you. Being a hero is an even better racket. After all, if you’re saving the world, who can be mad at you for stealing a few coins along the way?
_table: complications
__typeName: CharacterComplication
benefit: You have one skill of your choice from the intrigue skill group.
ctime: 1775041285727
drawback: Whenever you meet an NPC for the first time, the Director can decide that NPC was a victim of one of your previous cons and remembers you. If they do so, the party gains a hero token.
