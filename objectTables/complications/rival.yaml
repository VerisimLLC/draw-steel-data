name: Rival
description: Whatever your accomplishments, you’ll forever measure yourself against a former companion who always seemed to stay one step ahead of you.
_table: complications
__typeName: CharacterComplication
benefit: Choose one of your skills. That skill grants a +3 bonus to tests instead of +2.
ctime: 1775140656530
drawback: Your rival has similar statistics to yours, but always had one skill they excelled at, as determined by the Director. Intimidated by their prowess, you take a bane on tests using that skill.
modifierInfo:
  __typeName: ClassLevel
  features:
  - name: Rival - Benefit
    description: |-
      Choose one of your skills. That skill grants a +3 bonus to tests instead of +2.

      DIRECTOR INSTRUCTIONS
      As we cannot determine what skill a player will choose, we have provided a Modify Power Roll template below which will turn the chosen skill into a +3 instead of a +2.
      In the below 'Modify Power Rolls 'behaviour, click the 'Add Skill' dropdown and select the skill the player has nominated. Then scroll down and in the 'Activation' dropdown, select 'Always' and click Confirm. This will activate the Edge on all tests that use the skill the player has chosen.
    __typeName: CharacterFeature
    canHavePrerequisites: true
