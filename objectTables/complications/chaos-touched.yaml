id: 345cd34c-bc9e-4555-b308-1a4f711f8f0f
name: Chaos Touched
description: You came into contact with a mote of pure chaos energy, or were subjected to a supernatural effect or object that fused chaos into your very being. Now you can sprout and retract your limbs in a way that horrifies unprepared onlookers.
_table: complications
__typeName: CharacterComplication
benefit: You gain an edge on the Escape Grab, Grab, and Knockback maneuvers. Additionally, you can hold an additional item even when your hands are full.
ctime: 1774441429774
drawback: While dying, you grow and retract uncoordinated limbs at random, imposing a bane on your power rolls.
