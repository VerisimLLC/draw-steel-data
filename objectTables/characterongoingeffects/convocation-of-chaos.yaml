name: Convocation of Chaos
description: Until the end of the encounter, this elemental has a +5 bonus to speed and a +5 damage bonus to strikes. Whenever an elemental within this elemental's line of effect uses an ability with "Convocation" in the name, this elemental also gains the effects of that ability.
