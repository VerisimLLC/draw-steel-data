implementation: 4
implementationDetails: "GOLD: The +5 speed and +5 strike damage are automated for the encounter. Whenever an elemental within this elemental's line of effect uses Convocation of Flames, Squalls, Verdure, Waves or Quartz, this elemental also gains its base effect, and its 3 Malice effect when that option was paid for (the fire zone, vortex, overgrowth and ward, pool of water, or carapace, centered on this elemental). It is not echoed again when this elemental was itself the target. Echoed effects carry the same limits as the abilities they copy (Convocation of Waves leaves no stream behind)."
