implementation: 3
implementationDetails: "SILVER: The +5 speed and +5 strike damage are automated for the encounter. The Convocation echo is mirrored per implemented Convocation ability (Flames fire immunity, Squalls lightning immunity, Verdure 15 temporary Stamina) via useability triggers gated on line of effect. Not echoed: the 3-Malice zone modes of those abilities (the trigger cannot see which mode was used), and Convocation of Waves / Quartz, whose own monster abilities are not yet implemented."
