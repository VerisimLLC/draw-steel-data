name: I’m Not a Steed, You’re Equipment
description: |-
  The Nameless’s mentor enters the Nameless’s space and rides on their back. The Nameless or the mentor can move the mentor to an adjacent space as a free maneuver. While in the Nameless’s space,
  the mentor moves with them and can’t use their move action, and ability rolls against the mentor take a bane.
