id: b049f79f-f1d9-491e-b5a9-d8b0848008ff
name: Animal Form
description: You take the form of a specific animal of size 1T. You retain all your other statistics aside from your size, but you can’t talk or use main actions, and the only  maneuvers you can use are Es- cape Grab, Hide, and Stand Up. Based on the animal you can turn into, you might be able to burrow or fly, or to automatically climb or swim at full speed while moving. If your animal form doesn’t provide such additional movement, you have a +2 bonus to speed.
