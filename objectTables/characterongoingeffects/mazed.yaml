description: |-
  While mazed, the target is dazed. Additionally, at the end of each of the mazed target’s turns, the retainer can cause the target to move up to their speed in a straight line in a direction of the retainer’s
  choice. This is not forced movement, and the movement ends if it would cause the target to enter difficult or damaging terrain.
