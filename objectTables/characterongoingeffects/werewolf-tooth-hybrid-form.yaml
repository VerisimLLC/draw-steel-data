name: Hybrid Form
description: |-
  You have your companion's physical characteristics, and your speed is your companion's speed if it is higher. You gain your companion's movement types and damage immunities, and you can use abilities with the Companion keyword.

  Lasts until the end of the encounter, or until you revert to your true form as a free maneuver.
