  triggeredAbility:
    name: Caustic Detonator
    description: ""
    __typeName: TriggeredAbility
    abilityType: none
    behaviors:
    - __typeName: ActivatedAbilityScriptBehavior
      code: |-
        --Caustic Detonator: the odd/even die. Triggered casts run on the machine of
        --whoever controls the creature wearing the detonator, so a hero's player rolls
        --it and the Director rolls it for a monster. The roll goes on the sidebar roll
        --card; the old roll dialog is only used when there is no sidebar to show it on.
        --The result is stored as Cast.Memory("detonatorDie") for the explosion steps.
        local done, total = false, nil
        --Name who is rolling: one player can have several detonators go off at once.
        local title = "Roll Detonator Die"
        if casterToken.name ~= nil and casterToken.name ~= "" then
            title = title .. " for " .. casterToken.name
        end
        local params = {
            title = title,
            description = "Roll Detonator Die",
            explanation = "On an odd result, the detonator explodes.",
            roll = "1d10",
            creature = casterToken.properties,
            completeRoll = function(rollInfo)
                total = rollInfo.total
                done = true
            end,
            cancelRoll = function()
                done = true
            end,
        }

        --The sidebar holds one roll at a time. When several detonators go off at
        --once, each waits for its turn on it; the old dialog is only a last resort.
        local mount = nil
        if rawget(_G, "CharacterPanel") ~= nil and CharacterPanel.EmbedPromptRollDialog ~= nil then
            local waitStart = dmhub.Time()
            while mount == nil and dmhub.Time() - waitStart < 60 do
                mount = CharacterPanel.EmbedPromptRollDialog{token = casterToken, ability = ability}
                if mount == nil then
                    coroutine.yield(0.2)
                end
            end
        end

        --Free the sidebar for the next roll, and put the ability card away again
        --if we were the ones who put it up.
        local function Teardown()
            if mount == nil then return end
            if mount.dialog ~= nil and mount.dialog.valid and mount.dialog.data ~= nil then
                mount.dialog.data.promptPending = nil
            end
            if mount.locked then CharacterPanel.UnlockDisplayAbility(mount.lockId) end
            if mount.ownedAbility ~= nil then CharacterPanel.HideAbility(mount.ownedAbility) end
        end

        local onSidebar = false
        if mount ~= nil and mount.dialog ~= nil and mount.dialog.valid and mount.dialog.data ~= nil
            and mount.dialog.data.ShowDialog ~= nil then
            params.promptHeader = "<b>" .. title .. "</b>\nOn an odd result, the detonator explodes."
            params.delay = mount.showDelay
            onSidebar = mount.dialog.data.ShowDialog(params) ~= nil and mount.dialog.valid
        end
        if not onSidebar then
            Teardown()
            mount = nil
            GameHud.instance.rollDialog.data.ShowDialog(params)
        end

        while not done do
            --a sidebar card destroyed without finishing (displaced by another cast) can
            --never call back, so treat that as a cancel rather than waiting forever.
            if mount ~= nil and (mount.dialog == nil or not mount.dialog.valid) then
                done = true
            end
            coroutine.yield(0.1)
        end
        Teardown()

        symbols.cast:StoreMemory("detonatorDie", total or 0)
        if total ~= nil then
            ability:CommitToPaying(casterToken, options)
        end
      name: DetonatorDie
    - __typeName: ActivatedAbilityPowerRollBehavior
      filterTarget: Cast.Memory("detonatorDie") = 1 or Cast.Memory("detonatorDie") = 3 or Cast.Memory("detonatorDie") = 5 or Cast.Memory("detonatorDie") = 7 or Cast.Memory("detonatorDie") = 9
      roll: 2d10 + 2
      tiers:
      - 4 acid damage; M<0 bleeding (save ends)
      - 6 acid damage; M<1 bleeding (save ends)
      - 10 acid damage; M<2 bleeding (save ends)
    - __typeName: ActivatedAbilityPurgeEffectsBehavior
      conditions: []
      filterTarget: Cast.Memory("detonatorDie") = 1 or Cast.Memory("detonatorDie") = 3 or Cast.Memory("detonatorDie") = 5 or Cast.Memory("detonatorDie") = 7 or Cast.Memory("detonatorDie") = 9
      mode: effect
      ongoingEffect: 7c7cee0e-ad89-4c42-8a1d-94dec05a7b60
      purgeType: all
