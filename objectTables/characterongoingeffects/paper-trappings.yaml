name: Paper Trappings
description: "You can use a main action to fold in on yourself until you and your gear are paper thin. This effect lasts for 1 minute, letting you easily slip through any opening that is 1 inch wide or more.\v\vIf you return to your true form while in a space that is too small for you, you are violently expelled into the nearest open space of your choice and take 3d6 damage."
