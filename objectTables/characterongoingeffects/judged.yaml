name: Judged
description: |
  If a judged creature uses an action and you have line of 
  effect to them, you can use a free triggered action to deal 
  holy damage equal to twice your Presence score to them.
  When the judged creature is reduced to 0 Stamina, you can 
  use a free triggered action to use this ability against a new 
  target within distance.
