id: 2cd2be70-bda1-4891-939a-4a8601a64218
name: Wild Rumpus
description: |-
  You and your companion gain each other's movement types in addition to your own, and you both use your speed or your companion's speed, whichever is higher.

  Ends when you or your companion takes damage, or at the end of the encounter.
_table: characterOngoingEffects
__typeName: CharacterOngoingEffect
