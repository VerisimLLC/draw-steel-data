name: Hallucination Field
description: You are covered by an illusion causing you to appear exactly as any creature an observer most expects to see. The illusion ends if any creature under its effect harms or physically interacts with any creature not affected by the illusion, if the wearer uses the ability again, or if the wearer chooses to end the effect. It also ends for any affected ally who moves more than 10 squares from the wearer.
