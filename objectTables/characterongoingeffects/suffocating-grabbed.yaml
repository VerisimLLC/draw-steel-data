implementationDetails: "GOLD: Stacks count the rounds spent grabbed. At the end of each round (the start of the next) the creature takes 1d6 damage if the rounds already held exceed max(Might, 1), then gains a stack. The effect ends as soon as the creature is no longer grabbed. A creature that does not need to breathe still gets it - remove it by hand."
