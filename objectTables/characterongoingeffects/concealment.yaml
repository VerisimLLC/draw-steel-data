name: Concealment
description: |-
  Darkness, fog, invisibility magic, and other phenomena that fully obscures a creature but doesn’t protect their body give a creature concealment. You 
  can target creatures who are in concealment with attacks, provided they aren’t hidden, however attacks against these creatures have a bane.
