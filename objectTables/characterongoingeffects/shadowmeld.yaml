name: Shadowmeld
description: |
  You are flattened into a shadow. Area abilities don't affect you, strikes against you take a bane, and tests made to find you take a bane. If you are flattened against a wall, only creatures within 60 degrees of straight in front of the wall can see you through your hiding. Moving, or using a main action or maneuver, ends this form.
