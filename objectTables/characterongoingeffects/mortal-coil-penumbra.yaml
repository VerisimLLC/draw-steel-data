id: 0e77a5e8-e94f-4342-a074-6badce426aa5
name: Mortal Coil Penumbra
description: |-
  This creature is within the 10-mile penumbra of an active Mortal Coil. They have damage weakness 2 and can't regain Stamina. They age at 10 times the usual rate, diseases and poisons affecting them run their course at 10 times their usual rate, and they can undertake one additional respite activity during each respite. If they are non-mortal they can be killed, and any creature who dies in the penumbra is permanently, irrevocably dead.
