implementationDetails: "SILVER: after any enemy strike resolves against the warded creature, the attacker is pulled 5 squares toward the warded creature. The book pulls toward the overgrown area and only when the attacker is within line of effect of it; the pull here is toward the creature (who normally stands in the area) and has no line-of-effect check, since triggered abilities cannot reference the aura's location."
