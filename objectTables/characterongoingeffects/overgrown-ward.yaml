implementationDetails: "GOLD: after an enemy strike resolves against the warded creature, a Forced Movement Origin behavior finds the Overgrown Ground placed around that creature and drops the attacker unless it has line of effect to a square of it; the attacker is then pulled 5 squares toward the area's center. With several such areas the nearest one the attacker can see is used; with none left (the area was removed) there is no pull."
