id: e7c1ccbb-8c55-4e48-96bf-0cc4c0bc7c07
name: Punishing Regrowth
description: Until the end of the round, each wode elf gains an edge on abilities, and their strikes can slide a target up to 2 squares in addition to their usual effects. If a strike already imposes forced movement, this slide happens after that forced movement. A creature force moved by a wode elf’s strike who ends this forced movement in difficult terrain is restrained until the end of their next turn.
