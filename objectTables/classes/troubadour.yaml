  quantity: 2 + (1 when MelodramaBoostedEvents has "hero-winded")
- name: Creature Rolls Natural 19 or 20
  details: When a creature within your line of effect rolls a natural 19 or 20 you gain three Drama.
  guid: 9eca29f3-05c3-4a67-a840-4f5490934460
  mode: recurring
  quantity: 3 + (1 when MelodramaBoostedEvents has "natural-19-20")
- name: A Hero Dies
  details: When a hero, including you, dies, you gain ten Drama.
  guid: 6aa5e26c-ba27-4b69-bdaf-6b944745ac84
  mode: recurring
  quantity: 10 + (1 when MelodramaBoostedEvents has "hero-dies")
