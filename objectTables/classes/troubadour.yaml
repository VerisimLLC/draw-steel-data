- name: 3 Heroes Use Ability In Turn
  details: When three or more heroes use an ability on the same turn for the first time, you gain 2 Drama.
  guid: 8d195ece-c7df-41a6-9a17-0613ea792ff4
  mode: encounter
  quantity: 2 + (1 when MelodramaBoostedEvents has "3-heroes-ability")
- name: Hero Becomes Winded
  details: When a hero becomes winded for the first time, you gain 2 Drama.
