            - __typeName: ActivatedAbilityPowerRollBehavior
              tiers:
              - "#The target can shift 1 square and make a free strike."
              - "#The target can shift up to 2 squares and make a free strike with an edge."
              - "#The target can shift up to 3 squares and make a free strike with an edge, then can spend a Recovery."
              roll: 2d10 + Presence
            - __typeName: ActivatedAbilityScriptBehavior
              name: DramaticReversalPrompts
              code: |-
                --Offer each target a Dramatic Reversal prompt card. Accepting the
                --card casts the tier-matched standard ability package (shift, free
                --strike, and at tier 3 a recovery) on the accepting player's client,
                --whether the target is controlled locally or remotely. Dismissing
                --the card declines the offer.
                local tierAbilities = {
                    "6b7c412d-2ff8-428f-ab64-57d37c05ce06",
                    "50f79904-37ad-436f-9073-541b71d39484",
                    "827bf5ba-e81d-443d-8052-58fd0601dc06",
                }
                local tierRules = {
                    "You can shift 1 square and make a free strike.",
                    "You can shift up to 2 squares and make a free strike with an edge.",
                    "You can shift up to 3 squares and make a free strike with an edge, then can spend a Recovery.",
                }
                local tier = 0
                if symbols ~= nil and symbols.cast ~= nil then
                    tier = symbols.cast:try_get("tier", 0) or 0
                end
                if tier < 1 then
                    return
                end
                if tier > 3 then
                    tier = 3
                end
                for _,target in ipairs(targets or {}) do
                    if target.token ~= nil and target.token.valid then
                        AbilityInvocation.PromptStandardAbility{
                            token = target.token,
                            invoker = casterToken,
                            standardAbility = tierAbilities[tier],
                            targeting = "self",
                            prompt = "Dramatic Reversal",
                            rules = tierRules[tier],
                        }
                    end
                end
