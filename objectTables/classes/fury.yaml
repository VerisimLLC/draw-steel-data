    - name: Primordial Aspect
      description: "You are a product of customs older than warfare, older than civilization, older than most of the world. You have undergone a rite of passage that revealed the building blocks of the timescape--the Primordial Chaos--and that left an aspect of that chaos inside you. You choose a primordial aspect from the following options, each of which grants you a skill. *(Quick Build: Berserker.)*"
      __typeName: CharacterSubclassChoice
      classid: ce18b1ba-363b-4403-945b-34a3ce08a465
      guid: e1fc38a8-0fcc-444b-81b3-82db3a25ed0f
    - name: Ferocity
      description: "Within the heat of battle, your determination and anger grow, fueling a Heroic Resource called ferocity.\n\nAt the start of a combat encounter or some other stressful situation tracked in combat rounds (as determined by the Director), you gain ferocity equal to your Victories. At the start of each of your turns during combat, you gain 1d3 ferocity. Additionally, the first time each round that you take damage, you gain 1 ferocity. The first time in an encounter that you become winded or dying, you gain 1d3 ferocity. You lose any remaining rage at the end of the encounter. "
