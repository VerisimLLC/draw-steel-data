  mode: round
  quantity: Heroic Resource Gain at Start
- name: Damage the Marked
  details: 'The first time each round that you or an ally damages a target you have marked, you gain 1 focus. This inceases to 2 at level 4. '
  guid: 92ee378f-3221-43dc-a04c-6c15e63f3dd4
  mode: round
  quantity: 1 + 1 when level >= 4
- name: Ally Uses Heroic Ability
  details: The first time in a round that an ally within 10 squares of you uses a heroic ability, you gain 1 focus.
  guid: 75949255-7efc-4694-aedd-2660fb30ba7c
  mode: round
