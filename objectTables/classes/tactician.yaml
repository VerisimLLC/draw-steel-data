    - __typeName: CharacterFeature
      classid: 506d41b6-816b-45c5-8f28-765f29d6f8ae
      description: |-
        You have drilled with a broad array of weapons and have developed techniques to optimize their use. Whenever you select or change your kit, you can select an additional martial kit and gain the benefits of both kits.

        If both kits grant you the same benefit, you take one or the other and can't change your choice until you finish a Respite. (This usually means taking the higher of two bonuses.) You also gain access to the signature abilities of both kits.
      name: Field Arsenal
      source: Tactician Class Feature
      guid: 41070fb5-d25c-4cc0-8d1a-7e1db8e2d04c
      tags:
        Combat: true
        Respite: true
      implementation: 3
      domains:
        class:506d41b6-816b-45c5-8f28-765f29d6f8ae: true
      modifiers: []
    - __typeName: CharacterFeature
      classid: 506d41b6-816b-45c5-8f28-765f29d6f8ae
      source: Tactician Class Feature
      guid: b7c70946-ea8a-405d-99f4-1df9301eeff5
      domains:
        class:506d41b6-816b-45c5-8f28-765f29d6f8ae: true
      implementation: 4
      description: |-
        The target is marked by you until the end of the encounter, you are dying, you use this ability again, or you willingly end this effect (no action required). If another tactician marks the target, then your mark on the target ends. You can have one target marked this way, but other tactician abilities can allow you to have multiple marked creatures.

        While the target is marked and within your line of effect, you and allies within your line of effect have an edge on power rolls made against the target.

        When the marked creature is reduced to 0 Stamina, you can use a free triggered action to move the mark to a new target within 10 squares. 

        In addition, you can spend 1 focus to take one of the following free triggered actions whenever you or an ally damages a target with an ability. You can't use more than one instance of a benefit per trigger: 

        - The ability deals additional damage equal to twice your Reason score. 
        - The damage dealer can spend a Recovery. 
        - The damage dealer can shift up to a number of squares equal to your Reason score. 
        - If you damage a creature marked by you with a melee ability, the creature is taunted by you until the end of their next turn.
      name: Mark
      tags:
        Core Feature: true
        Combat: true
