name: Flanking
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867136310
definition: When two or more allied creatures are adjacent to and on opposite sides of an enemy, those creatures are flanking that enemy. A creature flanking an enemy gains an edge on melee strikes against that enemy.
