name: High Ground
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783868368118
definition: A creature has the advantage of high ground when they use an ability against a target while standing on the ground and occupying a space that is fully above the target's space. This advantage grants the creature an edge on the ability roll.
