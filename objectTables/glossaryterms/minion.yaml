name: Minion
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1788434879000
definition: Minions are weaker enemies who are made to die fast and threaten heroes en masse. A battle with minions is one where the heroes are outnumbered and can experience the joy of cutting through fields of their enemies. Creatures organized as minions are meant to support monsters organized in other ways, and have a special set of rules for doing so.
