name: Climb
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867190655
definition: A movement mode that allows a creature to climb without using additional squares of movement. A creature without "climb" in their speed entry or the temporary ability to climb must use 2 squares of movement to climb 1 square.
