name: Platoon
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1788434879000
definition: Monster platoons are highly organized and usually self-sufficient armies. Platoons are well-rounded organizations well equipped to handle most combat objectives. A single platoon creature is a decent threat to a hero of the same level, so an encounter consisting entirely of these creatures typically has one per hero. Platoon creatures often fight alongside minions and an elite creature or two to round out their ranks.
