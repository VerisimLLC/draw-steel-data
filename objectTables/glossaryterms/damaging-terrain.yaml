name: Damaging Terrain
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867135066
definition: An area of obstacles that deal damage to creatures who are in the area or move through it. A creature can't shift into or out of damaging terrain, and can't jump out of damaging terrain.
