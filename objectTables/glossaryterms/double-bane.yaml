id: d32a5eb1-83f9-4d4e-818e-0ea4882b30eb
name: Double Bane
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867151091
definition: When a creature has two or more banes and no edges applied to a power roll, they have a double bane on the roll. A double bane applies no penalty to a power roll, but instead automatically decreases the tier outcome of the roll by one tier.
