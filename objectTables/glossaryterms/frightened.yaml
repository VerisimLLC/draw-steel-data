name: Frightened
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783868364318
definition: A condition that causes a creature to take a bane on ability rolls against the source of their fear. The creature can't willingly move closer to the source of their fear, and that source gains an edge on ability rolls made against the creature.
