name: Concealment
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867165896
definition: A state where a target has their form entirely covered in a concealing effect that doesn't block line of effect, such as darkness or fog. While a target has concealment, strikes used against them take a bane.
