definition: Elite creatures are the functional opposite of minions. A creature noted as an elite is hardy and can usually stand up to two heroes of the same level. Elites also have a high encounter value. They work well when individually supporting monsters with other modes of organization, but multiple elites can also be effective as a band on their own.
