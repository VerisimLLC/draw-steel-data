name: Dazed
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783868361737
definition: "A condition that limits a creature to doing only one thing on their turn: use a main action, use a maneuver, or use a move action. A dazed creature also can't use triggered actions, free triggered actions, or free maneuvers."
