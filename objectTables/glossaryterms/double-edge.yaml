name: Double Edge
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867142046
definition: When a creature has two or more edges and no banes applied to a power roll, they have a double edge on the roll. A double edge adds no bonus to a power roll, but instead automatically increases the tier outcome of the roll by one tier.
