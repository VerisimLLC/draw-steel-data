name: Line of Effect
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783868368745
definition: To target a creature or object with an ability or other effect, a creature must have line of effect to that target. If any solid object, such as a wall or pillar, completely blocks the target from the creature, then the creature doesn't have line of effect.
