definition: A leader is a powerful monster who buffs their allies and grants them additional actions. They utilize villain actions and can stand toe-to-toe with two or more heroes of the same level by themself. Typically, only one leader appears in a battle at a time, alongside minions, horde or platoon creatures, and elites. Leader creatures have no additional creature role.
