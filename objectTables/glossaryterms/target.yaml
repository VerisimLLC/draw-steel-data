name: Target
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867155877
definition: A creature or object affected by an ability or other effect. The target of an enemy's ability typically takes damage, has a condition or harmful effect imposed on them, or both. The target of an ally's ability typically gains some beneficial effect.
