name: Free Triggered Action
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867133500
definition: An action a creature can use on any turn, including their own, but only when a specific trigger occurs. There is no limit to the number of free triggered actions a creature can take during combat.
