name: Critical Hit
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783868360480
definition: When a creature rolls a natural 19 or 20 on an ability roll made as part of a main action, that creature gains an additional main action that they can use immediately. An ability roll made as part of a maneuver can't score a critical hit.
