name: Swim
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867177995
definition: A movement mode that allows a creature to swim without using additional squares of movement. A creature without "swim" in their speed entry or the temporary ability to swim must use 2 squares of movement to swim 1 square.
