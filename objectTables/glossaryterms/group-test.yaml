name: Group Test
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1783867188121
definition: Two or more creatures attempting to overcome a single, simple task together can make a group test. If half or more of the creatures succeed on their individual test, the group test succeeds. Otherwise the group test fails.
