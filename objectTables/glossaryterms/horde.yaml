name: Horde
_table: glossaryTerms
__typeName: GlossaryTerm
ctime: 1788434879000
definition: Monsters organized as hordes are hardier and work in smaller groups than minions, but it still takes more than one of these creatures to effectively threaten a single hero of the same level. A battle against creatures all belonging to a horde sees those creatures outnumbering the heroes about two to one. Horde creatures are more fragile than any other monsters except minions, so be sure to double or triple up on their stat blocks if they're key to a combat encounter.
