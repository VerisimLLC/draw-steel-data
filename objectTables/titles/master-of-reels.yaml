name: Master of Reels
description: The hero reaches a new fishing milestone, gaining the following title and benefit.
_table: titles
__typeName: Title
ctime: 1771783375519
effect: Whenever you deal damage to a target who is 2 or more squares away from you and that target isn’t also force moved, you can pull the target a number of squares equal to your Agility, Reason, or Intuition score (your choice).
