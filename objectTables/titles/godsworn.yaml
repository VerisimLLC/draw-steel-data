    - name: Healing Gift
      description: "You can use the 1st-level Conduit feature Healing Grace as if you had spent 1 piety (see Chapter 5: Classes). Once you use this benefit, you can’t use it again until you earn 1 or more Victories."
      __typeName: CharacterFeature
      canHavePrerequisites: true
      guid: c46ec6f6-a0a9-4d0e-aca0-f6cae97330aa
      implementation: 3
      implementationDetails: Heals like Healing Grace with the 1-piety enhancement offered as modes; the target spends a Recovery, and the enhanced mode lets them spend a second one. Ending an effect or standing a prone target is handled at the table.
      modifiers:
      - name: Healing Gift
        description: "You can use the 1st-level Conduit feature Healing Grace as if you had spent 1 piety (see Chapter 5: Classes). Once you use this benefit, you can't use it again until you earn 1 or more Victories."
        __typeName: CharacterModifier
        activatedAbility:
          name: Healing Gift
          description: |-
            The target can spend 1 Recovery.

            As if you had spent 1 piety, choose one enhancement: the target can spend 1 additional Recovery, a prone target can stand up, or you can end one effect on the target that has a duration of EoT or is ended by a resistance roll.

            You can't use this benefit again until you earn 1 or more Victories.
