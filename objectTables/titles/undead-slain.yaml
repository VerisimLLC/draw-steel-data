id: 8309cd2b-9ac2-462e-b6ae-c5fb44802043
name: Undead Slain
description: No, I didn’t get bitten. And yes, I’m fine!
_table: titles
__typeName: Title
ctime: 1762351777893
echelon: "2"
effect: You return to life 1 minute after being killed with Stamina equal to your winded value. You gain corruption immunity equal to your level and one of the benefits below, based on the type of creature who killed you. If you die again, you rise as an undead creature under the Director’s control.
modifierInfo:
  __typeName: ClassLevel
  features:
  - name: Undead Slain Benefit
    description: "Choose one of the following benefits:"
    __typeName: CharacterFeatureChoice
    allowDuplicateChoices: false
    guid: 29ed1072-1738-472a-bc16-ac41fe9437bf
    numChoices: 1
    options:
    - name: Ghoul or Vampire
      description: When you make a melee free strike against an adjacent creature, you can bite that creature. If you do so and obtain a tier 3 outcome, you gain temporary Stamina equal to the damage dealt. If not lost beforehand, this temporary Stamina lasts until the end of your next respite.
      __typeName: CharacterFeature
      canHavePrerequisites: true
      guid: cf5065c1-0393-48a6-932c-2c3f99f43a45
      modifiers: []
      source: Feat
      sourceReference:
        __typeName: SourceReference
        docid: e6cab5b7-a1c9-4b12-ad06-ed573f6ba904
        page: 346
        type: pdf
      tags:
        Combat: true
        Respite: true
    - name: Incorporeal Undead
      description: You can move through other creatures and objects. The first time in a combat round that you pass through a creature, that creature takes corruption damage equal to half your level. You don’t take damage from being force moved into objects.
      __typeName: CharacterFeature
      canHavePrerequisites: true
