      description: ""
      __typeName: CharacterModifier
      activatedAbility:
        name: Summon Familiar
        description: ""
        __typeName: ActivatedAbility
        abilityFilters:
        - formula: (Combat Round = 0) or (not (Ongoing Effects has "Familiar Destroyed")) or (Recoveries Available to Spend > 0)
          reason: You need a Recovery to bring your familiar back in combat.
        abilityType: none
        actionNumber: 1 when (Combat Round > 0) and (Ongoing Effects has "Familiar Destroyed") else 0
        actionResourceId: d19658a2-4d7b-4504-af9e-1a5410fb17fd
        behaviors:
        - name: OneFamiliar
          __typeName: ActivatedAbilityScriptBehavior
          code: |-
            --Familiar perk: a hero has only one familiar. If this hero's familiar is
            --still on the map, stop before the summon step so no second one appears.
            --A destroyed familiar is dead or despawned, so it can be brought back.
            local familiarBestiaryId = "affc11be-5ac7-407e-8e61-c9297d6aef5f"
            for _,tok in ipairs(dmhub.GetTokens()) do
                local props = tok.properties
                if tok.valid and not tok.despawned and props ~= nil
                    and tok.summonerid == casterToken.charid
                    and (tok.bestiaryId == familiarBestiaryId or props:try_get("monster_type") == "Familiar")
                    and not props:IsDead() then
                    casterToken:ModifyProperties{
                        description = "Float text",
                        undoable = false,
                        execute = function()
                            casterToken.properties:FloatLabel("You already have a familiar", "#ffffffff")
                        end,
                    }
                    --abort without paying, and skip the summon behavior below.
                    options.abort = true
                    options.stopProcessing = true
                    return
                end
            end
            --Once the new familiar is here, clear the Familiar Destroyed marker so the
            --next summon is free again. This runs after the cast is paid for, because
            --the main action cost is worked out from the marker at payment time.
            local destroyedEffectId = "e680f37b-32ef-473c-aa1c-fdf71a4f8e4c"
            options.OnFinishCastHandlers = options.OnFinishCastHandlers or {}
            options.OnFinishCastHandlers[#options.OnFinishCastHandlers+1] = function()
                if options.abort or not casterToken.valid or casterToken.properties == nil then
                    return
                end
                casterToken:ModifyProperties{
                    description = "Familiar restored",
                    execute = function()
                        casterToken.properties:RemoveOngoingEffect(destroyedEffectId)
                    end,
                }
            end
        - __typeName: ActivatedAbilitySummonBehavior
          monsterType: affc11be-5ac7-407e-8e61-c9297d6aef5f
          persistAfterCombat: true
        - __typeName: ActivatedAbilityReplenishBehavior
