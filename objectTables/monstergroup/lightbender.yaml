- name: Everything the Light Touches
  description: |
    Each lightbender in the encounter shines radiantly, distorting the senses of any enemy within 5 squares of them. Each affected enemy makes a Reason test.
    - Tier 1 (<=11): The target doesn't have line of effect to any lightbender (save ends).
    - Tier 2 (12-16): The target doesn't have line of effect to any lightbender (EoT).
    - Tier 3 (17+): No effect.
  __typeName: MaliceAbility
  abilityType: none
