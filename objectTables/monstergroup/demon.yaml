- name: Abyssal Rift
  description: |
    Two size 2 rifts to the Abyssal Wasteland appear at locations of your choice. Any demon can use an abyssal rift as a portal to another abyssal rift in the encounter. A non-demon who enters a rift for the first time in a round or starts their turn there takes corruption damage equal to the level of the highest-level demon on the encounter map.
    An abyssal rift is an immovable object that has 25 Stamina, damage immunity 2, and holy weakness 5. The rift closes when there are no demons remaining on the encounter map.
  __typeName: MaliceAbility
  abilityType: none
  behaviors:
  - __typeName: ActivatedAbilitySummonBehavior
    allCreaturesTheSame: true
    bestiaryFilter: beast.name = "Abyssal Rift"
