- name: Death Tax
  description: |
    Each enemy within 5 squares of the undead makes a Might test.
    - Tier 1 (<=11): 10 corruption damage; the target loses 2 Recoveries
    - Tier 2 (12-16): 8 corruption damage; the target loses 1 Recovery
    - Tier 3 (17+): 5 corruption damage
    Effect: A target who has fewer Recoveries than they would lose is also weakened (save ends). This ability can't be used by a minion.
