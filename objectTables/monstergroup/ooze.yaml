- name: Congeal
  description: Two adjacent oozes combine into a larger ooze, with one ooze absorbed by the other. The remaining ooze increases their size by 1, gains a +1 bonus to speed, increases the potency of their potency effects by 1 (all to a maximum of 2), and gains temporary Stamina equal to the absorbed ooze's remaining Stamina.
