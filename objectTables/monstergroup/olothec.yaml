loreSections:
- heading: ""
  text: |
    Protean in form, beings of nearly pure intellect, the Old Ones think in alien geometric logic. Their name for themselves is unrecorded, but sages believe they are the oldest beings in the timescape and simply call them "The Old Ones." Synlirii refer to them as olothec (OH-luhthek) -- "ancient enemies." But some humanoid scholars have noted this term bears an uncanny similarity to another archaic synlirii word meaning "ancient ancestor."
- heading: Immortal Evil
  text: |
    Olothec haunt nightmares and adorn temple friezes across countless societies and ages. While their origins are obscure and may never be known, their hatred of the mundane world and every living thing in it is well recorded. Their malice manifests as unbridled psionic energy beyond any mortal power, surpassing even the voiceless talkers.
- heading: Agents of Chaos
  text: |
    Olothec strive to devolve all life back to primordial, formless potential. They lair in forgotten sea tunnels and beneath ancient ruins, surrounding themselves with slime servants -- humanoids, beasts, horrors, and others, all devolved into perfect, oozing, mindless thralls.
