- name: Foul Spew
  description: |
    One troll acting this turn spews out a half-digested meal in a 5 x 1 line within 1 square of them. Each troll in the area regains 3 Stamina. Each enemy in the area makes a Might test.
    - Tier 1 (<=11): 12 acid damage; dazed (EoT)
    - Tier 2 (12-16): 10 acid damage; weakened (EoT)
    - Tier 3 (17+): 6 acid damage
  __typeName: MaliceAbility
  abilityType: none
  behaviors:
  - __typeName: ActivatedAbilityHealBehavior
    filterTarget: Keywords has "Troll"
    roll: "3"
