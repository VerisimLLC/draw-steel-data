- name: Bullseye
  description: |
    All minotaurs in the encounter fill the area around them with psychic impressions of feeling lost and isolated. Each enemy within 5 squares of a minotaur is teleported up to 5 squares and makes an Intuition test.
    - Tier 1 (<=11): The target has line of effect only within 3 squares and is frightened of all minotaurs (save ends).
    - Tier 2 (12-16): The target has line of effect only within 3 squares (EoT).
    - Tier 3 (17+): No effect.
