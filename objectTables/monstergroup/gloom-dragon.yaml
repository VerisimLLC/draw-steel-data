- name: Phantasmagoria!
  description: |-
    The dragon summons macabre, disquieting phantasms in a 10 cube within 1 square that lasts until the end of the encounter. Any enemy who enters the area for the first time in a round or starts their turn there takes 6 psychic damage, or 8 psychic damage if they are dragonsealed by the gloom dragon. Additionally, the
    enemy's Intuition score is treated as 1 lower for the purpose of resisting potencies until the end of the encounter.
  __typeName: MaliceAbility
  abilityType: none
