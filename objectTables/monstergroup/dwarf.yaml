- name: Snaring Line
  description: |
    Area, Magic, Ranged. 10 x 1 line within 10. Each enemy in the area makes an Agility test.
    - Tier 1 (<=11): 8 damage; restrained (EoT)
    - Tier 2 (12-16): 6 damage; slowed (EoT)
    - Tier 3 (17+): No effect.
    The snaring line remains until the end of the encounter. Any enemy who moves into the area for the first time in a round or starts their turn there must make the test. This ability can't be used by a minion.
