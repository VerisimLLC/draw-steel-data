  description: |
    Each valok in the encounter can end one effect on them that can be ended by a saving throw, and can move up to their speed. Additionally, until the end of the encounter, all valok deal an extra 5 damage on strikes and gain a +5 bonus to speed. This feature can be activated multiple times, stacking the effects.
