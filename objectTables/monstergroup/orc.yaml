- name: Mohler Cavity
  description: |
    The ground shakes as a group of mohlers dig a 5 cube pit beneath an area where at least one creature is on the ground. The area is difficult terrain. Each orc in the area can shift into the nearest unoccupied space outside the pit before it is completed. Each non-orc in the area makes an Agility test.
    - Tier 1 (<=11): 4 damage; the target falls; prone and can't stand (EoT)
    - Tier 2 (12-16): 4 damage; the target falls
    - Tier 3 (17+): The target can shift into the nearest unoccupied space outside the pit.
  __typeName: MaliceAbility
  abilityType: none
