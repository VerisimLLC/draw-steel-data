- name: Titanic Tear
  description: |
    A giant creates a fissure along the ground, either in a 15 x 2 line within 1 or a 10 x 3 line within 2, and that opens up to a depth of 6 squares. Each giant in the area can shift into the nearest unoccupied space outside the fissure. Each non-giant in the area makes an Agility test.
    - Tier 1 (<=11): 10 damage; the target falls into the fissure, and is prone and can't stand (EoT)
    - Tier 2 (12-16): 10 damage; the target is prone and hanging onto the edge of the fissure
    - Tier 3 (17+): The target can shift into the nearest unoccupied space outside the fissure.
  __typeName: MaliceAbility
