- name: Overflowing Rage
  description: |
    Every wyvern's anger fills the encounter map with a thick miasma of hatred. Each enemy in the encounter makes an Intuition test.
    - Tier 1 (<=11): The target is taunted by the nearest creature or object (save ends). While the target is taunted this way, power rolls against them have a double edge.
    - Tier 2 (12-16): The target is taunted by the nearest creature or object (save ends).
    - Tier 3 (17+): No effect.
