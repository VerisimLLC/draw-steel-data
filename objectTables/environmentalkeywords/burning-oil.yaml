script: |-
  --Burning Oil: top-down fire over every tile of the zone (the shared
  --"burning-ground" particle recipe, see ParticleEffects.lua) plus a heat
  --shimmer, for as long as the zone exists.

  local def = {}

  def.create = function(zone)
    zone.data.heat = dmhub.CreateWorldDistortion{
      type = "heatwave",
      locs = zone.locs,
      strength = 6,
      edgeFade = 0.5,
      direction = { x = 0, y = 1 },
      plumeWidth = 2,
      plumeHeight = 1.2,
      turbulence = 0.5,
      shimmer = 0.7,
      haze = 0.6,
      frequency = 1.35,
      speed = 1.5,
    }
    zone.data.fire = ParticleEffects.Create("burning-ground", { locs = zone.locs })
  end

  def.locsChanged = function(zone)
    zone.data.heat:SetLocs(zone.locs)
    zone.data.fire:SetLocs(zone.locs)
  end

  def.destroy = function(zone)
    if zone.data.heat ~= nil then
      zone.data.heat:Stop()
    end
    if zone.data.fire ~= nil then
      zone.data.fire:Stop()
    end
  end

  return def
source: Environmental Keyword
