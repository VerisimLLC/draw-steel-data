description: A patch of oil or pitch that has been set alight. A creature or object that enters a square of burning oil or starts their turn there takes 3 fire damage and is burning (save ends). A burning creature takes 1d6 fire damage at the start of each of their turns. A burning object takes 1d6 fire damage at the end of each round.
