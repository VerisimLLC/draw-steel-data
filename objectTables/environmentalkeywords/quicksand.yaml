name: Quicksand
description: When this hidden patch of sand is stepped on, it is revealed as a water-saturated slurry ready to draw creatures down. A creature or object that enters the quicksand or starts their turn there is targeted by the Grasping Depths power roll. The roll takes a bane if a triggering creature shifted into the quicksand. A character who starts their turn restrained this way is suffocating. The quicksand is hidden until triggered or detected.
