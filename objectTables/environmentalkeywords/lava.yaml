script: |-
  --Lava: heat-plume distortion over the zone and its adjacent ring, plus
  --rising sparks emitted only from the core lava tiles, for as long as the
  --zone exists.
  --
  --zone.locsAndAdjacent = the zone's tiles plus every tile 8-way adjacent,
  --matching Lava's Affects Adjacent Squares reach.

  local def = {}

  def.create = function(zone)
    zone.data.heat = dmhub.CreateWorldDistortion{
      type = "heatwave",
      locs = zone.locsAndAdjacent,
      strength = 16,
      edgeFade = 0.5,
      direction = { x = 0, y = 1 },
      plumeWidth = 2.5,
      plumeHeight = 1.25,
      turbulence = 0.7,
      shimmer = 0.7,
      haze = 1,
      frequency = 1.35,
      speed = 3,
    }

    if dmhub.supportsParticleSystems then
      zone.data.sparks = dmhub.CreateParticleSystem{
        locs = zone.locs,
        image = "b9cb59b9-ddad-423b-b528-f154c7600b80",
        rate = 2.5,
        lifetime = { val = 1.1, maxVal = 2.1 },
        speed = 0,
        verticalSpeed = 0.75,
        opacity = 1,
        fadein = 0.08,
        fadeout = 0.55,
        birthColor = { r = 1, g = 0.55, b = 0.05, a = 1 },
        deathColor = { r = 1, g = 0.3, b = 0.02, a = 1 },
        birthSize = 0.09,
        deathSize = 0.025,
        type = "Default",
        rotation = { val = 0, maxVal = 360 },
        rotationOverLifetime = { val = -45, maxVal = 45 },
        worldSpace = true,
        noiseStrength = { val = 0.08, maxVal = 0.18 },
        noiseFrequency = 0.65,
        noiseScroll = { val = 0.15, maxVal = 0.35 },
        maxParticles = 1000,
      }
    end
  end

  def.locsChanged = function(zone)
    if zone.data.heat ~= nil then
      zone.data.heat:SetLocs(zone.locsAndAdjacent)
    end
    if zone.data.sparks ~= nil then
      zone.data.sparks:SetLocs(zone.locs)
    end
  end

  def.destroy = function(zone)
    if zone.data.heat ~= nil then
      zone.data.heat:Stop()
    end
    if zone.data.sparks ~= nil then
      zone.data.sparks:Stop()
    end
  end

  return def
