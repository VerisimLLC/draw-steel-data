__typeName: EnvironmentalKeyword
name: Toxic Plants
description: "Colorful mushrooms or flowering plants release sleep-inducing spores when disturbed. A creature that starts their turn in the Toxic Plants, or enters a square without shifting, is targeted by Sleep Spores, a Magic Melee Strike free triggered action. While dazed this way, a creature that starts their turn in the Toxic Plants falls prone and can't stand."
