script: |-
  --Sheltered: marks the zone's tiles as out of the weather (indoors, a cave,
  --under a roof). Weather Map Scripts fade out over them: the fog, colour
  --grade and heat shimmer of every world atmosphere, and particles made with
  --shelterMask = true (rain, snow, embers). Client-local, like every zone
  --script, so it runs on each client.

  local def = {}

  def.create = function(zone)
    zone.data.shelter = dmhub.CreateWeatherShelter{ locs = zone.locs }
  end

  def.locsChanged = function(zone)
    if zone.data.shelter ~= nil then
      zone.data.shelter:SetLocs(zone.locs)
    end
  end

  def.destroy = function(zone)
    if zone.data.shelter ~= nil then
      zone.data.shelter:Destroy()
      zone.data.shelter = nil
    end
  end

  return def
source: Environmental Keyword
