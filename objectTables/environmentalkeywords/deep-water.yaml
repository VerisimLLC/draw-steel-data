name: Deep Water
description: Water at least 1 square deep. A creature who enters it or starts their turn in it becomes wet until the end of the encounter. While fully submerged, a creature has fire immunity 5 and lightning weakness 5, and if they can't swim at full speed, their power rolls take a bane.
