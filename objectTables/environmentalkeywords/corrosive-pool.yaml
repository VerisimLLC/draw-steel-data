name: Corrosive Pool
description: A shallow pool bubbles with acid or some other corrosive liquid. A creature or object takes 3 acid damage for each square of the pool they enter, and a creature takes 3 acid damage if they start their turn there. If the pool takes fire damage, it explodes (Explosive Reaction) and is consumed.
