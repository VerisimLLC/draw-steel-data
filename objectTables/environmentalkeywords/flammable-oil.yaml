name: Flammable Oil
description: |-
  A patch of flammable oil or pitch on the ground is ready to be ignited.

  Activate: A creature or object in a square of oil takes fire damage. The oil ignites and becomes Burning Oil, and the triggering creature or object takes 3 fire damage and is burning (save ends).

  Deactivate: As a maneuver, a creature adjacent to a patch of flammable oil can make an Agility test. 11 or lower: the creature ignites the oil and is affected as if in its area. 12-16: the oil temporarily ignites before safely burning out, and the creature takes 3 fire damage and is burning (save ends). 17+: the oil is rendered safe and can't be ignited.

  Allied Awareness: Allies of the trap (creatures that are not heroes) can use a maneuver to throw a torch up to 5 squares and ignite the flammable oil.
