name: Frozen Pond
description: A shallow, frozen patch of water features ice thick enough that it won't break, but its surface is slick and treacherous to navigate. A creature or object that enters a square of the frozen pond without shifting is targeted by the Slippery Surface power roll. The triggering creature's movement ends, then they are force moved.
