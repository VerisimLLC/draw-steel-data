id: 1ec3eb4d-f78f-4858-bf4a-8565900f27d5
name: Dragon
description: The dragon archetype can be used for any other kingdom-level threat, such as a fire giant chief, a contender for a throne, or the dread synliroi Lord Syuul.
_table: negotiators
__typeName: Negotiator
ctime: 1783885402701
flavorText: The dragon’s tremendous might is overshadowed only by their boundless ambition and pride.
impressionScore: 9
motivations:
- name: Freedom
  description: Yes, my ambitions have been bound to the earth for far too long. It’s time I took flight.
  __typeName: NegotiatorTrait
- name: Greed
  description: Bring me tribute now, and when I rule, I will not forget you.
  __typeName: NegotiatorTrait
- name: Protection
  description: My people have been mistreated for centuries. It ends now!
  __typeName: NegotiatorTrait
- name: Vengeance
  description: This land, these people, their treasures, all rightfully mine. Stolen from me!
  __typeName: NegotiatorTrait
mtime: 1783885402701
pitfalls:
- name: Legacy
  description: No heir will outlive me, no legend will remember my past glory ... for I shall never die!
  __typeName: NegotiatorTrait
- name: Peace
  description: You want to make peace? When there are still things in the world that are not yet mine?
  __typeName: NegotiatorTrait
- name: Power
  description: How can you possibly offer me power?
  __typeName: NegotiatorTrait
- name: Revelry
  description: My pleasures are as far beyond your comprehension as yours are to a worm.
  __typeName: NegotiatorTrait
